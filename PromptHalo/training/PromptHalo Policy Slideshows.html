nager, any other manager, or the ethics reporting route in the Code of Conduct. Section 14: exceptions are requested in writing to the Security Officer and approved by the Steering Committee, recorded with rationale, compensating control, approver, and expiry date, and reviewed at expiry."}, {"k": "table", "t": "12. Records you create", "head": ["Record", "Section", "When"], "rows": [["Input validation and rejection logs", "6", "On every input"], ["Processing and export logs", "7, 8", "On every run and export"], ["Change test evidence", "7, 8", "Before release"], ["Error ticket, triage, correction", "10", "On each processing error"], ["Reprocessing record", "10", "When data is reprocessed"], ["Annual confirmation", "11", "Annually"]], "n": "Section 12 lists the records. They are input validation and rejection logs; processing and export logs; test evidence for changes affecting processing correctness; processing error tickets with their triage, correction, and reprocessing records; and the annual confirmation required by Section 11. Records may be kept in the systems we already operate, provided they are retrievable and attributable."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass", "Covered at onboarding and yearly"], "side": "At hire, yearly, and on change", "n": "You acknowledge this policy when you join, at the annual refresher, and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping make sure the data we process stays complete, accurate, timely, and authorized. Let's move on to the questions."}]}, {"key": "rsk", "title": "Risk Management", "id": "POL-RSK-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Identify, score, treat, track, review.", "slides": [{"k": "title", "t": "Risk Management", "sub": "One register, reviewed at least yearly", "body": "How PromptHalo identifies, assesses, treats, and tracks significant risks.", "meta": "POL-RSK-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Risk Management Policy training. We keep one central Risk Register, and risk management is proportional to our size. We will cover how risks are identified, scored with exploitability in mind, treated or accepted, recorded, reviewed, and tracked. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["eye", "Identify", "Find significant risks"], ["user", "Assign", "Decide on action and an owner"], ["check", "Track", "Until resolved or accepted"]], "banner": ["Proportional:", "effort should not exceed what the risk warrants."], "n": "Section 1 states the purpose. PromptHalo identifies significant security and business risks, decides whether they require action, assigns responsibility, and tracks them until they are resolved or accepted. Risk management is proportional to our size, operations, customers, and risk, and it should not cost more time and effort than the risk being managed warrants. The Company maintains one central Risk Register."}, {"k": "flow", "t": "How risk management works", "steps": [["eye", "Identify", "Record significant risks", "E9E3F5"], ["target", "Assess", "Likelihood x impact", "F7EDC9"], ["edit", "Treat", "Mitigate, accept, avoid, transfer", "FBE5D6"], ["tool", "Track", "In existing tickets", "DDEBF7"], ["clock", "Review", "At least annually", "DCEFE2"]], "banner": "Not every operational issue needs to become a formal risk.", "n": "Here is the process the policy describes. Identify significant risks and record them in the Risk Register. Assess each one for likelihood and impact. Decide on a treatment: mitigate, accept, avoid, or transfer. Track the action in an existing ticket or issue, and review the register at least annually and when significant changes occur. Not every operational issue needs to become a formal risk."}, {"k": "grid", "t": "2. What it covers", "items": [["db", "Information", "Company and customer data"], ["server", "Technology", "Products, AWS, apps, AI agents"], ["link", "Vendors", "Vendors and service providers"], ["users", "People and duties", "Operations, legal, contractual"]], "n": "Section 2 sets the scope: significant risks affecting Company and customer information; products and services; AWS and other technology environments; applications, AI systems, models, and agents; vendors and service providers; personnel and operations; and legal, contractual, security, privacy, and availability obligations. Not every operational issue needs to become a formal risk."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Committee approves and reviews yearly", "Security Officer maintains the register", "Risk owners monitor and address risks", "CEO approves material risk acceptance"], "art": "Risk Register", "cad": "Maintained continuously", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy and may delegate duties. The Information Security Steering Committee approves it and reviews it at least annually. The Security Officer, or a designee, coordinates the process and maintains the Risk Register. Risk owners monitor and address the risks assigned to them. The CEO, or a designee, approves acceptance of material risks."}, {"k": "grid", "t": "4. Key terms", "items": [["target", "Exploitability", "Can an attacker reach and use it?"], ["shield", "Residual risk", "Level after controls and treatment"], ["tool", "Treatment", "Mitigate, accept, avoid, transfer"], ["user", "Accountable Party", "CEO, or Security Officer"]], "n": "Section 4 defines the terms. Exploitability is whether a weakness can realistically be reached and used by an attacker in our environment. Residual risk is the level of a risk after existing controls and treatment. Treatment is what the Company decides to do about a risk: mitigate, accept, avoid, or transfer. The Accountable Party is the CEO or, in their absence, the Security Officer."}, {"k": "sec", "t": "5. Identify risks", "items": ["Normal business and engineering work", "Security, vulnerability, vendor reviews", "Incidents, audits, customer requirements", "New products, technologies, AI use", "Legal, contract, or threat changes"], "art": "Risk Register entry", "cad": "As risks are identified", "n": "Section 5 covers identification. Risks are identified through normal business and engineering work, security reviews, vulnerability management, vendor reviews, incidents, customer requirements, audits and assessments, new products or technologies, AI use, significant system changes, and changes in legal, regulatory, contractual, or threat conditions. Significant risks are recorded in the Risk Register."}, {"k": "check", "t": "6. Assess: score with exploitability", "items": ["Likelihood 1 to 5", "Impact 1 to 5", "Score = likelihood x impact", "Likelihood reflects exploitability", "Score supports, not replaces, judgment"], "big": "L x I", "bigsub": "A short scoring guide is kept with the register", "n": "Section 6. Each significant risk is assessed for likelihood and impact, each on a simple 1 to 5 scale, and the score is likelihood multiplied by impact. Likelihood takes exploitability into account: whether the weakness is exposed, whether a known exploit or active attack exists, how much access or skill an attacker would need, and whether existing controls block the path. The score supports decisions but does not replace judgment."}, {"k": "sec", "t": "6. Assess: what gets priority", "items": ["Exploitable path to customer data: first", "Even when the score is moderate", "Material impact needs management attention", "Treat it or accept it", "Residual risk optional, where useful"], "art": "Score in the Risk Register", "cad": "When a risk is assessed", "n": "A risk that is readily exploitable and could reach customer information or critical systems is prioritized even when its overall score is moderate. Risks with potentially material customer, security, privacy, contractual, financial, or availability impact require management attention and appropriate treatment or acceptance. A single current score is sufficient for most risks. Residual risk may be recorded for significant risks where useful."}, {"k": "grid", "t": "7. Four treatments", "items": [["shield", "Mitigate", "Implement controls to reduce it"], ["check", "Accept", "Accept the remaining risk"], ["alert", "Avoid", "Stop or change the activity"], ["link", "Transfer", "Provider, contract, or insurance"]], "n": "Section 7 lists four treatments. Mitigate means implementing controls to reduce the risk. Accept means accepting the remaining risk. Avoid means stopping or changing the activity that creates the risk. Transfer means shifting some of the risk through a provider, a contract, insurance, or another mechanism. Significant risks that require action have an owner, a treatment, a target date where appropriate, and a status. Treatment is proportional to the risk."}, {"k": "sec", "t": "7. Accepting a risk", "items": ["When more mitigation isn't practical", "Weigh customer and business impact", "Weigh contracts, controls, and cost", "Material acceptance: CEO or designee", "Recorded in the register with rationale"], "art": "Acceptance and rationale in register", "cad": "When a material risk is accepted", "n": "A risk may be accepted when further mitigation is not practical or justified. The decision considers customer impact, sensitive information exposure, business impact, contractual requirements, existing controls, and the cost of further mitigation. Material risk acceptance is approved by the CEO, or a designee, and recorded in the Risk Register with the rationale."}, {"k": "table", "t": "8. The Risk Register", "head": ["Field", "Content"], "rows": [["ID and risk", "Short identifier and description"], ["Likelihood, impact, score", "1 to 5 each, multiplied"], ["Treatment or action", "What we do, linked to tracking record"], ["Owner, target date, status", "Who, by when, and where it stands"], ["Optional fields", "Controls, residual risk, dates, rationale"]], "n": "Section 8 describes the Risk Register, the primary risk management record. A spreadsheet is sufficient. Each significant risk records an ID and description; likelihood, impact, and score, with likelihood reflecting exploitability; the treatment or action, with a link to the tracking record; and the owner, target date, and status. Existing controls, residual risk, dates identified and reviewed, acceptance rationale, and closure date may be added where they help."}, {"k": "sec", "t": "9. Annual review", "items": ["Security Officer or designee reviews", "New, closed, and significant open risks", "Acceptances and overdue actions", "Fraud risk considered every review", "Dated review record is sufficient"], "art": "Dated review record", "cad": "At least annually", "n": "Section 9. At least annually, the Security Officer, or a designee, reviews the Risk Register: new and closed risks, significant open risks, material changes, risk acceptances, and overdue significant actions. Fraud risk, such as fraudulent reporting, misappropriation of assets, insider or privileged access misuse, and management override, is considered, and any material fraud risk is recorded. A dated review record is sufficient and may be part of the Annual Control Environment Assessment."}, {"k": "check", "t": "9. Significant changes trigger a look", "items": ["New product or service", "Material architectural change", "Significant new AI use or incident", "New critical vendor", "Major customer, legal, or regulatory change"], "big": "Add or update", "bigsub": "Routine changes do not require reassessment", "n": "Significant changes are evaluated to see whether they introduce new or materially changed risks. Examples are a new product or service, a material architectural change, a significant new use of AI, a significant security incident, a new critical vendor, a material customer requirement, or a significant legal or regulatory change. Where they do, the applicable risk is added or updated. Routine changes do not require reassessment."}, {"k": "two", "t": "10. Vendor and AI risks", "items": [["link", "Vendor risk", ["Routine: Vendor Management Policy", "Significant residual: the register", "Only significant risks elevated"]], ["cpu", "AI, models, agents", ["Excessive agent permissions", "Prompt injection", "Customer data exposure via AI"]]], "n": "Section 10. Routine vendor risk is managed under the Vendor Management Policy, and only significant residual vendor risks are elevated to the Risk Register. Significant risks from our use or development of AI, models, and agents, such as excessive agent permissions, prompt injection, or customer data exposure through an AI service, are managed in the same Risk Register."}, {"k": "sec", "t": "11 and 12. Tracking and exceptions", "items": ["Track in GitHub issues or tickets", "Or tasks, findings, vendor actions", "Register links to that record", "Overdue actions reviewed or escalated", "Material exceptions: Exception Register"], "art": "Linked ticket or issue", "cad": "Ongoing; overdue items reviewed", "n": "Section 11 covers tracking. Risk treatments are tracked in existing GitHub issues, tickets, project tasks, security findings, or vendor actions, and the Risk Register references that record. Overdue significant actions are reviewed and updated or escalated as appropriate. Section 12 covers exceptions: material exceptions to this policy are recorded in the Exception Register."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "When"], "rows": [["Risk Register entry and score", "5, 6, 8", "When a significant risk is found"], ["Acceptance with rationale", "7", "When a material risk is accepted"], ["Linked ticket or issue", "11", "For each treatment action"], ["Dated annual review record", "9", "At least annually"], ["Exception Register entry", "12", "For material exceptions"]], "n": "Here are the records this policy relies on. A Risk Register entry, with its score, when a significant risk is identified. The acceptance and its rationale, recorded in the register, when a material risk is accepted. A linked ticket or issue for each treatment. A dated review record at least annually, which may be part of the Annual Control Environment Assessment. And an Exception Register entry for material exceptions."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-RSK-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping us manage risk sensibly and in proportion. Let's move on to the questions."}]}, {"key": "sdlc", "title": "Secure SDLC", "id": "POL-SDLC-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Build and test software securely.", "slides": [{"k": "title", "t": "Secure SDLC", "sub": "Build and test software securely", "body": "How PromptHalo designs, builds, tests and releases software securely.", "meta": "POL-SDLC-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Secure Software Development Life Cycle Policy training. This short walkthrough covers why the policy exists, what it covers, how we build and test securely, the records we keep, and how exceptions work. You can pause, rewind, speed up, or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["shield", "Secure by design", "Designed, reviewed, tested, released"], ["alert", "Find issues early", "Before they create unacceptable risk"], ["link", "Two policies", "Change Management covers approval"]], "banner": ["Purpose:", "PromptHalo software is built and tested securely."], "n": "Section 1 states the purpose. Software developed by PromptHalo is designed, reviewed, tested, and released securely, and security vulnerabilities are identified and addressed before they create unacceptable risk. This policy works alongside the Change Management Policy, which covers how changes are authorized, reviewed, and tracked."}, {"k": "grid", "t": "2. What it covers", "items": [["cpu", "Our software", "Everything the Company develops"], ["target", "AI behavior", "Prompts, tools, retrieval configuration"], ["doc", "Not covered here", "Change approval and tracking"], ["link", "See instead", "Change Management Policy"]], "n": "Section 2 sets the scope. The policy covers software the Company develops, including the AI prompts, tool definitions, and retrieval configuration that shape how our AI systems behave. Authorization, review, and tracking of changes are covered by the Change Management Policy, not here."}, {"k": "sec", "t": "3 and 4. Roles and terms", "items": ["Accountable Party owns the policy", "Committee approves and reviews yearly", "Engineering runs the program", "Security Officer provides guidance", "Dependency: third-party code we rely on"], "art": "Dated policy approval record", "cad": "At least annually", "n": "Sections 3 and 4 set the roles and terms. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy and may delegate duties. The Information Security Steering Committee approves it and reviews it at least annually. Engineering runs the secure development program day to day, and the Security Officer provides guidance. A dependency is third-party code our software relies on at build or run time."}, {"k": "flow", "t": "The secure development lifecycle", "steps": [["edit", "Design", "Consider how it could be misused", "E9E3F5"], ["cpu", "Build", "Scan dependencies and secrets", "DDEBF7"], ["check", "Test", "Static analysis and web checks", "FBE5D6"], ["server", "Release", "Reviewed under Change Management", "DCEFE2"]], "banner": "Vulnerabilities found are fixed within the VPM Policy timeframes.", "n": "Here is the lifecycle the policy describes. Design: consider security, and how a feature could be misused. Build: dependencies and secrets are scanned, and no real client data is used in test. Test: static analysis on every change, and web checks before anything is exposed. Release: code is reviewed under the Change Management Policy, and vulnerabilities are fixed within the timeframes in the Vulnerability and Patch Management Policy."}, {"k": "sec", "t": "5. Building securely: design and code", "items": ["Security considered at design", "Misuse note for client data or access", "Code reviewed under Change Management", "Security impact part of that review", "AI prompts and tools changed like code"], "art": "Issue or pull request misuse note", "cad": "Client data or access features", "n": "Section 5 covers building securely. Security is considered when a feature is designed. A feature that handles client information or grants access includes a brief note, in the issue or pull request, on how it could be misused. Code is reviewed under the Change Management Policy, and security impact is part of that review. AI prompts, tool definitions, and retrieval configuration are held in source control and changed like code."}, {"k": "sec", "t": "5. Building securely: data and dependencies", "items": ["Dependencies scanned automatically", "Secrets scanned automatically", "No real client data in test or dev", "Synthetic or masked data instead", "Build lists dependencies and versions"], "art": "Scan results and dependency list", "cad": "Every build", "n": "Dependencies and secrets are scanned automatically, under the Vulnerability and Patch Management Policy. Test and development environments do not hold real client information; where realistic data is needed, it is synthetic or masked. The build produces a list of the software's dependencies and their versions. Remember that a dependency is any third-party code our software relies on at build or run time."}, {"k": "check", "t": "6. Testing", "items": ["Static analysis on every change", "Dependency scanning on every change", "Web checks before first exposure", "Again when attack surface changes", "Pen test: by contract or material change"], "big": "On time", "bigsub": "Fixed within VPM Policy timeframes; clients by agreement", "n": "Section 6 covers testing. Static analysis and dependency scanning run automatically on every change. Internet-facing services are checked for common web weaknesses before they are first exposed and when their attack surface changes materially. An independent penetration test is performed when a client agreement requires one, or when the Company judges that a material change warrants it. Identified vulnerabilities are remediated within the timeframes set by the Vulnerability and Patch Management Policy. Client systems are tested only under an engagement agreement."}, {"k": "sec", "t": "7. Records", "items": ["Kept in our build and test systems", "Design notes", "Pull requests and reviews", "Scanning and test results", "Pen test reports, where performed"], "art": "PRs, scan results, pen test reports", "cad": "As work happens", "n": "Section 7 covers records. They are kept in the systems used to build and test the Company's software, so no separate record keeping is needed. Records may include design notes, pull requests and reviews, scanning and test results, and penetration test reports where a test was performed."}, {"k": "sec", "t": "8. Exceptions", "items": ["Requirement can't reasonably be met", "Accountable Party records the position", "And the compensating measure"], "art": "Exception record with compensating measure", "cad": "When an exception arises", "n": "Section 8 covers exceptions. Where a requirement of this policy cannot reasonably be met, the Accountable Party records the position and the compensating measure. The policy works with the Change Management Policy, the Vulnerability and Patch Management Policy, the AI Governance Policy, and the Cloud Platform Standard, STD-CLD-001."}, {"k": "table", "t": "Artifacts and how often they are updated", "head": ["Artifact", "Section", "How often"], "rows": [["Misuse note", "5", "Features with client data or access"], ["Pull request review", "5", "Every change, per Change Management"], ["Scan results", "5, 6", "Every change"], ["Dependency list", "5", "Every build"], ["Penetration test report", "6", "By contract or material change"], ["Exception record", "8", "When an exception arises"]], "n": "Here are the records this policy produces. A misuse note for features that handle client information or grant access. A pull request review for every change, under Change Management. Scan results on every change. A dependency list from the build. A penetration test report when a client agreement requires one or a material change warrants it. And an exception record, with its compensating measure, when a requirement cannot be met."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-SDLC-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for designing, building, and testing our software securely. Let's move on to the questions."}]}, {"key": "sat", "title": "Security Awareness", "id": "POL-SAT-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Short training, once a year.", "slides": [{"k": "title", "t": "Security Awareness", "sub": "Short, practical, once a year", "body": "How PromptHalo keeps everyone ready to spot and report security problems.", "meta": "POL-SAT-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Security Awareness and Training Policy training. This one is short on purpose. It explains what training you take, when you take it, what it covers, how ongoing awareness works, and how completion is recorded and reviewed. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["shield", "Protect the Company", "And our customers"], ["eye", "Spot problems", "Know the common risks"], ["mail", "Report quickly", "security@prompthalo.ai"]], "banner": ["Purpose:", "people with access know basic security practices."], "n": "Section 1 states the purpose: to make sure people with access to PromptHalo systems and information understand the basic security practices needed to protect the Company and its customers. Personnel complete a short, practical security training when they join the Company and once each calendar year. The policy keeps this simple and focused on what matters most to us."}, {"k": "grid", "t": "2. Who it covers", "items": [["users", "Employees", "With access to systems or data"], ["user", "Contractors", "And consultants"], ["users", "Other personnel", "Interns and temporary workers"], ["target", "Role-adjusted", "Training may fit role and access"]], "n": "Section 2 sets the scope. The policy applies to employees, contractors, consultants, and other personnel with access to Company systems or information. Personnel, as defined in Section 4, includes employees, officers, contractors, consultants, interns, and temporary workers. Training may be adjusted to a person's role and access, so an engineer and a salesperson may receive somewhat different guidance."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Committee approves and reviews yearly", "Security Officer runs program and material", "Managers support role-specific guidance", "Personnel train, comply, and report"], "art": "Training material", "cad": "Kept current; checked yearly", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy and may delegate duties. The Information Security Steering Committee approves it and reviews it at least annually. The Security Officer, or a designee, coordinates the awareness program and maintains the training material. Managers support role-specific security guidance where appropriate. Personnel complete required training, follow security requirements, and report security concerns."}, {"k": "flow", "t": "Security awareness at a glance", "steps": [["user", "Join", "You receive access", "E9E3F5"], ["edit", "Train", "Within 30 days", "DDEBF7"], ["list", "Record", "Person, training, date", "F7EDC9"], ["clock", "Repeat", "Once each calendar year", "DCEFE2"], ["mail", "Remind", "When something relevant happens", "FBE5D6"]], "banner": "One short training, one completion record, reminders when relevant.", "n": "Here is the whole program on one slide. You join and receive access. You complete a short security training within 30 days. Your completion is recorded with the person, the training, and the date. You repeat the current training once each calendar year. And the Security Officer may send short reminders when something relevant happens."}, {"k": "check", "t": "5. When you train", "items": ["Within 30 days of getting access", "Then once each calendar year", "Any format: slides, guide, module", "Quizzes and certificates not required", "Role guidance in normal work"], "big": "30 days", "bigsub": "New personnel complete training within 30 days of access", "n": "Section 5 sets the timing. New personnel complete the security awareness training within 30 days of receiving access to Company systems. Personnel with ongoing access complete the current training once each calendar year. Any format works, such as a short presentation, written guidance, or an online module, and quizzes and certificates are not required by the policy. Role-specific guidance, such as secure development for engineers, may be shared as part of normal onboarding and day-to-day work."}, {"k": "grid", "t": "5. What the training covers", "items": [["lock", "Account security", "MFA, no sharing, protect devices"], ["alert", "Phishing", "Check requests before acting"], ["db", "Information", "Keep it in approved systems"], ["cpu", "AI use", "Use approved AI services"]], "n": "The training is brief and focuses on the risks most relevant to us. Account security: multi-factor authentication, not sharing credentials, and protecting Company devices. Phishing and social engineering: checking unexpected messages and requests before acting. Company and customer information: keeping it in approved Company systems. AI use: using approved AI services for Company and customer information. And reporting, which is next."}, {"k": "three", "t": "5. Reporting", "items": [["mail", "Where", "security@prompthalo.ai"], ["clock", "When", "Quickly"], ["check", "Confirm first?", "No, report anything suspicious"]], "banner": ["Report quickly,", "without first confirming it is an incident."], "n": "The last training topic is reporting. Tell security at prompthalo dot ai quickly about anything suspicious, without first confirming that it is an incident. You do not need to investigate or prove anything before you report. Personnel are also expected under Section 3 to report security concerns, so reporting is part of everyone's role."}, {"k": "sec", "t": "6. Ongoing awareness", "items": ["Short reminders via existing channels", "When something relevant happens", "Phishing attempt, new scam, incident", "Or a material change in practices", "Phishing simulations: never punitive"], "art": "Reminder messages, if sent", "cad": "When something relevant happens", "n": "Section 6 covers ongoing awareness. The Security Officer, or a designee, may send short security reminders through existing communication channels when something relevant happens, such as a phishing attempt against the Company, a new scam, a significant security incident, or a material change to our security practices. Phishing simulations may be performed. Results are used to guide awareness and are not used against individuals."}, {"k": "sec", "t": "7. Records and review", "items": ["Completion record: person, training, date", "Spreadsheet or provider report", "Current training material retained", "Yearly check: material current", "Yearly check: active personnel completed"], "art": "Completion record and dated review", "cad": "Once each calendar year", "n": "Section 7 covers records and review. The Company keeps a simple completion record showing the person, the training, and the date completed, such as a spreadsheet or a training provider report. The current training material is retained. Once each calendar year, the Security Officer, or a designee, confirms that the material is current and that active personnel have completed it, and notes the date of that review."}, {"k": "sec", "t": "8. Exceptions", "items": ["Can't finish on time, such as on leave", "Note the reason", "Note the new completion date", "Both go in the completion record"], "art": "Note in the completion record", "cad": "When training is late", "n": "Section 8 covers exceptions. Where someone cannot complete training on time, for example because of leave, the reason and the new completion date are noted in the completion record. No separate exception process is needed. The policy works with the Human Resources Security Policy, the Code of Conduct, the Acceptable Use Policy, and the AI Governance Policy."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "When"], "rows": [["Completion record", "5, 7", "At hire, then each calendar year"], ["Current training material", "7", "Retained; checked yearly"], ["Dated annual review", "7", "Once each calendar year"], ["Reminder messages", "6", "When something relevant happens"], ["Late-completion note", "8", "When training is late"]], "n": "Here are the records this policy relies on. The completion record shows each person's training and date, within 30 days of access and then each calendar year. The current training material is retained. The Security Officer notes the date of the yearly review. Reminders go out when something relevant happens. And when training is late, the reason and new date go in the completion record."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-SAT-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping keep PromptHalo and its customers safe. Let's move on to the questions."}]}, {"key": "sod", "title": "Segregation of Duties", "id": "STD-SOD-001", "version": "1.0", "date": "October 9, 2026", "blurb": "No one makes, approves, and hides a change.", "slides": [{"k": "title", "t": "Segregation of Duties", "sub": "No one makes, approves, and hides a change", "body": "How PromptHalo separates sensitive duties on a small team.", "meta": "STD-SOD-001, version 1.0, October 9, 2026", "n": "Welcome to PromptHalo's Segregation of Duties Standard training. It covers who may approve production changes, the separation principle, which duties are separated and how, the compensating controls a small team uses, and the evidence we keep. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1 to 3. Purpose, scope, and team", "items": [["shield", "Purpose", "No one makes, approves, and conceals"], ["server", "Scope", "Changes, access, logging, backups"], ["users", "Team", "3 full-time, 1 part-time engineer"]], "banner": ["Four engineers:", "every production change is approved by a non-author."], "n": "Section 1. This Standard makes sure no single person can make, approve, and conceal a material change to Company systems, access, or records without another person or an automated control being involved. Section 2. It applies to production changes, deployments, access management, privileged administration, logging, backups, and security exceptions. Section 3. The AI and back-end team has three full-time and one part-time engineer. With four engineers, every production change must be reviewed and approved by an engineer other than its author. The compensating controls apply only when no other engineer is available."}, {"k": "table", "t": "4. Authorized change approvers", "head": ["Product", "Approver", "If approver is author"], "rows": [["Septa", "John (Engineering Lead) or delegate", "Amisha or Uddyaan"], ["Litmus", "Amisha or Uddyaan, or delegate", "Other Litmus lead or engineer"], ["Emergency (any)", "Any approver, after deployment", "Any approver but the author"]], "n": "Section 4. Production changes must be approved by an authorized approver who is not the author. For Septa, the approver is John, the Engineering Lead, or a delegate; if John wrote the change, Amisha or Uddyaan approves. For Litmus, Amisha or Uddyaan, the Engineering Leads, or a delegate approves; if one of them wrote it, the other Litmus lead or another engineer approves. Emergency changes on any product are approved after deployment by any listed approver other than the author."}, {"k": "sec", "t": "4. Approver rules", "items": ["Delegates: AI and back-end engineers", "Designated in writing, e.g. CODEOWNERS", "Authors never approve their own change", "CI/CD accounts never approve", "List updated on joins, leaves, moves"], "art": "CODEOWNERS file or ticket", "cad": "On staff change; with access reviews", "n": "A delegate must be an engineer on the AI and back-end team, designated by the Engineering Lead in writing, for example in GitHub CODEOWNERS or a ticket. The author of a change must never approve it, and CI/CD service accounts must never approve changes. GitHub branch protection and CODEOWNERS should enforce the approver list. The list must be updated when people join, leave, or change roles, and reviewed with the access reviews under the Access Control Policy, POL-AC-001."}, {"k": "three", "t": "5. The principle", "items": [["users", "Two people", "The doer is not the only reviewer"], ["eye", "After the fact", "Independent review if too small"], ["tool", "Technical controls", "Enforce it, not individual behavior"]], "n": "Section 5 states the principle. The person who performs a sensitive activity must not be the only person who approves or reviews it. Where the Company is too small for full separation, an independent review after the fact, or an automated control, must provide the separation. Technical controls should enforce separation wherever practical, so that it does not depend on individual behavior."}, {"k": "table", "t": "6. Separated duties: change", "head": ["Activity", "Approved or reviewed by", "Enforced by"], "rows": [["Code and infra change", "Section 4 approver, not author", "GitHub branch protection"], ["Engineering Lead's change", "Another Engineering member", "GitHub branch protection"], ["Production deployment", "Approved pull request", "CI/CD permissions"], ["Emergency change", "Peer before deploy; approve within 15 days", "PR or ticket after change"]], "n": "Section 6 lists the duties that must be separated. Code and infrastructure changes by an author are approved by a Section 4 approver other than the author, enforced by GitHub branch protection. A change by the Engineering Lead is approved by another Engineering team member. Production deployment is done by the CI/CD pipeline or an authorized deployer from an approved pull request, with no direct production access by default. An emergency change is reviewed by another Engineering team member before deployment and approved under the Change Management Policy, normally within 15 days, with a pull request or ticket recorded after the change."}, {"k": "table", "t": "6. Separated duties: access and ops", "head": ["Activity", "Approved or reviewed by", "Enforced by"], "rows": [["Granting access", "Accountable Party if privileged", "Request and approval record"], ["Access review", "CEO or delegate confirms privileged", "Annual access review record"], ["Privileged admin activity", "Security Officer or delegate", "AWS CloudTrail and alerting"], ["Logging or backup changes", "Engineering and Security alerted", "CloudTrail alerts"], ["Security exception", "Accountable Party", "Exception Register"]], "n": "Granting access is approved by the Accountable Party for privileged access, and otherwise by the approver under the Access Control Policy. Access reviews are done by the Engineering Lead or CEO, the CEO or delegate confirms privileged access, and no one is the sole reviewer of their own privileged access. Privileged admin activity is reviewed by the Security Officer or delegate through CloudTrail and alerts. Changes to logging, alerting, or backup settings alert Engineering and the Security Officer or delegate. Security exceptions are approved by the Accountable Party and logged in the Exception Register."}, {"k": "check", "t": "7. Small-team compensating controls", "items": ["Review after the fact in 5 days", "By CEO or Security Officer, or delegate", "Automated checks that block", "Logging with alert to someone else"], "big": "At least one", "bigsub": "Applied and recorded when one person does both", "n": "Section 7. Where only one person can perform and approve an activity, the Company must apply at least one compensating control and record it. The options are a review after the fact by the CEO or delegate, or the Security Officer or delegate, within 5 business days; automated checks that block the activity unless conditions are met; or logging of the activity with an alert to someone other than the person performing it."}, {"k": "table", "t": "Artifacts and cadence", "head": ["Evidence", "When it is created"], "rows": [["Branch protection and PR approvals", "Each production change"], ["CI/CD permissions and deploy records", "Each deployment"], ["Access requests and review records", "Each grant; annual review"], ["CloudTrail alerts", "Privileged activity; setting changes"], ["Exception Register entries", "Each compensating control or exception"]], "n": "Section 8 lists the evidence. GitHub branch protection settings and pull request approvals. CI/CD deployment permissions and deployment records. Access requests and access review records. CloudTrail alerts on privileged activity and on changes to logging, alerting, or backup settings. And Exception Register entries for any compensating control. Under Section 9, exceptions to this Standard must be approved by the Accountable Party and recorded in the Exception Register with the compensating control and an expiry date."}, {"k": "sign", "t": "Acknowledge this standard", "items": ["Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this standard when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for making sure no change at PromptHalo rests on one person alone. Let's move on to the questions."}]}, {"key": "vm", "title": "Vendor Management", "id": "POL-VM-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Three tiers, effort where the risk is.", "slides": [{"k": "title", "t": "Vendor Management", "sub": "Three tiers, effort where the risk is", "body": "How we classify, assess, monitor, and offboard the vendors we rely on.", "meta": "POL-VM-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Vendor Management Policy training. This walkthrough goes section by section: why the policy exists, who it covers, the three vendor risk tiers, the four questions that set a tier, what happens before and while a vendor is used, how a vendor leaves, and both appendices. You can pause, rewind, speed up, or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["server", "Reliance", "Hosting, models, code, productivity"], ["shield", "Shared risk", "Their security affects ours"], ["target", "Three tiers", "Effort goes where the risk is"]], "banner": ["Lifecycle:", "approve before use, monitor, offboard. No scoring."], "n": "Section 1 sets the purpose. PromptHalo relies on vendors for hosting, model access, source code, and everyday productivity. Their security affects our security and our commitments to clients. The policy sets a simple three-tier model so that effort goes where the risk is: assess and approve a vendor before use, monitor it while in use, and offboard it cleanly. No numeric scoring is required."}, {"k": "grid", "t": "2. Who and what it covers", "items": [["list", "Every vendor", "Software, infrastructure, or services"], ["target", "All three tiers", "Critical, Moderate, and Low Risk"], ["doc", "One register", "Every vendor is recorded"], ["user", "Not covered", "Personal tools: Code of Conduct"]], "n": "Section 2 sets the scope. The policy covers every vendor that supplies software, infrastructure, or services to the Company, in all three tiers, and every one of them is recorded in the vendor register. Personal tools used under Section 11 of the Code of Conduct are governed by the Code of Conduct, not by this policy."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Committee approves and reviews yearly", "AP approves Critical and Moderate", "AP confirms tiers and keeps the register", "Each vendor has a named internal owner"], "art": "Vendor register: owner, tier, approval", "cad": "When a vendor is added or changes", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy. The Steering Committee approves it and reviews it at least annually. The Accountable Party approves Critical and Moderate Risk vendors before use, confirms each tier, and maintains the vendor register. Security or infrastructure staff may review vendors on its behalf. Each vendor has a named owner, usually the requester, who reports changes in use."}, {"k": "three", "t": "5. The three vendor risk tiers", "items": [["alert", "Critical Risk", "Sensitive data, deep access, key service"], ["eye", "Moderate Risk", "Limited access, not critical"], ["check", "Low Risk", "No data, no access, no dependency"]], "banner": ["Tier:", "set by the four questions in Section 6."], "n": "Section 5 sets the tiers. A Critical Risk vendor processes customer or sensitive data, has significant access to our systems or source code, or would materially disrupt the business if it failed: for example cloud hosting, AI model providers, source code hosting, email, and payroll. A Moderate Risk vendor has limited access but is not critical, such as CRM, support, or analytics. A Low Risk vendor has no sensitive data, access, or dependency, such as office supplies."}, {"k": "table", "t": "5. What each tier requires", "head": ["Tier", "Before use", "While in use"], "rows": [["Critical Risk", "Security review; contract and DPA review", "Annually"], ["Moderate Risk", "Lightweight security review", "At renewal or on concern, at most yearly"], ["Low Risk", "Record in the vendor register", "No periodic security review"]], "n": "This table from Section 5 is the heart of the policy. Before use, a Critical Risk vendor gets a security review plus a contract and DPA review, a Moderate Risk vendor gets a lightweight security review, and a Low Risk vendor is simply recorded. While in use, Critical is reassessed annually, Moderate at renewal or when a concern arises, at most yearly, and Low has no periodic review. A vendor whose use changes is reclassified before the change takes effect."}, {"k": "grid", "t": "6. How to classify: four questions", "items": [["db", "1. Data", "Customer, confidential, regulated?"], ["lock", "2. Access", "Production, source code, key accounts?"], ["server", "3. Operations", "Would losing it materially hurt?"], ["alert", "4. Exposure", "Security, privacy, regulatory risk?"]], "n": "Section 6 says how to classify a vendor. The vendor owner and the Accountable Party answer four questions using their judgment. One: does the vendor handle customer, confidential, or regulated data? Two: does it have access to production systems, source code, or important accounts? Three: would losing its service materially affect operations? Four: does it create material security, privacy, or regulatory exposure?"}, {"k": "check", "t": "6. Answers and the tier rule", "items": ["Any Significant: Critical Risk", "Else any Limited: Moderate Risk", "All None: Low Risk", "Unclear: the higher answer applies", "Record answers, tier, one-line reason"], "big": "No scores", "bigsub": "Judgment by the owner and the Accountable Party", "n": "Each question is answered Significant, Limited, or None, as defined in Appendix A. Any Significant answer places the vendor in Critical Risk. If nothing is Significant and at least one answer is Limited, the vendor is Moderate Risk. If every answer is None, it is Low Risk. Where an answer is unclear, the higher answer applies until the Accountable Party decides. The answers, the tier, and a one-line reason go in the vendor register."}, {"k": "sec", "t": "7. Before use: identify and assess", "items": ["Owner adds vendor to register first", "Critical: data, location, data return", "Assurance: SOC 2 or ISO 27001 link", "Appendix B rating: High, Moderate, Low", "Record our complementary user controls"], "art": "Register entry and assurance link", "cad": "Before first use", "n": "Section 7 covers the steps before use. The vendor owner adds the vendor to the register, with its owner, purpose, and basic details, before it is used. A Critical Risk review covers what data the vendor holds, where it processes it, whether we can get our data back, and what assurance exists. A current SOC 2 report or ISO 27001 certificate is accepted, and at least a link is recorded. The review applies Appendix B and records a security risk rating. Our complementary user entity controls are recorded."}, {"k": "sec", "t": "7. Before use: other tiers and contract", "items": ["Relied-on vendors: subservice orgs", "Moderate: lightweight review", "Low: record in the register only", "Critical contracts: security, privacy, DPA", "Fixed terms: reviewed, accepted knowingly"], "art": "Accepted terms or DPA, noted in register", "cad": "Before use", "n": "Vendors whose controls we rely on for our own SOC 2 report are subservice organizations under the carve-out method. A Moderate Risk review confirms published security information, data handling, and terms, and checks incidents and vulnerabilities under Appendix B. A Low Risk vendor is just recorded. Contract terms for Critical, and Moderate where appropriate, cover security, privacy, data processing, and incident notification. Non-negotiable terms are reviewed and accepted knowingly, and the acceptance could be recorded once in the register."}, {"k": "two", "t": "8. Sub-processors", "items": [["users", "Client personal data", ["Marked as sub-processor", "Register view is the client list", "Clients told of changes"]], ["link", "Dependencies", ["Critical vendor's key provider", "Example: AI model on another cloud", "Noted in the register"]]], "n": "Section 8 covers sub-processors. A sub-processor is a vendor that processes personal data on behalf of a client. These vendors are marked as sub-processors in the vendor register, and that view of the register is the sub-processor list we share with clients. Clients are told about changes as their agreements require. Where a Critical Risk vendor depends materially on another provider, such as an AI model provider running on another cloud, that dependency is noted in the register."}, {"k": "sec", "t": "9. While in use: reassessment", "items": ["Critical: once a year, not more often", "Confirm assurance, terms, rating, tier", "Material changes logged in the register", "Moderate: at renewal or concern", "Low: no periodic security review"], "art": "Assessment in the compliance platform", "cad": "Critical annually", "n": "Section 9 covers vendors in use. Critical Risk vendors are reassessed once a year, and not more often: the assurance link is confirmed, terms rechecked, the security risk rating refreshed, and the owner and tier confirmed. A material change, such as new terms, a disclosed breach, or new access to customer data, is recorded in the register and considered at the next assessment. Moderate vendors are reassessed at renewal or on a concern, at most yearly. Low Risk vendors have no periodic review."}, {"k": "sec", "t": "9. New tools, connections, high risk", "items": ["Tell the Accountable Party first", "Card statement checked yearly", "Missing tools added and classified", "App connections on an allow-list", "High rating: enhanced monitoring"], "art": "Card review and allow-list review", "cad": "Annually", "n": "Personnel tell the Accountable Party before adopting a new tool. At the annual review, the Company card statement is checked for tools missing from the register, and any found are added and classified. Third-party application connections to our productivity and source code platforms are restricted by allow-list and reviewed annually under the Asset Management Policy. A vendor rated High security risk that remains in use is placed under enhanced monitoring until the rating improves."}, {"k": "flow", "t": "10. When a vendor leaves", "steps": [["lock", "Revoke", "Remove the vendor's access", "F7DEDE"], ["db", "Return", "Or confirm deletion of data", "F7EDC9"], ["check", "Record", "Record the confirmation", "DDEBF7"], ["doc", "Close", "Closed with a date, not deleted", "DCEFE2"]], "banner": "Cannot confirm deletion? Record it as a residual risk, not assumed clean.", "n": "Section 10 covers offboarding. We revoke the vendor's access, have Company and client data returned or confirm its deletion, and record the confirmation. A vendor that cannot confirm deletion is recorded as a residual risk rather than assumed clean. Finally, the register entry is marked closed with the date. It is not deleted, so the history of the vendor stays in the register."}, {"k": "sec", "t": "11 and 12. Records and exceptions", "items": ["Policy: rules, tiers, roles", "Vendor register: the single record", "No other vendor records required", "Material exceptions: Accountable Party", "Logged in Policy Exception Register"], "art": "Policy Exception Register entry", "cad": "When an exception is approved", "n": "Section 11 keeps records small. The policy defines the rules, and the vendor register is the single operational record, holding vendor details, tier and reason, security risk rating, owner, evidence links, review dates, and status. No other vendor records are required. Section 12: material exceptions must be approved by the Accountable Party and documented in the Policy Exception Register, with any risk mitigation. Accepting a large provider's published terms is not an exception."}, {"k": "table", "t": "Appendix A: The three answers", "head": ["Answer", "Meaning", "Examples"], "rows": [["Significant", "Direct and at scale", "Customer data; production access"], ["Limited", "Some exposure, but contained", "Internal data; read-only access"], ["None", "No meaningful exposure", "No data, access, or dependency"]], "n": "Appendix A defines the answers. Significant means the vendor holds, reaches, or affects something directly and at scale, such as customer data or employee SSNs, production or source code access, or a product or payroll that stops without it. Limited means some exposure, but contained. None means no meaningful exposure. In the worked examples, cloud hosting and payroll are Critical, team chat is Moderate, and office supplies are Low."}, {"k": "table", "t": "Appendix B: Assessment criteria", "head": ["Criterion", "What is checked"], "rows": [["Independent assurance", "Current SOC 2 report or ISO 27001"], ["Incidents and exposure", "Last 24 months; exposed services"], ["Vulnerabilities", "Exploited or critical; patches"], ["HTTPS, TLS, email", "Certificates; DMARC, SPF, DKIM"], ["Disclosure, transparency", "Security contact; status page"], ["Governance and data", "Security program, DPA, retention"], ["Fourth parties", "Vendor's critical providers"], ["AI model supply chain", "Named models; no training on data"]], "n": "Appendix B lists the criteria used, from public information and the vendor's own assurance: independent assurance; known incidents and external exposure over the last 24 months; known vulnerabilities and patches; HTTPS and TLS; DMARC, SPF, and DKIM email security; vulnerability disclosure; governance and data handling; transparency, such as a status page; fourth parties; and the AI model supply chain, including no training on customer data."}, {"k": "sec", "t": "Appendix B: Rating and monitoring", "items": ["Rate: No concern, Gap, Significant gap", "High: 2+ Significant gaps, or 5+ Gaps", "Moderate: 1 Significant gap or 2+ Gaps", "High in use: enhanced monitoring", "Critical and High: fix or accept in quarter"], "art": "Rating and reasons in the register", "cad": "At each assessment", "n": "Each criterion is rated No concern, Gap, or Significant gap. High means two or more Significant gaps, one Significant gap and two or more Gaps, or five or more Gaps. Moderate means one Significant gap, two or more Gaps, or any Gap in incidents and exposure. Otherwise Low. Under enhanced monitoring, the owner subscribes to advisories, the Security Officer watches them, compensating controls are recorded, and new incidents go to the Accountable Party. A Critical vendor rated High is remediated or accepted within the quarter."}, {"k": "table", "t": "Artifacts and cadence", "head": ["Artifact", "Section", "How often"], "rows": [["Register entry: tier, reason, owner", "5, 6, 7", "Before use; when use changes"], ["Assurance link and risk rating", "7, App. B", "Before use; at each assessment"], ["Accepted terms or DPA", "7", "Before use"], ["Sub-processor view of register", "8", "When a sub-processor changes"], ["Vendor reassessment", "9", "Critical yearly; Moderate at renewal"], ["Card statement and allow-list", "9", "Annually"], ["Offboarding confirmation", "10", "When a vendor leaves"], ["Exception Register entry", "12", "When an exception is approved"]], "n": "Here is what the policy produces. A register entry with tier, reason, and owner, before use and when use changes. An assurance link and security risk rating at each assessment. Accepted terms or a DPA before use. The sub-processor view, updated when sub-processors change. Reassessments yearly for Critical and at renewal for Moderate. The card statement and allow-list review annually. An offboarding confirmation when a vendor leaves, and exception entries when approved."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-VM-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping our vendors, and our clients' data, in safe hands. Let's move on to the questions."}]}, {"key": "vpm", "title": "Vulnerability and Patch Management", "id": "POL-VPM-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Find weaknesses, break the paths that matter.", "slides": [{"k": "title", "t": "Vulnerability and Patch Management", "sub": "Patching and the attack paths that matter", "body": "How PromptHalo identifies, prioritizes, and fixes security weaknesses.", "meta": "POL-VPM-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Vulnerability and Patch Management Policy training. We will cover how we find weaknesses, how we decide which ones matter using attack paths, how we remediate and verify, how patching works, how we review, and how exceptions are handled. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["eye", "Find weaknesses", "In systems, code, dependencies and cloud"], ["target", "Focus on risk", "Risk decides what is fixed and how fast"], ["tool", "Automate", "Use automated capabilities where practical"]], "banner": ["Purpose:", "address significant risks before they can be exploited."], "n": "Section 1 states the purpose: to identify security weaknesses in Company systems, applications, code, dependencies, and cloud environments, and to address significant risks before they can be exploited. We use automated capabilities wherever practical to find vulnerabilities, and risk determines what is remediated and how quickly."}, {"k": "grid", "t": "2. What it covers", "items": [["server", "Cloud resources", "And production applications"], ["cpu", "Code and dependencies", "Repositories and libraries"], ["db", "Containers", "And container images"], ["target", "AI systems", "Applications, models and agents"]], "n": "Section 2 sets the scope: Company systems and technology that may affect the security of Company or customer information, including cloud resources, production applications, source code, repositories and dependencies, containers and container images, and AI applications, models, and agents. Employee endpoints receive operating system and application security updates under the Company's endpoint security requirements."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Committee approves, reviews yearly", "Security Officer oversees the program", "System owners support remediation", "Everyone reports vulnerabilities"], "art": "Dated policy approval record", "cad": "At least annually", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy and may delegate duties. The Information Security Steering Committee approves it and reviews it at least annually. The Security Officer, or a designee, oversees vulnerability management. System and application owners support remediation in the systems they are responsible for. And personnel report security vulnerabilities they identify."}, {"k": "sec", "t": "4. Terminology", "items": ["Attack path: weaknesses chained to a target", "Attack graph: all paths in an environment", "Exploitability: can it really be used here", "Finding: reported by scan, test or person", "Patch: a vendor-supplied fix"], "art": "None specified", "cad": "As needed", "n": "Section 4 defines the terms. An attack path is a sequence of vulnerabilities, exposures, or permissions that an attacker could chain together to reach a target, and an attack graph shows the attack paths in an environment. Exploitability is whether a weakness can realistically be reached and used in our environment. A finding is a weakness reported by a scan, a test, or a person. A patch is a vendor-supplied fix, distinct from a configuration change or compensating control."}, {"k": "flow", "t": "The vulnerability lifecycle", "steps": [["eye", "Identify", "Automated scans and testing", "E9E3F5"], ["target", "Prioritize", "Rate attack paths, not single findings", "F7EDC9"], ["tool", "Remediate", "Break the most significant paths", "FBE5D6"], ["check", "Verify", "Confirm the risk is addressed", "DCEFE2"], ["list", "Review", "Open items and coverage", "DDEBF7"]], "banner": "Risk determines what is remediated and how quickly.", "n": "Here is the lifecycle the policy describes. Identify weaknesses with automated capabilities and testing. Prioritize them as attack paths rather than one finding at a time. Remediate by breaking the most significant paths, through Change Management. Verify that the risk is actually addressed before closing significant findings. And review significant open vulnerabilities periodically, and coverage at least annually."}, {"k": "check", "t": "5. Identify", "items": ["Source code and dependency scanning", "Container and image scanning", "Cloud vulnerability and config scanning", "Secret detection", "OS and software vulnerabilities"], "big": "Automated", "bigsub": "Running continuously or periodically, based on risk", "n": "Section 5 covers identification. Vulnerabilities are identified using automated security capabilities where practical, running automatically or periodically based on the technology and risk. Coverage may include source code and dependency scanning, container and image scanning, cloud vulnerability and configuration scanning, secret detection, operating system and software vulnerabilities, and security testing during development. Capabilities already built into our cloud, development, and security platforms may be used instead of separate scanning products.", "art": "Scan findings", "cad": "Automatically or periodically"}, {"k": "sec", "t": "6. Prioritize: think in attack paths", "items": ["Prioritize as sets, not one at a time", "Build or analyze attack graphs", "Chain findings, exposure, identities", "Paths to production or customer data", "Findings take their path's rating"], "art": "Attack path rating with the finding", "cad": "As findings are identified", "n": "Section 6 is the heart of the policy. Vulnerabilities are prioritized as sets, not one at a time. Where practical, the Company builds or analyzes attack graphs that show how findings, external exposure, identities, and permissions could be chained into attack paths to production systems or customer information. Each attack path is rated, and the vulnerabilities on that path take its rating."}, {"k": "check", "t": "6. Rating an attack path", "items": ["Severity and exploitability of each step", "Internet or external exposure", "Sensitive or customer data reachable", "Importance of systems on the path", "Known exploit, compensating controls"], "big": "Four ratings", "bigsub": "Rated by likelihood and potential impact", "n": "Each attack path is rated Critical, High, Medium, or Low based on likelihood and potential impact. We consider the severity and exploitability of each step, external exposure, whether sensitive or customer information is reachable, the importance of the systems, whether a known exploit is available, and compensating controls in place. A vulnerability on a published known-exploited list is treated as exploitable until shown otherwise. A finding on no meaningful path may be rated below its scanner severity, with the reason recorded."}, {"k": "table", "t": "7. Remediation targets", "head": ["Attack path rating", "Remediation target"], "rows": [["Critical", "As soon as reasonably practicable"], ["High", "Promptly, based on risk"], ["Medium", "Through normal maintenance and development"], ["Low", "As appropriate"]], "n": "Section 7 sets the remediation targets by attack path rating. Critical paths are remediated as soon as reasonably practicable. High, promptly based on risk. Medium, through normal maintenance and development. Low, as appropriate. Where remediation is delayed beyond its target, the reason, any compensating control, and the planned disposition are recorded."}, {"k": "sec", "t": "7. Remediate and verify", "items": ["Break the most significant paths first", "Fix shared exposure, credential, permission", "Patch, update, reconfigure or restrict", "Changes go through Change Management", "Close only once verified"], "art": "Finding with fix and verification", "cad": "As findings are remediated", "n": "Remediation focuses on the changes that break the most significant attack paths, such as a shared exposure, credential, or permission that several paths rely on. Remediation may mean a patch, a dependency update, a configuration change, removing unnecessary software or services, restricting access or exposure, or another compensating control. A patch is not required where another reasonable action reduces the risk. Changes go through Change Management, and significant findings are closed only when remediation is verified, for example by a later scan."}, {"k": "sec", "t": "8. Patching", "items": ["Applied based on risk and impact", "Automatic OS updates may be relied on", "Provider-managed and dependency updates", "Application or infrastructure deploys", "No manual patching if provider does it"], "art": "Update and deployment records", "cad": "Based on risk and operational impact", "n": "Section 8 covers patching. Security patches and updates are applied based on risk and operational impact. The Company may rely on automatic operating system updates, SaaS and cloud provider managed updates, dependency updates, and application or infrastructure deployments. Manual patching is not required where the cloud or SaaS provider performs it."}, {"k": "sec", "t": "9. Review", "items": ["Security Officer or designee reviews", "Significant open vulnerabilities", "Material findings being addressed", "Coverage confirmed at least annually", "A dated written record is sufficient"], "art": "Dated written review record", "cad": "Periodically; coverage yearly", "n": "Section 9 covers review. The Security Officer, or a designee, periodically reviews significant open vulnerabilities and confirms that material findings are being addressed. At least annually, the Company confirms that vulnerability management coverage remains appropriate for its environment. A dated written record of the review is sufficient."}, {"k": "sec", "t": "10. Exceptions", "items": ["No patch, or fix riskier than the issue", "Not reasonably exploitable here", "Or a compensating control suffices", "Accepted temporarily by Accountable Party", "Recorded in the Exception Register"], "art": "Exception Register entry", "cad": "When a material exception is accepted", "n": "Section 10 covers exceptions. A vulnerability that cannot reasonably be remediated may be accepted temporarily by the Accountable Party when a patch is unavailable, remediation would create greater operational risk, the vulnerability is not reasonably exploitable in our environment, or a compensating control sufficiently reduces the risk. Material exceptions are recorded in the Exception Register with the vulnerability, reason, compensating control, owner, and review date."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "When"], "rows": [["Finding with path rating and reason", "6", "When rated below scanner severity"], ["Delayed remediation record", "7", "When a target is missed"], ["Fix through Change Management", "7", "For significant vulnerabilities"], ["Verification evidence", "7", "Before closing significant findings"], ["Dated review record", "9", "Periodically; coverage yearly"], ["Exception Register entry", "10", "For material exceptions"]], "n": "Here are the records this policy relies on. The reason, kept with the finding, when it is rated below its scanner severity. The reason, compensating control, and planned disposition when remediation is delayed beyond its target. The change record for each significant fix. Verification evidence, such as a later scan, before a significant finding is closed. A dated review record. And an Exception Register entry for material exceptions."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-VPM-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping us find weaknesses and close the attack paths that matter. Let's move on to the questions."}]}], "icons": {"users": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\/path><circle cx=\"9\" cy=\"7\" r=\"4\"><\/circle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"><\/path><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\/path><\/svg>", "map": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"><\/path><circle cx=\"12\" cy=\"10\" r=\"3\"><\/circle><\/svg>", "clock": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><polyline points=\"12 6 12 12 16 14\"><\/polyline><\/svg>", "link": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"><\/path><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"><\/path><\/svg>", "check": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"><\/path><polyline points=\"22 4 12 14.01 9 11.01\"><\/polyline><\/svg>", "heart": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"><\/path><\/svg>", "eye": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"
