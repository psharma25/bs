"><\/line><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"><\/line><polyline points=\"10 9 9 9 8 9\"><\/polyline><\/svg>", "edit": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"><\/path><path d=\"M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z\"><\/path><\/svg>", "send": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"><\/line><polygon points=\"22 2 15 22 11 13 2 9 22 2\"><\/polygon><\/svg>", "globe": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"><\/line><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"><\/path><\/svg>", "clip": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"><\/path><rect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\"><\/rect><\/svg>", "tool": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"><\/path><\/svg>", "list": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"8\" y1=\"6\" x2=\"21\" y2=\"6\"><\/line><line x1=\"8\" y1=\"12\" x2=\"21\" y2=\"12\"><\/line><line x1=\"8\" y1=\"18\" x2=\"21\" y2=\"18\"><\/line><line x1=\"3\" y1=\"6\" x2=\"3.01\" y2=\"6\"><\/line><line x1=\"3\" y1=\"12\" x2=\"3.01\" y2=\"12\"><\/line><line x1=\"3\" y1=\"18\" x2=\"3.01\" y2=\"18\"><\/line><\/svg>", "phone": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\" ry=\"2\"><\/rect><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"><\/line><\/svg>"}, "link": "https://claude.ai/artifact/PcMEpXDE2W2zzdM2AgGBAG"}</script>
<script>
"use strict";
const D=JSON.parse(document.getElementById("data").textContent);
const DECKS=D.decks, IC=D.icons, LOGO=document.querySelector("img.logo").src;
const $=s=>document.querySelector(s);
const el=(t,a={},x)=>{const n=document.createElement(t);for(const k in a)n.setAttribute(k,a[k]);if(x!=null)n.textContent=x;return n;};
const icon=k=>{ const w=el("span",{"aria-hidden":"true"}); w.innerHTML=IC[k]||IC.ok; return w.firstChild; };
let scale=1.1; try{const v=parseFloat(localStorage.getItem("show-scale"));if(v>=1&&v<=1.5)scale=v;}catch(e){}
const applyScale=()=>{document.documentElement.style.setProperty("--scale",scale);try{localStorage.setItem("show-scale",String(scale));}catch(e){}};
applyScale();
$("#fsDown").onclick=()=>{scale=Math.max(1,+(scale-.1).toFixed(2));applyScale();};
$("#fsUp").onclick=()=>{scale=Math.min(1.5,+(scale+.1).toFixed(2));applyScale();};

/* ---------- slide renderer ---------- */
function chip(k,sm){ const c=el("div",{class:"chip"+(sm?" sm":"")}); c.appendChild(icon(k)); return c; }
function foot(d,dark){ const f=el("div",{class:"foot"}); f.appendChild(el("span",{},d.date)); const i=el("img",{alt:"PromptHalo",src:LOGO}); f.appendChild(i); return f; }
function renderSlide(d,s){
  const dark=s.k==="title"||s.k==="sign";
  const r=el("div",{class:"s"+(dark?" dark":"")});
  if(s.k==="title"){
    const c=el("div",{class:"titlecard"}); c.appendChild(el("img",{alt:"PromptHalo",src:LOGO}));
    c.append(el("h1",{class:s.t.length>30?"long":""},s.t),el("p",{class:"sub"},s.sub),el("p",{class:"body"},s.body),el("p",{class:"meta"},s.meta)); r.appendChild(c); return r;
  }
  r.appendChild(el("h2",{},s.t));
  if(s.k==="grid"){ const g=el("div",{class:"grid4"}); s.items.forEach(([k,l,t])=>{ const c=el("div",{class:"card"}); c.appendChild(chip(k)); const w=el("div"); w.append(el("div",{class:"lab"},l),el("div",{class:"txt"},t)); c.appendChild(w); g.appendChild(c); }); r.appendChild(g); }
  if(s.k==="three"){ const g=el("div",{class:"three"+(s.banner?"":" tall")}); s.items.forEach(([k,l,t])=>{ const c=el("div",{class:"card"}); const h=el("div",{class:"h"}); h.append(chip(k),el("div",{class:"lab"},l)); c.append(h,el("div",{class:"txt"},t)); g.appendChild(c); }); r.appendChild(g);
    if(s.banner){ const b=el("div",{class:"banner"}); b.appendChild(icon("shield")); const t=el("div"); t.append(el("b",{},s.banner[0]+" "),el("span",{},s.banner[1])); b.appendChild(t); r.appendChild(b); } }
  if(s.k==="two"){ const g=el("div",{class:"two"}); s.items.forEach(([k,l,list])=>{ const c=el("div",{class:"card"}); const h=el("div",{class:"h"}); h.append(chip(k),el("b",{},l)); const ul=el("ul",{class:"b"}); list.forEach(x=>ul.appendChild(el("li",{},x))); c.append(h,ul); g.appendChild(c); }); r.appendChild(g); }
  if(s.k==="check"){ const g=el("div",{class:"chk"}); const c=el("div",{class:"card"}); s.items.forEach(x=>{ const row=el("div",{class:"row"}); row.append(chip("ok",true),el("span",{},x)); c.appendChild(row); }); const b=el("div",{class:"big"}); b.append(el("b",{},s.big),el("span",{},s.bigsub)); g.append(c,b); r.appendChild(g); }
  if(s.k==="sec"){ const g=el("div",{class:"secg"}); const c=el("div",{class:"card"}); s.items.forEach(x=>{ const row=el("div",{class:"row"}); row.append(chip("ok",true),el("span",{},x)); c.appendChild(row); });
    const ev=el("div",{class:"ev"}); ev.append(el("b",{},"Artifact"),el("span",{},s.art),el("b",{},"Updated"),el("span",{},s.cad)); g.append(c,ev); r.appendChild(g); }
  if(s.k==="table"){ const tl=s.rows.flat().join("").length, w=el("div",{class:"tbl"+(tl>380||s.rows.length>6?" xdense":(s.rows.length>5||tl>300?" dense":""))}), t=el("table"), tr=el("tr"); s.head.forEach(h=>tr.appendChild(el("th",{},h))); t.appendChild(tr);
    s.rows.forEach(row=>{ const r2=el("tr"); row.forEach(c=>r2.appendChild(el("td",{},c))); t.appendChild(r2); }); w.appendChild(t); r.appendChild(w); }
  if(s.k==="flow"){ const g=el("div",{class:"flow n"+s.steps.length}); s.steps.forEach(([k,l,t,f],i)=>{ if(i) g.appendChild(el("div",{class:"ar","aria-hidden":"true"},"\u2192")); const c=el("div",{class:"card st"}); if(f) c.style.background="#"+f; c.append(chip(k),el("div",{class:"lab"},l),el("div",{class:"txt"},t)); g.appendChild(c); }); r.appendChild(g);
    if(s.banner){ const b=el("div",{class:"banner"}); b.appendChild(icon("shield")); const t=el("div"); t.appendChild(el("b",{},s.banner)); b.appendChild(t); r.appendChild(b); } }
  if(s.k==="sign"){ const g=el("div",{class:"signg"}); const c=el("div",{class:"card"}); c.appendChild(el("div",{class:"lab"},"Your record:")); const ul=el("ul",{class:"b"}); s.items.forEach(x=>ul.appendChild(el("li",{},x))); c.appendChild(ul);
    const side=el("div",{class:"card side"}); side.append(chip("pen"),el("p",{},s.side)); const a=el("a",{href:D.link,target:"_blank",rel:"noopener"},"Start training"); side.appendChild(a); g.append(c,side); r.appendChild(g); }
  r.appendChild(foot(d,dark)); return r;
}

function fitSlide(r){ if(!r||r.dataset.fit||getComputedStyle(r).position!=="absolute") return; const f=r.querySelector(".foot"); const body=[...r.children].filter(c=>c.tagName!=="H2"&&!c.classList.contains("foot")&&!c.classList.contains("titlecard")); if(!f||!body.length||!r.getBoundingClientRect().height) return;
  r.dataset.fit="1"; let k=1; const over=()=>{const ft=f.getBoundingClientRect().top; return body.some(b=>b.getBoundingClientRect().bottom>ft-4);};
  while(over()&&k>0.66){ k-=0.04; body.forEach(b=>b.style.zoom=k); } }
/* ---------- chooser ---------- */
const thumbs=[];
const words=t=>t.split(/\s+/).length;
const dur=s=>Math.max(7,Math.round(words(s.n)/2.6+2));
const mins=d=>Math.max(1,Math.round(d.slides.reduce((a,s)=>a+dur(s),0)/60));
DECKS.forEach(d=>{
  const c=el("article",{class:"pcard"});
  const th=el("div",{class:"thumb"}); const ts=el("div",{class:"tscale"}); ts.appendChild(renderSlide(d,d.slides[0])); th.appendChild(ts); c.appendChild(th); thumbs.push([th,ts]);
  const b=el("div",{class:"body"}); b.append(el("h3",{},d.title),el("div",{class:"meta"},d.id+", version "+d.version+"  |  "+d.slides.length+" slides, about "+mins(d)+" minutes on auto-play"),el("div",{},d.blurb));
  const row=el("div",{class:"row"}); const go=el("button",{class:"btn primary"},"Start slideshow"); go.onclick=()=>open(d.key,0,false);
  const pr=el("button",{class:"btn"},"Present"); pr.onclick=()=>open(d.key,0,true); row.append(go,pr); b.appendChild(row); c.appendChild(b); $("#cards").appendChild(c);
  $("#pick").appendChild(el("option",{value:d.key},d.title));
});

const fitThumbs=()=>thumbs.forEach(([th,ts])=>{ ts.style.transform="scale("+(th.clientWidth/1280)+")"; });
fitThumbs(); document.querySelectorAll("#cards .tscale .s").forEach(fitSlide); try{ new ResizeObserver(fitThumbs).observe($("#cards")); }catch(e){ window.addEventListener("resize",fitThumbs); }

/* ---------- slideshow ---------- */
let deck=null, cur=0, nodes=[], playing=false, timer=null, t0=0, raf=0;
function open(key,idx,present){
  deck=DECKS.find(d=>d.key===key)||DECKS[0]; $("#pick").value=deck.key;
  $("#chooser").hidden=true; $("#show").hidden=false; $("#showTools").hidden=false;
  const st=$("#stage"); st.textContent=""; nodes=deck.slides.map((s,i)=>{ const w=el("div",{class:"slide","aria-hidden":"true"}); w.appendChild(renderSlide(deck,s)); st.appendChild(w); return w; });
  const sg=$("#segs"); sg.textContent=""; deck.slides.forEach((s,i)=>{ const b=el("button",{type:"button","aria-label":"Slide "+(i+1)+": "+s.t}); b.appendChild(el("i")); b.onclick=()=>go(i); sg.appendChild(b); });
  renderRail();
  nodes.forEach(n=>fitSlide(n.firstChild));
  cur=-1; go(idx||0,true); if(present) enterPresent(); window.scrollTo({top:0});
}
function go(i,instant){
  if(!deck) return; i=Math.max(0,Math.min(deck.slides.length-1,i)); const dir=i>=cur?1:-1;
  nodes.forEach((n,j)=>{ n.classList.toggle("on",j===i); n.classList.toggle("left",j<i); n.setAttribute("aria-hidden",String(j!==i)); });
  cur=i; const s=deck.slides[i];
  $("#count").textContent=deck.title+"  "+(i+1)+" / "+deck.slides.length+"  |  "+s.t; $("#notes").textContent=s.n;
  $("#prev").disabled=i===0; $("#next").disabled=i===deck.slides.length-1;
  [...$("#segs").children].forEach((b,j)=>{ b.classList.toggle("done",j<i); b.firstChild.style.width=j<i?"100%":"0"; });
  const tbs=[...$("#rail").querySelectorAll('.rail-list[data-deck="'+deck.key+'"] .tb')]; tbs.forEach((b,j)=>b.setAttribute("aria-current",String(j===i)));
  const ct=tbs[i]; if(ct && !document.body.classList.contains("fs")) keepVisible(ct);
  try{ history.replaceState(null,"","#"+deck.key+"/"+(i+1)); }catch(e){}
  if(playing) startTimer();
}
function startTimer(){ cancelAnimationFrame(raf); t0=performance.now(); const ms=dur(deck.slides[cur])*1000; const bar=$("#segs").children[cur].firstChild;
  const step=now=>{ if(!playing) return; const p=Math.min(1,(now-t0)/ms); bar.style.width=(p*100)+"%"; if(p>=1){ if(cur<deck.slides.length-1) go(cur+1); else setPlay(false); } else raf=requestAnimationFrame(step); };
  raf=requestAnimationFrame(step); }
function setPlay(v){ playing=v; $("#playBtn").setAttribute("aria-pressed",String(v)); $("#playBtn").textContent=v?"Pause":"Auto-play"; if(v){ if(cur===deck.slides.length-1) go(0); else startTimer(); } else { cancelAnimationFrame(raf); const b=$("#segs").children[cur]; if(b) b.firstChild.style.width="0"; } }
$("#prev").onclick=()=>go(cur-1); $("#next").onclick=()=>go(cur+1);
$("#stage").onclick=e=>{ if(e.target.closest("a")) return; go(cur+1); };
$("#playBtn").onclick=()=>setPlay(!playing);
$("#notesBtn").onclick=()=>{ const on=$("#notesBox").hidden; $("#notesBox").hidden=!on; $("#notesBtn").setAttribute("aria-pressed",String(on)); };
$("#pick").onchange=e=>{ setPlay(false); open(e.target.value,0,false); };
$("#homeBtn").onclick=()=>{ setPlay(false); exitPresent(); $("#show").hidden=true; $("#showTools").hidden=true; $("#chooser").hidden=false; deck=null; requestAnimationFrame(fitThumbs); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} };
const railThumbs=[];
function fitRail(){ railThumbs.forEach(([m,ts])=>{ if(m.clientWidth) ts.style.transform="scale("+(m.clientWidth/1280)+")"; }); }
function renderRail(){
  const r=$("#rail"); r.textContent=""; railThumbs.length=0;
  r.appendChild(el("div",{class:"sr",style:"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"},"Select a slide"));
  DECKS.forEach(d=>{
    const open=d.key===deck.key;
    const h=el("button",{class:"rail-h",type:"button","aria-expanded":String(open),"aria-controls":"rl-"+d.key});
    h.append(el("b",{},d.title),el("span",{},d.slides.length+" slides"+(open?"":", click to open")));
    h.onclick=()=>{ if(d.key!==deck.key){ setPlay(false); open_(d.key,0); } };
    r.appendChild(h);
    const list=el("div",{class:"rail-list",id:"rl-"+d.key,"data-deck":d.key}); if(!open) list.hidden=true;
    if(open) d.slides.forEach((sl,i)=>{
      const b=el("button",{class:"tb",type:"button","aria-label":"Slide "+(i+1)+": "+sl.t});
      const mini=el("div",{class:"mini"}); const ts=el("div",{class:"tscale"}); ts.appendChild(renderSlide(d,sl)); mini.appendChild(ts);
      b.append(el("span",{class:"num"},String(i+1)),mini,el("span",{class:"cap"},sl.t));
      b.onclick=()=>go(i); list.appendChild(b); railThumbs.push([mini,ts]);
    });
    r.appendChild(list);
  });
  requestAnimationFrame(()=>{ fitRail(); railThumbs.forEach(([m,ts])=>fitSlide(ts.firstChild)); });
}
const open_=(k,i)=>open(k,i,false);
function keepVisible(ct){
  const list=ct.parentElement, rail=$("#rail"); const c=ct.getBoundingClientRect();
  if(list.scrollWidth>list.clientWidth+2){ const l=list.getBoundingClientRect(); const target=list.scrollLeft+(c.left-l.left)-(l.width-c.width)/2; list.scrollTo({left:target,behavior:"smooth"}); }
  else { const r=rail.getBoundingClientRect(); if(c.top<r.top||c.bottom>r.bottom){ rail.scrollTo({top:rail.scrollTop+(c.top-r.top)-r.height/3,behavior:"smooth"}); } }
}
try{ new ResizeObserver(fitRail).observe($("#rail")); }catch(e){ window.addEventListener("resize",fitRail); }
$("#railBtn").onclick=()=>{ const g=$("#showgrid"); const on=g.classList.toggle("norail"); $("#railBtn").setAttribute("aria-pressed",String(!on)); if(!on) requestAnimationFrame(fitRail); };
function enterPresent(){ document.body.classList.add("fs"); $("#exitBtn").hidden=false; try{ const r=document.documentElement.requestFullscreen; if(r) r.call(document.documentElement).catch(()=>{}); }catch(e){} }
function exitPresent(){ document.body.classList.remove("fs"); $("#exitBtn").hidden=true; try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} }
$("#presentBtn").onclick=enterPresent; $("#exitBtn").onclick=exitPresent;
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement && document.body.classList.contains("fs")) exitPresent(); });
document.addEventListener("keydown",e=>{
  if(!deck || e.target.closest("select")) return;
  const k=e.key;
  if(k==="ArrowRight"||k==="PageDown"||k===" "){ e.preventDefault(); go(cur+1); }
  else if(k==="ArrowLeft"||k==="PageUp"){ e.preventDefault(); go(cur-1); }
  else if(k==="Home") go(0); else if(k==="End") go(deck.slides.length-1);
  else if(k==="p"||k==="P") setPlay(!playing);
  else if(k==="n"||k==="N") $("#notesBtn").click();
  else if(k==="f"||k==="F") document.body.classList.contains("fs")?exitPresent():enterPresent();
  else if(k==="s"||k==="S") $("#railBtn").click();
  else if(k==="Escape") exitPresent();
});
let tx=null; $("#stage").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
$("#stage").addEventListener("touchend",e=>{ if(tx==null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40) go(cur+(dx<0?1:-1)); tx=null; });
if(window.matchMedia("(max-width:900px)").matches){ $("#notesBox").hidden=true; $("#notesBtn").setAttribute("aria-pressed","false"); }
const m=(location.hash||"").match(/^#(\w+)\/(\d+)$/); if(m && DECKS.some(d=>d.key===m[1])) open(m[1],+m[2]-1,false);
</script>
