<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PromptHalo Policy Slideshows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --plum:#4A3A5C;--purple:#7A5C99;--chip:#8E72AE;--ink:#3B2748;--muted:#6A5878;--lilac:#E3D5F0;
  --line:#DCCFE5;--bg:#EDE6F2;--surface:#FBF8FC;--sbg:#DDD2E8;--scale:1.1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241C2C;--surface:#2F2538;--line:#45384F;--ink-ui:#EDE4F3;--muted-ui:#BBA9C8}}
:root[data-theme="dark"]{--bg:#241C2C;--surface:#2F2538;--line:#45384F;--ink-ui:#EDE4F3;--muted-ui:#BBA9C8}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;font-size:calc(16px * var(--scale))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink-ui,var(--ink));font-family:Figtree,"Segoe UI",Calibri,Arial,sans-serif;line-height:1.5}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chip);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .9rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--chip)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
header.top{display:flex;align-items:center;gap:.7rem;padding:.6rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top img.logo{height:2rem;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top img.logo{background:#fff;border-radius:8px;padding:.2rem .4rem}}
header.top h1{font-family:Nunito,"Segoe UI",Calibri,Arial,sans-serif;font-size:1.1rem;margin:0}
.sep{width:1px;height:1.7rem;background:var(--line)}
.grow{flex:1}
select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .8rem}

/* chooser */
#chooser{max-width:64rem;margin:0 auto;padding:2rem 1.2rem 3rem}
#chooser h2{font-family:Nunito,"Segoe UI",Calibri,Arial,sans-serif;font-size:1.8rem;margin:0 0 .3rem}
#chooser .lead{color:var(--muted-ui,var(--muted));margin:0 0 1.5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.2rem}
.pcard{background:var(--surface);border-radius:22px;box-shadow:0 8px 28px rgba(74,58,92,.14);overflow:hidden;display:flex;flex-direction:column}
.pcard .thumb{aspect-ratio:16/9;position:relative;pointer-events:none;overflow:hidden}
.pcard .tscale{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;container-type:inline-size}
.pcard .body{padding:1rem 1.2rem 1.2rem;display:flex;flex-direction:column;gap:.5rem}
.pcard h3{font-family:Nunito,"Segoe UI",Calibri,Arial,sans-serif;font-size:1.35rem;margin:0}
.pcard .meta{color:var(--muted-ui,var(--muted));font-size:.95rem}
.pcard .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.3rem}

/* show */
#show{padding:1rem clamp(.6rem,3vw,2rem) 2rem;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:min(80rem,calc((100vh - 12rem) * 16 / 9))}
.stage{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(74,58,92,.22);background:var(--sbg)}
.stage .slide{position:absolute;inset:0;opacity:0;transition:opacity .45s ease,transform .45s ease;transform:translateX(1.5%)}
.stage .slide.on{opacity:1;transform:none}
.stage .slide.left{transform:translateX(-1.5%)}
@media (prefers-reduced-motion:reduce){.stage .slide{transition:none}}
@media (max-width:700px){.stage{aspect-ratio:auto}.stage .slide{position:relative;display:none;opacity:1;transform:none}.stage .slide.on{display:block}}
.showgrid{display:grid;grid-template-columns:16.5rem minmax(0,1fr);gap:1.2rem;width:100%;max-width:100rem;align-items:start}
.showgrid.norail{grid-template-columns:minmax(0,1fr)}
.showgrid.norail .rail{display:none}
.main{display:flex;flex-direction:column;align-items:center;min-width:0}
.rail{position:sticky;top:4.2rem;max-height:calc(100vh - 5.5rem);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.7rem .6rem 1rem}
.rail-h{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:.5rem .7rem;cursor:pointer;margin:.3rem 0 .5rem}
.rail-h b{font-family:Nunito,"Segoe UI",Calibri,Arial,sans-serif;font-weight:700}
.rail-h span{font-size:.875rem;color:var(--muted-ui,var(--muted))}
.rail-h[aria-expanded="true"]{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple) inset}
.rail-list{display:flex;flex-direction:column;gap:.55rem;margin-bottom:.8rem}
.rail-list[hidden]{display:none}
.tb{display:grid;grid-template-columns:1.6rem 1fr;gap:.35rem;align-items:start;border:0;background:transparent;padding:.2rem;border-radius:10px;cursor:pointer;text-align:left}
.tb .num{color:var(--muted-ui,var(--muted));font-size:.875rem;text-align:right;padding-top:.15rem;font-variant-numeric:tabular-nums}
.tb .mini{position:relative;aspect-ratio:16/9;border-radius:7px;overflow:hidden;border:2px solid transparent;box-shadow:0 2px 8px rgba(74,58,92,.15);pointer-events:none}
.tb .mini .tscale{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;container-type:inline-size}
.tb .cap{grid-column:2;font-size:.875rem;line-height:1.3;color:var(--muted-ui,var(--muted))}
.tb:hover .mini{border-color:var(--line)}
.tb[aria-current="true"] .mini{border-color:var(--purple)}
.tb[aria-current="true"] .num,.tb[aria-current="true"] .cap{color:var(--purple);font-weight:600}
body.fs .rail{display:none}
body.fs .showgrid{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){
  .showgrid{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;order:2;max-height:none;padding:.6rem}
  .rail-list{flex-direction:row;overflow-x:auto;gap:.6rem;padding-bottom:.4rem}
  .tb{flex:none;width:9.5rem;grid-template-columns:1fr}
  .tb .num{display:none}
  .tb .cap{grid-column:1}
}
.ctrl{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;width:100%}
.ctrl .count{color:var(--muted-ui,var(--muted));font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px;width:100%;margin-top:.7rem}
.segs button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden}
.segs button.done{background:var(--chip)}
.segs button i{position:absolute;left:0;top:0;bottom:0;background:var(--purple);width:0}
.notes{width:100%;margin-top:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8rem 1.1rem}
.notes h2{font-size:1rem;margin:0 0 .3rem;color:var(--purple)}
.notes p{margin:0;max-width:80ch}
.index{position:fixed;top:0;right:0;bottom:0;width:min(22rem,88vw);background:var(--surface);border-left:1px solid var(--line);z-index:20;transform:translateX(105%);transition:transform .25s ease;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem 2rem;overflow:auto}
.index.open{transform:none}
.index h2{font-family:Nunito,"Segoe UI",Calibri,Arial,sans-serif;font-size:1.1rem;margin:0 0 .6rem}
.index ol{list-style:none;margin:0;padding:0}
.index li button{display:flex;gap:.6rem;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:.4rem .6rem;cursor:pointer}
.index li button span{color:var(--muted-ui,var(--muted));min-width:1.5rem}
.index li button[aria-current="true"]{background:var(--bg);color:var(--purple);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(36,28,44,.45);z-index:19;display:none}
.scrim.open{display:block}
body.fs header.top,body.fs .notes{display:none}
body.fs #show{background:#1c1622;min-height:100vh;justify-content:center;padding:1rem}
body.fs .wrap{max-width:calc((100vh - 6rem) * 16 / 9)}
body.fs .ctrl{color:#EDE4F3}
body.fs .ctrl .btn{background:#2F2538;border-color:#45384F;color:#EDE4F3}
body.fs .segs button{background:#45384F}

/* ===== slide design (scales with the slide via cqw) ===== */
.s{position:absolute;inset:0;background:#DDD2E8;color:#3B2748;font-family:Figtree,"Segoe UI",Calibri,Arial,sans-serif;padding:4.2cqw 5.5cqw 7cqw;display:flex;flex-direction:column}
.s.dark{background:#4A3A5C}
.s h2{font-family:Nunito,"Segoe UI",Calibri,Arial,sans-serif;font-weight:800;font-size:4.1cqw;line-height:1.15;margin:0 0 2.6cqw;color:#3B2748}
.s.dark h2{color:#fff}
.s .foot{position:absolute;left:5.5cqw;right:5.5cqw;bottom:2.6cqw;display:flex;align-items:center;justify-content:space-between;font-size:max(14px,1.3cqw);color:#6A5878}
.s.dark .foot{color:#E3D5F0}
.s .foot img{height:3.2cqw;width:auto}
.card{background:#FBF8FC;border-radius:1.6cqw;box-shadow:0 .5cqw 1.6cqw rgba(74,58,92,.18)}
.chip{flex:none;width:7cqw;height:7cqw;border-radius:1.3cqw;background:#8E72AE;color:#fff;display:grid;place-items:center;font-size:3.6cqw}
.chip.sm{width:4cqw;height:4cqw;border-radius:.8cqw;font-size:2.2cqw}
.chip svg{display:block;width:1em;height:1em}
.banner svg,.big svg{width:1em;height:1em}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;flex:1;align-content:start}
.grid4 .card{display:flex;align-items:center;gap:2.2cqw;padding:2.6cqw;min-height:15cqw}
.lab{font-weight:700;color:#7A5C99;font-size:2.6cqw;line-height:1.2}
.txt{font-size:2.4cqw;line-height:1.3}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;align-content:start}
.three .card{padding:2.4cqw;min-height:17cqw;display:flex;flex-direction:column;gap:1.4cqw}
.three .card .h{display:flex;align-items:center;gap:1.4cqw}
.three.tall .card{min-height:30cqw}
.banner{margin-top:2.4cqw;background:#4A3A5C;color:#fff;border-radius:1.6cqw;padding:2.2cqw 2.6cqw;display:flex;align-items:center;gap:1.8cqw;font-size:2.5cqw}
.banner>svg{font-size:3.4cqw}
.banner b{font-weight:700}
.banner span{color:#E3D5F0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;flex:1;align-content:start}
.two .card{padding:2.6cqw;min-height:30cqw}
.two .card .h{display:flex;align-items:center;gap:1.8cqw;margin-bottom:2cqw}
.two .card .h b{font-size:2.9cqw;font-weight:700}
ul.b{margin:0;padding-left:2.6cqw;font-size:2.6cqw;line-height:1.45}
ul.b li{margin:.9cqw 0}
ul.b li::marker{color:#8E72AE}
.chk{display:grid;grid-template-columns:1.5fr 1fr;gap:2.6cqw;flex:1;align-content:start}
.chk .card{padding:2.4cqw 2.6cqw;display:flex;flex-direction:column;justify-content:center;gap:1.3cqw;min-height:30cqw}
.chk .row{display:flex;align-items:center;gap:1.6cqw;font-size:2.45cqw}
.big{background:#7A5C99;color:#fff;border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2.6cqw;box-shadow:0 .5cqw 1.6cqw rgba(74,58,92,.18)}
.big b{font-family:Nunito,"Segoe UI",Calibri,Arial,sans-serif;font-size:5.2cqw;line-height:1.1;font-weight:800}
.big span{font-size:2.4cqw;margin-top:1.4cqw;max-width:26cqw}
.titlecard{margin:auto;width:56cqw;background:#FBF8FC;border-radius:2cqw;padding:3.6cqw 4cqw;box-shadow:0 .8cqw 2.6cqw rgba(0,0,0,.25)}
.titlecard img{height:4.4cqw;width:auto;display:block;margin-bottom:2.2cqw}
.titlecard h1{font-family:Nunito,"Segoe UI",Calibri,Arial,sans-serif;font-weight:800;font-size:4.6cqw;line-height:1.1;margin:0 0 1cqw;color:#3B2748}
.titlecard .sub{color:#7A5C99;font-size:2.4cqw;margin:0 0 2cqw}
.titlecard .body{font-size:2.3cqw;margin:0 0 3cqw}
.titlecard .meta{font-size:max(14px,1.7cqw);color:#6A5878;margin:0}
.signg{display:grid;grid-template-columns:1.6fr 1fr;gap:2.6cqw;flex:1;align-content:start}
.signg .card{padding:2.6cqw;min-height:32cqw}
.signg .card .lab{margin-bottom:1.4cqw}
.signg .side{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.8cqw}
.signg .side .chip{width:8cqw;height:8cqw;font-size:4cqw}
.signg .side p{font-size:2.3cqw;margin:0}
.signg .side a{display:inline-block;background:#7A5C99;color:#fff;text-decoration:none;border-radius:999px;padding:1.2cqw 2.8cqw;font-weight:700;font-size:2.2cqw}
.secg{display:grid;grid-template-columns:1.9fr 1fr;gap:2.4cqw;flex:1;align-content:start}
.secg .card{padding:2.2cqw 2.4cqw;display:flex;flex-direction:column;justify-content:center;gap:1.1cqw;min-height:33cqw}
.secg .row{display:flex;align-items:center;gap:1.4cqw;font-size:2.15cqw;line-height:1.25}
.secg .ev{background:#7A5C99;color:#fff;border-radius:1.6cqw;padding:2.4cqw;display:flex;flex-direction:column;gap:.6cqw;box-shadow:0 .5cqw 1.6cqw rgba(74,58,92,.18)}
.secg .ev b{font-size:1.7cqw;color:#E3D5F0;letter-spacing:.02em}
.secg .ev span{font-size:2.1cqw;line-height:1.3;margin-bottom:1.4cqw}
.tbl{background:#FBF8FC;border-radius:1.6cqw;padding:1.6cqw;box-shadow:0 .5cqw 1.6cqw rgba(74,58,92,.18)}
.tbl table{width:100%;border-collapse:collapse;font-size:1.9cqw}
.tbl th{background:#7A5C99;color:#fff;text-align:left;padding:1cqw 1.2cqw;font-weight:700}
.tbl.dense td{padding:.5cqw 1.2cqw}.tbl.dense th{padding:.7cqw 1.2cqw}.tbl.dense table{font-size:1.8cqw}
.tbl td{padding:.9cqw 1.2cqw;border-bottom:1px solid #DCCFE5;color:#3B2748;vertical-align:top}
@container (max-width: 640px){ .secg{grid-template-columns:1fr;gap:.7rem}.secg .card,.secg .ev{min-height:0;padding:.8rem .9rem;border-radius:14px}.secg .row{font-size:1rem}.secg .ev b{font-size:.875rem}.secg .ev span{font-size:1rem;margin-bottom:.4rem}.tbl{padding:.6rem;border-radius:14px;overflow-x:auto}.tbl table{font-size:.9rem}.tbl th,.tbl td{padding:.4rem .5rem} }
.flow{display:flex;gap:1cqw;align-items:stretch}
.flow .st{flex:1;padding:2cqw 1.2cqw;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1cqw;min-height:24cqw}
.flow .st .lab{font-size:2.4cqw}.flow .st .txt{font-size:2cqw}
.flow .ar{flex:none;align-self:center;color:#8E72AE;font-size:2.6cqw;font-weight:800}
.flow.n5 .st .lab{font-size:2.15cqw}.flow.n5 .st .txt{font-size:1.8cqw}.flow.n6{gap:.6cqw}.flow.n6 .st{padding:1.6cqw .7cqw}.flow.n6 .st .lab{font-size:1.85cqw}.flow.n6 .st .txt{font-size:1.55cqw}.flow.n6 .ar{font-size:2cqw}.tbl.xdense table{font-size:1.55cqw}.tbl.xdense td{padding:.4cqw 1cqw}.tbl.xdense th{padding:.6cqw 1cqw}.titlecard h1.long{font-size:3.8cqw}
/* narrow screens: reflow slides so text stays readable */
@container (max-width: 640px){
  .s{position:relative;inset:auto;min-height:100%;padding:1.2rem 1.1rem 3.2rem}
  .s h2{font-size:1.45rem;margin-bottom:1rem}
  .grid4,.three,.two,.chk,.signg{grid-template-columns:1fr;gap:.7rem}
  .grid4 .card,.three .card,.two .card,.chk .card,.signg .card{min-height:0;padding:.8rem .9rem;border-radius:14px}
  .three .card{flex-direction:row;align-items:center}
  .chip{width:2.6rem;height:2.6rem;font-size:1.3rem;border-radius:10px}
  .chip.sm{width:1.7rem;height:1.7rem;font-size:.9rem;border-radius:7px}
  .lab{font-size:1.05rem}.txt,ul.b,.chk .row,.banner,.big span,.signg .side p,.titlecard .body{font-size:1rem}
  ul.b{padding-left:1.2rem}
  .two .card .h b{font-size:1.1rem}
  .flow{flex-direction:column;gap:.4rem}.flow .st{min-height:0;padding:.7rem .9rem;flex-direction:row;text-align:left;gap:.8rem}.flow .st .lab,.flow.n5 .st .lab,.flow.n6 .st .lab{font-size:1.05rem;min-width:6.5rem}.flow .st .txt,.flow.n5 .st .txt,.flow.n6 .st .txt{font-size:1rem}.flow.n6 .st{padding:.7rem .9rem}.flow.n6 .ar{font-size:1rem}.tbl.xdense table,.tbl.dense table{font-size:.9rem}.tbl.xdense td,.tbl.xdense th{padding:.4rem .5rem}.titlecard h1.long{font-size:1.9rem}.flow .ar{transform:rotate(90deg);font-size:1rem;align-self:flex-start;margin-left:1.4rem}
  .big{padding:1rem}.big b{font-size:1.8rem}.big span{max-width:none}
  .banner{padding:.8rem 1rem;border-radius:14px}.banner svg{width:1.4rem;height:1.4rem}
  .titlecard{width:auto;padding:1.4rem;border-radius:16px}.titlecard img{height:1.8rem;margin-bottom:1rem}.titlecard h1{font-size:1.9rem}.titlecard .sub{font-size:1.05rem}.titlecard .meta{font-size:.9rem}
  .signg .side a{font-size:1rem;padding:.5rem 1.2rem}.signg .side .chip{width:3rem;height:3rem;font-size:1.5rem}
  .s .foot{font-size:.875rem;bottom:.8rem;left:1.1rem;right:1.1rem}.s .foot img{height:1.3rem}
}
@container (max-width: 640px){ }
</style>
</head>

<script type="application/json" id="data">{"decks": [{"key": "isp", "title": "Information Security", "id": "POL-ISP-001", "version": "1.0", "date": "July 23, 2026", "blurb": "The charter of our security program.", "slides": [{"k": "title", "t": "Information Security", "sub": "The charter of our security program", "body": "Protecting the confidentiality, integrity, and availability of our systems and customer data.", "meta": "POL-ISP-001, version 1.0, July 23, 2026", "n": "Welcome to PromptHalo's Information Security Policy training. We depend on the confidentiality, integrity, and availability of our systems and the customer data entrusted to us. This policy is the charter of our security program. It assigns ownership, authorizes our other policies and standards, and sets how we govern, assess, and report on security. You can pause, rewind, speed up, or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["shield", "Protect", "Systems and customer data"], ["user", "Assign", "Ownership and accountability"], ["doc", "Authorize", "Subordinate policies and standards"]], "banner": ["The charter document", "of our security compliance program."], "n": "Section 1 sets the purpose. PromptHalo depends on the confidentiality, integrity, and availability of its information systems and the customer data entrusted to it. This policy establishes the Company's overall security program, assigns ownership and accountability, and authorizes the subordinate policies, standards, and procedures that implement it. It is the charter document of our compliance program."}, {"k": "grid", "t": "2. Scope, sized to us", "items": [["users", "Covers", "All people, systems, data"], ["map", "Anywhere", "Including remote work"], ["clip", "Evidence", "A short, dated note"], ["check", "\"No change\"", "Recorded = control performed"]], "n": "Section 2 sets the scope. The policy applies to all personnel, every Company-owned or Company-managed system, all customer and Company data in any form, and every location we work from, including remote work. It is written for a company our size. A short, dated note from the person responsible satisfies a requirement to record, review, assess, or approve. No clause requires a meeting, a dedicated tool, a committee sitting, a new document, or a new appointment. When a review finds nothing has changed, recording that finding is a performed control, not a skipped one."}, {"k": "grid", "t": "3 and 4. Roles and key terms", "items": [["user", "Accountable Party", "CEO, or Security Officer if absent"], ["users", "Steering Committee", "The CEO today; dated record suffices"], ["shield", "Security Officer", "Runs the program day to day"], ["alert", "Deficiency", "Control absent, failing, or unevidenced"]], "n": "Sections 3 and 4 set roles and terms. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party: they own this policy, oversee it, and may delegate duties. The Information Security Steering Committee approves the policy and reviews it at least annually. At our size the Committee is the CEO, and a dated written record made or confirmed by the CEO satisfies any Committee decision. A control is an activity on a defined cadence that produces evidence it occurred. A deficiency is a control that is absent, not operating as described, or not producing evidence."}, {"k": "sec", "t": "5. Security Program: governance", "items": ["Program proportionate to size, risk, contracts", "Security Officer reports at least quarterly", "No independent member yet: CEO reviews yearly", "Governance Decisions Log records every decision", "Independent member at over 30 personnel"], "art": "Governance Decisions Log; risk register", "cad": "Quarterly report; yearly review", "n": "Section 5 sets up the program. It is documented and proportionate to our size, risk profile, and contracts. The Accountable Party is accountable for it, and the Security Officer reports its status to the Steering Committee at least quarterly. Our size prevents an oversight member independent of security operations, so the CEO reviews the Security Officer's assessment of control effectiveness each year, and that limitation is a discrete, accepted risk register entry. Approvals, risk acceptances, exceptions, and delegations go in the Governance Decisions Log. An independent member is appointed above 30 personnel, or on appointing an independent director or advisor, whichever comes first."}, {"k": "sec", "t": "5. Security Program: objectives and registers", "items": ["Objectives set yearly, measured by metrics", "Each objective names the controls delivering it", "One obligations register, owned by the CEO", "Security information sources confirmed yearly", "Annual reviews may be done as one exercise"], "art": "Objectives; obligations register", "cad": "At least annually", "n": "Security objectives are set every year and measured, including control operating effectiveness, incident trends, vulnerability remediation timeliness, and training completion. Each objective records the controls that deliver it, as a field on the control matrix. A single register lists the laws, contracts, and customer commitments we are subject to and the controls that meet each one; the CEO owns it and reviews it at least annually. The Security Officer keeps a short list of the security sources we watch and confirms yearly that each is monitored. All the annual confirmations may be done together, on one date, in one document."}, {"k": "sec", "t": "6. Policy Framework: documents", "items": ["In effect only if listed in Annex A", "Approved, reviewed yearly, shared on change", "Acknowledgment: person, version, date", "Standards carry platform and config detail", "Records may live in tools we already use"], "art": "Acknowledgment and notification records", "cad": "At hire and on material change", "n": "Section 6 sets the framework. This policy authorizes the policies and standards listed in Annex A, and none is effective unless it is listed there. Each is approved by the Steering Committee, reviewed at least annually, published in the policy repository with its version and approval date, and communicated at hire and on material change. You acknowledge the ones for your role, and the record shows you, the version, and the date. One notification may cover several documents. Records can be kept in the code repository, ticketing system, compliance platform, or dated email. A dated entry by a named person is enough."}, {"k": "sec", "t": "6. Policy Framework: controls follow risk", "items": ["Risk assessment drives control selection", "Control matrix: owner, frequency, evidence", "Every control owned by a named person", "Record whether it prevents or detects", "Detective-only risks reviewed every year"], "art": "Control matrix", "cad": "Reviewed at the annual risk assessment", "n": "Risk assessment, including fraud risk and reassessment on significant change, follows the Risk Management Policy. Controls are selected in response to identified risks. The control matrix, owned by the Security Officer, records each control's owner, operating frequency, the criterion it addresses, and the evidence it produces. Every control is owned by a named individual, not just a role. The matrix also records whether a control prevents or detects a risk, and a risk covered only by detective controls is recorded as such and reviewed at the annual risk assessment. Annex A is reviewed at each annual policy review and whenever a document is issued or withdrawn."}, {"k": "sec", "t": "7. Control Environment and Accountability", "items": ["Security duties written and acknowledged", "One-page org chart, reviewed yearly", "Screened before production or customer data", "Training at onboarding and every year", "Segregation of duties assessed yearly"], "art": "Org chart; segregation of duties note", "cad": "Yearly and when people join or leave", "n": "Section 7 covers people. Every role has written security responsibilities, acknowledged as a condition of employment or engagement. We keep a current one-page organization chart, including contractors and any fractional officer, reviewed yearly and when someone joins or leaves. Personnel are screened before access to production systems or customer data, and complete security awareness training at onboarding and at least annually. Each person's periodic review covers their control responsibilities. Segregation of duties is assessed and recorded every year: each conflicting pair of duties held by one person, its compensating control, and whether anyone holds more control responsibilities than they can reasonably discharge."}, {"k": "three", "t": "7. Report and speak up", "items": [["shield", "Security issues", "To the Security Officer"], ["mail", "Ethical concerns", "Directly to the CEO, by email"], ["globe", "Outsiders", "Public security contact"]], "banner": ["No retaliation, ever.", "Good-faith reports are protected."], "n": "Section 7 also covers reporting. Report suspected security weaknesses, policy violations, and incidents to the Security Officer, following the Incident Response Plan. Standards of behavior are set out in the Code of Conduct, which you acknowledge at hire, on material revision, and at least annually. Ethical concerns about anyone, including the Security Officer, can be emailed directly to the CEO. Reports are handled confidentially, and PromptHalo prohibits retaliation against anyone who reports in good faith. People outside the Company can report vulnerabilities through our public security contact."}, {"k": "sec", "t": "8. Program Assessment", "items": ["Program assessed at least once a year", "Scope and frequency confirmed each year", "Never assessed only by the control operator", "FRM-CE-001 signed by the CEO", "System Security Plan sets the boundary"], "art": "FRM-CE-001; System Security Plan", "cad": "At least annually", "n": "Section 8 covers assessment. The program is assessed at least annually through internal control self-assessments and, where contracts require it, independent examinations. Scope and frequency are confirmed each year. A control is never assessed only by the person who operates it; where no independent assessor is available, the CEO reviews and signs. The annual control environment assessment is recorded on form FRM-CE-001 and signed by the CEO. The System Security Plan describes our boundaries, environments, and controls. When a change moves the boundary, the plan and the asset inventory are updated as part of closing that change."}, {"k": "check", "t": "8. One plan of action", "items": ["One plan of action for all deficiencies", "A missed control counts", "Closed only when verified", "Recurring means redesign"], "big": "15 days", "bigsub": "to report after each quarter ends", "n": "Every deficiency, however it is found, is recorded in one plan of action with an owner, a severity, and a remediation date, tracked to closure by the Security Officer. Subordinate policies use this plan, not their own registers. Missing a scheduled control is itself a deficiency, even if the control is done later. A deficiency closes only when the fix is verified and the verification is recorded with who and when. A written report goes to the Steering Committee within 15 days of each quarter end. If nothing happened, one line is enough. A deficiency that comes back is escalated as a design problem."}, {"k": "sec", "t": "9. External Commitments: customers", "items": ["Commitments recorded in customer agreements", "Customer commitments register, reviewed yearly", "Security Officer reviews before anything issues", "Reviewer, item, and date recorded", "Carve-out method for subservice organizations"], "art": "Commitments register; review record", "cad": "Yearly and per new agreement", "n": "Section 9 covers what we promise. Security, availability, and confidentiality commitments are recorded in the customer agreement or data processing agreement, and the Security Officer reviews them yearly against the controls in operation. A register lists each commitment, the agreement it is in, who it is owed to, and the control that meets it, reviewed yearly and on each new or amended agreement. Every security questionnaire, proposal, published security claim, and contractual commitment is reviewed by the Security Officer before it goes out, with the reviewer, item, and date recorded. Subservice organizations and complementary user entity controls are managed under the Vendor Management Policy."}, {"k": "sec", "t": "9. External Commitments: contact and notice", "items": ["Public security contact and security.txt", "Outside reports use the same triage path", "Sub-processor list, including AI providers", "List derived from the vendor inventory", "One notification matrix; shortest period wins"], "art": "Sub-processor list; notification matrix", "cad": "On material change", "n": "We publish a monitored security contact address, reachable without a customer relationship, on our website and in a security.txt file. Reports through it are triaged under the Incident Response Plan, on the same path as internal findings. We keep a current list of sub-processors and third parties that process customer data, including AI service providers. It is derived from the vendor inventory, available to customers, and material changes are notified as our contracts require. Incident notification triggers and timeframes from customer agreements and applicable law sit in one matrix under the Incident Response Plan, and the shortest applicable period governs."}, {"k": "sec", "t": "10. Enforcement", "items": ["Discipline up to termination or referral", "Security Officer documents the finding", "CEO decides and documents the outcome", "Comparable findings, comparable outcomes", "Applies under HR Security and Code too"], "art": "Finding and disciplinary record", "cad": "At each case", "n": "Section 10 covers enforcement. Violations may lead to disciplinary action, up to and including termination of employment or engagement, and where applicable, civil or criminal referral. The Security Officer documents the security finding and recommends action. The CEO determines and documents the outcome, applies it consistently, and keeps the personnel record. This split applies wherever discipline arises from a security matter, including under the Human Resources Security Policy or the Code of Conduct. Comparable findings attract comparable outcomes, and the reason for any departure is recorded."}, {"k": "sec", "t": "11. Exceptions", "items": ["Request in writing to the Security Officer", "Steering Committee approves before effect", "Recorded in the Policy Exception Register", "Risk-assessed, time-bound, reviewed yearly", "Unrecorded shortfall is a deficiency"], "art": "Policy Exception Register", "cad": "Reviewed at least annually", "n": "Section 11 covers exceptions. Request them in writing to the Security Officer; the Steering Committee approves them before they take effect. Each approved exception is recorded in the Policy Exception Register with the requester, the policy and clause, the justification, the compensating control, the approver, and the approval and expiry dates. Exceptions are risk-assessed, time-bound, and reviewed at least annually, and if none are open, that is recorded. When a requirement cannot be met proportionately at our size, the answer is a recorded, time-bound exception with a named compensating control, never silent non-performance."}, {"k": "table", "t": "13. Annex A: who owns what", "head": ["Owning documents", "Control owner"], "rows": [["POL-COC-001 Code of Conduct", "Steering Committee"], ["POL-ISP-001 Information Security Policy", "Steering Committee or CEO"], ["POL-HRS-001 Human Resources Security", "Steering Committee"], ["POL-SAT-001, POL-RSK-001", "CEO"], ["POL-AC-001, POL-PHY-001, POL-NET-001", "CEO"], ["POL-DRD-001, STD-ENC-001, STD-EPT-001", "CEO"], ["POL-VPM-001, POL-LOG-001, PLN-IRP-001", "CEO"], ["POL-CM-001, POL-BCP-001, POL-VM-001", "CEO"]], "n": "Annex A maps each criterion in our declared scope to the document that owns it and its accountable owner. The Code of Conduct and Human Resources Security Policy are owned by the Steering Committee, and this policy by the Steering Committee or the CEO depending on the area. The CEO owns the rest: training, risk, access control, physical and network security, retention and disposal, the Encryption Standard, the Endpoint Standard, vulnerability management, logging, the Incident Response Plan, change management, business continuity, and vendor management. Versions and approval dates live in the policy repository index."}, {"k": "table", "t": "Artifacts and cadence", "head": ["Artifact", "Section", "How often"], "rows": [["Governance Decisions Log", "5", "At each decision; reviewed yearly"], ["Risk register entry: no independent member", "5", "Reviewed yearly on its date"], ["Obligations and commitments registers", "5, 9", "Yearly and on new agreements"], ["Policy acknowledgment record", "6", "At hire and on material change"], ["Control matrix with named owners", "6", "Yearly and on document change"], ["Org chart; segregation of duties note", "7", "Yearly and on joiners or leavers"], ["FRM-CE-001 signed by the CEO", "8", "Annually"], ["Plan of action; quarterly report", "8", "Within 15 days of quarter end"]], "n": "Here are the records this policy produces. The Governance Decisions Log captures every decision as it happens. The risk register entry for our missing independent oversight member is reviewed yearly. The obligations and customer commitments registers are reviewed yearly and on new agreements. Your acknowledgment is recorded at hire and on material change. The control matrix names every control owner. The org chart and segregation of duties note are reviewed yearly and when people join or leave. Form FRM-CE-001 is signed by the CEO each year, and the plan of action feeds a written report within 15 days of each quarter end."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass", "Report concerns to the Security Officer"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Remember that a short, dated note is usually all the evidence a control needs, and that a recorded exception is always better than a silent shortfall. Thank you for helping keep PromptHalo and our customers secure. Let's move on to the questions."}]}, {"key": "coc", "title": "Code of Conduct", "id": "POL-COC-001", "version": "1.0", "date": "July 23, 2026", "blurb": "How we work, and how to speak up.", "slides": [{"k": "title", "t": "Code of Conduct", "sub": "How we work, and how to speak up", "body": "Our standards, and how to raise concerns.", "meta": "POL-COC-001, version 1.0, July 23, 2026", "n": "Welcome to PromptHalo's Code of Conduct training. This walkthrough covers why the Code exists, who it applies to and who owns it, and each of its sections from 5 to 19, including the records each one produces and how often they are updated. You can pause, rewind, speed up, or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this Code exists", "items": [["shield", "Trust", "Clients give us sensitive access"], ["users", "Standards", "Behavior expected of everyone"], ["mail", "Speaking up", "How concerns are raised and handled"]], "banner": ["Evidence of our integrity.", "Our commitment to integrity and ethical values."], "n": "Section 1 sets the purpose. PromptHalo advises clients on protecting their most sensitive information, and in doing so is given access to systems, data, and business circumstances that clients expect to be treated with integrity. This Code defines the ethical standards and behavior expected of all personnel, establishes how concerns are raised and addressed, and evidences the Company's commitment to integrity and ethical values."}, {"k": "grid", "t": "2. Who it covers", "items": [["users", "Who", "Candidates to temporary workers"], ["map", "Where", "Remote work and client premises"], ["clock", "When", "After hours, if it affects us"], ["link", "Third parties", "Same standards, by contract"]], "n": "Section 2 sets the scope. The Code applies to candidates, employees, officers, contractors, consultants, interns, and temporary workers, wherever Company business happens, including remote work and client premises. It also covers conduct outside working hours when it affects the Company, our clients, or our reputation. Third parties acting for us are held to equivalent standards through contracts managed under the Vendor Management Policy. It is written for our size: a short, dated note is enough to declare, record, review, or decide, and no hotline, ethics provider, or case system is required."}, {"k": "three", "t": "3 and 4. Owners and key terms", "items": [["user", "Owner", "CEO (Accountable Party)"], ["check", "Approves", "Steering Committee, yearly review"], ["eye", "Independence", "Objectivity no one could question"]], "banner": ["Retaliation:", "any adverse action for a good-faith report."], "n": "Sections 3 and 4 set roles and terms. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party: they own the Code, oversee it, and may delegate duties. The Information Security Steering Committee approves it and reviews it at least annually; at our size that is the CEO, and a dated written record is enough. A conflict of interest is anything that could reasonably be seen to impair objectivity. Independence means no relationship that would make a reasonable person question a finding. Retaliation is any adverse action taken because someone reported in good faith or joined an investigation."}, {"k": "sec", "t": "5. Standards of Integrity", "items": ["Act honestly, lawfully, and in good faith", "Never misstate qualifications or work done", "Findings reflect the work actually performed", "Accurate records, timesheets, and expenses", "No commitments the Company cannot keep"], "art": "Code acknowledgment", "cad": "At hire, yearly, and on change", "n": "Section 5 covers integrity. Act honestly, lawfully, and in good faith with clients, colleagues, vendors, regulators, and the public. Never misrepresent your qualifications or the work performed, and never alter, omit, or overstate findings to satisfy a client, a deadline, or a sale. Keep records, timesheets, invoices, and expense claims accurate, and never commit the Company to something it cannot deliver. The evidence is your Code acknowledgment, made at hire, every year, and when the Code changes."}, {"k": "sec", "t": "6. Professional Conduct", "items": ["No harassment, discrimination, or bullying", "Respect colleagues, clients, and vendors", "No alcohol or drugs while working", "Follow client site and safety rules"], "art": "Conduct record, if a concern is raised", "cad": "When a case arises", "n": "Section 6 covers conduct in the workplace. Harassment, discrimination, bullying, intimidation, and violence are prohibited without exception. Treat everyone with respect, and never discriminate on any characteristic protected by law. Do not work under the influence of alcohol or unlawful substances, and follow client site rules, safety requirements, and access conditions. If a concern is raised, a conduct record is made at the time."}, {"k": "sec", "t": "7. Conflicts of Interest", "items": ["Avoid real or apparent conflicts", "Disclose promptly, preferably in writing", "Unconnected outside work need not be disclosed", "Never advise opposing clients without consent", "No personal gain from our information"], "art": "Conflict declaration; none is complete", "cad": "Yearly and before new engagements", "n": "Section 7 is our conflict of interest policy. Avoid situations where your interests conflict, or appear to conflict, with the Company's or a client's. Promptly disclose, preferably in writing to the Accountable Party, any competing interest in or relationship with a vendor, competitor, or client. Routine outside work unconnected to them need not be disclosed until it becomes connected. Never advise directly opposing clients without their written consent, or use Company or client information for personal gain. Declare conflicts yearly and before each new client engagement; no conflict is a complete answer and may be one line in your annual acknowledgment."}, {"k": "sec", "t": "8. Independence and Objectivity", "items": ["Findings rest on evidence, not fees", "No client preference shapes a conclusion", "Built or ran the control? Disclose in writing", "Disclose before we assess it"], "art": "Independence disclosure, engagement file", "cad": "Before each affected assessment", "n": "Section 8 protects our objectivity. Findings, conclusions, and advice rest on the evidence, never on a commercial relationship, a fee, or a client's preference. If the Company designed, implemented, or operated a control, that fact is disclosed in writing before we assess or test it, and the disclosure is recorded in the engagement file."}, {"k": "sec", "t": "9. Confidentiality and Client Information", "items": ["Access client information only as needed", "Never shared or marketed without consent", "Never use a client's weaknesses against them", "Obligations continue after you leave", "Follow classification and retention policies"], "art": "Client authorization; exit reaffirmation", "cad": "Before each use; at departure", "n": "Section 9 covers confidentiality. Protect all Company and client information, including vulnerabilities, assessment results, architecture, incidents, plans, and personal data, and access it only as your work requires. Never share client information with other clients or third parties, or use it in marketing or public commentary, without prior written authorization. Never use knowledge of a client's weaknesses for any advantage or against that client. Your confidentiality obligations continue after you leave and are reaffirmed when you depart. Handling follows the Data Classification Policy and the Data Retention, Disposal and Disaster Recovery Policy."}, {"k": "sec", "t": "10. Protection of Assets and Access", "items": ["Access only what your duties need", "Never misuse privileged access", "Keep no client data after an engagement", "Company funds and time for Company work", "Report misuse; silence is a violation"], "art": "Offboarding no-retention confirmation", "cad": "At each engagement end and departure", "n": "Section 10 covers access and assets. Access systems and data only as your duties require, never out of curiosity or personal interest. Never use privileged access for personal advantage, to hide an error or incident, or to bypass an approval. Keep no client data, credentials, evidence, or tool output after an engagement ends, except in Company systems under the Data Retention, Disposal and Disaster Recovery Policy, and never on personal accounts or devices. Use Company funds, equipment, software, and time for Company purposes. If you learn of misuse, falsified records, or a bypassed control, report it. Failing to report known misuse is itself a violation."}, {"k": "sec", "t": "11. Company Systems and AI Tools", "items": ["Follow the Acceptable Use Policy", "No bypassing controls or sharing credentials", "Paid personal AI: training off, notify first", "Never client data in personal AI", "No testing without written client approval"], "art": "AI notice; client test authorization", "cad": "Before first use; before each test", "n": "Section 11 covers systems and AI. Use Company systems under the Acceptable Use Policy. Never bypass controls, share credentials, or install unauthorized software. Never put client confidential information, personal data, or Company proprietary information into unapproved services. A paid personal AI tool may be used for Company work when training on inputs is off and the Security Officer or CEO is notified before first use, but client information never goes into a personal AI tool. Company-approved AI tools are encouraged. You own AI-assisted output and must review it for accuracy. Never test or scan any system without documented client authorization defining the scope."}, {"k": "sec", "t": "12. Personal Devices: using them safely", "items": ["Personal devices allowed; enrollment not required", "Encrypt, lock, update, use built-in protections", "Client data in Company cloud; copies brief", "Restricted data on Company equipment only", "No shared devices; separate user account"], "art": "Device attestation in annual acknowledgment", "cad": "Yearly at acknowledgment", "n": "Section 12 covers personal devices. We are remote-first, and you may use your own laptop, tablet, or phone; the Company does not require enrollment in central device management at this stage. Apply the protections available: full-disk encryption, automatic screen lock, a supported and updated operating system, built-in anti-malware, and a firewall. Keep client information in Company cloud services, and delete local copies by the end of the engagement. Restricted data, and client data under managed-endpoint agreements, is accessed only from Company equipment, which the Company provides. Do not share a work device; on a shared household computer, use a separate user account."}, {"k": "sec", "t": "12. Personal Devices: accounts, loss, leaving", "items": ["No personal accounts or storage for client data", "Paid personal AI under Section 11 is the exception", "Report loss or compromise once confirmed", "We revoke access; never touch personal content", "Confirm deletion of local copies at offboarding"], "art": "Offboarding deletion confirmation", "cad": "At engagement end and departure", "n": "Personal accounts, cloud storage, email, and AI tools are never used for client information, and Company information is not forwarded to a personal account, except to a paid personal AI tool used under Section 11. Report loss or theft of a work device, or compromised credentials, to the Security Officer as soon as confirmed. We revoke sessions and access, and may wipe Company data where we provided the device or a management tool is in place, but we never access or erase personal content. When you leave, you confirm local copies are deleted. Remote working requirements are acknowledged within the annual Code acknowledgment."}, {"k": "sec", "t": "13. Fair Dealing, Gifts, Anti-Corruption", "items": ["Deal fairly; no manipulation or concealment", "No bribes, kickbacks, or improper payments", "Gifts modest, infrequent, and lawful", "Disclose anything beyond nominal value", "Political donations need CEO approval"], "art": "Gift disclosure to the Security Officer", "cad": "When offered or received", "n": "Section 13 covers fair dealing. Deal fairly with clients, vendors, competitors, and colleagues, without manipulation, concealment, or misrepresentation. Never offer, give, request, or accept a bribe, kickback, or improper payment, directly or through anyone else. Gifts and hospitality must be modest, infrequent, and lawful. Disclose anything beyond nominal value to the Security Officer. Political contributions on the Company's behalf need the CEO's prior approval."}, {"k": "sec", "t": "14. Public Communication and Social Media", "items": ["Never name a client publicly without consent", "Only the CEO or delegate speaks for us", "Personal research: no Company or client data", "Client technology? Tell the Security Officer", "Never disparage clients, colleagues, rivals"], "art": "Client authorization; research disclosure", "cad": "Before each publication", "n": "Section 14 covers public communication. Never identify a client, an engagement, or a client's security in any public forum without prior written authorization. Only the CEO, or a delegate authorized in writing, speaks for the Company. Personal vulnerability research must not use Company or client information, must be disclosed in advance to the Security Officer when it involves technology a client uses, and must follow coordinated disclosure. Do not disparage clients, colleagues, or competitors online."}, {"k": "sec", "t": "15. Compliance with Laws and Contracts", "items": ["Privacy, export, IP, employment, misuse laws", "Client contract and flow-down obligations", "Licensed software and authorized content only", "Obligations listed in one register"], "art": "Obligations and commitments register", "cad": "Yearly and when obligations change", "n": "Section 15 covers laws and contracts. Follow all applicable laws, including privacy, export control, intellectual property, employment, and computer misuse. Meet the security, privacy, and confidentiality obligations in our client agreements, including flow-down obligations. Use only licensed software and authorized content. Our obligations are listed in the obligations and commitments register kept under the Information Security Policy."}, {"k": "sec", "t": "16. Reporting Concerns and Non-Retaliation", "items": ["Report violations to the Accountable Party", "Ethical concerns about anyone: email the CEO", "About the CEO: external counsel or accountant", "Incidents: Incident Response Plan too", "Confidential; no retaliation, ever"], "art": "Investigation record; fraud nil return", "cad": "Per report; nil return yearly", "n": "Section 16 covers speaking up. Report suspected violations promptly to the Accountable Party. Ethical concerns about anyone, including the Security Officer, can be emailed directly to the CEO. Concerns about the CEO can go to the Company's external counsel or accountant, once appointed and when the Company grows to 50 employees. Report security incidents under the Incident Response Plan as well. Reports are confidential, investigated promptly and proportionately, and documented. Retaliation against good-faith reporters is itself a violation. Fraud is handled under this Code, and if no case arose in a year, a nil return is recorded in the annual risk assessment."}, {"k": "sec", "t": "17. Acknowledgment and Training", "items": ["At hire, yearly, and on material revision", "Record shows name, version, and date", "Revisions reset outstanding acknowledgments", "Ethics included in yearly security training", "Screening before sensitive data access"], "art": "Acknowledgment record; Decisions Log", "cad": "At hire, yearly, and on revision", "n": "Section 17 covers acknowledgment. Everyone acknowledges the Code in writing at hire, at least once a year, and on material revision. The Security Officer keeps the records, and each shows the person, the version, and the date. A material revision resets outstanding acknowledgments. The Code is published in the policy repository, personnel are notified on issue, and its approval is recorded in the Governance Decisions Log. Ethics is reinforced yearly through security awareness training, and background screening is completed before access to Confidential or Restricted data."}, {"k": "sec", "t": "18. Enforcement", "items": ["Violations can lead to termination or referral", "Security Officer documents and recommends", "CEO decides; outcomes are consistent", "Record finding, decision, and rationale", "Not reporting or interfering is a violation"], "art": "Conduct deviation record", "cad": "At the time of each case", "n": "Section 18 covers enforcement. Violations may lead to discipline, up to termination, and where applicable, civil or criminal referral. The Security Officer documents the finding and recommends action. The CEO decides, applies outcomes consistently across comparable cases, and records the reason for any difference. Each case is recorded at the time with the finding, the decision, and the rationale, even when no further action is taken. Failing to report, or interfering with an investigation, can itself lead to discipline."}, {"k": "sec", "t": "19. Exceptions", "items": ["Request in writing to the Security Officer", "Steering Committee approves first", "Documented and risk-assessed", "Time-bound and reviewed yearly", "Never for harassment, bribery, or unlawful acts"], "art": "Documented exception", "cad": "Reviewed at least yearly", "n": "Section 19 covers exceptions. Request them in writing to the Security Officer. The Steering Committee approves them before they take effect. Approved exceptions are documented, risk-assessed, time-bound, and reviewed at least annually. No exception is ever granted to the prohibitions on harassment, discrimination, retaliation, bribery, or unlawful conduct."}, {"k": "table", "t": "Artifacts you create", "head": ["Artifact", "Section", "How often"], "rows": [["Code acknowledgment and device attestation", "17, 12", "At hire, yearly, on revision"], ["Conflict declaration", "7", "Yearly; before new engagements"], ["Gift disclosure", "13", "When offered or received"], ["Personal AI tool notification", "11", "Before first use"], ["Loss or compromise report", "12", "As soon as confirmed"], ["Offboarding deletion confirmation", "10, 12", "At engagement end and departure"]], "n": "Here are the records you create. Your Code acknowledgment, which includes the device and remote working attestation, at hire, every year, and on revision. A conflict declaration every year and before a new engagement. A gift disclosure when something beyond nominal value is offered or received. A notification before first using a paid personal AI tool. A report as soon as a loss or compromise is confirmed. And a confirmation that local copies are deleted at the end of an engagement and when you leave."}, {"k": "table", "t": "Artifacts the Company keeps", "head": ["Artifact", "Section", "How often"], "rows": [["Independence disclosure", "8", "Before each affected assessment"], ["Client authorization (publicity, testing)", "9, 11, 14", "Before each use"], ["Obligations and commitments register", "15", "Yearly and on change"], ["Investigation records; fraud nil return", "16", "Per report; nil return yearly"], ["Conduct deviation records", "18", "At the time of each case"], ["Exception records", "19", "Reviewed at least yearly"]], "n": "And here are the records the Company keeps. Independence disclosures in the engagement file before an affected assessment. Written client authorizations before publicity, marketing use, or testing. The obligations and commitments register kept under the Information Security Policy. Documented investigation records for each report, and a fraud nil return in the annual risk assessment when no case arose. Conduct deviation records made at the time of each case, with finding, decision, and rationale. And documented exceptions, reviewed at least yearly."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass", "Conflict declaration: \"none\" counts", "Device attestation"], "side": "At hire, yearly, and on change", "n": "You acknowledge this Code at hire, at least once a year, and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result, and it can include your conflict declaration, where none is a complete answer, and your device attestation. Violations may lead to disciplinary action, up to and including termination. Thank you for helping keep PromptHalo a company clients can trust. Let's move on to the questions."}]}, {"key": "aup", "title": "Acceptable Use", "id": "POL-AUP-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Use Company systems wisely and securely.", "slides": [{"k": "title", "t": "Acceptable Use", "sub": "Use Company systems wisely and securely", "body": "How we use PromptHalo accounts, information, devices, and AI tools.", "meta": "POL-AUP-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Acceptable Use Policy training. It covers how we use Company systems and information, how we protect accounts and credentials, the rules for personal devices, software, and AI tools, what is prohibited, and how to report a concern. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1 and 2. Purpose and scope", "items": [["shield", "Purpose", "Acceptable, secure use of Company tech"], ["users", "Who", "Everyone who accesses Company systems"], ["globe", "What", "Accounts, cloud, repos, AI services"]], "banner": ["Personal devices:", "still yours, but these rules apply for Company work."], "n": "Section 1 sets the purpose: requirements for the acceptable and secure use of Company systems, accounts, information, and technology, applied in proportion to our size, risk, and obligations. Section 2 sets the scope. It applies to employees, officers, contractors, consultants, interns, temporary workers, and other personnel. It covers Company accounts, systems, applications, cloud services, repositories, AI services, and other technology used for Company work. Personally owned devices stay the property of their owners, but the security requirements apply when they are used for Company work."}, {"k": "sec", "t": "3. Roles and responsibilities", "items": ["CEO or Security Officer owns the policy", "Committee approves and reviews yearly", "Everyone protects information", "Protect your credentials", "Ask when unsure if a use is OK"], "art": "Dated CEO record of approval", "cad": "At least annually and on change", "n": "Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party. They own the policy and may delegate administration to the Security Officer, the Engineering Lead, or another designated person. The Information Security Steering Committee, which today is the CEO, approves it and reviews it at least annually and when material changes occur. All personnel protect Company and customer information, use systems only as authorized, protect their credentials, follow security policies, report suspected incidents or loss promptly, and ask the CEO, the Security Officer, or a designated person when unsure."}, {"k": "sec", "t": "5. Acceptable use", "items": ["Legitimate Company purposes only", "Limited incidental personal use is OK", "Work through approved Company accounts", "No transfers to personal email or cloud", "No personal AI accounts for Company data"], "art": "None specified", "cad": "Every day", "n": "Section 5. Personnel must use Company systems and information responsibly and for legitimate Company purposes. Limited incidental personal use is permitted when it does not interfere with work, create material cost, violate law or policy, expose Company or customer information, or create material security risk. Company and customer work should be done through approved Company accounts and services. Company or customer information should not be transferred to personal email, personal cloud storage, personal AI accounts, or other unapproved services."}, {"k": "sec", "t": "6. Protection of information", "items": ["Store data in approved services", "Match the Data Classification Policy", "Limit local copies; delete when done", "Share only with authorized recipients", "Report disclosure or loss promptly"], "art": "None specified", "cad": "Every day", "n": "Section 6. Company and customer information must be stored and processed in approved Company services appropriate to its classification under the Data Classification Policy. Personnel must store information in approved services, limit local copies of sensitive information and delete them when no longer required, avoid unnecessary copying or distribution, share only with authorized recipients, and promptly report accidental disclosure or loss."}, {"k": "check", "t": "7. Accounts and credentials", "items": ["Use your own assigned account", "Never share credentials insecurely", "No secrets in code, tickets, or chat", "Use the password manager", "MFA where required; SSO where supported"], "big": "Yours alone", "bigsub": "Shared only when authorized for a technical need", "n": "Section 7. Personnel must use their own assigned accounts, and accounts and credentials must not be shared unless specifically authorized for a legitimate technical requirement. Credentials must not be shared insecurely, reused from personal accounts, stored in source code, or placed in tickets, documents, or chat where others may see them. Approved secure methods, such as the password manager, must be used to store or share secrets. MFA must be used where required, and SSO through the identity provider should be used where supported, under the Access Control and Password and Authentication policies."}, {"k": "sec", "t": "8. Personally owned devices", "items": ["Allowed when the Company permits", "Screen lock, encryption, current updates", "Native anti-malware protection on", "Keep data in approved cloud services", "Report lost or stolen devices promptly"], "art": "None specified", "cad": "While the device is used for work", "n": "Section 8. Personal devices may be used for Company work when the Company permits it. Where supported, keep screen lock, device or disk encryption, current operating system and security updates, and native security or anti-malware protection enabled, and use a separate user profile where reasonably appropriate. Company information should stay primarily in approved cloud services. Report lost, stolen, or suspected compromised devices promptly. The Company may revoke sessions, disable access, or reset credentials. It does not require general administrative control of personal devices unless a business, customer, contractual, legal, or security requirement calls for it."}, {"k": "two", "t": "9 and 10. Software, services, and AI", "items": [["server", "Software and services", ["Approved, licensed, supported", "Material services approved first", "App connections need approval"]], ["cpu", "AI tools", ["Approved for use and data class", "You own work you rely on", "Request new tools for review"]]], "n": "Section 9. Personnel should use approved, licensed, and supported software. Material third-party services that touch Company or customer information must be approved before use, and connecting third-party apps to Google Workspace, GitHub, AWS, or other material systems requires approval where it grants access to Company information. Risky unapproved services may be restricted. Section 10. Use AI tools approved for the intended use and classification, and never enter Company or customer information into an AI service not approved for it. You remain responsible for AI-generated work you rely on. New tool requests go to the CEO, the Security Officer, or a designated person, and the AI Governance Policy governs the rest."}, {"k": "two", "t": "11 and 12. Privileged access and testing", "items": [["lock", "Privileged access", ["Only if your role requires it", "Per the Access Control Policy", "Never for unrelated purposes"]], ["target", "Security testing", ["Only systems we own or may test", "Stay within approved scope", "No unauthorized client testing"]]], "n": "Section 11. Administrative, privileged, and production access is limited to personnel whose responsibilities require it, under the Access Control Policy, and must not be used for purposes unrelated to your authorized responsibilities. Section 12. Security testing, scanning, penetration testing, or similar activity may be performed only against systems the Company owns or is authorized to test, and must stay within the approved scope. Customer or third-party systems must not be tested without authorization."}, {"k": "sec", "t": "13. Prohibited use: people and access", "items": ["Breaking the law", "Harassment, threats, or discrimination", "Access without a business need", "Sharing accounts or identity", "Bypassing security controls"], "art": "None specified", "cad": "Always", "n": "Section 13 lists prohibited uses. Personnel must not use Company systems, information, or access to violate applicable law; to harass, discriminate against, threaten, or intimidate others; to access information without a legitimate business need; to share accounts or let another person act under their identity; or to bypass, circumvent, or disable required security controls without authorization."}, {"k": "sec", "t": "13. Prohibited use: data and tools", "items": ["Introducing malicious software", "Unauthorized security testing", "Unauthorized disclosure of data", "Keeping customer data past its need", "Secrets in unauthorized places"], "art": "Request to review or exception", "cad": "When a control blocks work", "n": "Personnel also must not introduce malicious software, conduct unauthorized security testing, disclose Company or customer information without authorization, retain customer information after authorization or business need has ended, store credentials or secrets in unauthorized locations, or use unapproved services to process sensitive information. If a control prevents legitimate work, contact the CEO, the Security Officer, the Engineering Lead, or a designated person so the requirement can be reviewed or an exception considered."}, {"k": "flow", "t": "14. Reporting security concerns", "steps": [["alert", "Notice", "Loss, theft, or suspicious activity", "F7DEDE"], ["phone", "Report", "Security Officer, CEO, or designee", "F7EDC9"], ["shield", "Respond", "Under the Incident Response Plan", "DCEFE2"]], "banner": "Report promptly: lost devices, compromised credentials, disclosure, unauthorized access.", "n": "Section 14. Personnel must promptly report lost or stolen devices used for Company work, suspected compromised credentials, suspicious messages or activity, accidental disclosure of Company or customer information, unauthorized access, and suspected security incidents. Reports can go to the Security Officer, the CEO, or a designated person, and they are handled under the Incident Response Plan."}, {"k": "sec", "t": "15. Monitoring and privacy", "items": ["Company systems may be logged", "Logins, admin, security, access events", "Used for legitimate purposes only", "Personal device content not monitored", "Company accounts still create records"], "art": "Logs under the Logging policy", "cad": "Continuous", "n": "Section 15. The Company may log and monitor activity on Company-controlled systems, accounts, applications, cloud environments, and services, including authentication, administrative, security, and access events. Logs are used for legitimate security, operational, compliance, and investigative purposes, consistent with law and the Logging and Monitoring Policy. The Company does not generally monitor personal activity or content on personal devices just because they are used for work, but use of Company accounts may create records whatever device is used."}, {"k": "sec", "t": "16 to 18. Acknowledge, enforce, except", "items": ["Acknowledge at onboarding and periodically", "Complete security awareness training", "Violations handled by severity", "Prompt reporting is considered", "Exceptions approved and registered"], "art": "Acknowledgment; Exception Register", "cad": "Onboarding, periodically; as needed", "n": "Section 16. Personnel must acknowledge applicable security policies during onboarding and periodically after, and a combined acknowledgment may be used. They must complete security awareness training under the Security Awareness and Training Policy. Section 17. Material violations are handled by nature and severity, from guidance or training to access removal, discipline, or termination, and prompt reporting and cooperation are considered. Section 18. When a requirement cannot reasonably be met, the CEO, the Security Officer, or a designated person may approve an exception, recorded in the Exception Register with the requirement, reason, compensating measure, approver, and review or expiry date."}, {"k": "table", "t": "Records you create", "head": ["Record", "Minimum content"], "rows": [["Policy acknowledgment", "Name, policies, date; one yearly combined"], ["Security awareness training", "Name, training, completion date"], ["Approved services and software", "Asset, vendor, and AI Tool registers"], ["Incident evidence", "Per the Incident Response Plan"], ["Exception record", "Requirement, reason, measure, approver, date"]], "n": "Section 19 lists the records. A policy acknowledgment with name, policies acknowledged, and date, where one annual combined acknowledgment is enough. Security awareness training with name, training, and completion date. Approved services and software, kept in the asset inventory, vendor inventory, and Approved AI Tool Register, with no separate inventory for this policy. Incident evidence only when an incident occurs, and an exception record only when an exception exists. Existing emails, tickets, and system records can serve as evidence."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass"], "side": "At onboarding and periodically", "n": "You acknowledge this policy during onboarding and periodically after that, and a combined acknowledgment may be used. Your record captures your name, the version, the date, and your quiz result. Thank you for using PromptHalo systems and information responsibly. Let's move on to the questions."}]}, {"key": "ac", "title": "Access Control", "id": "POL-AC-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Approve, limit, record, review, remove.", "slides": [{"k": "title", "t": "Access Control", "sub": "Approve, limit, record, review, remove", "body": "How PromptHalo grants, reviews, and removes access to systems and information.", "meta": "POL-AC-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Access Control Policy training. It covers how access is granted, how we authenticate, how privileged and non-human access is handled, access to client systems, joiners, movers and leavers, and access reviews. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1 and 2. Purpose and scope", "items": [["shield", "Purpose", "Approved, limited, reviewed, removed"], ["server", "Systems", "Workspace, AWS, GitHub, password manager"], ["cpu", "Identities", "People, service accounts, agents"]], "banner": ["Also covered:", "access we hold inside client environments."], "n": "Section 1 sets the purpose: access to Company systems and information is approved, limited to what each role needs, recorded, reviewed, and removed when no longer needed. Section 2 sets the scope. It covers Google Workspace, AWS, GitHub, the password manager, any other system holding Company or customer information, and access the Company holds inside client environments. It covers people and non-human identities: service accounts, automations, and agents. Personal devices are addressed in the Acceptable Use Policy."}, {"k": "grid", "t": "3. Roles", "items": [["user", "Accountable Party", "CEO, or Security Officer if absent"], ["flag", "Approvals", "Production, customer data, admin"], ["eye", "Reviewers", "Engineering Lead or CEO"], ["cpu", "Non-human IDs", "Each has a named human owner"]], "n": "Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party, owns the policy, and may delegate duties. The Steering Committee, which today is the CEO, approves it and reviews it at least annually. The Accountable Party approves access to production, customer data, and administrative functions. If the approver is also the requester, another authorized approver confirms the grant, and that is recorded. The Engineering Lead or the CEO performs access reviews, with the CEO confirming privileged access where independence is needed. Every non-human identity has a named human owner."}, {"k": "sec", "t": "5. How access is granted", "items": ["Deny by default; least privilege", "Named individual identity", "Requested and approved before grant", "Role baseline, not a copy of others", "Screening done before production access"], "art": "Email or ticket approval record", "cad": "Each grant", "n": "Section 5. Access must be denied by default and granted on least privilege to a named individual identity. It must be requested and approved before it is granted, and the record must show who requested it, what was requested, who approved it, and when. An email or ticket is enough. New personnel receive a defined baseline for their role, not a copy of someone else's access. Screening must be completed and recorded before access to production systems or customer data, under the Screening Standard."}, {"k": "sec", "t": "6. Authentication and MFA", "items": ["Individual accounts; no shared accounts", "MFA wherever supported", "SSO through the identity provider", "Non-SSO systems managed individually", "Privileged access always uses MFA"], "art": "MFA and SSO configuration evidence", "cad": "Kept current; shown at audit", "n": "Section 6. Company systems must use individual user accounts, and shared accounts are not permitted unless technically necessary and approved by the Accountable Party. MFA is required wherever supported, including Google Workspace, GitHub, AWS, and other systems with Company or customer information. SSO through the identity provider, Google Workspace, should be used where supported. Systems without SSO are managed individually and included in access reviews and offboarding. Privileged access must use MFA and be limited to those who need it. Password rules are in the Password and Authentication Policy."}, {"k": "sec", "t": "7. Privileged and non-human access", "items": ["Privileged: role need, approved separately", "Separate from the day-to-day account", "Break-glass: password manager, hardware MFA", "Break-glass use alerts and is recorded", "Non-human IDs inventoried with owner"], "art": "Privileged list; break-glass record", "cad": "Each grant or use; reviewed yearly", "n": "Section 7. Privileged access must be granted only where the role requires it, approved separately, and held apart from the day-to-day account where the platform allows. Break-glass credentials must be held in the password manager under hardware MFA, and their use must raise an alert and be recorded with the reason. Non-human identities must be inventoried with a named human owner, their purpose, and their permissions, and included in access reviews."}, {"k": "two", "t": "7. Environments and duties", "items": [["server", "Separate environments", ["Split at cloud account boundary", "Permission sets per role", "Per the Cloud Platform Standard"]], ["users", "Segregation of duties", ["Applied to access decisions", "Per STD-SOD-001", "No self-approval of own grants"]]], "n": "Section 7 also requires that production and non-production are separated at the cloud account boundary, with permission sets granting only what a role needs in each, as set out in the Cloud Platform Standard. Segregation of duties must be applied as set out in the Segregation of Duties Standard, STD-SOD-001. That is also why, under Section 3, a requester who is also the approver needs another authorized approver to confirm the grant."}, {"k": "sec", "t": "8. Access to client systems", "items": ["Only under the engagement agreement", "Limited to the authorized scope", "Removed when the engagement ends", "Included in each access review", "Reviewed at engagement end"], "art": "Access review record", "cad": "Each review and engagement end", "n": "Section 8 covers access we hold inside a client environment. It must be granted only under the engagement agreement, limited to the authorized scope, and removed when the engagement ends. Client-environment access must be included in each access review and reviewed again when an engagement ends."}, {"k": "flow", "t": "9. Joiners, movers and leavers", "steps": [["user", "Join", "Role baseline after approval", "DCEFE2"], ["edit", "Move", "Adjust access, do not accumulate", "F7EDC9"], ["lock", "Leave", "Revoke within one business day", "F7DEDE"], ["list", "Non-SSO", "Remove system by system", "DDEBF7"], ["check", "Record", "Identity, checklist, or email", "E9E3F5"]], "banner": "Involuntary departure: revoke immediately. Contractors: set an engagement end date.", "n": "Section 9. Access must change with the role. When someone moves to different work, access is adjusted, not accumulated. Access must be revoked within one business day of departure, and immediately when the departure is involuntary. Access outside SSO goes on the offboarding checklist and is removed system by system, including AWS, GitHub, shared credentials in the password manager, and third-party AI services. Contractor identities should carry an engagement end date so access lapses if the engagement is not renewed."}, {"k": "sec", "t": "9. Joiner, mover, leaver records", "items": ["Name and ID if assigned", "Role, start or last working date", "Systems needing changes or removal", "Completion of those changes", "Any available evidence is fine"], "art": "Joiner, mover and leaver record", "cad": "Each join, move, or departure", "n": "Joiner, mover and leaver documentation must identify, as applicable, the employee or contractor name and ID if one is assigned, the role, the start date or last working date, the systems that need access changes or removal, and the completion of those changes. Any available evidence can document it, such as an identity-provider record, a system record, an email, or the offboarding checklist."}, {"k": "sec", "t": "10. Access reviews", "items": ["At least annually, and on major change", "Access still fits role and need", "Engineering Lead or CEO reviews", "No one solely reviews own privileges", "Include non-human and client access"], "art": "Annual access review record", "cad": "At least a
