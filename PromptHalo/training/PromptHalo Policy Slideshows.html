nnually", "n": "Section 10. Access to systems within the audit boundary must be reviewed at least annually, and when there is a significant organizational, role, system, or security change. The review confirms each user's access still fits their role and business need. The Engineering Lead or the CEO performs it, and no one should be the sole reviewer of their own privileged access; where needed, the CEO performs or confirms the review. Non-human identities and client-environment access are included. Changes found must be completed and recorded, and platform exports may be kept as supporting evidence."}, {"k": "table", "t": "Records you create", "head": ["Artifact", "Minimum evidence"], "rows": [["Access and role matrix", "Person, role, system, access level"], ["Access approval", "Requester, access, approver, date"], ["Annual access review", "Reviewer, date, decisions, changes done"], ["Joiner, mover, leaver record", "Name, role, dates, actions completed"], ["MFA and SSO evidence", "Configuration or console screenshots"], ["Non-human identity list", "Purpose, human owner, permissions"], ["Privileged access list", "Account, system, level, justification"], ["Break-glass use record", "Date, person, reason, actions taken"]], "n": "Section 11 lists the artifacts. An access and role matrix. An access approval showing requester, access, approver, and date. The annual access review with reviewer, date, keep, remove, or change decisions, and proof changes were done. Joiner, mover and leaver records. MFA and SSO evidence for Google Workspace, GitHub, AWS, and others. A non-human identity list and a privileged access list. A break-glass use record. An exception record is needed only when a requirement cannot be met. Other artifacts are created only when a real need requires them."}, {"k": "sec", "t": "12. Exceptions", "items": ["Example: app without SSO", "Example: no separate privileged account", "Accountable Party approves", "Recorded in the Exception Register", "With compensating control, review date"], "art": "Exception Register entry", "cad": "When an exception is approved", "n": "Section 12 covers exceptions. Where a requirement cannot be met, such as an application that does not support SSO or a platform without separate privileged accounts, the Accountable Party must approve the exception and record it in the Exception Register with the compensating control and a review date."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping access at PromptHalo limited to what each of us needs. Let's move on to the questions."}]}, {"key": "ai", "title": "AI Governance", "id": "POL-AI-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Use approved AI, protect data, stay accountable.", "slides": [{"k": "title", "t": "AI Governance", "sub": "Use approved AI, protect data, stay accountable", "body": "How PromptHalo uses, builds, and oversees artificial intelligence.", "meta": "POL-AI-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Artificial Intelligence Governance Policy training. It covers when an AI use is higher risk, approved AI tools, data handling, assistants, model providers, agents, development and testing, human oversight, logging, incidents, and records. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["users", "Personnel use", "AI tools and information protection"], ["server", "Providers", "Third-party AI and model providers"], ["cpu", "What we build", "AI features, agents, automation"]], "banner": ["Proportionate:", "reuse existing processes, no separate AI process."], "n": "Section 1 sets the purpose: proportionate controls for how the Company uses and develops AI. That covers AI tools used by personnel, protection of Company and customer information, third-party AI and model providers, AI-enabled functionality, agents and automated actions, and human accountability for AI-assisted decisions. Controls depend on the information, access, and actions involved. Where an existing Company process already provides the control, this policy relies on it rather than creating a separate AI process."}, {"k": "grid", "t": "2 and 3. Scope and roles", "items": [["globe", "In scope", "Assistants, models, RAG, agents, dev tools"], ["user", "Out of scope", "Personal AI use with no Company data"], ["flag", "Approvers", "CEO, Security Officer, or designee"], ["pen", "Accountable", "People, never the AI model or agent"]], "n": "Section 2. The policy applies to AI used for Company or customer work: assistants, generative AI services, models and inference, AI product features, retrieval-augmented generation, agents and automated workflows, and AI-assisted development tools. Personal AI use with no Company or customer information or business is out of scope. Section 3. The CEO or, if absent, the Security Officer owns the policy and is accountable for AI governance. The CEO, the Security Officer, or a designated person may approve AI tools and material uses. Every material AI system, agent, or workflow has a named owner, and personnel stay accountable for AI-assisted work they use or rely on."}, {"k": "check", "t": "5. When an AI use is higher risk", "items": ["Customer or Restricted information", "Consequential decisions", "Production or privileged access", "Acts without direct human execution", "Customer-facing or new capability"], "big": "Review first", "bigsub": "Higher-risk use is reviewed before production", "n": "Section 5. Ordinary AI use, where a person uses an approved tool and reviews the output before relying on it, needs no separate approval. An AI use is higher risk, and must be reviewed before production in proportion to the risk, when it processes customer or Restricted information, makes or materially influences consequential decisions, has access to production systems, can execute actions without direct human execution, has privileged access, is part of customer-facing functionality, or introduces materially new data access or system capabilities."}, {"k": "sec", "t": "6. Approved AI tools", "items": ["Approved for use and data type", "Recorded in Approved AI Tool Register", "No re-approval within approved purpose", "New requests reviewed promptly", "Register reviewed at least annually"], "art": "Approved AI Tool Register", "cad": "Annually and on provider change", "n": "Section 6. AI tools used for Company work must be approved for the intended use and type of information, and recorded in the Approved AI Tool Register. A spreadsheet is enough. The register lists the tool or provider, intended use, highest data classification permitted, approval status, and owner where applicable. You do not need approval each time you use an approved tool within its purpose and classification. New tool requests are reviewed in a timely way, and low-risk tools may get a streamlined review. The register is reviewed at least annually and when a provider's security, privacy, retention, training use, or terms change materially."}, {"k": "sec", "t": "7. AI data handling", "items": ["Only into services approved for it", "No sensitive data in unapproved AI", "No secrets in prompts", "No training on customer data unless allowed", "Data Classification Policy still applies"], "art": "None specified", "cad": "Every use", "n": "Section 7. Company or customer information may only be entered into AI services approved for that classification and use. Confidential, Restricted, customer, regulated, proprietary, or other sensitive information must not go into an AI service unless it is approved to process it. Credentials, API keys, passwords, private keys, tokens, and other secrets must not be entered into prompts unless an approved system design requires it and protects them. Customer information must not train or fine-tune a model unless the agreement authorizes it or the customer approves where required. The Data Classification Policy continues to apply."}, {"k": "two", "t": "8 and 9. Assistants and providers", "items": [["cpu", "AI assistants", ["Approved tools, Company accounts", "Routine uses need no approval", "Judge output before relying on it"]], ["server", "Model providers", ["Assessed via Vendor Management", "Training use, retention, deletion", "In subprocessor records if needed"]]], "n": "Section 8. Use approved AI assistants through approved Company accounts where available. Drafting, brainstorming, summarizing, coding help, and similar low-risk uses need no separate approval with an approved tool and permitted information. Decide whether output is appropriate before relying on it. Section 9. AI providers are evaluated through Vendor Management, in proportion to the information and functionality involved. Where a provider handles customer, Confidential, Restricted, or regulated information, the review considers training use, retention, security and privacy practices, contract terms, subprocessor status, and deletion. Providers processing customer information go in vendor or subprocessor records where required."}, {"k": "sec", "t": "10. AI agents and automation", "items": ["Least privilege access only", "Named owner for each material agent", "Dedicated identities where practical", "Never approve own changes", "Activity logged; may be disabled"], "art": "Agent and automation inventory", "cad": "When an agent is added or changes", "n": "Section 10. Agents and automated workflows get access only to the systems and information reasonably needed for their purpose. Each material agent or workflow has a named owner and, where practical, a dedicated identity with least-privilege permissions under the Access Control Policy. Agents must not approve their own changes or bypass production change approvals, and material production actions are subject to authorization and controls suited to the risk. Material agent activity is logged enough to investigate significant actions, where feasible. An agent operating materially outside its scope may be disabled or restricted while the issue is investigated."}, {"k": "sec", "t": "11. Development and change", "items": ["Follow Change Management and Secure SDLC", "Models, prompts, guardrails, retrieval", "Tool definitions and agent permissions", "Routine changes: normal process", "No separate AI change system"], "art": "GitHub issue, pull request, change record", "cad": "Each material AI change", "n": "Section 11. AI-related product changes must follow the Change Management Policy and the Secure SDLC Policy. That includes material changes to models and model versions, system prompts, guardrails, retrieval configuration, tool definitions, agent permissions, AI workflows, and customer-facing AI functionality. Routine prompt, content, or configuration changes that do not materially affect security, data access, permissions, or behavior follow the normal change process. No separate AI change-management system or approval process is required."}, {"k": "check", "t": "12. Security review before production", "items": ["Expands data access", "Adds agent or tool capabilities", "Changes authorization", "Customer-facing AI functionality", "New model or provider in production"], "big": "Proportionate", "bigsub": "Recorded in the issue, PR, or change record", "n": "Section 12. Security must be considered whenever material AI functionality is designed or changed. An additional security review, proportionate to the change, is required when a change materially expands access to Company or customer information, adds or expands agent or tool capabilities, changes authorization or permissions, introduces customer-facing AI functionality, puts a new model or provider in a material production path, or creates a material new security or privacy risk. The review can live in the issue, pull request, change record, or test record."}, {"k": "sec", "t": "13. Testing", "items": ["Test material AI before production", "Access control and data exposure", "Prompt injection and tool misuse", "Guardrails and unsafe output", "Fix issues or accept the risk"], "art": "Test results, PR records, or notes", "cad": "Before each material release", "n": "Section 13. Material AI functionality must be tested before production, in proportion to its use and risk, covering what is relevant to the change. Testing may consider functionality, access control, data exposure, prompt injection, tool misuse, unauthorized actions, guardrail behavior, and materially incorrect or unsafe output. Evidence can be automated test results, pull request records, screenshots, test notes, or security testing results. Issues must be fixed before release, or documented and accepted through the Risk Management Policy."}, {"k": "sec", "t": "14 and 15. Oversight and logging", "items": ["A named person stays accountable", "Review in proportion to impact", "No per-output approval for low risk", "No unchecked consequential decisions", "Logs enough to investigate"], "art": "Existing app, cloud, or provider logs", "cad": "Continuous", "n": "Section 14. A named person remains accountable for material AI-assisted decisions or actions, with human review proportionate to the impact. Low-risk assistance does not need documented approval for each output. AI should not independently make consequential decisions affecting individuals, customers, security, legal obligations, or material commitments unless designed, authorized, and controlled for it. Section 15. Logging is proportionate to risk and capability. For material agents and production AI, records should be enough to understand significant actions and investigate incidents. Existing logs are fine, under the Logging and Monitoring Policy."}, {"k": "flow", "t": "16. AI incidents", "steps": [["alert", "Spot", "Disclosure, misuse, odd agent behavior", "F7DEDE"], ["mail", "Report", "Promptly, as an AI incident", "F7EDC9"], ["lock", "Contain", "Disable the tool, agent, or access", "DDEBF7"], ["shield", "Respond", "Under the Incident Response Plan", "DCEFE2"]], "n": "Section 16. Personnel should promptly report suspected AI-related security or privacy incidents. Suspected compromise, unauthorized data disclosure, material unintended agent behavior, misuse, and other significant security events involving AI must be handled under the Incident Response Plan. While a material concern is investigated, the Company may disable an AI tool, model, agent, integration, or access."}, {"k": "sec", "t": "17 and 18. Inventory and risk review", "items": ["Material AI identifiable in records", "No duplicate inventories needed", "Reassign agent owners on change", "Review AI changes at least yearly", "Material risks to Risk Management"], "art": "AI Tool Register, asset inventory", "cad": "At least annually and on change", "n": "Section 17. Material AI systems, agents, and services must be identifiable through the Approved AI Tool Register, the asset inventory, code repositories, architecture documentation, or other existing records; duplicate inventories are not required. Ownership of material agents and workflows must be reassigned when the owner changes role or leaves. Section 18. The Company reviews material AI changes at least annually and when significant changes become known, such as new providers or terms, new capabilities, threats, regulatory or customer requirements, or product changes. Material risks go through the Risk Management Policy."}, {"k": "table", "t": "Records you create", "head": ["Record", "Minimum content"], "rows": [["Approved AI Tool Register", "Tool, purpose, data class, status, owner"], ["AI provider assessment", "Data, training use, retention, DPA, approval"], ["AI change and test evidence", "Issues, PRs, change records, test results"], ["Agent and automation inventory", "Agent, owner, identity, access, permissions"], ["AI risk or exception record", "Risk, reason, measure, approver, date"]], "n": "Section 19 lists the records. The Approved AI Tool Register. An AI provider assessment, only where the information or risk warrants it, and existing vendor evidence can be used. Material AI change and test evidence in GitHub issues, pull requests, change records, or test results, with no separate AI change form. An agent and automation inventory for material agents. An AI risk or exception record only when applicable. Section 20: exceptions are approved by the CEO, the Security Officer, or a designated person and logged in the Exception Register. Section 21: material violations are handled in proportion to their severity."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for using AI at PromptHalo carefully and accountably. Let's move on to the questions."}]}, {"key": "am", "title": "Asset Management", "id": "POL-AM-001", "version": "1.0", "date": "July 23, 2026", "blurb": "Know it, own it, protect it, retire it.", "slides": [{"k": "title", "t": "Asset Management", "sub": "Know it, own it, protect it, retire it", "body": "How PromptHalo inventories, owns, reviews, and disposes of its assets.", "meta": "POL-AM-001, version 1.0, July 23, 2026", "n": "Welcome to PromptHalo's Asset Management Policy training. It covers what counts as an asset, the inventory, ownership, Company and personal devices, cloud and SaaS, AI assets, the annual review, offboarding, loss or theft, and disposal. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["list", "Inventory", "Of the material assets we rely on"], ["user", "Ownership", "Every asset has a responsible person"], ["shield", "Protection", "Access, protection, and disposition"]], "banner": ["No new tool:", "existing system and provider records are enough."], "n": "Section 1 sets the purpose. The Company maintains an inventory of the material assets it uses to run the business and deliver its services, so those assets have appropriate ownership, protection, access, and disposition. We use existing system and provider records where practical, and we are not required to buy or deploy a dedicated asset-management tool."}, {"k": "grid", "t": "2. What counts as an asset", "items": [["server", "Equipment and cloud", "Devices, cloud environments, resources"], ["globe", "SaaS and domains", "Applications, domains, certificates"], ["db", "Code and data", "Repositories and data stores"], ["cpu", "AI and devices", "AI services and agents; personal devices"]], "n": "Section 2 sets the scope: material Company assets, including Company-owned equipment, cloud environments and material cloud resources, SaaS applications, code repositories, data stores, domains and certificates, AI services, models, and agents where applicable, and personally owned devices used to access Company systems, to the extent applicable. The Company does not assume ownership or general administrative control over personally owned devices. A material asset is one whose loss, compromise, or misuse would affect operations, services, or Company or customer information."}, {"k": "sec", "t": "3. Roles", "items": ["CEO or Security Officer owns the policy", "Committee approves and reviews yearly", "Asset owners keep assets protected", "Owners remove or reassign when done", "Personnel report loss or theft"], "art": "Dated CEO record of approval", "cad": "At least annually", "n": "Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party, owns the policy and the asset management program, and may delegate administration to the Security Officer, the Engineering Lead, or another designated person. The Steering Committee, which today is the CEO, approves the policy and reviews it at least annually. Asset owners keep their assets necessary, configured, protected, and removed or reassigned when no longer needed. Personnel protect the assets they use and report loss, theft, or suspected compromise."}, {"k": "table", "t": "5. The asset inventory", "head": ["Field", "What it records"], "rows": [["Asset or service", "Name of the asset or service"], ["Asset type", "Equipment, cloud, SaaS, repo, data, AI"], ["Owner", "Person responsible for the asset"], ["User or custodian", "Person using or holding it"], ["Purpose", "Why the Company uses it"], ["Status", "Active, retired, or disposed"], ["Data classification", "Highest class of information held"]], "n": "Section 5. The Company must keep a reasonable inventory of the material assets used to run the business and deliver services. It can draw on records from AWS, Google Workspace, GitHub, SaaS providers, and financial records instead of duplicating them, and a maintained spreadsheet is enough where automated information is not available. As applicable, it identifies the asset or service, its type, owner, user or custodian, purpose, status, and the highest data classification it holds."}, {"k": "sec", "t": "6. Asset ownership", "items": ["Every material asset has an owner", "Owner keeps it necessary", "Configured and protected", "Removed or reassigned when done", "Ownerless assets investigated"], "art": "Owner field in the asset inventory", "cad": "Kept current; checked yearly", "n": "Section 6. Each material asset must have an identified owner or responsible person. The owner makes sure the asset remains necessary, is appropriately configured and protected, and is removed or reassigned when no longer required. Assets without an identifiable business purpose or owner must be investigated and then assigned, removed, or decommissioned."}, {"k": "two", "t": "7 and 8. Company and personal devices", "items": [["server", "Company-owned", ["Recorded when issued or returned", "Protections kept in place", "Report loss or theft promptly"]], ["user", "Personally owned", ["Screen lock and encryption", "Current updates, anti-malware", "Data stays in approved cloud"]]], "n": "Section 7. Company-owned devices must be recorded when issued and, as applicable, when returned, reassigned, lost, or disposed of. Appropriate protections must be maintained, and lost, stolen, or compromised equipment reported promptly. Section 8. Personal devices may be used when the Company permits. Keep a screen lock, disk or device encryption where supported, current operating system and security updates, and native anti-malware or platform security switched on. Company information should stay in approved cloud services. The Company does not monitor or administer personal devices unless a customer, contractual, legal, or security requirement makes it necessary."}, {"k": "sec", "t": "9. Cloud, SaaS and software", "items": ["Services in records or provider records", "New material services approved first", "Unapproved services evaluated", "Then approved or discontinued", "Licensed, supported software only"], "art": "Asset inventory; vendor approval", "cad": "Before use; reviewed yearly", "n": "Section 9. Approved cloud services, SaaS applications, code repositories, and other material technology services must be in the asset records or identifiable through authoritative provider records. New material services that store, process, or access Company or customer information must be approved before use, under the Vendor Management Policy where applicable. Unapproved material services the Company finds are evaluated and then approved or discontinued. Only licensed and supported software should be used for Company business."}, {"k": "sec", "t": "10. AI, agents and other technology", "items": ["Material AI is a Company asset", "Includes services, models, agents", "Record owner, purpose, permitted use", "Details in the AI Governance Policy"], "art": "Asset record or AI Tool Register", "cad": "When added or changed", "n": "Section 10. Material AI services, models, agents, or similar technologies used to process Company or customer information are Company technology assets. Where applicable, the Company must record the service or asset, its owner, its purpose, and its permitted use. Detailed AI requirements are in the AI Governance Policy."}, {"k": "check", "t": "11. The annual asset review", "items": ["Material assets accounted for", "Owners are appropriate", "Assets still necessary", "Leavers hold no assets or access", "Obsolete or unauthorized addressed"], "big": "Yearly", "bigsub": "And when significant changes occur", "n": "Section 11. The asset inventory must be reviewed at least annually and when significant changes occur. The review confirms that material assets are accounted for, have appropriate owners, and remain necessary, that departed personnel no longer hold Company assets or access, and that obsolete or unauthorized assets are addressed. The CEO, the Security Officer, the Engineering Lead, or a designated person may perform it. The review and resulting actions must be recorded, and an email, spreadsheet, checklist, or system record is enough."}, {"k": "flow", "t": "12. Asset return and offboarding", "steps": [["gift", "Return", "Company assets returned or accounted", "DCEFE2"], ["lock", "Remove", "Access, per Access Control Policy", "F7DEDE"], ["edit", "Delete", "Company data on personal devices", "F7EDC9"], ["users", "Reassign", "Repos, cloud, service accounts", "DDEBF7"], ["doc", "Record", "Email, checklist, or system record", "E9E3F5"]], "n": "Section 12. Company assets assigned to departing personnel must be returned or otherwise accounted for, and access removed under the Access Control Policy. Where Company information is on a personal device, the departing person must delete it and confirm the deletion. Repositories, cloud resources, service accounts, and other resources they owned are reassigned where necessary. Return, reassignment, and deletion can be evidenced by email, checklist, system record, or other written record."}, {"k": "sec", "t": "13. Loss or theft", "items": ["Report promptly to Security Officer or CEO", "Disable accounts; revoke sessions", "Reset credentials; remove access", "Investigate possible exposure", "Start Incident Response if needed"], "art": "Incident record where applicable", "cad": "Each loss or theft", "n": "Section 13. Loss, theft, or suspected compromise of a Company asset, or of any device used to access Company information, must be reported promptly to the Security Officer, the CEO, or a designated person. The Company takes action appropriate to the risk, which may include disabling accounts, revoking sessions or credentials, resetting credentials, removing access, investigating potential information exposure, and starting the Incident Response Plan where appropriate."}, {"k": "sec", "t": "14. Disposal", "items": ["Erase, sanitize, or destroy media", "Before reuse, transfer, or disposal", "Document the disposal action", "Cloud and SaaS: provider deletion", "Avoid removable media"], "art": "Disposal record", "cad": "Each disposal", "n": "Section 14. Company-owned devices or media holding Company or customer information must be securely erased, sanitized, destroyed, or otherwise appropriately disposed of before reuse, transfer, or disposal, and the action documented. For cloud and SaaS services, the Company may rely on the provider's deletion and disposal capabilities. Removable media should not be used for Company or customer information unless there is a business need and appropriate protection is applied."}, {"k": "table", "t": "Records you create", "head": ["Record", "Minimum content"], "rows": [["Asset inventory", "Asset, type, owner, purpose, class, status"], ["Company device list", "Person, device, serial, issued, returned"], ["BYOD list", "Name, device type, OS, used for work"], ["Annual asset review", "Date, reviewer, assets, actions done"], ["Offboarding record", "Assets returned, data deleted, access off"], ["Disposal record", "Asset, date, method, person responsible"], ["Exception record", "Requirement, reason, measure, approver"]], "n": "Section 15 lists the records. The asset inventory, including SaaS and cloud services. A Company device list, only if the Company issues equipment. A BYOD list, where a personnel acknowledgment covers the security baseline. The annual asset review. An offboarding record. A disposal record, only when an asset is disposed of. And an exception record, which under Section 16 is approved by the CEO, the Security Officer, or a designated person and logged in the Exception Register with a review or expiry date. Existing authoritative records can serve as evidence."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for knowing, owning, and protecting the assets PromptHalo relies on. Let's move on to the questions."}]}, {"key": "bkp", "title": "Backup and Recovery", "id": "PLN-BKP-001", "version": "1.0", "date": "October 9, 2026", "blurb": "Back up, monitor, restore, test.", "slides": [{"k": "title", "t": "Backup and Recovery Plan", "sub": "Back up, then prove you can restore", "body": "How PromptHalo backs up, monitors, and recovers critical data and systems.", "meta": "PLN-BKP-001, version 1.0, October 9, 2026", "n": "Welcome to PromptHalo's Backup and Recovery Plan training. This Plan is owned by Engineering, with guidance from the Security Officer. We will cover what we back up, the schedule and retention, the tools, how backups are protected and monitored, how backup issues are ticketed, how we recover, and how we test recovery. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this Plan exists", "items": [["shield", "Recover", "Critical data, configs, and systems"], ["server", "Cloud native", "Provider backup, versioning, replication"], ["alert", "Any cause", "Deletion, corruption, incident, outage"]], "banner": ["Plan owner: Engineering.", "The Security Officer provides guidance."], "n": "Section 1 sets the purpose. This Plan describes how PromptHalo backs up, monitors, and recovers critical data, configurations, and systems after accidental deletion, corruption, a security incident, a system failure, or a service disruption. Because the Company primarily uses cloud and SaaS services, we use the providers' native backup, versioning, replication, and recovery capabilities rather than building our own."}, {"k": "grid", "t": "2. What the Plan covers", "items": [["server", "AWS production", "Systems, databases, object storage"], ["link", "GitHub", "Code, IaC, and app configuration"], ["mail", "Google Workspace", "Email and documents"], ["tool", "Configs and SaaS", "Security configs, Slack, and others"]], "n": "Section 2 sets the scope. The Plan applies to systems that hold Company, customer, product, security, or operational information needed to run or recover our services. That includes AWS production systems, databases, and object storage; GitHub repositories, Infrastructure-as-Code, and application configuration; Google Workspace email and documents; security and operational configurations; and other critical SaaS such as Slack."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party: objectives, disasters, holds", "Engineering owns and maintains this Plan", "Engineering runs backups, restores, and tests", "Security Officer guides and coordinates the test", "Owners identify critical systems and data"], "art": "Quarterly backup coverage review", "cad": "Quarterly", "n": "Section 3 sets the roles. The Accountable Party approves recovery objectives, declares a disaster, places legal holds, and approves material exceptions. Engineering owns and maintains this Plan, configures and monitors backups, receives alerts on backup setting changes, manages backup tickets, and performs restores and tests. The Security Officer provides guidance, coordinates the annual recovery test, reports results to the Accountable Party, and keeps the evidence. Engineering and the Security Officer review coverage together every quarter. System and business owners identify critical systems and make sure each has a backup."}, {"k": "grid", "t": "4. Key terms", "items": [["target", "RPO", "Most data loss accepted, as time"], ["clock", "RTO", "Time to restore after a disruption"], ["db", "Point-in-time", "Restore to any moment in retention"], ["alert", "Disaster", "Beyond RTO; Accountable Party declares"]], "n": "Section 4 defines the terms. The recovery point objective, or RPO, is the maximum amount of data, as a period of time, we accept losing for a system. The recovery time objective, or RTO, is the period within which a system is to be restored after a disruption is declared. Point-in-time recovery restores a database to any moment within its retention period. A disaster is a disruption that ordinary incident response cannot resolve within the system's RTO, declared by the Accountable Party."}, {"k": "table", "t": "5. Backup schedule and retention", "head": ["System or data", "Method", "Frequency", "Retention"], "rows": [["Production databases (RDS, Aurora)", "Automated backups with PITR", "Continuous, plus daily snapshot", "35 days"], ["Production databases, long-term", "AWS Backup snapshot", "At least yearly or as needed", "12 months"], ["DynamoDB tables, if used", "Point-in-time recovery", "Continuous", "35 days"], ["Critical S3 buckets", "Versioning; replication if justified", "Every write", "Previous versions 30 days"], ["EBS volumes, if any", "AWS Backup snapshot", "Daily", "14 days"], ["Source code and IaC", "GitHub version control", "Every commit", "Full history"], ["Google Workspace email and Drive", "Trash, admin restore, Vault if licensed", "Continuous", "Provider recovery window"], ["Critical SaaS", "Provider recovery or scheduled export", "As set by the owner", "As set by the owner"]], "n": "Section 5 sets the schedule. Production databases use automated backups with point-in-time recovery, continuous plus a daily snapshot, kept 35 days, with a long-term AWS Backup snapshot kept 12 months. DynamoDB, if used, keeps 35 days of point-in-time recovery. Critical S3 buckets keep previous versions for 30 days. EBS volumes, if any, get daily snapshots kept 14 days. GitHub keeps full code history, Google Workspace uses provider recovery, and critical SaaS follows what the owner sets."}, {"k": "sec", "t": "5. Objectives and retention rules", "items": ["RPO: 4 hours for the production service", "RPO: 24 hours for corporate tools and code", "A shorter client objective governs", "Legal holds and contracts extend retention", "Schedule changes go through POL-CM-001"], "art": "Updated schedule table", "cad": "When the schedule changes", "n": "Backups must meet the recovery point objectives in Section 9 of the Data Retention, Disposal and Disaster Recovery Policy: 4 hours for the production service, and 24 hours for corporate collaboration, email, and files, and for source code and the build pipeline. Where a client agreement sets a shorter objective, the agreement governs. Retention is extended for a legal hold and where a contract or customer requirement applies. Client statements about how long deleted data persists in backups must reflect the longest retention in the table. Schedule changes go through the Change Management Policy."}, {"k": "table", "t": "6. Tools", "head": ["Tool", "Used for"], "rows": [["RDS and Aurora automated backups", "Point-in-time recovery of production databases"], ["AWS Backup", "Snapshots, retention rules, view of backup jobs"], ["Amazon S3 Versioning", "Recovering deleted or overwritten objects"], ["EventBridge and SNS", "Backup failure alerts to channel, Jira, or email"], ["AWS CloudTrail", "Logging backup setting changes and deletions"], ["GitHub", "Source code, IaC, and branch protection"], ["Google Admin console and Vault", "Restoring deleted email and files"], ["Jira", "Backup alerts, issue tickets, restore requests"]], "n": "Section 6 lists the tools. Amazon RDS and Aurora automated backups give point-in-time recovery. AWS Backup handles scheduled snapshots, retention rules, and a central view of backup jobs. S3 Versioning recovers deleted or overwritten objects. EventBridge and SNS send backup failure alerts. CloudTrail records changes to backup settings and deletions of backups. GitHub holds code, Infrastructure-as-Code, and branch protection. The Google Workspace Admin console and Vault restore email and files. Jira tracks backup alerts, issues, and restore requests."}, {"k": "check", "t": "7. Backup security", "items": ["Encrypted at rest and in transit", "Least privilege; MFA for privileged access", "Few admins can delete or change backups", "Separate storage, account, or Region", "Deletion protection on critical backups"], "big": "Protect", "bigsub": "Against unauthorized access, change, and deletion", "n": "Section 7. Backups must be protected against unauthorized access, modification, and deletion. They must be encrypted at rest and in transit, as the Encryption Standard requires. Access must follow least privilege, and privileged access must use MFA. Permission to delete backups or change backup settings should be limited to a small number of administrators. Critical production backups must be protected against loss of the primary system, using separate storage, accounts, or Regions where practical, and deletion protection."}, {"k": "sec", "t": "8. Backup monitoring", "items": ["Failed jobs alert through EventBridge and SNS", "Alerts reach the channel, Jira, or email", "Engineering checks the console monthly", "Setting changes logged in CloudTrail", "Coverage reviewed quarterly with Security"], "art": "Alert configuration; coverage review", "cad": "Monthly check; quarterly review", "n": "Section 8 covers monitoring. Failed, expired, or aborted AWS Backup jobs and RDS backup failures must generate an alert through EventBridge and SNS to the security alerts channel, Jira, or email. Engineering must check the AWS Backup console at least monthly for missed or failed jobs on critical systems. Changes to backup plans, vaults, retention, or deletion of recovery points must be logged in CloudTrail and alert the Engineering Team. Every quarter, Engineering and the Security Officer confirm each critical system in the schedule has a working backup."}, {"k": "table", "t": "9. Backup issues and response", "head": ["Issue", "Example", "Response"], "rows": [["Single failed job", "One nightly snapshot fails", "Rerun or confirm next job in 1 business day"], ["Repeated failure or gap", "Two failures, or no backup for 24 hours", "Fix the same day; notify the Security Officer"], ["Missing coverage", "New critical system has no backup", "Add before production or within 5 business days"], ["Suspicious change", "Backup deleted or retention cut", "Security incident under PLN-IRP-001"], ["Restore request", "Data needs to be recovered", "Ticket; follow Section 10"]], "n": "Section 9 sets how we respond. A single failed job, such as one nightly snapshot, is rerun or the next job confirmed within 1 business day. Repeated failures, or no production backup for over 24 hours, are fixed the same day and the Security Officer is notified. A new critical system without a backup is added before production use or within 5 business days. A suspicious change, such as a deleted backup or shortened retention, is a security incident under the Incident Response Plan."}, {"k": "sec", "t": "9. Backup tickets", "items": ["Every issue is a Jira ticket labeled backup", "Record system, failure, date, and owner", "Record the cause and the fix", "Close only on a confirmed backup or restore", "Attach a link or screenshot"], "art": "Jira ticket labeled backup", "cad": "Every backup issue", "n": "Every backup issue must be tracked as a Jira ticket labeled backup, including restore requests. Each ticket must record the system, what failed, the date it was detected, the owner, the cause, and the fix. A ticket may be closed only when a successful backup or restore is confirmed, with a link or screenshot attached. These tickets, handled to closure, are part of the evidence we keep."}, {"k": "flow", "t": "10. How we recover", "steps": [["list", "Identify", "System, data, and business impact", "E9E3F5"], ["link", "Select", "Best recovery source", "DDEBF7"], ["tool", "Restore", "Data, configuration, or infrastructure", "F7EDC9"], ["check", "Validate", "Complete and working", "FBE5D6"], ["edit", "Record", "Significant actions and issues", "DCEFE2"]], "banner": "Security incident: coordinate under PLN-IRP-001.", "n": "Section 10 sets the recovery steps. When data or systems must be recovered, identify the affected system, data, and business impact. Select the most appropriate recovery source. Restore the data, configuration, or infrastructure. Validate that the restored system or data is complete and working. Then record significant recovery actions and issues. Recovery following a security incident must be coordinated under the Incident Response Plan."}, {"k": "sec", "t": "10. Recovery records and escalation", "items": ["Significant recovery: Jira ticket labeled backup", "Record request, approver, recovery point", "Record the validation result", "Beyond RTO: Accountable Party may declare disaster", "Closes when service and integrity are confirmed"], "art": "Jira recovery ticket", "cad": "Each significant recovery", "n": "Each significant recovery must be tracked as a Jira ticket labeled backup, recording the request, the approver, the recovery point used, and the validation result. Where a disruption cannot be resolved within the affected system's recovery time objective, the Accountable Party may declare a disaster, and recovery then follows the Data Retention, Disposal and Disaster Recovery Policy and the Business Continuity and Disaster Recovery Plan. Recovery closes when service is restored and data integrity is confirmed."}, {"k": "two", "t": "11. Annual restoration test", "items": [["tool", "What a test may be", ["Database or snapshot to non-production", "Previous file version or GitHub code", "Rebuild from IaC or provider tool"]], ["doc", "What the record captures", ["Date, system, method, what restored", "Result: pass or fail, time taken", "Issues, owner, performer, evidence"]]], "n": "Section 11. At least annually, Engineering must perform and record a restoration test of a critical system or representative backup, and results and follow-up actions must be reported to the Accountable Party. A test may restore a database or snapshot to a non-production environment, recover a deleted or previous file version, restore code from GitHub, recreate infrastructure from Infrastructure-as-Code, or use a provider's recovery mechanism. The record captures the date and system, method, what was restored, the result and time taken, issues and owner, and who performed it with evidence."}, {"k": "sec", "t": "12 and 13. Evidence and exceptions", "items": ["Keep records in source systems or compliance platform", "Backup settings, alerts, and Jira tickets", "Coverage reviews, branch protection, tests", "Exceptions: Accountable Party approves", "Compensating measure and expiry date"], "art": "Exception Register entry", "cad": "When an exception is approved", "n": "Section 12 covers evidence. Records must be kept in the systems that produce them or in the compliance platform. Evidence includes AWS Backup plans, RDS backup and point-in-time recovery settings, S3 versioning, the backup failure alert configuration, Jira backup tickets, the quarterly coverage review, GitHub branch protection, and the annual recovery test record. Section 13: material exceptions must be approved by the Accountable Party and recorded in the Exception Register with a compensating measure and an expiry date."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "How often"], "rows": [["Backup and PITR settings, S3 versioning", "5, 12", "Kept current"], ["Backup failure alert configuration", "8, 12", "Kept current"], ["Console check for failed jobs", "8", "At least monthly"], ["Backup coverage review", "8, 12", "Quarterly"], ["Jira ticket labeled backup", "9, 10", "Each issue or significant recovery"], ["Restoration test record", "11", "At least annually"], ["Exception Register entry", "13", "When an exception is approved"]], "n": "Here are the records this Plan produces. Backup settings, S3 versioning, and the failure alert configuration are kept current in the systems themselves. Engineering checks the AWS Backup console at least monthly, and the coverage review happens every quarter. A Jira ticket labeled backup is opened for every backup issue and every significant recovery. The restoration test record is made at least annually, and an Exception Register entry is made whenever an exception is approved."}, {"k": "sign", "t": "Acknowledge this plan", "items": ["Name, version, date", "Quiz result recorded", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this Plan when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping make sure we can always get our data and systems back. Let's move on to the questions."}]}, {"key": "bcp", "title": "Business Continuity", "id": "POL-BCP-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Keep critical work going after a disruption.", "slides": [{"k": "title", "t": "Business Continuity", "sub": "Keep critical work going, whoever is out", "body": "How PromptHalo continues or restores critical operations after a significant disruption.", "meta": "POL-BCP-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Business Continuity Policy training. We will cover why the policy exists, what it covers, who does what, how we record critical services, how we handle key-person dependency, how we respond to a disruption, and how we test and review our arrangements. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["server", "Cloud access", "Keep critical cloud services reachable"], ["users", "Another person", "Someone else can do critical work"], ["check", "Proven", "Confirm arrangements work"]], "banner": ["Goal:", "continue or restore critical operations after a disruption."], "n": "Section 1 sets the purpose. This policy enables PromptHalo to continue or restore critical business operations following a significant disruption. As a small, distributed, cloud-based company, we focus on three things: keeping access to critical cloud services and information, making sure another person can perform or coordinate critical activities, and periodically confirming that our continuity arrangements actually work."}, {"k": "grid", "t": "2. What the policy covers", "items": [["server", "Cloud and production", "Infrastructure, applications, and data"], ["link", "Code and collaboration", "Source code, email, and documents"], ["globe", "Third parties", "Critical third-party and SaaS services"], ["users", "People", "Personnel running critical operations"]], "n": "Section 2 sets the scope: the systems, information, services, and personnel needed to operate the Company and deliver its services. That includes cloud infrastructure, production applications and data, source code, email, documents and collaboration services, critical third-party and SaaS services, and the people responsible for critical operations. We do not run our own data center. Backup, recovery objectives, disaster recovery, and restoration testing are governed by the Data Retention, Disposal and Disaster Recovery Policy and the Backup and Recovery Plan, not here."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Steering Committee approves, reviews yearly", "Security Officer coordinates continuity", "Engineering recovers infrastructure and data", "Management accepts significant risks"], "art": "None specified", "cad": "Policy reviewed at least annually", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party: they own the policy, oversee it, and may delegate duties. The Information Security Steering Committee approves the policy and reviews it at least annually. The Security Officer, or a designee, coordinates continuity activities. System and business owners support recovery of what they own. Engineering owns recovery of cloud infrastructure, production systems, and data, with guidance from the Security Officer. Management accepts significant continuity risks where appropriate."}, {"k": "three", "t": "4. Key terms", "items": [["user", "Accountable Party", "CEO, or Security Officer if absent"], ["users", "Alternate", "Covers a critical activity if needed"], ["list", "Continuity Register", "Critical services, owners, alternates"]], "n": "Section 4 defines three terms. The Accountable Party is the CEO or, in their absence, the Security Officer, who owns this policy. An alternate is a person who can perform or coordinate a critical activity when its owner is unavailable. The Business Continuity Register is a short table of critical services, their owners, their dependencies, and their alternates."}, {"k": "sec", "t": "5. Critical services", "items": ["Record each in the Continuity Register", "What the service is and who owns it", "What it depends on", "How long we can operate without it", "How it is restored, and its alternate"], "art": "Business Continuity Register", "cad": "Reviewed yearly and on change", "n": "Section 5 covers critical services. The Company identifies the systems and business activities important to continued operation and records them in the Business Continuity Register. For each critical service, the register records what the service is and who owns it, what it depends on, how long the Company can reasonably operate without it, and how it is restored or replaced, along with its alternate. Recovery time and recovery point objectives for critical systems are set and approved under the Data Retention, Disposal and Disaster Recovery Policy."}, {"k": "sec", "t": "6. People and key-person dependency", "items": ["Each critical activity has an owner", "And an alternate, where practical", "No alternate: runbooks, break-glass, support", "Material key-person risks: Risk Register", "CEO is alternate for the Security Officer"], "art": "Risk Register entry", "cad": "As needed", "n": "Section 6 deals with key-person dependency. Each critical activity has an identified owner and, where practical, an alternate who can perform or coordinate it. Where no practical alternate exists, the risk is reduced through documentation or runbooks, emergency break-glass access, external or vendor support, cross-training, or formal acceptance of the risk. Material key-person risks are recorded in the Risk Register. The CEO holds emergency break-glass access under the Access Control Policy and acts as alternate for the Security Officer."}, {"k": "flow", "t": "7. Responding to a disruption", "steps": [["eye", "Assess", "Understand the impact", "E9E3F5"], ["target", "Prioritize", "Critical customer and business services", "DDEBF7"], ["tool", "Recover", "Service, data, access, or capability", "F7EDC9"], ["mail", "Communicate", "Personnel, customers, vendors, others", "FBE5D6"], ["check", "Verify", "Service operating acceptably", "DCEFE2"], ["edit", "Record", "Significant issues and improvements", "E9E3F5"]], "banner": "Security-related disruptions are coordinated under the Incident Response Plan.", "n": "Section 7 sets the response. When a significant disruption occurs, the Company assesses the impact, prioritizes critical customer and business services, recovers the affected service, data, access, or capability, and communicates with affected personnel, customers, vendors, or other parties as appropriate. It then verifies the service is operating acceptably and records significant issues and improvements. Engineering restores systems and data under the Data Retention, Disposal and Disaster Recovery Policy and the Backup and Recovery Plan."}, {"k": "check", "t": "8. The annual walkthrough", "items": ["Who would respond", "Who can substitute for critical people", "Required access is available", "Contacts are current", "The register is current"], "big": "Yearly", "bigsub": "A representative disruption scenario", "n": "Section 8 covers testing. At least annually, the Company walks through a representative disruption scenario. The walkthrough confirms who would respond, who can substitute for critical personnel, that the required access is available, and that contacts and the Business Continuity Register are current. It may be combined with the annual incident response tabletop and the disaster recovery exercise under the Data Retention, Disposal and Disaster Recovery Policy."}, {"k": "sec", "t": "8. Issues and review", "items": ["Significant test issues tracked to resolution", "Arrangements reviewed at least annually", "Including the Continuity Register", "Also after significant changes", "A dated record is sufficient"], "art": "Dated review record", "cad": "Yearly and after significant change", "n": "Significant issues identified through testing are tracked to resolution. Business continuity arrangements, including the Business Continuity Register, are reviewed at least annually, and also after significant changes that affect the Company's ability to continue critical operations. The review does not need a heavy document. A dated record is sufficient."}, {"k": "sec", "t": "9. Exceptions", "items": ["When a requirement cannot reasonably be met", "Document the reason", "Document compensating measures", "Material exceptions: Exception Register"], "art": "Exception Register entry", "cad": "When an exception arises", "n": "Section 9 covers exceptions. Where a requirement of this policy cannot reasonably be met, the reason and the compensating measures are documented. Material exceptions are recorded in the Exception Register. That way we know where our continuity arrangements fall short and what we are doing instead."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "How often"], "rows": [["Business Continuity Register", "5", "Reviewed yearly and on significant change"], ["Key-person risk in the Risk Register", "6", "When a material risk is found"], ["Annual walkthrough", "8", "At least annually"], ["Test issues tracked to resolution", "8", "After each test"], ["Dated review of arrangements", "8", "Yearly and after significant change"], ["Exception Register entry", "9", "For material exceptions"]], "n": "Here are the records this policy produces. The Business Continuity Register lists critical services, owners, dependencies, and alternates, and is reviewed at least yearly and after significant change. Material key-person risks go in the Risk Register. The annual walkthrough is recorded, and significant issues from it are tracked to resolution. A dated record of the yearly review is enough. Material exceptions are recorded in the Exception Register."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz result recorded", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping PromptHalo keep critical work going, even when something or someone is unavailable. Let's move on to the questions."}]}, {"key": "bcplan", "title": "BC and DR Plan", "id": "PLN-BCP-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Assess, contact, recover, verify, record.", "slides": [{"k": "title", "t": "BC and DR Plan", "sub": "What to do when something important is down", "body": "Simple instructions for continuing or restoring PromptHalo's critical operations.", "meta": "PLN-BCP-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Business Continuity and Disaster Recovery Plan training. This Plan is owned by Engineering, with the CEO as business owner. It is a practical playbook: when to use it, who is in charge, what to recover first, the steps to follow, scenario playbooks, and how to return to normal. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Purpose", "items": [["server", "Customer services", "Keep or restore them"], ["db", "Data and access", "AWS, GitHub, Google Workspace, SaaS"], ["users", "People", "Someone else can act; we communicate"]], "banner": ["Implements:", "POL-BCP-001 and POL-DRD-001."], "n": "Section 1 sets the purpose. This Plan gives simple instructions for continuing or restoring PromptHalo's critical operations after a significant disruption. It implements the Business Continuity Policy and the Data Retention, Disposal and Disaster Recovery Policy. Recovery focuses on keeping or restoring customer services, recovering critical data and systems, keeping access to AWS, GitHub, Google Workspace, and other critical services, making sure another person can act when the owner is unavailable, and communicating with personnel and customers."}, {"k": "grid", "t": "2. When to use this Plan", "items": [["server", "Production", "Production or customer services"], ["db", "Data", "Critical Company or customer data"], ["globe", "Providers", "AWS, GitHub, Google, or critical SaaS"], ["user", "Access and people", "Critical access or key people missing"]], "n": "Section 2 says when to use the Plan: when a disruption materially affects, or is reasonably expected to affect, production or customer services; critical Company or customer data; AWS, GitHub, Google Workspace, or another critical third-party service; access to critical systems; or the availability of people needed to operate or recover critical services. Minor operational issues go through normal engineering and support processes. For security incidents, use this Plan together with the Incident Response Plan."}, {"k": "sec", "t": "3. Who is in charge", "items": ["First person aware notifies the owner", "CEO makes decisions and leads communication", "Security Officer coordinates security recovery", "Engineering leads technical recovery", "Owner unavailable: the alternate takes over"], "art": "Business Continuity Register", "cad": "Kept current", "n": "Section 3 sets who is in charge. The first person aware of a significant disruption notifies the technical or business owner. The CEO, or a designee, makes business decisions and leads customer and external communication. The Security Officer, or a designee, provides guidance and coordinates security-related recovery. Engineering owns and leads technical recovery of infrastructure, production systems, and data. If the normal owner is unavailable, the alternate or another authorized administrator takes over. Recovery must not wait for a specific person when another authorized person can act."}, {"k": "table", "t": "4. Critical services and priorities", "head": ["Priority", "Service (dependency)", "Recovery approach"], "rows": [["1", "Production service (AWS)", "Restore, redeploy, or rebuild with AWS"], ["1", "Production data (AWS)", "Backup, snapshot, or point-in-time recovery"], ["2", "Source code (GitHub)", "Provider recovery or a repository copy"], ["2", "Identity and admin access", "Alternate or break-glass admin access"], ["3", "Email and documents (Google)", "Provider recovery, export, other channel"], ["3", "Other critical SaaS", "Provider support or an alternative process"]], "n": "Section 4 sets the recovery order, unless circumstances require otherwise. Priority one is the production service and production data on AWS, restored, redeployed, or rebuilt, with data restored under the Backup and Recovery Plan. Priority two is source code on GitHub and identity and administrative access to AWS, GitHub, and Google. Priority three is Google Workspace email and documents and other critical SaaS. Safety, security, customer impact, and data integrity take priority over convenience. Owners and alternates are in the Business Continuity Register."}, {"k": "flow", "t": "5. Responding to a disruption", "steps": [["eye", "Assess", "What is down; customers, data, security", "E9E3F5"], ["phone", "Contact", "Owner, Security Officer, CEO", "DDEBF7"], ["tool", "Recover", "In Section 4 order, simplest method", "F7EDC9"], ["check", "Verify", "Service, data, access, security", "FBE5D6"], ["mail", "Communicate", "CEO informs affected customers", "DCEFE2"], ["edit", "Record", "What happened and follow-up", "E9E3F5"]], "banner": "Take necessary recovery action before spending time on documentation.", "n": "Section 5 gives the steps. Assess what happened, what is unavailable, whether customers or data are affected, whether it is a security incident, and whether the owner is available. Contact the technical owner, Security Officer, and CEO as appropriate, using phone or text if email or chat is down. Prioritize in the Section 4 order and recover using the simplest appropriate mechanism. Verify service, data, access, and security. The CEO, or a designee, informs customers when services are materially affected. Then record what happened."}, {"k": "table", "t": "6. Recovery playbooks: platforms", "head": ["Scenario", "Key actions"], "rows": [["AWS or production failure", "Check status; find cause; redeploy or restore"], ["Data loss or corruption", "Stop damage; restore last good state; validate"], ["GitHub unavailable", "Work locally; resync when service returns"], ["Google Workspace unavailable", "Use phone or text; no personal services"]], "n": "Section 6 gives playbooks. For an AWS or production failure, identify the service, check AWS status and monitoring, decide whose cause it is, redeploy or restore, then verify. For data loss or corruption, stop further damage, find the last known good state and matching backup, restore into a safe environment where practical, and validate before restoring production. If GitHub is down, work locally and resynchronize later. If Google Workspace is down, coordinate by phone or text, and never move Company information into personal services."}, {"k": "table", "t": "6. Recovery playbooks: people and security", "head": ["Scenario", "Key actions"], "rows": [["Critical SaaS unavailable", "Check status; contact support; workaround"], ["Critical person unavailable", "Alternate, emergency access, runbooks"], ["Security event", "Also activate the Incident Response Plan"]], "n": "If a critical SaaS provider is unavailable, confirm its status and the impact, contact provider support, use a reasonable workaround, and tell affected parties about material impact. If a critical person is unavailable, contact the alternate, use emergency administrative access if needed, rely on documentation, repositories, runbooks, or vendor support, and record a significant key-person gap as a risk. For a security event, also activate the Incident Response Plan, and do not restore compromised systems blindly."}, {"k": "check", "t": "7. Verify before declaring recovery", "items": ["Production and critical functions work", "Required admin access works", "Data available, accurate, and complete", "Security controls and monitoring running", "Customer impact ended; stakeholders told"], "big": "Verify", "bigsub": "Before declaring recovery complete", "n": "Section 7. Before declaring recovery complete, confirm, as applicable, that the production service and critical functionality work, that required administrative access works, that critical data is available, accurate, and complete, that security controls and monitoring are operating, and that customer impact has ended or is understood and stakeholders are informed."}, {"k": "sec", "t": "7 and 8. Return to normal and record", "items": ["Remove temporary workarounds", "Secure any emergency access used", "Tell personnel operations have resumed", "Record date, service, impact, and actions", "Record data loss and follow-up needed"], "art": "Incident ticket, Jira ticket, or email", "cad": "After each significant disruption", "n": "Once services are stable, remove temporary workarounds that are no longer needed, secure any emergency access that was used, tell personnel normal operations have resumed, and record remaining issues. Section 8: for a significant disruption, record the date, the service affected, what happened, the business and customer impact, the recovery actions, when recovery was completed, any data loss, and follow-up required. An existing incident ticket, Jira ticket, or email may serve as this record."}, {"k": "table", "t": "9. Contacts and providers", "head": ["Provider", "Purpose", "Owner"], "rows": [["AWS", "Production and cloud infrastructure", "Engineering"], ["GitHub", "Source code and development", "Engineering"], ["Google Workspace", "Email and documents", "Administration"], ["Jira", "Ticketing and backup alerts", "Engineering"]], "n": "Section 9 holds the emergency contacts, including a phone number that works when email is down. For security, the primary is the Security Officer with the CEO as alternate, at security at prompthalo dot ai. Contacts for business, engineering and AWS, GitHub administration, and Google administration are filled in on the table. During a provider outage, use the provider's status page and support channel. The critical providers are AWS, GitHub, Google Workspace, and Jira."}, {"k": "sec", "t": "10. Testing and maintenance", "items": ["Engineering runs the yearly recovery test", "Recorded under PLN-BKP-001", "May demonstrate emergency admin access", "Can share the incident response tabletop", "Plan reviewed yearly and on change"], "art": "Recovery test record (PLN-BKP-001)", "cad": "At least annually", "n": "Section 10. At least annually, Engineering performs the recovery test required by the Backup and Recovery Plan and records it there, and demonstrating emergency administrative access may be part of it. The recovery test and continuity walkthrough may run in the same exercise as the annual incident response tabletop. Engineering reviews this Plan at least annually, with guidance from the Security Officer, and updates it when critical systems, providers, recovery methods, or key personnel change, or when testing finds a significant gap."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "How often"], "rows": [["Disruption record (ticket or email)", "8", "Each significant disruption"], ["Key-person gap recorded as a risk", "6", "When the gap is significant"], ["Contacts and providers tables", "9", "Kept current"], ["Recovery test record", "10", "At least annually"], ["Plan review and update", "10", "Yearly and on significant change"]], "n": "Here are the records this Plan produces. Each significant disruption gets a record, and an existing incident ticket, Jira ticket, or email is fine. A significant key-person gap is recorded as a risk. The contact and provider tables are kept current. The annual recovery test is recorded under the Backup and Recovery Plan. And the Plan itself is reviewed at least annually and updated when systems, providers, methods, or people change."}, {"k": "sign", "t": "Acknowledge this plan", "items": ["Name, version, date", "Quiz result recorded", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this Plan when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping PromptHalo recover quickly when something important goes down. Let's move on to the questions."}]}, {"key": "cm", "title": "Change Management", "id": "POL-CM-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Test, review, approve, then deploy.", "slides": [{"k": "title", "t": "Change Management", "sub": "Tested, reviewed, approved, traceable", "body": "How changes reach PromptHalo production safely, with proof of every step.", "meta": "POL-CM-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Change Management Policy training. This walkthrough covers what the policy applies to, how changes are developed and tested, how we classify risk, who reviews and approves, how we deploy and validate, how emergency changes work, and what records we keep. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1 and 2. Why and what it covers", "items": [["target", "Purpose", "Authorized, tested, reviewed, traceable"], ["server", "In scope", "Apps, infra, security config, AI, IaC"], ["doc", "Not in scope", "Content edits; baseline config"]], "banner": ["Proportionate:", "testing and approval match the risk and impact."], "n": "Section 1 sets the purpose. Changes to Company systems must be authorized, tested, reviewed, and traceable before they reach production, to reduce the risk of security issues, outages, or unintended impact. Testing and approval are proportionate to risk. Section 2 sets the scope: production applications, infrastructure, security configurations, AI models, guardrails, and other material configuration, including infrastructure defined as code. Routine content edits that do not change how a system behaves, and configuration fixed as a baseline by the Cloud Platform Standard, are not covered."}, {"k": "grid", "t": "3. Roles", "items": [["user", "Accountable Party", "CEO, or the Security Officer"], ["users", "Steering Committee", "Approves; reviews at least yearly"], ["edit", "Anyone", "May propose a change"], ["check", "Engineering", "Approves; never the author"]], "n": "Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party: they own the policy and may delegate duties. The Information Security Steering Committee approves the policy and reviews it at least annually. Anyone may propose a change. Every production change is reviewed and approved by an Engineering team member other than the author, typically the Engineering Lead or a delegate. If only one person can review a change, the CEO or delegate records that fact and the compensating check applied."}, {"k": "sec", "t": "5. Development and testing", "items": ["Use source control and the deployment process", "Document through commits and pull requests", "Develop and test before production", "Separate from production where practical", "Pass applicable testing before approval"], "art": "Commits, pull requests, test results", "cad": "Every change", "n": "Section 5 covers development and testing. In-scope changes must go through the Company's source-control and deployment processes and be documented through commits and pull requests. Changes must be developed and tested before production, separately from production where technically practical. A change must pass applicable testing before it is approved. Testing should be proportionate to risk and may include automated CI/CD tests, unit and integration tests, security scanning, code review, functional testing, manual validation, and deployment or configuration validation."}, {"k": "sec", "t": "6. Environment segregation", "items": ["Production logically separate from dev and test", "Production access only where the job needs it", "Change through source control and CI/CD", "Direct console changes are emergency changes", "No separate environments: compensating controls"], "art": "Access records and pipeline settings", "cad": "Ongoing", "n": "Section 6 covers segregation. Production must be logically separated from development and test environments where applicable, and production access is limited to people who need it for their job, under the Access Control Policy. Production changes should go through the approved source-control and CI/CD process, not directly into production. A direct console or manual change to production is treated as an emergency change. Where separate environments are not practical, separation comes from logical access controls, source control, peer review, automated testing, and deployment controls."}, {"k": "sec", "t": "7. Classifying change risk", "items": ["Every production change: low or high risk", "Author proposes it in the pull request", "Approver confirms it", "When in doubt, it is high risk", "Templates, CODEOWNERS and CI labels help"], "art": "Risk class recorded in the pull request", "cad": "Every production change", "n": "Section 7 requires every production change to be classified as low or high risk. The author proposes the classification in the pull request and the approver confirms it. When in doubt, the change is high risk. Automated controls should support this where practical: a pull request template with the questions, GitHub CODEOWNERS rules requiring Engineering Lead review for sensitive paths such as infrastructure, IAM, authentication, and AI configuration, and CI labels when those paths change. AI-assisted threat modeling may support review, but does not replace the approver's judgment."}, {"k": "table", "t": "7. Any yes makes a change high risk", "head": ["Question", "Examples"], "rows": [["Who can access what?", "IAM, authentication, roles, API keys"], ["Secrets or encryption?", "Keys, certificates, secrets storage"], ["Customer data handling?", "Schema migrations, exports, new data flows"], ["Network exposure?", "Security groups, endpoints, DNS, firewalls"], ["AI behavior or permissions?", "Models, guardrails, tools, agent permissions"], ["Monitoring or recovery?", "Logging, alerting, backup, retention"], ["New third party or major upgrade?", "New vendor, SaaS integration, major version"], ["Hard to roll back, or outage risk?", "Destructive migrations, infra deletion"]], "n": "A change is high risk if any of these eight questions is answered yes. Does it change who can access what? Does it touch secrets or encryption? Does it change how customer data is stored, processed, or shared? Does it change network exposure? Does it change AI behavior or permissions, such as models, guardrails, tool definitions, or retrieval sources? Does it change security monitoring or recovery? Does it add a new third party or a major dependency upgrade? Is it hard to roll back, or could it cause an outage?"}, {"k": "table", "t": "7. Low risk versus high risk", "head": ["", "Low risk", "High risk"], "rows": [["Examples", "Docs, tests, formatting, UI text", "Any yes to the eight questions"], ["Review and approval", "One approver under Section 8", "Approver; security and rollback recorded"], ["Testing", "Automated checks pass", "Automated checks plus fitting tests"], ["Security Officer", "Not required", "Informed before deployment"]], "n": "Everything else is low risk: documentation, tests, formatting, refactoring with no change in behavior, user interface text, and minor dependency updates that pass all automated checks. A low-risk change needs one approver under Section 8 and passing automated checks. A high-risk change also needs its security impact and rollback considered and recorded in the pull request, testing appropriate to the change on top of automated checks, and the Security Officer or a delegate informed before deployment and consulted on request."}, {"k": "sec", "t": "8. Review and approval", "items": ["Approve every production change before deploy", "Never approved by the author", "Engineering Lead or a written delegate", "Approvers named in STD-SOD-001", "GitHub or ticket approval is the record"], "art": "Pull request approval", "cad": "Before every production deployment", "n": "Section 8 says every production change must be reviewed and approved before deployment, through a GitHub pull request or equivalent change record. Only an authorized approver may approve, and never the author. Approvers are the Engineering Lead for the product, or a delegate on the AI and back-end engineering team designated in writing. The named approvers are listed in the Segregation of Duties Standard, STD-SOD-001. The reviewer confirms, as applicable, the purpose, passing tests, security impact, production readiness, and rollback or recovery."}, {"k": "flow", "t": "8. The normal change path", "steps": [["edit", "Propose", "Change opened as a pull request", "E9E3F5"], ["tool", "Test", "Automated tests and security checks", "DDEBF7"], ["eye", "Review", "Independent reviewer", "F7EDC9"], ["check", "Approve", "Authorized approver, not the author", "FBE5D6"], ["send", "Deploy", "Through CI/CD", "DCEFE2"], ["ok", "Validate", "Confirm it works in production", "DCEFE2"]], "banner": "Protected branches and CI/CD permissions should enforce this flow.", "n": "This is the standard production change flow from Section 8. The change is opened as a pull request. Automated tests and security checks run. An independent reviewer reviews it, and an authorized approver, never the author, approves it. It is deployed through CI/CD, and then validated in production. Protected branches and CI/CD permissions should enforce this flow, so that a change cannot skip a step."}, {"k": "table", "t": "9. Change roles", "head": ["Role", "Responsibility", "Deploys to production"], "rows": [["Developer", "Develops, tests, opens the pull request", "Only if specifically authorized"], ["Reviewer", "Independent review of the change", "Not required"], ["Approver", "Engineering Lead or delegate, not author", "May deploy if authorized"], ["Deployer", "Executes or authorizes deployment", "Yes"], ["Administrator", "Maintains CI/CD and production access", "Yes, as authorized"], ["Emergency Approver", "Approves after deploy, normally in 15 days", "As authorized"]], "n": "Section 9 requires a maintained list of people authorized to develop, review, approve, and deploy production changes. One person may hold more than one role, but material production changes must still receive independent review before deployment. The developer builds and tests the change and creates the pull request. The reviewer reviews it. The approver approves it. The deployer executes or authorizes deployment. The administrator maintains CI/CD and production access. The emergency approver approves emergency changes after deployment, normally within 15 days."}, {"k": "sec", "t": "10. Authorized production deployers", "items": ["Only authorized people or CI/CD accounts deploy", "Keep a list of deployers and service accounts", "Name, role, method, and who approved", "Reviewed with periodic access reviews", "Removed when no longer required"], "art": "Authorized deployer list", "cad": "With periodic access reviews", "n": "Section 10 says only authorized personnel or approved automated CI/CD service accounts may deploy to production. The Company must keep a list of those people and service accounts, showing the name, role, environment, access or deployment method, such as CI/CD or AWS, and who approved it. Production deployment access is reviewed along with the periodic access reviews under the Access Control Policy, and removed when it is no longer required."}, {"k": "sec", "t": "11. Production validation", "items": ["Deployment completed successfully", "Affected service works as expected", "No material
