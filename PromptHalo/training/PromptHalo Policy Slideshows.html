 unexpected issue", "Significant issue: roll back, fix, or recover"], "art": "Deployment result in CI/CD records", "cad": "After every deployment", "n": "Section 11 covers validation. After deployment, the change must be validated to confirm that the deployment completed successfully, that the affected service is functioning as expected, and that no material unexpected issue was introduced. If a deployment causes a significant issue, the change must be rolled back, corrected, or recovered through the applicable operational or incident response process."}, {"k": "flow", "t": "12. The emergency change path", "steps": [["alert", "Urgent issue", "Incident, outage, or vulnerability", "F7DEDE"], ["tool", "Fix", "Documented and tested as practical", "F7EDC9"], ["eye", "Review", "Another Engineering team member", "FBE5D6"], ["send", "Deploy", "Without waiting for formal approval", "DDEBF7"], ["check", "Approve after", "Normally within 15 days", "DCEFE2"], ["edit", "Codify", "Hand changes reflected in code", "E9E3F5"]], "banner": "Review comes before release. Formal approval comes afterward.", "n": "Section 12 covers emergency changes. When a security incident, outage, critical vulnerability, or other urgent issue needs a fix, the change is documented and tested to the extent practical. It must be reviewed by another Engineering team member before release, and can then be deployed without waiting for formal approval. Approval under Section 8 follows after deployment, normally within 15 days. Any change made by hand must be reflected back into code."}, {"k": "sec", "t": "12. Emergency change rules", "items": ["Reviewed by another engineer before release", "Documented and tested as far as practical", "Approved under Section 8 after deployment", "Normally within 15 days", "Late: record the reason, approve soon"], "art": "Change record with after-the-fact approval", "cad": "Approval normally within 15 days", "n": "Emergency changes still leave a trail. Each one is reviewed by another Engineering team member before release, documented, and tested to the extent practical. Each one must then be approved under Section 8 after deployment, normally within 15 days. If approval cannot be obtained within 15 days, the reason must be recorded in the change record and approval obtained as soon as practical. Remember that a direct console or manual change to production counts as an emergency change."}, {"k": "check", "t": "13. What every change record shows", "items": ["What changed, and who made it", "Testing or automated test results", "Who reviewed, approved, and when", "When deployed, and by whom or what", "Whether the deployment succeeded"], "big": "Pull request", "bigsub": "With CI/CD records, it is the primary evidence", "n": "Section 13 says documentation must show the testing and approval of every production change, including emergency changes. Records stay in the systems we use to develop and deploy. The pull request and its CI/CD records are the primary evidence and need not be copied into a separate ticket. Emergency changes are documented in the development, deployment, or incident system. Each record shows what changed, who made it, testing, who reviewed and approved it and when, when and by whom or what it was deployed, and whether it succeeded."}, {"k": "sec", "t": "13 and 14. Population and exceptions", "items": ["Export all production deployments when needed", "Exceptions: emergencies, no second reviewer", "Accountable Party approves material ones", "Logged in the Exception Register", "Record the compensating measure"], "art": "Exception Register entry", "cad": "When an exception is approved", "n": "A complete population of production deployments must be exportable from these systems when needed. Section 14 covers exceptions. Exceptions to the normal change process may be permitted for emergencies, or where standard segregation is not practical, such as a change with no available second reviewer. The Accountable Party must approve material exceptions and record them in the Exception Register with the compensating measure."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "When"], "rows": [["Pull request with risk class", "5, 7", "Every production change"], ["Test results and security checks", "5, 13", "Before approval"], ["Pull request approval", "8", "Before deployment"], ["CI/CD deployment and result", "11, 13", "Every deployment"], ["Emergency change approval", "12", "Normally within 15 days"], ["Single reviewer note", "3", "When only one can review"], ["Authorized deployer list", "9, 10", "With access reviews"], ["Exception Register entry", "14", "When approved"]], "n": "Here are the records this policy produces. Each production change has a pull request with its risk classification, test results and security checks, and an approval before deployment. CI/CD records show each deployment and whether it succeeded. Emergency changes get their approval afterward, normally within 15 days. When only one person can review, the CEO or delegate records the compensating check. The authorized role and deployer list is reviewed with access reviews, and exceptions are logged in the Exception Register."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I follow the change process", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping every production change tested, reviewed, and traceable. Let's move on to the questions."}]}, {"key": "cvd", "title": "Coordinated Vulnerability Disclosure", "id": "POL-CVD-001", "version": "1.0", "date": "September 2, 2026", "blurb": "Report it, triage honestly, fix, then disclose.", "slides": [{"k": "title", "t": "Coordinated Vulnerability Disclosure", "sub": "Easy to report, honest to triage, public credit", "body": "How researchers report vulnerabilities to PromptHalo and what we commit to in return.", "meta": "POL-CVD-001, version 1.0, September 2, 2026", "n": "Welcome to PromptHalo's Coordinated Vulnerability Disclosure Policy training. This is a public document, so everything in it is a promise we make to the outside world. It covers what is in scope, the safe harbor for good-faith research, how to report, how we score severity, AI-specific findings, disclosure timing, and recognition. You can pause or skip ahead at any time. At the end, you will answer short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["shield", "Our credibility", "We build security testing tools"], ["mail", "Easy reporting", "Researchers can tell us of our own flaws"], ["check", "Good faith", "Protections for research done in good faith"]], "banner": ["Not a bug bounty:", "a coordinated disclosure policy (see section 9)."], "n": "Section 1 sets the purpose. PromptHalo builds security testing tools, and it would be incoherent to run an adversarial testing platform while making it hard for researchers to tell us when we have a problem of our own. The policy sets out how to report a vulnerability in a PromptHalo product or system, what we commit to in return, and the protections for research conducted in good faith. It is a coordinated vulnerability disclosure policy, not a bug bounty program. The Security Officer owns it."}, {"k": "sec", "t": "2. Scope: what is in scope", "items": ["Any system PromptHalo operates or controls", "The PromptHalo platform and its API", "prompthalo.ai, the Trust Center, our web sites", "Our client libraries, agents, and integrations", "Cloud infrastructure reachable from the internet"], "art": "None specified", "cad": "As needed", "n": "Section 2 sets the scope. Any system PromptHalo operates or controls is in scope. That means the PromptHalo platform and its API; prompthalo.ai, the Trust Center, and other PromptHalo-operated web properties; the client libraries, agents, and integrations we publish; and our cloud infrastructure, insofar as it is reachable from the internet."}, {"k": "grid", "t": "2. Scope: what is out of scope", "items": [["target", "Customer targets", "Systems customers point the platform at"], ["link", "Third parties", "Subprocessors and providers: own programs"], ["users", "People and places", "No social engineering or physical attacks"], ["alert", "Denial of service", "No volumetric testing of any kind"]], "n": "Some things are not ours to authorize testing against, and reports about them should go to the party that owns them. Systems our customers point the platform at belong to those customers, and we cannot grant permission to test them. Our subprocessors, cloud, identity, and model providers have their own disclosure programs; the current list is in the Subprocessors section of the Trust Center. Social engineering of staff, customers, or vendors, physical attacks against our offices or personnel, and denial-of-service or volumetric testing of any kind are all out of scope."}, {"k": "check", "t": "2. Not accepted without real impact", "items": ["Missing security headers", "Weak TLS ciphers, no exploit path", "Self-XSS", "Clickjacking, no sensitive action", "Unverified automated scanner output"], "big": "Show impact", "bigsub": "Rate-limit notes need an attack they enable", "n": "Section 2 also lists findings that are generally not accepted without a demonstrated security impact. These are missing security headers, weak TLS ciphers with no exploit path, self cross-site scripting, clickjacking on pages with no sensitive action, output from an automated scanner with no verification, and rate-limiting observations that are not accompanied by an attack they enable. The common thread is impact: show what an attacker can actually do."}, {"k": "sec", "t": "3. Safe harbor: what good faith means", "items": ["Touch only what proves the issue", "Personal data or credentials: stop at once", "Never degrade or disrupt any service", "No pivoting once impact is shown", "Allow time to fix before going public"], "art": "None specified", "cad": "For every piece of research", "n": "Section 3 defines good faith concretely. Access, modify, and retain only what is necessary to demonstrate the issue: one record is proof, a thousand is exfiltration. If you meet personal data, customer content, or credentials, stop immediately, do not save or transmit it, and tell us in general terms what you found. Do not degrade or disrupt any service. Do not pivot further once impact is established. Give us reasonable time to remediate before disclosing publicly. Safe harbor does not cover activity that breaks the law independently of this policy, or research on out-of-scope assets, and the policy cannot bind third parties."}, {"k": "sec", "t": "4. How to report", "items": ["Email security@prompthalo.ai", "Contacts in /.well-known/security.txt", "Encryption welcome: PGP key in security.txt", "Anonymous is allowed: no follow-up or credit", "No public issue, social post, or broker first"], "art": "Report email to security@prompthalo.ai", "cad": "When a vulnerability is found", "n": "Section 4 explains how to report. Researchers email security@prompthalo.ai, and machine-readable contact details are published at prompthalo.ai, slash dot well-known, slash security.txt. Encrypted reports are welcome using the PGP key referenced in security.txt. Reporting anonymously is allowed; it only means we cannot follow up or give credit. We ask researchers not to open a public issue, post to social media, or file through a broker before contacting us. Section 10 gives our postal address in Frisco, Texas."}, {"k": "check", "t": "4. What a useful report includes", "items": ["Affected asset, URL, or component", "Type, and a CVSS v3.1 vector if any", "Steps to reproduce without guessing", "Proof of impact", "Prerequisites and credit preference"], "big": "Reproducible", "bigsub": "Enough detail to follow without guessing", "n": "A useful report includes the affected asset, URL, endpoint, or component; the vulnerability type and, if the researcher has one, a CVSS version 3.1 vector; steps to reproduce in enough detail that we can follow them without guessing; proof of impact, such as a screenshot, a request and response pair, or a short video; any prerequisites, such as authentication, role, tenant, or timing; and how the researcher would like to be credited, if at all."}, {"k": "sec", "t": "5 and 6. Commitments and severity", "items": ["Commitments, not aspirations", "Missing one? Tell the reporter beforehand", "Score with CVSS v3.1, adjusted for us", "Explain any score that differs from theirs", "Exploitable critical: clock starts at triage"], "art": "Severity reasoning sent to the reporter", "cad": "At triage of each report", "n": "Section 5 says our commitments are commitments, not aspirations. If we are going to miss one, we tell the researcher before the deadline rather than after it. Section 6 sets severity. We score with CVSS version 3.1 and adjust for exploitability in our environment and for blast radius across tenants. Where our assessment differs from the researcher's, we explain the reasoning rather than simply reassigning the number. A critical finding that is actively exploitable takes precedence over planned work, and the clock starts at triage, not at the next sprint boundary."}, {"k": "two", "t": "6. Severity follows attack graphs", "items": [["alert", "Scored up", ["Paths, not standalone CVEs", "Medium to Critical on key paths", "Chains scored as one path"]], ["eye", "Scored down", ["High score not reachable here", "Upstream control holds", "We name the control we rely on"]]], "n": "Severity is assessed against attack graphs, not standalone CVEs. We look at what a finding is reachable from and to, the preconditions an attacker must hold, the trust boundaries it crosses, and what the next step becomes. A Medium finding is treated as Critical where it closes a path to cross-tenant access, credential or token material, or an agent's tool and data permissions. Chains are scored as chains, not by the weakest link. In reverse, where a high base score is not reachable because an upstream control holds, we lower the severity and name that control so the researcher can tell us if we are wrong."}, {"k": "two", "t": "7. AI-specific findings", "items": [["shield", "In scope", ["Injection crossing a trust boundary", "Jailbreak of a control we assert", "Test data to a model provider"]], ["mic", "Not a vulnerability", ["Objectionable or inaccurate text", "No security consequence", "Handled as a quality issue"]]], "n": "Section 7 covers AI-specific findings. In scope: prompt injection that crosses a trust boundary, making the platform act outside a customer's authorized test scope, leak another tenant's data, or exfiltrate credentials or system prompts with security value. Also jailbreaks that defeat a control we assert publicly, and any path by which test data reaches a model provider contrary to our stated terms. Eliciting objectionable, inaccurate, or off-policy text with no security consequence is a quality issue, not a security finding. The dividing line is whether the behavior breaches a security boundary or a promise we make on the Trust Center."}, {"k": "flow", "t": "8. Coordinated disclosure", "steps": [["list", "Triage", "The 90-day clock starts", "E9E3F5"], ["tool", "Remediate", "Fix on our published timelines", "F7EDC9"], ["send", "Publish", "At 90 days or when the fix ships", "DDEBF7"], ["mail", "Notify", "Advisory and account admins", "FBE5D6"], ["flag", "Credit", "CVE where warranted; reporter named", "DCEFE2"]], "banner": "Extension past 90 days: only when needed, explained, with a date. Silence is not consent.", "n": "Section 8 sets disclosure. Our default is publication at 90 days from triage, or on the day a fix ships, whichever comes first. We ask to extend only where remediation genuinely requires it, such as a coordinated third-party fix, and we explain why, propose a date, and never treat silence as consent. Advisories go in the Trust Center Advisories section and to affected account administrators, we request a CVE where warranted, and reporters are credited unless they ask otherwise. If we cannot reproduce an issue or accept the risk, we say so plainly; the researcher remains free to publish."}, {"k": "sec", "t": "9. Recognition", "items": ["No paid bug bounty today", "Fast acknowledgement and honest triage", "Remediation on published timelines", "Credit in the advisory and acknowledgements", "A paid program is announced here first"], "art": "Advisory credit and acknowledgements list", "cad": "When a report leads to a fix", "n": "Section 9 covers recognition. PromptHalo does not currently operate a paid bug bounty. We are a small company and would rather promise what we can deliver: fast acknowledgement, honest triage, remediation on published timelines, and public credit. Researchers whose reports lead to a fix are credited in the resulting advisory and listed in our acknowledgements. If we ever introduce a paid program, it will be announced in this policy first."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "When"], "rows": [["Report received at security@", "4", "On each report"], ["Severity reasoning to reporter", "6", "At triage"], ["Extension request with a date", "8", "Only if past 90 days"], ["Advisory on the Trust Center", "8", "At 90 days or when fixed"], ["CVE request", "8", "Where a finding warrants one"], ["Acknowledgements entry", "9", "When a report leads to a fix"]], "n": "Here are the records this policy produces. Each report arrives at security@prompthalo.ai. At triage, we send the reporter our severity reasoning wherever it differs from theirs. If remediation needs more than 90 days, we send an extension request that explains why and proposes a date. Advisories are published on the Trust Center at 90 days or when the fix ships. We request a CVE where a finding warrants one, and researchers whose reports lead to a fix are added to our acknowledgements."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass", "Reports go to security@prompthalo.ai"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Remember that this policy is public: researchers will hold us to every commitment in it. Thank you for helping us keep those promises. Let's move on to the questions."}]}, {"key": "dcl", "title": "Data Classification", "id": "POL-DCL-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Classify it, store it right, share it right.", "slides": [{"k": "title", "t": "Data Classification", "sub": "Three labels everything else relies on", "body": "How we classify information so it gets the right protection.", "meta": "POL-DCL-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Data Classification Policy training. This policy sets three classifications: Public, Internal, and Confidential. Other policies rely on these classifications to decide how information is stored, shared, and disposed of. You can pause, rewind, speed up, or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["shield", "Protection", "Matched to how sensitive it is"], ["list", "One framework", "Other policies point here"], ["check", "Simple", "Three classes, few labels"]], "banner": ["Purpose:", "protect information according to its sensitivity."], "n": "Section 1 states the purpose. The policy establishes PromptHalo's data classification framework so that information is protected according to its sensitivity. It is deliberately simple: three classifications, labels only where they matter, and one handling matrix in Appendix A that says how each classification is stored, shared, encrypted, and disposed of."}, {"k": "grid", "t": "2. Who and what it covers", "items": [["doc", "All information", "Company and client, any form"], ["server", "Cloud services", "Wherever it is held"], ["edit", "Code and documents", "Repositories and files"], ["mail", "Messages", "Covered as well"]], "n": "Section 2 sets the scope. The policy covers all Company and client information in any form. It applies wherever that information is held: in cloud services, in code repositories, in documents, and in messages. If information belongs to PromptHalo or to a client, this policy decides how it is classified and handled, no matter where it sits."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Steering Committee approves, reviews yearly", "Creator or receiver classifies", "Unclear client information: Confidential", "Unclear Company information: Internal"], "art": "Dated approval record for this policy", "cad": "Reviewed at least annually", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy and may delegate duties. The Information Security Steering Committee, which today is the CEO, approves it and reviews it at least annually. The person who creates or receives information classifies it. If unclear, client information is treated as Confidential and Company information as Internal until the Accountable Party decides. No owner is assigned to individual files."}, {"k": "three", "t": "5. The three classifications", "items": [["globe", "Public", "Approved for publication"], ["doc", "Internal", "Working information; most data"], ["lock", "Confidential", "Disclosure harms us or a client"]], "banner": ["Handling:", "follow the matrix in Appendix A."], "n": "Section 5 sets the three classifications. Personnel classify information as Public, Internal, or Confidential. Public information is approved for publication. Internal is the Company's own working information, and most information is Internal. Confidential is information whose disclosure would harm the Company or a client. Information must be stored, accessed, transmitted, retained, and disposed of according to the Data Classification and Handling Matrix in Appendix A."}, {"k": "two", "t": "5. Public and Internal in detail", "items": [["globe", "Public", ["Accountable Party approves", "Reviewed before each release", "Accuracy over completeness"]], ["doc", "Internal", ["Personnel and authorized users", "Embarrassing, not harmful", "Most information is Internal"]]], "n": "Public information includes the website, published marketing material, public documentation, and the PromptHalo Trust Center. No special handling applies. The Accountable Party approves publication, and the document is reviewed before each release. Once published, it is a statement we can be held to, so accuracy matters more than completeness. Internal information covers procedures, routine communications, documentation, plans, and drafts. Access is limited to personnel and authorized users, and disclosure would be embarrassing rather than harmful."}, {"k": "check", "t": "5. What counts as Confidential", "items": ["Customer data", "Credentials and secrets", "Source code and security information", "Contracts, deliverables, financials", "Personnel information"], "big": "Need-to-know", "bigsub": "Through approved systems, encrypted where appropriate", "n": "Confidential information includes customer data, credentials and secrets, source code, and security information, including client security findings and assessment evidence. It also includes contracts and commercial terms, client deliverables, financial information, personnel information, and anything designated confidential by contract or by the Company. Access is on a need-to-know basis, through approved Company systems, with encryption where appropriate."}, {"k": "flow", "t": "How to classify information", "steps": [["globe", "Published?", "Approved for publication: Public", "DCEFE2"], ["lock", "Harmful?", "Disclosure harms: Confidential", "F7DEDE"], ["doc", "Otherwise", "Working information: Internal", "F7EDC9"], ["alert", "Not sure?", "Client: Confidential. Ours: Internal"]], "banner": "The Accountable Party decides any case that stays unclear.", "n": "Here is a simple way to apply Sections 3 and 5. First ask whether the information is approved for publication. If yes, it is Public. If not, ask whether disclosing it would harm the Company or a client. If yes, it is Confidential. Otherwise it is Internal working information. If you are not sure, treat client information as Confidential and Company information as Internal, until the Accountable Party decides."}, {"k": "sec", "t": "6. Handling: where it lives", "items": ["Approved: Workspace, GitHub, AWS", "No personal email or cloud, unless approved", "Confidential: share via Company systems", "Internal: authorized recipients only", "Business-need sharing needs no approval"], "art": "Appendix B system list", "cad": "Ongoing", "n": "Section 6 covers handling. Internal and Confidential information is held in approved Company systems: Google Workspace, GitHub, and AWS. It must not be sent to personal email or held in personal cloud storage unless the CEO or the CEO's delegate approves. Confidential information must be shared through Company systems rather than as an email attachment. Internal information should be shared only with authorized recipients using approved methods. Sharing Confidential information with an authorized recipient who has a business need needs no separate approval."}, {"k": "sec", "t": "6. Handling: Confidential limits", "items": ["No unencrypted channels", "No personal accounts or personal AI tools", "No removable media", "Local copies only on AUP-compliant devices", "Client data never in personal AI tools"], "art": "Device requirements in POL-AUP-001", "cad": "Ongoing", "n": "Confidential information must not be transmitted over unencrypted channels, held in personal accounts or personal AI tools, or placed on removable media. It is accessed through approved Company systems and is not stored locally, except on devices that meet the device requirements in the Acceptable Use Policy. Client information of any classification is never entered into a personal AI tool, as set out in Section 11 of the Code of Conduct."}, {"k": "sec", "t": "6. Handling: labels and systems", "items": ["Each system classified once, with an owner", "Content inherits the system's class", "Label only Confidential locations", "Unlabeled: takes the system's class", "Customer data is always Confidential"], "art": "Confidential labels on drives and folders", "cad": "When a location is created", "n": "Each Company system is classified once, with an owner, in Appendix B, and content inherits the classification of the system that holds it. No separate classification register is kept. Only Confidential information is labeled, and the label goes on the location: a shared drive, a folder, or a note in a repository README. Everything in a location marked Confidential is Confidential. Individual documents and messages need no labels. Customer data is Confidential whether or not it is labeled."}, {"k": "sec", "t": "6. Client terms and retention", "items": ["Stricter client terms take precedence", "Client agreements, NDAs, and DPAs", "Confidential retained per POL-DRD-001", "Appendix A sets storage and sharing", "Unlisted system: use the closest rule"], "art": "Client handling requirements", "cad": "At contract signing or change", "n": "Client information is classified and handled according to the confidentiality requirements in client agreements, NDAs, DPAs, or other agreements, wherever those are stricter than ours. Confidential information is retained according to POL-DRD-001, the Data Retention, Disposal and Disaster Recovery Policy, and its retention schedule. Appendix A sets where each classification may be stored and how it is shared, encrypted, and disposed of. If a system is not listed, apply the closest listed rule and ask the Security Officer if unsure."}, {"k": "two", "t": "7. Changing a classification", "items": [["edit", "Reclassify when", ["Sensitivity changes", "Business use changes", "Contract terms change"]], ["lock", "Downgrade with care", ["Only when no longer Confidential", "Client agreements still apply", "Accountable Party decides doubts"]]], "n": "Section 7 covers changes. Information may be reclassified when its sensitivity, business use, or contractual requirements change. Confidential information may be downgraded only when it no longer requires Confidential protection. Client information always remains subject to the applicable client agreements. Where a classification is unclear, Section 3 says the Accountable Party decides."}, {"k": "three", "t": "8. Sharing information", "items": [["globe", "Public", "Share without restriction"], ["doc", "Internal", "External with a business need"], ["lock", "Confidential", "Authorized, need, and NDA or contract"]], "banner": ["Trust Center:", "documents may be shared there where appropriate."], "n": "Section 8 covers sharing. Public information may be shared without restriction. Internal information may be shared externally when there is a legitimate business need. Confidential information may be shared only with authorized recipients who have a business need and appropriate confidentiality protections, such as contractual confidentiality requirements or a non-disclosure agreement. Documents may be made available through the Company's Trust Center where appropriate."}, {"k": "sec", "t": "9 and 10. Records and exceptions", "items": ["System classifications in normal records", "Client handling rules kept with them", "No separate classification register", "Material exceptions: Accountable Party", "Logged in the compliance system"], "art": "Exception record with risk mitigation", "cad": "When an exception is approved", "n": "Section 9 covers records. System classifications and client-specific handling requirements are kept as part of our normal security and compliance records, and no separate classification register is required. Section 10 covers exceptions. Material exceptions to this policy must be approved by the Accountable Party and documented in the Company's compliance system, including any necessary risk mitigation."}, {"k": "table", "t": "Appendix A: Access and storage", "head": ["Handling", "Public", "Internal", "Confidential"], "rows": [["Who may access", "No restrictions", "Personnel, authorized users", "Need-to-know only"], ["Labeling", "Not labeled", "May be labeled", "Label location (not GitHub, AWS)"], ["Website or publication", "Allowed", "Not allowed", "Not allowed"], ["Google Workspace", "Allowed", "Allowed", "Allowed"], ["GitHub", "Public repos only", "Private repos", "Private, restricted access"], ["AWS", "Not applicable", "Allowed", "Allowed, restricted access"], ["Personal email or cloud", "Not allowed", "Not allowed", "Not allowed"]], "n": "Appendix A is the handling matrix, and it is part of the policy. Public information has no access restrictions. Internal is for personnel and authorized users, and Confidential is need-to-know, with the location labeled, except for information in GitHub or AWS. All three may sit in Google Workspace. In GitHub, Public goes in public repositories, Internal in private ones, and Confidential in private repositories with restricted access. Nothing goes to personal email or personal cloud storage."}, {"k": "table", "t": "Appendix A: Sharing and disposal", "head": ["Handling", "Public", "Internal", "Confidential"], "rows": [["Share externally", "Allowed", "With a business need", "Authorized, with a business need"], ["Encryption", "As applicable", "Standard platform controls", "Required where appropriate"], ["Disposal", "Normal", "POL-DRD-001 schedule, annual", "POL-DRD-001 retention and disposal"]], "n": "The matrix also covers sharing, encryption, and disposal. Public information can be shared freely. Internal information is shared externally only with a business need, and Confidential only with authorized recipients who have a business need. Encryption requirements are set out in STD-ENC-001, the Encryption Standard. Retention periods and disposal methods are set out in POL-DRD-001. Client agreements that are stricter than this matrix take precedence."}, {"k": "table", "t": "Appendix B: System classification", "head": ["System", "Information", "Class", "Owner"], "rows": [["Google Workspace", "Email and business documents", "Internal or Confidential", "CTO"], ["GitHub", "Source code", "Confidential", "Engineering"], ["AWS", "Application and customer data", "Confidential", "Engineering"], ["Secureframe", "Compliance evidence", "Confidential", "CTO/Security Officer"], ["Website", "Marketing and public information", "Public", "Engineering"]], "n": "Appendix B classifies each system at the level of the most sensitive information it normally holds. Google Workspace holds both Internal and Confidential information, so Confidential content there is kept in locations labeled Confidential. GitHub, AWS, and Secureframe are Confidential, and the website is Public. Each owner keeps the system's access aligned with Appendix A, and a new system is added to this table before it holds Confidential information."}, {"k": "table", "t": "Artifacts and how often they are updated", "head": ["Artifact", "Section", "How often"], "rows": [["Policy approval record", "3", "At least annually"], ["System classification table", "6, App. B", "Before a system holds Confidential"], ["Confidential location labels", "6", "When a location is created"], ["Client handling requirements", "6, 9", "At contract signing or change"], ["Exception record with mitigation", "10", "When an exception is approved"]], "n": "Here are the records this policy relies on. The policy approval record is renewed at least annually. The system classification table in Appendix B is updated before any new system holds Confidential information. Confidential labels go on a location such as a shared drive or folder. Client handling requirements are kept with our compliance records. Exceptions are recorded, with their risk mitigation, when they are approved."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-DCL-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping information at the right classification and handling it the right way. Let's move on to the questions."}]}, {"key": "drd", "title": "Retention, Disposal, Recovery", "id": "POL-DRD-001", "version": "1.0", "date": "August 28, 2026", "blurb": "Keep what is needed, dispose, recover.", "slides": [{"k": "title", "t": "Data Retention, Disposal and DR", "sub": "Keep it while needed, then dispose of it", "body": "How PromptHalo retains, disposes of, backs up, and recovers information.", "meta": "POL-DRD-001, version 1.0, August 28, 2026", "n": "Welcome to PromptHalo's Data Retention, Disposal and Disaster Recovery Policy training. We will cover how long information is kept, legal holds, disposal, backup, recovery objectives, disaster recovery, and recovery testing. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["clock", "Retain", "Keep information while there is a reason"], ["edit", "Dispose", "Then dispose of it, with evidence"], ["server", "Recover", "Restore lost or unavailable systems"]], "banner": ["Note:", "retention periods in Section 5 are subject to change."], "n": "Section 1 sets the purpose. PromptHalo keeps information for as long as it has a reason to, and then disposes of it. This policy says how that decision is made and how disposal is evidenced. It also sets out how the Company recovers information and systems when they are lost or unavailable. The retention periods in Section 5 are subject to change."}, {"k": "grid", "t": "2 and 3. Scope and roles", "items": [["globe", "All information", "Company and client, wherever held"], ["server", "Backup and recovery", "Including cloud provider systems"], ["user", "Accountable Party", "Owns policy, objectives, disasters"], ["tool", "Engineering", "Owns backup, recovery, and tests"]], "n": "Section 2: the policy covers Company and client information wherever it is held, any device or media that has held it, and backup and recovery of the systems we depend on, including those our cloud providers operate. Section 3: the Accountable Party owns and approves the policy, reviews it at least annually, approves recovery objectives, and declares a disaster. Engineering owns backup and recovery, maintains the Backup and Recovery Plan, and performs recovery tests. The Security Officer provides guidance and reports test results to the Accountable Party."}, {"k": "grid", "t": "4. Key terms", "items": [["lock", "Confidential", "Per Data Classification; customer data"], ["alert", "Disaster", "Beyond RTO; Accountable Party declares"], ["target", "RPO", "Most data loss accepted, as time"], ["clock", "RTO", "Time to restore after a disruption"]], "n": "Section 4 defines the terms. Confidential information is information classified Confidential under the Data Classification Policy, including customer data. A disaster is a disruption that ordinary incident response cannot resolve within the affected system's recovery time objective, declared by the Accountable Party. The recovery point objective is the maximum amount of data, as a period of time, we accept losing. The recovery time objective is the period within which a system is to be restored after a disruption is declared."}, {"k": "sec", "t": "5. Retention rules", "items": ["Keep each category per the schedule", "Client data per agreement, then return or delete", "Be honest about how long backups persist", "Client or legal requirements govern", "Schedule reviewed with policy and on change"], "art": "Retention schedule (Section 5)", "cad": "With policy review and on change", "n": "Section 5 sets the retention rules. Each category of information is kept for the period in the retention schedule, considering client agreements, legal requirements, and Company needs. Client information is retained as the client agreement specifies, and returned or deleted at the end of the engagement. Where we commit to delete information, we tell the client honestly how long copies may persist in backups. Where a client agreement or legal requirement sets a different period, it governs. The schedule is reviewed with this policy and when a requirement changes."}, {"k": "table", "t": "5. Retention schedule", "head": ["Information", "Retention", "Notes"], "rows": [["Customer data", "Per contract or business need", "The contract takes precedence"], ["Security and audit logs", "13 months", ""], ["Contracts and legal records", "7 years after termination", "Unless otherwise required"], ["Financial and tax records", "7 years", "Subject to applicable requirements"], ["Personnel records", "Per legal or business requirement", ""], ["Compliance and audit evidence", "7 years", "Audit and related evidence"], ["Source code", "Per business or product need", "Archive or delete when not needed"], ["Backups", "Per configured backup lifecycle", "Set out in PLN-BKP-001"]], "n": "Here is the schedule. Customer data is kept per contract or business need, and the contract takes precedence. Security and audit logs are kept 13 months. Contracts and legal records are kept 7 years after termination, and financial and tax records 7 years. Personnel records follow legal or business requirements. Compliance and audit evidence is kept 7 years. Source code is kept as the business needs, then archived or deleted. Backups follow their configured lifecycle in the Backup and Recovery Plan. A legal hold can extend any of these."}, {"k": "sec", "t": "6. Legal hold", "items": ["Triggered by litigation, investigation, or request", "Accountable Party places the hold", "Record what is preserved and why", "No disposal; automated deletion suspended", "Lifted only in writing by Accountable Party"], "art": "Legal hold record", "cad": "When a hold is placed or lifted", "n": "Section 6 covers legal holds. When the Company becomes aware of actual or anticipated litigation, a regulatory investigation, or a client request to preserve information, the Accountable Party places a legal hold and records what is preserved and why. Information under hold is not disposed of, and automated deletion is suspended for it, until the Accountable Party lifts the hold in writing."}, {"k": "sec", "t": "7. Disposal", "items": ["Dispose when the retention period ends", "Use automated deletion where practical", "Wipe or destroy devices and media", "Before disposal, reassignment, or return", "Cloud: provider deletion or crypto erasure"], "art": "Deletion logs from source systems", "cad": "When retention ends", "n": "Section 7 covers disposal. Information is disposed of when its retention period ends, using automated deletion where practical. Devices and media that have held Company or client information are wiped or destroyed before disposal, reassignment, or return. Information in cloud services is disposed of using the provider's deletion mechanisms, or by cryptographic erasure where the Company holds the keys."}, {"k": "check", "t": "8. Backup", "items": ["Defined schedule, automated if practical", "Encrypted; access restricted", "Protected against loss of the primary", "Failures monitored and resolved", "Kept per configured lifecycle"], "big": "PLN-BKP-001", "bigsub": "Holds the schedules, tools, monitoring, issue handling", "n": "Section 8 covers backup. Production systems and other systems holding Company or customer data are backed up on a defined schedule, using automated backups where practical. Backups are encrypted, and access is restricted to authorized personnel. They are protected against loss of the primary system, using separate storage, accounts, or Regions where practical. Failures are monitored, and significant failures are investigated and resolved. The details of schedules, retention, tools, monitoring, and issue handling are in the Backup and Recovery Plan."}, {"k": "table", "t": "9. Recovery objectives", "head": ["Service category", "Target RTO", "Target RPO"], "rows": [["Production service", "24 hours", "4 hours"], ["Corporate collaboration, email, and files", "48 hours", "24 hours"], ["Source code and build pipeline", "48 hours", "24 hours"]], "n": "Section 9 sets the recovery objectives, approved by the Accountable Party. The production service must be restored within 24 hours, with no more than 4 hours of data lost. Corporate collaboration, email, and files, and source code and the build pipeline, have a 48-hour recovery time and a 24-hour recovery point. Objectives reflect what we can demonstrate and are revisited when a test shows they cannot be met. Where a client agreement sets a shorter objective, the agreement governs."}, {"k": "flow", "t": "10. Disaster recovery", "steps": [["flag", "Declare", "Accountable Party names the lead", "F7DEDE"], ["doc", "Record", "The declaration is recorded", "E9E3F5"], ["tool", "Recover", "Escalation of incident response", "F7EDC9"], ["mail", "Notify", "Clients, under PLN-IRP-001", "DDEBF7"], ["check", "Close", "Service restored, integrity confirmed", "DCEFE2"]], "banner": "Keep recovery plans and access reachable when the primary environment is not.", "n": "Section 10 covers disaster recovery. The Accountable Party declares a disaster and names who leads recovery, and the declaration is recorded. Recovery follows the Incident Response Plan, as an escalation of incident response rather than a separate process. Recovery plans and the access needed to use them are kept where they remain reachable when the primary environment is not. We rely on our cloud providers for infrastructure resilience. Clients are notified under the Incident Response Plan, and recovery closes when service is restored and data integrity is confirmed."}, {"k": "sec", "t": "11 to 13. Testing, records, exceptions", "items": ["Engineering tests recovery at least yearly", "Restoration test, DR tabletop, or both", "Record results and follow-up actions", "Records in compliance platform or source systems", "Exceptions: Accountable Party approves"], "art": "Recovery test results", "cad": "At least annually", "n": "Section 11: at least annually, Engineering tests recovery through a backup restoration test, a disaster recovery tabletop exercise, or both, with guidance from the Security Officer, and records results and follow-up actions. Section 12: records such as legal holds, disaster declarations, and test results are kept in the compliance platform or the systems that produce them. Backup job results and deletion logs are sufficient evidence. Section 13: material exceptions must be approved by the Accountable Party and documented, with any necessary risk mitigation."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "How often"], "rows": [["Legal hold record", "6", "When a hold is placed or lifted"], ["Deletion logs", "7, 12", "Produced by systems as data is deleted"], ["Backup job results", "8, 12", "Produced by backup systems"], ["Disaster declaration", "10", "When a disaster is declared"], ["Recovery test results and actions", "11", "At least annually"], ["Exception record with mitigation", "13", "When an exception is approved"]], "n": "Here are the records this policy produces. A legal hold record is made when a hold is placed, and the hold is lifted in writing. Deletion logs and backup job results come from the systems that produce them, and no separate documents are needed. A disaster declaration is recorded whenever one is made. Recovery test results and follow-up actions are recorded at least annually. Exceptions are documented in the compliance system with any necessary risk mitigation."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz result recorded", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping only what we need, disposing of it properly, and helping us recover when things go wrong. Let's move on to the questions."}]}, {"key": "enc", "title": "Encryption Standard", "id": "STD-ENC-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Encrypt in transit and at rest, guard secrets.", "slides": [{"k": "title", "t": "Encryption Standard", "sub": "Encrypted in transit and at rest", "body": "How PromptHalo protects information with platform encryption and managed secrets, keys, and certificates.", "meta": "STD-ENC-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Encryption Standard training. This walkthrough covers why the standard exists, what it applies to, the encryption requirements for data in transit and at rest, how we handle secrets, keys, and certificates, how we keep algorithms current, the annual review, and exceptions. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this standard exists", "items": [["shield", "Protect", "Against disclosure or alteration"], ["server", "Built-in", "Cloud and SaaS platform encryption"], ["lock", "No custom crypto", "We do not build our own"]], "banner": ["Covers:", "data in transit and at rest, plus secrets, keys, certificates."], "n": "Section 1 sets the purpose. The standard protects Company and customer information from unauthorized disclosure or alteration. It requires appropriate encryption in transit and at rest, and secure management of secrets, keys, and certificates. PromptHalo meets these requirements mainly through the built-in encryption of its cloud and SaaS platforms. The Company does not build or operate its own cryptography."}, {"k": "grid", "t": "2 and 3. Scope and roles", "items": [["globe", "Platforms", "AWS, Google Workspace, GitHub"], ["lock", "Protections", "Secrets, keys, and certificates"], ["eye", "Security Officer", "Oversees encryption requirements"], ["tool", "Engineering", "Configures encryption for its systems"]], "n": "Section 2 sets the scope: Company and customer information in transit and at rest in Company-managed cloud and SaaS services, including AWS, Google Workspace, and GitHub, and the secrets, keys, and certificates that protect it. Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party and owns the standard. The Information Security Steering Committee approves it and reviews it at least annually. The Security Officer, or a designee, oversees encryption requirements, and Engineering configures encryption, secrets, keys, and certificates for the systems it manages."}, {"k": "sec", "t": "5. In transit and at rest", "items": ["In transit: TLS 1.2 or higher", "Plain HTTP redirected to HTTPS", "At rest: AES-256 or equivalent", "For Confidential and Restricted information", "On by default for storage, backups, snapshots"], "art": "Platform encryption configuration", "cad": "Always on; confirmed yearly", "n": "Section 5 sets the requirements. In transit means information moving over a network, including between our own services. Company and customer information must be encrypted in transit using TLS 1.2 or higher, with plain HTTP redirected to HTTPS. At rest means information on disk, in a database, in object storage, or in a backup or snapshot. Confidential and Restricted information must be encrypted at rest using AES-256 or an equivalent. Encryption is enabled by default for storage, databases, backups, and snapshots wherever the platform supports it."}, {"k": "sec", "t": "5. Secrets, keys, and certificates", "items": ["Secrets in a managed service or password manager", "Never in code, config, tickets, chat, or logs", "Keys managed by the platform key service", "Key rotation enabled where supported", "Certificates renewed automatically if possible"], "art": "Secrets service and key service settings", "cad": "Ongoing", "n": "A secret is a credential, key, or token that protects access to information or a system. Secrets are held in a managed secrets service or the password manager, and are never placed in source code, committed configuration files, tickets, chat, or logs. Encryption keys are managed by the platform key service, with rotation enabled where supported. Certificates are issued and renewed automatically where possible. Where renewal cannot be automated, the expiry date is tracked and an alert is set before it."}, {"k": "table", "t": "5. Requirements at a glance", "head": ["What", "Requirement"], "rows": [["Data in transit", "TLS 1.2 or higher; HTTP redirects to HTTPS"], ["Data at rest", "AES-256 or equivalent, on by default"], ["Secrets", "Managed secrets service or password manager"], ["Keys", "Platform key service; rotation where supported"], ["Certificates", "Auto-renewed, or expiry tracked with alert"]], "n": "Here are the five requirements of Section 5 in one place. Data in transit uses TLS 1.2 or higher, with HTTP redirected to HTTPS. Confidential and Restricted data at rest uses AES-256 or an equivalent, enabled by default. Secrets live in a managed secrets service or the password manager. Keys are managed by the platform key service, with rotation where supported. Certificates renew automatically, or their expiry is tracked with an alert set before it."}, {"k": "sec", "t": "6. Algorithms and change", "items": ["Use algorithms current guidance considers sound", "Take stronger platform defaults when offered", "Never implement our own cryptography", "Deprecated or broken: assess under POL-RSK-001", "Providers adopt post-quantum algorithms"], "art": "Risk assessment record", "cad": "When an algorithm is deprecated", "n": "Section 6 covers algorithms. The Company uses algorithms and key lengths that current industry guidance considers sound, takes stronger platform defaults where they are offered, and does not implement its own cryptography. When a protocol or algorithm we rely on is deprecated or broken, it is assessed under the Risk Management Policy and remediated based on exposure. The Company relies on its platform providers to adopt post-quantum algorithms as they become available."}, {"k": "sec", "t": "7. Annual review", "items": ["Security Officer or designee reviews", "Default encryption settings still enabled", "No unencrypted external connections", "Platform configuration is the evidence"], "art": "Platform configuration", "cad": "At least annually", "n": "Section 7 sets the review. At least annually, the Security Officer, or a designee, confirms two things: that default encryption settings remain enabled, and that no unencrypted external connections are in use. No separate report is needed for this. The platform configuration itself serves as the evidence that encryption is in place."}, {"k": "sec", "t": "8. Exceptions", "items": ["When a service cannot meet a requirement", "Example: legacy crypto a customer requires", "Use a compensating control", "Record in the Exception Register", "Include a review date"], "art": "Exception Register entry", "cad": "When an exception arises", "n": "Section 8 covers exceptions. Sometimes a service cannot meet a requirement of this standard, for example when a customer or platform requires legacy cryptography. In that case a compensating control is used, and the exception is recorded in the Exception Register with a review date, so that it is revisited rather than forgotten."}, {"k": "table", "t": "Artifacts and cadence", "head": ["Artifact", "Section", "How often"], "rows": [["TLS and at-rest encryption settings", "5", "Always on"], ["Secrets service and password manager", "5", "Ongoing"], ["Key service with rotation", "5", "Where supported"], ["Certificate expiry alerts", "5", "When renewal is manual"], ["Risk assessment of weak algorithms", "6", "When deprecated or broken"], ["Encryption settings review", "7", "At least annually"], ["Exception Register entry", "8", "With a review date"]], "n": "Here is the evidence this standard relies on. Platform settings show TLS and encryption at rest are on. The secrets service, password manager, and key service with rotation show how secrets and keys are handled. Certificate expiry alerts cover any renewal that cannot be automated. A risk assessment is recorded when an algorithm is deprecated or broken. The Security Officer confirms the settings at least annually, and exceptions go in the Exception Register with a review date."}, {"k": "sign", "t": "Acknowledge this standard", "items": ["I keep secrets out of code and chat", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this standard when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping our data encrypted and our secrets where they belong. Let's move on to the questions."}]}, {"key": "hrs", "title": "HR Security", "id": "POL-HRS-001", "version": "1.0", "date": "July 23, 2026", "blurb": "Screen, train, protect, offboard cleanly.", "slides": [{"k": "title", "t": "HR Security", "sub": "From joining to leaving", "body": "How PromptHalo screens, onboards, trains, and offboards the people with access to its information.", "meta": "POL-HRS-001, version 1.0, July 23, 2026", "n": "Welcome to PromptHalo's Human Resources Security Policy training. This walkthrough covers who the policy applies to, what happens before access is granted, onboarding and training, your duties while you work here, contractors, role changes, offboarding, incidents and violations, AI-assisted work, and the records we keep. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["users", "Understand", "Everyone knows their responsibilities"], ["shield", "Lifecycle", "Screened, authorized, trained, offboarded"], ["target", "Proportionate", "Matched to role, access, and law"]], "banner": ["Goal:", "protect Company and customer information through people."], "n": "Section 1 sets the purpose. Everyone with access to PromptHalo or customer information must understand their responsibilities, and must be appropriately screened, authorized, trained, and offboarded. The controls are proportionate to each person's role, their access, and applicable legal requirements, so not everyone goes through exactly the same steps."}, {"k": "grid", "t": "2 and 3. Scope and roles", "items": [["users", "Everyone with access", "Staff, contractors, interns, temps"], ["user", "Accountable Party", "CEO, or the Security Officer"], ["check", "Steering Committee", "Approves; reviews at least yearly"], ["shield", "Personnel", "Follow policy, protect information"]], "n": "Section 2 says the policy applies to employees, officers, contractors, consultants, interns, temporary workers, and other personnel with access to Company systems or information, to the extent permitted by law and contract. Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party, accountable for personnel security, and may delegate administration to the Security Officer, the Engineering Lead, a personnel sponsor, or another designee. The Information Security Steering Committee approves the policy and reviews it at least annually."}, {"k": "check", "t": "3. Every person's responsibilities", "items": ["Follow Company security policies", "Protect Company and customer data", "Use only authorized access", "Complete required training", "Report concerns; return assets"], "big": "Everyone", "bigsub": "These apply to all personnel, every day", "n": "Section 3 also sets out what every person is responsible for. Personnel follow Company security policies, protect Company and customer information, use only the access they are authorized to use, and complete required security training. They promptly report security concerns. And when their engagement ends, they return Company assets and information."}, {"k": "sec", "t": "5. Before access is granted", "items": ["Identity reasonably verified", "Screening fits role, risk, law, contract", "Agreements signed or accepted", "Role and responsibilities documented", "Access approved before it is granted"], "art": "Screening record and signed agreements", "cad": "Before access is granted", "n": "Section 5 covers what happens before access to Company systems or sensitive information is granted. The person's identity must be reasonably verified. Screening appropriate to the role, risk, applicable law, and contract must be performed. The individual must sign or accept employment or contractor, confidentiality, intellectual property, and security obligations. Their role and responsibilities must be documented, and the access they need must be approved before it is granted."}, {"k": "sec", "t": "5. Proportionate screening", "items": ["Not the same level for every person", "Privileged roles may get more screening", "May rely on a staffing firm's confirmation", "Record person, role, type, date, result", "Also record status and the reviewer"], "art": "Screening provider record or confirmation", "cad": "Before access is granted", "n": "Screening means identity verification and background checks proportionate to the role and permitted by law. The same level is not required for everyone, and more sensitive or privileged roles may receive more. Where a contractor or staffing organization performs screening, the Company may rely on its written confirmation. The screening record should identify the person, role, type of screening, date, result or status, and reviewer. A provider record, email, checklist, personnel record, or written confirmation is sufficient evidence."}, {"k": "sec", "t": "6. Job roles and responsibilities", "items": ["Roles documented in writing", "Job descriptions or equivalent records", "Include security duties where relevant", "CEO may create or modify roles", "No description needed for temporary tasks"], "art": "Job descriptions or engagement agreements", "cad": "When a role is created or changes", "n": "Section 6 says roles and responsibilities must be documented through job descriptions or equivalent role documentation, such as engagement agreements or organization records. Job descriptions should identify the primary responsibilities and, where relevant, the security responsibilities of the role. The CEO may create or modify roles as the Company's needs evolve. A separate job description is not required for every temporary task or assignment."}, {"k": "check", "t": "7. Onboarding checklist", "items": ["Agreements and screening complete", "Applicable policies acknowledged", "Security training assigned or done", "Access approved under POL-AC-001", "Company equipment recorded"], "big": "Least access", "bigsub": "Only the access reasonably required for the role", "n": "Section 7 covers onboarding. Personnel receive only the access reasonably required for their role. Before or during onboarding, as applicable, required agreements and screening are completed, applicable policies are acknowledged, security awareness training is assigned or completed, required access is approved and provisioned under the Access Control Policy, and any Company equipment is recorded. An email, checklist, system record, or other written record is sufficient onboarding evidence."}, {"k": "sec", "t": "8. Training and policy acknowledgment", "items": ["Training at onboarding, then yearly", "Completion must be recorded", "Briefing, online, or other reasonable method", "No learning management system required", "Acknowledge policies at onboarding and after"], "art": "Training record and policy acknowledgment", "cad": "At onboarding and at least yearly", "n": "Section 8 says personnel must complete security awareness training at onboarding and at least annually after that, and completion must be recorded. Training may be an internal briefing, online material, free or commercial training, or another reasonable method, under the Security Awareness and Training Policy. A dedicated learning management system is not required. Personnel must also acknowledge applicable Company security policies at onboarding and periodically thereafter, which is what you are doing now."}, {"k": "check", "t": "9. While you work here", "items": ["Follow Company policies", "Protect Company and customer data", "Use systems only as authorized", "Keep your credentials confidential", "Report incidents and access changes"], "big": "Speak up", "bigsub": "Report suspected incidents or policy violations", "n": "Section 9 lists what personnel must do during employment or engagement. Follow applicable Company policies. Protect Company and customer information. Use Company systems only as authorized. Keep your credentials confidential. Report suspected security incidents or policy violations. And notify the Company of any change that may affect your access or responsibilities."}, {"k": "sec", "t": "10. Contractors and consultants", "items": ["Requirements match their access", "May rely on the supplier's confirmation", "Each contractor should have a sponsor", "Access reviewed and removed when not needed"], "art": "Contract or written confirmation", "cad": "At engagement and when it ends", "n": "Section 10 covers contractors, consultants, and other non-employees with Company access. Their security requirements are proportionate to their access, and may include confidentiality obligations, screening, training, policy acknowledgment, approved access, and access removal when the engagement ends. Where a contractor comes through another organization, the Company may rely on contractual commitments or written confirmation of screening. Each contractor should have a Company sponsor, responsible for their engagement, access, and offboarding. Contractor access must be reviewed and removed when no longer required."}, {"k": "sec", "t": "11. Changes in role", "items": ["Material change: review access", "Adjust access to the new role", "Remove access no longer required", "Follow the Access Control Policy", "Email or system record is enough"], "art": "Access record or email", "cad": "When responsibilities change", "n": "Section 11 covers role changes. When a person's responsibilities materially change, their access must be reviewed and adjusted, and access they no longer need must be removed, under the Access Control Policy. The change may be documented through email, system records, an access record, or another written record."}, {"k": "flow", "t": "12. The offboarding path", "steps": [["send", "Notify", "Tell those who remove access", "E9E3F5"], ["lock", "Disable", "Access off by the last working day", "F7DEDE"], ["server", "Return assets", "Equipment returned or accounted for", "DDEBF7"], ["db", "Return data", "Outside copies returned or deleted", "F7EDC9"], ["users", "Reassign", "Repos, cloud, agents, documents", "DCEFE2"]], "banner": "Confidentiality obligations continue after departure where applicable.", "n": "Section 12 covers what happens when employment or an engagement ends. The departure is communicated to the people responsible for removing access. System access is removed or disabled. Company equipment and other assets are returned or accounted for. Company information held outside Company systems is returned or deleted. Ownership of repositories, cloud resources, service accounts, agents, workflows, and documents is reassigned where necessary. Confidentiality obligations continue after departure where applicable."}, {"k": "sec", "t": "12. Offboarding rules", "items": ["Access off by last working day, or sooner", "Involuntary or high risk: may be immediate", "Disabling SSO identity is the main step", "Remove non-SSO access separately", "No separate HR system required"], "art": "Offboarding record", "cad": "At every departure", "n": "Access must be removed or disabled by the last working day, or promptly based on the circumstances and risk, under the Access Control Policy. For involuntary or higher-risk departures, access may be removed immediately. Where single sign-on is used, disabling the primary Company identity may be the main removal step, but access that does not use single sign-on must be removed separately. The offboarding record shows the person, role, last working date, systems, assets, removal and return status, who completed it, and when."}, {"k": "sec", "t": "13. Incidents and policy violations", "items": ["Report incidents and violations promptly", "Follow the Incident Response Plan", "Company evaluates each matter", "Training, restriction, or discipline", "Material violations are documented"], "art": "Record of violation and action taken", "cad": "When a violation occurs", "n": "Section 13 says personnel must promptly report suspected security incidents, unauthorized access, loss of Company information, or material violations of security policies, under the Incident Response Plan. The Company evaluates each matter and takes appropriate action, which may include additional training, access restriction, corrective or disciplinary action, or termination of employment or engagement. Material personnel security violations and the resulting actions are documented as appropriate to the circumstances."}, {"k": "sec", "t": "14. AI-assisted work", "items": ["Use only approved AI tools", "Enter data only into authorized services", "You remain responsible for AI output", "Review AI output before relying on it", "See POL-AI-001 and POL-DCL-001"], "art": "None specified", "cad": "Every use of AI", "n": "Section 14 covers AI-assisted work. Personnel must use only AI tools approved for Company work. Company or customer information may be entered only into AI services authorized for that classification of information. You remain responsible for work produced with AI, and you must review AI-generated output before relying on it. The detailed requirements are in the AI Governance Policy and the Data Classification Policy."}, {"k": "sec", "t": "16. Exceptions", "items": ["When a requirement cannot be met", "Approved by CEO, Security Officer, or designee", "Recorded in the Exception Register", "Reason and compensating measure", "Approver and review or expiry date"], "art": "Exception Register entry", "cad": "When an exception is approved", "n": "Section 16 covers exceptions. Where a requirement cannot reasonably or lawfully be met, the exception must be approved by the CEO, the Security Officer, or a designated person. It is recorded in the Exception Register with the requirement, the reason, any compensating measure, the approver, and a review or expiry date."}, {"k": "table", "t": "Records you create", "head": ["Record", "Minimum content"], "rows": [["Personnel list", "Name, role, type, start and end, status"], ["Job descriptions", "Title, duties, security duties"], ["Screening evidence", "Person, screening, date, result, reviewer"], ["Agreements", "Employment or contractor, confidentiality, IP"], ["Training record", "Person, training, completion date"], ["Policy acknowledgment", "Person, policies, date"], ["Onboarding evidence", "Screening, training, access, equipment"], ["Offboarding evidence", "Access removed, assets and data returned"]], "n": "Section 15 lists the personnel security records the Company keeps, as applicable: the personnel list, job descriptions, screening evidence, agreements, training records, policy acknowledgments, onboarding evidence, and offboarding evidence, plus exception records when they apply. Existing emails, spreadsheets, system logs, identity provider records, screening provider records, contracts, and checklists can serve as evidence, and duplicate evidence is not required."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I understand my responsibilities", "Name, version, date", "Quiz: 60% to pass"], "side": "At onboarding and periodically after", "n": "You acknowledge this policy at onboarding and periodically after that, as Section 8 requires. Your record captures your name, the version, the date, and your quiz result. Thank you for helping protect Company and customer information from your first day to your last. Let's move on to the questions."}]}, {"key": "irp", "title": "Incident Response Plan", "id": "PLN-IRP-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Report fast, contain, recover, learn.", "slides": [{"k": "title", "t": "Incident Response Plan", "sub": "Report fast, contain, recover, learn", "body": "How PromptHalo identifies, contains, recovers from, and communicates security incidents.", "meta": "PLN-IRP-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Incident Response Plan training. We will cover what to report and how, how events are assessed and rated, the response steps, notification, incident records, testing, and what to do in the first hour. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Purpose", "items": [["eye", "Identify fast", "Spot and assess incidents quickly"], ["shield", "Contain and recover", "Investigate, fix, and restore"], ["mail", "Communicate", "Inform the right people properly"]], "banner": ["Built for a small remote team:", "existing people, systems, and outside help."], "n": "Section 1 sets the purpose. Incident response lets PromptHalo quickly identify, contain, investigate, recover from, and appropriately communicate security incidents affecting Company or customer information or systems. The Plan is designed for a small, remote team. It uses existing personnel, systems, and cloud provider capabilities, and brings in outside expertise where needed."}, {"k": "grid", "t": "2. What the Plan covers", "items": [["users", "All personnel", "Their accounts and devices too"], ["server", "Systems and data", "Cloud, apps, APIs, code, infrastructure"], ["cpu", "AI systems", "AI systems and agents"], ["link", "Third parties", "Vendors and customer environments"]], "n": "Section 2 sets the scope. The Plan applies to all personnel and to security events involving Company systems and cloud environments, Company or customer information, personnel accounts and devices, applications, APIs, source code, and infrastructure, AI systems and agents, the third-party services we use, and our access to customer environments."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the Plan", "Steering Committee approves, reviews yearly", "Security Officer coordinates the response", "CEO decides and leads external communication", "Everyone reports and assists when asked"], "art": "Contacts table (Section 11)", "cad": "Plan reviewed at least annually", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party and owns the Plan. The Information Security Steering Committee approves it and reviews it at least annually. The Security Officer, or a designee, coordinates assessment, containment, investigation, recovery, and records. The CEO, or a designee, makes significant business decisions and coordinates material external communication. Engineering and system owners support the response, and everyone reports and assists. Outside experts join when appropriate, and one person may hold several roles."}, {"k": "grid", "t": "4. Key terms", "items": [["eye", "Event", "Observed, not yet evaluated"], ["alert", "Incident", "Evaluated: affects or threatens security"], ["target", "Severity", "Critical, High, Medium, or Low"], ["user", "Accountable Party", "CEO, or Security Officer if absent"]], "n": "Section 4 defines the terms. An event is something observed that may or may not be an incident, until it has been evaluated. An incident is an event that has been evaluated and found to affect, or credibly threaten, the security of Company or client information. Severity is the level assigned under Section 6: Critical, High, Medium, or Low. The Accountable Party is the CEO or, in their absence, the Security Officer."}, {"k": "sec", "t": "5. Report", "items": ["Email security@prompthalo.ai promptly", "Do not wait to confirm an incident", "Phishing, lost devices, odd AI behavior, and more", "Critical or High: also call the Security Officer", "Outsiders use the published security contact"], "art": "Event and incident register entry", "cad": "Every suspected event", "n": "Section 5 covers reporting. Personnel must report suspected security events promptly to security at prompthalo dot ai, without waiting to confirm that an incident has occurred. Examples include suspected phishing or credential theft, unauthorized access, malware, lost or stolen devices, accidental disclosure, customer information exposure, unexpected AI or agent behavior, and significant security control failures. For a suspected Critical or High incident, also call or message the Security Officer directly. Customers, researchers, and the public use the security contact the Company publishes."}, {"k": "table", "t": "6. Assess and prioritize", "head": ["Severity", "Examples", "Response"], "rows": [["Critical", "Major customer exposure, compromise, outage", "Respond immediately; involve the CEO"], ["High", "Credible threat to sensitive info or systems", "Contain and investigate promptly"], ["Medium", "Limited impact, no major customer exposure", "Handle as part of normal work"], ["Low", "Minor event, near miss, or minor issue", "Fix, record, and close"]], "n": "Section 6. The Security Officer, or a designee, evaluates each reported event: what happened, what may be affected, whether customer information is involved, whether it is ongoing, and the potential business impact. Events that need a response become incidents; others are closed with a brief disposition. Critical means significant customer exposure, widespread compromise, or material disruption. High is a credible threat to sensitive information or important systems. Severity may change as more is learned, and containment must not wait for it to be settled."}, {"k": "flow", "t": "7. Respond", "steps": [["lock", "Contain", "Stop or limit the incident", "F7DEDE"], ["eye", "Investigate", "What, how, and what is affected", "E9E3F5"], ["tool", "Recover", "Return to a trusted state", "F7EDC9"], ["mail", "Communicate", "Keep the people involved informed", "DDEBF7"], ["check", "Learn", "Close: outcome and corrective actions", "DCEFE2"]], "banner": "Containment may happen before the cause is known.", "n": "Section 7 sets the response steps. Contain the incident to stop or limit it. Investigate what occurred, how, and what is affected. Recover by returning affected systems to a trusted state. Communicate, keeping the people involved informed, with the CEO or a designee coordinating material customer and external communication. Then close and learn: record the outcome and corrective actions. Containment may happen before the cause is known."}, {"k": "two", "t": "7. Contain and investigate", "items": [["lock", "Contain", ["Disable accounts, revoke tokens", "Isolate systems, block activity", "Stop or restrict a rogue AI agent"]], ["eye", "Investigate", ["What happened, how, and to what", "Was there unauthorized access?", "Preserve logs before destructive steps"]]], "n": "Containment means reasonable action such as disabling an account, revoking credentials or tokens, isolating a system, stopping a compromised process or AI agent, restricting access, or blocking malicious activity. For an AI agent acting outside its authorized scope, stopping or restricting the agent is an appropriate first action. Investigation determines what occurred, how, which systems, accounts, and information are affected, whether unauthorized access occurred, and whether it continues. Preserve relevant logs and evidence where practical before destructive recovery actions."}, {"k": "sec", "t": "7. Recover, communicate, learn", "items": ["Return systems to a trusted state", "Reset credentials, patch, fix config, or restore", "Verify the service works before resolving", "Significant incidents: review what happened", "Track corrective actions in existing tools"], "art": "Tickets, issues, or risk records", "cad": "Each incident", "n": "To recover, return affected systems to a trusted state, for example by resetting credentials, removing malicious access, patching, correcting configuration, or restoring from backup, and verify that the service works before resolving the incident. To close and learn, record the outcome and corrective actions. For significant incidents, review what happened, what worked, what did not, and what should change. Corrective actions are tracked in existing tickets, issues, or risk records."}, {"k": "sec", "t": "8. Notification", "items": ["Security Officer and CEO evaluate the need", "Consider data, extent, contracts, and law", "CEO decides and coordinates material notices", "As processor: tell the controller without delay", "Record every decision and its basis"], "art": "Notification decision; notification register", "cad": "Each incident evaluated", "n": "Section 8 covers notification. The Security Officer and the CEO evaluate whether to notify customers, partners, regulators, insurers, law enforcement, or others, considering the information affected, the extent of t
