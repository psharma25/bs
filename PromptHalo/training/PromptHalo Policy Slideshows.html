ternal privacy disclosure, serving as our GDPR Article 13 and 14 disclosures."}, {"k": "sec", "t": "5. What the Company processes", "items": ["Controller: personnel and candidate records", "Processor: client data, on instructions only", "Business for personnel data", "Service provider for client data", "No selling, no training on client data"], "art": "Record of processing activities, if needed", "cad": "As processing changes", "n": "Section 5 sets out what we process. As Controller, we process personnel and candidate records under the HR Security Policy and the Screening Standard, and retain them under the Data Retention, Disposal and Disaster Recovery Policy. As Processor, we process client personal data encountered during engagements only on the client's instructions and under the engagement agreement. In US state law terms, we are a business for our own personnel and candidates, and a service provider for client data. We do not sell personal data, do not use client personal data to train models, and do not process personal data for our own purposes beyond running the business."}, {"k": "sec", "t": "6. Obligations the Company carries", "items": ["Collect only with a lawful basis", "Keep only as long as retention allows", "Record each sub-processor and notify clients", "Breach: handle as an incident", "Review the Policy and the Notice together"], "art": "Sub-processor list and client notices", "cad": "When a sub-processor is added", "n": "Section 6 lists our obligations. We must collect personal data only with a lawful basis, keep it only as long as the retention schedule allows, and protect it as the Data Classification Policy and Encryption Standard require. Each sub-processor handling client personal data must be recorded on the sub-processor list, with clients notified under the Vendor Management Policy. A personal data breach is handled as an incident under the notification matrix in the Incident Response Plan, and as Processor we must notify the Controller without undue delay. The Policy and the public Privacy Notice must be reviewed together."}, {"k": "two", "t": "6. Data subject requests", "items": [["user", "We are Controller", ["Acknowledge the request", "Answer within the legal period", "Accountable Party handles it"]], ["send", "Client data", ["The client is the Controller", "Forward the request to them", "Do not answer it ourselves"]]], "n": "Section 6 also covers data subject requests, where a person asks to exercise a right over their personal data. When we are the Controller, we must acknowledge and answer the request within the period applicable law allows, and the Accountable Party handles it. When the request relates to client data, the client is the Controller, so we must forward the request to the client. Every request we receive, and how we handled it, is recorded."}, {"k": "sec", "t": "7. Protecting personal data: the basics", "items": ["Classify and encrypt in transit and at rest", "Prompts, traces, and logs are personal data", "Least privilege and MFA for access", "Screened, bound to confidentiality, trained", "Log and monitor access to these systems"], "art": "Access reviews and training records", "cad": "Per Access Control and HR cadence", "n": "Section 7 names the security controls that carry our privacy obligations. Personal data must be classified under the Data Classification Policy and encrypted in transit and at rest. Personal data in prompts, tool inputs and outputs, execution traces, and application logs is personal data, and gets the same classification, access, encryption, and retention treatment. Access is least privilege with multi-factor authentication, reviewed at the Access Control Policy cadence, and removed on separation. People with access are screened, bound by confidentiality terms, and trained at the HR Security Policy cadence. Access to systems holding personal data is logged and monitored."}, {"k": "sec", "t": "7. Protecting personal data: more rules", "items": ["Backups and recovery: Business Continuity", "Retention: Data Retention Policy", "No production personal data in dev or test", "Unless de-identified, or approved and recorded", "Reassess on significant change and yearly"], "art": "Approval with a review date", "cad": "Each significant change and yearly", "n": "Availability and restorability of personal data, including backups, recovery objectives, and restoration testing, fall under the Business Continuity Policy, and how long we keep it falls under the Data Retention, Disposal and Disaster Recovery Policy. We must not use production personal data in development or test environments unless it has been de-identified. Where de-identification is not practicable, the Accountable Party must approve the use and record it with a review date. These safeguards must be reassessed on any significant change, as the Risk Management Policy defines it, and at the annual review."}, {"k": "sec", "t": "8. Sharing: what we never do", "items": ["Never sell personal data", "No cross-context behavioral advertising", "No disclosure for a third party's own use", "Client data never trains any model", "AI services: terms excluding training"], "art": "Commercial AI service terms", "cad": "Before an AI service is used", "n": "Section 8 distinguishes selling from disclosure to service providers. We do not sell personal data and do not share it for cross-context behavioral advertising, as US state privacy law defines those terms. We do not disclose personal data to any third party for that party's own purposes. We process client personal data only on the client's documented instructions and must not use it for any Company purpose, including training or evaluating models, whether ours or a provider's. Where we use a commercial AI service in delivery, it must be on terms that exclude our submissions from provider training."}, {"k": "sec", "t": "8. Sharing: what we do, and how", "items": ["Sub-processors: written contract only", "Assess before engagement, then reassess", "Notify clients before a new sub-processor", "End of engagement: return or delete", "Transfers: contract clauses or adequacy"], "art": "Transfer assessment, deletion record", "cad": "Per engagement and transfer", "n": "We disclose personal data to sub-processors and service providers only under written contract, on our documented instructions, and only as far as they need it, and each is recorded on the sub-processor list. A sub-processor is assessed before engagement and reassessed under the Vendor Management Policy, and clients are notified before it starts processing their data. At the end of an engagement we return or delete client personal data at the client's choice. Transfers out of the UK or EEA use the Standard Contractual Clauses with the UK Addendum, or an adequacy decision, with a transfer assessment where needed."}, {"k": "check", "t": "8. Other disclosures", "items": ["Client audits: report, Trust Center, answers", "Legal demands only where law requires", "Record it; notify the client if allowed", "Sale of business: notify clients first", "Anything else: Accountable Party approves"], "big": "Recorded", "bigsub": "Every disclosure outside the usual path is written down", "n": "We must give clients the information they need to demonstrate compliance, supporting their audits through our independent audit report, our Trust Center documentation, and written answers to their questions. We disclose personal data to law enforcement, a regulator, or a court only where law requires it, or to establish or defend a legal claim, and we must record the disclosure and notify the client where permitted. On a merger, acquisition, or sale, personal data may transfer subject to this policy, with affected clients notified first. The Accountable Party must approve and record any other disclosure in advance."}, {"k": "two", "t": "10 and 11. Enforcement and exceptions", "items": [["alert", "Enforcement", ["All personnel must comply", "Accountable Party investigates", "Discipline up to termination"]], ["doc", "No exceptions", ["Client terms govern if stricter", "Reissue the policy instead", "Exceptions are not recorded"]]], "n": "Section 10 says all personnel must comply with this policy. The Accountable Party investigates suspected non-compliance, and confirmed non-compliance may lead to disciplinary action up to and including termination of employment or contract. Section 11 handles exceptions differently from most of our policies. Where a client agreement requires the Privacy category to be in scope, or imposes obligations beyond this policy, that requirement governs, and we must reissue this policy rather than record an exception."}, {"k": "table", "t": "9. Records you create", "head": ["Record", "When"], "rows": [["Privacy scoping decision and review date", "At each review"], ["Record of processing, where required", "As processing changes"], ["Sub-processor list and client notices", "When sub-processors change"], ["Data subject requests and handling", "On each request"], ["Privacy Notice and version history", "Each time it changes"], ["Transfer mechanisms and assessments", "Per transfer"], ["Return or deletion of client data", "At engagement end"], ["Legal disclosures; non-production approvals", "When they occur"]], "n": "Section 9 lists the records. We keep the scoping decision on the Privacy category with its review date; the record of processing activities where required; the sub-processor list and client notifications; data subject requests and how we handled them; the published Privacy Notice and its version history; transfer mechanisms and assessments; records of returning or deleting client data at the end of an engagement; disclosures made under legal compulsion; and approvals for any use of personal data outside production."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass", "Internal policy, not the public Notice"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Remember that this is our internal Privacy Policy; the public Privacy Notice and the Privacy Implementation Plan are separate documents. Thank you for protecting the personal data entrusted to us. Let's move on to the questions."}]}, {"key": "privnotice", "title": "Privacy Notice", "id": "NOTICE-PRIV", "version": "1.0", "date": "August 18, 2026", "blurb": "Know what we promise, then keep it.", "slides": [{"k": "title", "t": "Privacy Notice", "sub": "What we publicly promise about personal data", "body": "Staff training on PromptHalo's public Privacy Notice: what we tell visitors, enquirers, and customer contacts.", "meta": "NOTICE-PRIV, version 1.0, August 18, 2026", "n": "Welcome to the Privacy Notice training. The Privacy Notice is our public document for external readers, and it is separate from our internal Privacy Policy and the Privacy Implementation Plan. Because it is public, every statement in it is a promise people can hold us to. This walkthrough covers who we are, what we collect and why, cookies, sharing, transfers, retention, AI, our role for customers, individual rights, security, children, and changes. At the end, you will answer short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Who we are", "items": [["shield", "Controller", "For the data this Notice describes"], ["mail", "One contact", "privacy@prompthalo.ai"], ["user", "Security Officer", "Handles privacy enquiries; no statutory DPO"]], "banner": ["Public promise:", "everything here must match what we actually do."], "n": "Section 1 says who we are. PromptHalo provides security and AI advisory and software services to business customers, and for the personal data in this Notice we are the controller unless we say otherwise. Anyone can reach us about the Notice at privacy@prompthalo.ai. We do not have a statutory Data Protection Officer; enquiries are handled by our Security Officer, who is accountable for privacy alongside security."}, {"k": "sec", "t": "1. Which law applies", "items": ["Established in the United States", "Assessed: EU and UK GDPR do not apply", "No Article 27 representative appointed", "Reassessed yearly and before UK or EEA work", "Complaint to a supervisory authority allowed"], "art": "GDPR applicability assessment", "cad": "At least annually", "n": "The Notice states that we are established in the United States and that, as of its date, we have assessed that neither the EU GDPR nor the UK GDPR applies: we have no establishment there, do not offer goods or services there, and do not monitor behavior there. So we have not appointed an Article 27 representative. The assessment is reviewed at least annually and reopened before we begin serving UK or EEA customers, not afterwards. If either Regulation comes to apply, we will appoint and name a representative before processing begins. People in the UK or EEA may complain to their local supervisory authority."}, {"k": "two", "t": "2. What this Notice covers", "items": [["check", "Covered", ["Website visitors", "People who contact us", "Contacts at business customers"]], ["lock", "Not covered", ["Data we process for customers", "Our own personnel", "Third-party websites"]]], "n": "Section 2 sets the scope. The Notice covers personal data we handle as a controller: website visitors, people who contact us or receive our communications, and individual contacts at our business customers. It does not cover personal data we process on a customer's behalf; there the customer is the controller, their own notice applies, and our obligations are in the data processing agreement. It also does not cover our own personnel, whose data is handled under a separate internal notice, or third-party websites we link to."}, {"k": "check", "t": "2. What we do anyway", "items": ["Access and correction", "Deletion and restriction", "Portability and objection", "For everyone who asks, anywhere"], "big": "Everyone", "bigsub": "Rights extended whether or not the GDPR applies", "n": "Section 2 also states what we do anyway. Independently of whether the Regulation applies, we extend the rights in this Notice, access, correction, deletion, restriction, portability, and objection, to everyone who asks, wherever they live. Where either Regulation does apply to a processing activity, a person in the UK or the EEA who is not satisfied with our response may complain to their local supervisory authority, whether or not they contact us first, and doing so does not affect any other right."}, {"k": "table", "t": "3. What we collect and why", "head": ["What", "Why", "Legal basis"], "rows": [["Website visit and device data", "Keep the site working and secure", "Legitimate interests"], ["Contact form, email, meetings", "Answer and hold meetings", "Legitimate interests; pre-contract"], ["Prospect business contacts", "Relevant business contact", "Legitimate interests; unsubscribe"], ["Customer contacts and records", "Deliver, invoice, keep records", "Contract; legal obligation"], ["Security event records", "Detect and respond to incidents", "Legitimate interests; legal duty"]], "n": "Section 3 sets out what we collect, why, and the legal basis. Website visit data supports keeping the site working and secure. Details people send through the contact form, email, or meeting requests let us answer them and hold meetings. Business contact details of prospects support relevant business contact, with an unsubscribe link in every message. Customer contacts and engagement records let us deliver, invoice, and meet record-keeping duties. Security event records help us detect and respond to incidents. We do not ask for special category data, and we delete it if sent unless we have a specific basis to keep it."}, {"k": "sec", "t": "4. Cookies and similar technologies", "items": ["Strictly necessary cookies only", "No analytics, advertising, or tracking", "No third-party cookies through our site", "No banner: nothing needs consent", "We honor Global Privacy Control"], "art": "Cookie Policy list of every cookie", "cad": "When a cookie changes", "n": "The cookies section says we set strictly necessary cookies only: the ones that sign people in, keep sessions secure, and route requests. We run no analytics, advertising, or tracking cookies, and we let no third party set one through our site. Because nothing we set requires consent, there is no cookie banner and no preference center. Our Cookie Policy names every cookie, what it does, and how long it lasts. Blocking these cookies prevents signing in to the platform, though public pages stay readable. We honor Global Privacy Control signals, which confirm what we already do."}, {"k": "sec", "t": "6. Who we share it with", "items": ["Never sold; no cross-context advertising", "Service providers on our instructions only", "Hosting, email, payments, advisers", "Each bound by a limiting contract", "Provider list available on request"], "art": "Current provider list, on request", "cad": "Kept current", "n": "Section 6 says we do not sell personal data or share it for cross-context behavioral advertising, and never have. We share it only with service providers who process it on our instructions and only as far as they need: cloud infrastructure and hosting, email, collaboration and file storage, payment and accounting, and professional advisers such as legal, insurance, and audit. Each is bound by a contract limiting what they may do. A current list of providers used to deliver services is available on request. We may also disclose data where law requires, for legal claims, or in a sale of the business, telling affected customers before their data transfers."}, {"k": "sec", "t": "7. Where your data goes", "items": ["We operate from the United States", "Providers in the US and the EEA", "Standard Contractual Clauses, UK Addendum", "Adequacy decisions where they apply", "Copy of the mechanism on request"], "art": "Transfer mechanism copy, on request", "cad": "Per transfer", "n": "Section 7 covers transfers. We operate from the United States and use service providers there and in the European Economic Area, so personal data from the UK or EEA may be transferred outside those areas. Where a transfer needs a safeguard, or a customer contract asks for one, we rely on the UK and EU Standard Contractual Clauses with the UK International Data Transfer Addendum, and on adequacy decisions where they apply. Using these mechanisms is not a statement that either Regulation applies to us. We assess whether extra safeguards are needed, and anyone can ask for a copy of the mechanism for a specific transfer."}, {"k": "table", "t": "8. How long we keep it", "head": ["What", "How long"], "rows": [["Enquiries with no relationship", "Up to 24 months from last contact"], ["Marketing contact details", "Until unsubscribe, then a suppression record"], ["Customer contacts and engagements", "The engagement plus six years"], ["Security event records", "13 months, longer if investigating"]], "n": "Section 8 sets retention. Enquiries that do not become a relationship are kept up to twenty-four months from our last contact. Marketing contact details are kept until the person unsubscribes or asks us to stop, then reduced to a minimal suppression record so we do not contact them again. Customer contacts and engagement records are kept for the engagement and six years afterwards. Security event records are kept thirteen months unless an investigation needs longer. When a period ends, we delete or irreversibly anonymize the data. A deleted record may persist briefly in a backup, but is never restored to active use."}, {"k": "two", "t": "9. AI and automated decisions", "items": [["user", "Decisions", ["No solely automated decisions", "None with legal or similar effects", "A named person is accountable"]], ["cpu", "Training", ["No personal data trains models", "Enterprise terms: no provider training", "Customer data: their instructions only"]]], "n": "Section 9 is direct about AI. We do not make decisions about people by automated means alone that produce legal or similarly significant effects, and a named person is accountable for any output we act on. We do not use personal data from our website, enquiries, or customers to train or fine-tune AI models, ours or a provider's. Where we use a commercial AI service, we use business or enterprise terms under which submissions are not used for provider training. Where we process customer data with AI, we do so only on that customer's documented instructions and under our data processing agreement."}, {"k": "sec", "t": "10. When we act for a customer", "items": ["We are processor; customer is controller", "Act only on documented instructions", "No use of the data for our own purposes", "Sub-processor list kept; notice before new ones", "Requests passed to the customer promptly"], "art": "Sub-processor list and change notices", "cad": "Before a new sub-processor starts", "n": "Section 10 explains our role for customers. When we handle customer information that includes personal data about their staff or customers, we are a processor and the customer is the controller. We act only on their documented instructions, do not decide what the data is used for, and do not use it for any purpose of our own. We engage sub-processors only under our agreement with the customer, keep a current list, and give notice before a new one starts. If someone contacts us to exercise a right over such data, we pass the request to the customer promptly and tell the person we have done so."}, {"k": "table", "t": "11. Your rights", "head": ["Right", "What it means"], "rows": [["Access", "Know what we hold and get a copy"], ["Correction", "Fix wrong or incomplete data"], ["Deletion", "Delete data we no longer need"], ["Restriction", "Pause processing during a question"], ["Portability", "Machine-readable copy, or sent onward"], ["Objection", "Object to legitimate interests use"], ["Opt out of marketing", "Unsubscribe at any time"], ["Withdraw consent", "Withdraw any consent given"]], "n": "Section 11 lists the rights over personal data we hold as controller: access, correction, deletion, restriction, portability, objection including to profiling, opting out of marketing at any time with no effect on services, and withdrawing consent. People in California or another US state with comparable law also have the right to know what we collect and why, to delete, to correct, to opt out of sale or sharing, which does not arise because we do neither, and not to be discriminated against for exercising any of these rights."}, {"k": "sec", "t": "11. How a rights request is handled", "items": ["Requests go to privacy@prompthalo.ai", "Acknowledge within a few working days", "Respond within one month, or say why longer", "We may verify identity first", "No charge unless unfounded or excessive"], "art": "Request acknowledgment and response", "cad": "On each request", "n": "To exercise a right, people email privacy@prompthalo.ai. We promise to acknowledge within a few working days and to respond within one month, or to tell the person if we need longer because the request is complex. We may need to verify who they are before acting. We do not charge unless a request is manifestly unfounded or excessive. An authorized agent may act for someone if that person confirms they may."}, {"k": "sec", "t": "12. How we protect it", "items": ["Encrypt in transit and at rest", "Access only for those who need it", "Multi-factor authentication required", "Access logged and reviewed; people screened", "High-risk breach: tell people promptly"], "art": "Breach notifications, where owed", "cad": "Without undue delay", "n": "Section 12 describes how we protect personal data. We encrypt it in transit and at rest, restrict access to those who need it for their work, require multi-factor authentication, log and review access to our systems, and screen the people who work with us. The Notice also admits that no system is perfectly secure. If a personal data breach is likely to result in a high risk to someone's rights, we tell them without undue delay, and we notify the relevant supervisory authority where the law requires it."}, {"k": "sec", "t": "13 and 14. Children and changes", "items": ["Business use, not directed at children", "No data knowingly collected under 16", "Child's data reported to us is deleted", "Updated on change and at least yearly", "Material change: tell affected people"], "art": "Previous Notice versions kept", "cad": "At least annually and on change", "n": "Section 13 says our website and services are intended for business use and are not directed at children. We do not knowingly collect personal data from anyone under 16, and if someone believes a child has given us personal data, we delete it. Section 14 says we update the Notice when what we do changes, and at least once a year. The date at the top shows the last update, and we keep previous versions. Where a change materially affects personal data we already hold, we tell affected people directly rather than relying on the page."}, {"k": "table", "t": "Artifacts and cadence", "head": ["Artifact", "Cadence"], "rows": [["GDPR applicability assessment", "At least annually; before UK or EEA work"], ["Privacy Notice and prior versions", "On change and at least annually"], ["Marketing suppression record", "When someone unsubscribes"], ["Rights request acknowledgment", "Within a few working days"], ["Rights request response", "Within one month"], ["Sub-processor list and notices", "Before a new sub-processor starts"]], "n": "Here are the artifacts behind the Notice's promises. The GDPR applicability assessment is reviewed at least annually and before we serve UK or EEA customers. The Notice is updated on change and at least annually, with previous versions kept. A suppression record is created when someone unsubscribes. Rights requests are acknowledged within a few working days and answered within one month. The sub-processor list is kept current, with notice before a new sub-processor starts."}, {"k": "sign", "t": "Acknowledge this notice", "items": ["Name, version, date", "Quiz: 60% to pass", "Public notice, not the internal Policy"], "side": "At hire and when it changes", "n": "You acknowledge this notice when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Remember that the Privacy Notice is public, and it is separate from the internal Privacy Policy and the Privacy Implementation Plan. Thank you for helping us keep every promise we make in it. Let's move on to the questions."}]}, {"key": "privplan", "title": "Privacy Implementation Plan", "id": "PLN-PRIV-001", "version": "1.0", "date": "August 28, 2026", "blurb": "Who does what, by when, and what proves it.", "slides": [{"k": "title", "t": "Privacy Implementation Plan", "sub": "Who does what, by when, and what proves it", "body": "Six workstreams that turn our stated privacy obligations into a working, evidenced record.", "meta": "PLN-PRIV-001, version 1.0, August 28, 2026", "n": "Welcome to PromptHalo's Privacy Implementation Plan training. This Plan is not the Privacy Policy and not the public Privacy Notice. It is the schedule that turns the obligations those documents already carry into dated work with named owners and evidence. We will cover the purpose, scope and roles, where we stand today, the six workstreams, the milestones, the evidence, the measures, and the assumptions. You can pause, rewind, speed up, or skip ahead at any time. At the end, you will answer short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this plan exists", "items": [["doc", "Policy states", "What we owe people whose data we hold"], ["list", "Plan schedules", "Who does what, by when"], ["clip", "Artifact proves", "Evidence named for every item"]], "banner": ["No new obligations.", "It schedules the ones the Policy and Notice already carry."], "n": "Section 1 sets the purpose. The Privacy Policy states what PromptHalo owes the people whose personal data it holds. This Plan says who does what about it, by when, and what artifact proves it was done. Nothing in the Plan creates a new obligation. It is worked in order, and a completed workstream stays in the document with its evidence named, because the next examination will ask when it was done, not whether it is still on a list."}, {"k": "grid", "t": "2. What the plan covers", "items": [["users", "As controller", "Personnel, candidates, visitors, contacts"], ["shield", "As processor", "Personal data held for clients"], ["server", "Systems", "Every system holding that data"], ["link", "Sub-processors", "Every provider that touches it"]], "n": "Section 2 sets the scope. The Plan covers personal data the Company holds as controller: personnel, candidates, website visitors, enquirers, and customer contacts. It also covers personal data the Company processes as processor on behalf of clients. It includes the systems that hold that data and the sub-processors that touch it."}, {"k": "sec", "t": "3. Roles and Responsibilities", "items": ["Accountable Party owns the Plan and scoping", "Accountable Party accepts or rejects closures", "Security Officer runs it and holds artifacts", "Committee receives reports, records acceptance", "External counsel engaged by the Accountable Party"], "art": "Quarterly progress report", "cad": "Each quarterly review while open", "n": "Section 3 sets the roles. The Accountable Party owns the Plan, approves the scoping position, and accepts or rejects any workstream that closes without meeting its measure. The Security Officer runs the Plan day to day, holds the artifacts, and reports progress at each quarterly review while workstreams remain open. The Information Security Steering Committee receives that report, and its acceptance of a closed workstream is recorded like any other Committee decision. Where a workstream needs external counsel, for a transfer assessment or a controller or processor determination, the Accountable Party engages it and the advice is kept with the artifact."}, {"k": "sec", "t": "4. Current Position", "items": ["Privacy Policy and Privacy Notice are aligned", "Notice carries the Article 13 and 14 disclosures", "Privacy audit category out of scope, by decision", "No completed processing inventory yet", "No exercised request or tested breach path"], "art": "Recorded scoping decision", "cad": "Revisited when scope triggers occur", "n": "Section 4 describes where we stand. The Privacy Policy and the published Privacy Notice exist and are aligned, and the Notice carries the GDPR Article 13 and 14 disclosures. The Privacy category of the Trust Services Criteria is out of scope by a recorded decision, revisited when a client agreement requires it or when the Company begins acting as controller for material volumes. The obligations are stated, but the operating record behind several is thin: no completed processing inventory, no exercised data subject request procedure, and no tested breach notification path. This Plan closes that gap."}, {"k": "sec", "t": "5. Workstream 1, Processing Inventory", "items": ["Record purpose, data, basis, systems, retention", "Include recipients and the transfer position", "Reconcile with sub-processor and asset lists", "Confirm controller or processor, with reasoning", "Review yearly and on significant change"], "art": "Record of processing activities", "cad": "Due Q4 2026, then yearly", "n": "Workstream 1 builds the processing inventory under GDPR Article 30. Each processing activity is recorded with its purpose, categories of data and data subjects, legal basis, systems, recipients, retention period, and transfer position. The inventory is reconciled against the sub-processor list and the asset inventory, so no system holding personal data can be missing from any of the three. The Security Officer owns the inventory, and the Accountable Party confirms whether we act as controller or processor for each activity, both due in Q4 2026. It is reviewed annually and on significant change, with a Risk Management Policy trigger named to catch new activities."}, {"k": "sec", "t": "6. Workstream 2, Notice, Cookies, Consent", "items": ["Test: no non-essential cookie before consent", "Record the test with a date and browser trace", "Consent record shows what, when, how withdrawn", "Verify Global Privacy Control is honored", "Review the Notice and the Policy together"], "art": "Cookie and consent test record", "cad": "Due Q4 2026", "n": "Workstream 2 checks that what we publish is what our site actually does. The Security Officer verifies that the deployed cookie banner sets no non-essential cookie before consent, and records the test with a date and a browser trace, because a banner that is present but ineffective is the common finding. The consent record must keep what was consented to, when, and how it can be withdrawn, and withdrawal must take effect. Global Privacy Control signals must be honored, as the Notice states. These are due in Q4 2026. The Notice and the Policy go on one review, so a change to either forces a read of the other."}, {"k": "sec", "t": "7. Workstream 3, Data Subject Requests", "items": ["Write the procedure: intake to retention", "Verify identity; route controller or processor", "Run one test request and time it", "Open the request register, even if empty", "Align client path, agreements, and Notice"], "art": "Procedure, register, and test result", "cad": "Q4 2026; client path Q1 2027", "n": "Workstream 3 makes data subject requests real. The Security Officer writes the procedure by Q4 2026: intake at the published address, identity verification, the controller or processor routing decision, the response clock, and what is kept afterwards. One test request is run end to end and its elapsed time recorded against the statutory period, because an untested procedure is a document, not a control. The request register is opened even if it stays empty, since an empty register with a start date is evidence. By Q1 2027 the Accountable Party confirms the client-facing path for requests we receive as processor."}, {"k": "sec", "t": "8. Workstream 4, Sub-processors, Transfers", "items": ["Complete list: what, where, which contract", "DPA with Article 28(3) terms for each", "Record the transfer mechanism outside UK/EEA", "Transfer assessment where SCCs are used", "Set the new sub-processor notice path"], "art": "Sub-processor list, DPAs, transfer records", "cad": "List Q4 2026; the rest Q1 2027", "n": "Workstream 4 covers sub-processors and transfers. The Security Officer completes the sub-processor list by Q4 2026, showing what each processes, where, and the contract that binds it. By Q1 2027 the Accountable Party confirms a data processing agreement with every sub-processor that touches client personal data, carrying the Article 28(3) terms rather than a general confidentiality clause. The transfer mechanism is recorded for each provider outside the UK or EEA, with a transfer assessment where we rely on Standard Contractual Clauses. The Security Officer also sets the client notification path for a new sub-processor and the notice period our agreements commit to."}, {"k": "sec", "t": "9. Workstream 5, Breach Notification", "items": ["Name the personal data case in the matrix", "Who assesses risk to individuals", "72-hour supervisory authority clock", "Processor tells controller without undue delay", "Keep client breach contacts current"], "art": "Extended matrix and exercise record", "cad": "Matrix Q4 2026; exercise yearly", "n": "Workstream 5 prepares breach notification. By Q4 2026 the Security Officer extends the incident notification matrix to name the personal data case explicitly: who assesses risk to individuals, the 72-hour clock for the supervisory authority under GDPR Article 33, and our duty as processor to tell the controller without undue delay. A personal data scenario is added to the annual incident exercise, and we record where the matrix was wrong. The client contact of record for breach notification is confirmed current for every active engagement and refreshed at the annual review."}, {"k": "sec", "t": "10. Workstream 6, AI Processing Position", "items": ["Record each AI service's training exclusion", "Record the setting that enforces it", "Verify the setting; do not assume it", "No significant automated decision unowned", "Re-verify on provider, plan, or model change"], "art": "AI training exclusion verification", "cad": "Verified Q4 2026; re-verify on change", "n": "Workstream 6 covers AI processing. For each AI service used in delivery or internally, we record the terms that exclude our submissions from provider training and the configuration setting that gives effect to them. That setting is verified, not assumed, and the check is recorded, because the statement in the Privacy Notice depends on it and nothing else. By Q1 2027 the Accountable Party confirms that no automated decision with legal or similarly significant effects on an individual is made without a named person accountable for the output. The check is repeated on any change of provider, plan, or model."}, {"k": "table", "t": "11. Sequence and Milestones", "head": ["Quarter", "Milestone", "Owner"], "rows": [["Q4 2026", "Inventory drafted; AI exclusion verified", "Security Officer"], ["Q4 2026", "Cookie and consent tested; register opened", "Security Officer"], ["Q4 2026", "Notification matrix extended", "Security Officer"], ["Q1 2027", "DPAs confirmed; transfers recorded", "Accountable Party / Security Officer"], ["Q1 2027", "Request procedure exercised once", "Accountable Party / Security Officer"], ["Q1 2027", "Notice and Policy on a joint review", "Accountable Party / Security Officer"], ["Q2 2027", "Personal data scenario in incident exercise", "Security Officer"], ["Q2 2027", "Triggers updated; Plan closed or reissued", "Security Officer"]], "n": "Section 11 sets the order, and the order matters. The inventory comes first because every later workstream refers to it, and the AI verification comes early because a public statement already depends on it. Q4 2026 delivers the inventory, cookie and consent testing, AI verification, the request register, and the extended matrix. Q1 2027 delivers agreements, transfer records, one exercised request, and the joint review. Q2 2027 runs the personal data exercise, updates triggers, and closes or reissues the Plan. A missed date is recorded with a reason and a new date, never moved silently."}, {"k": "check", "t": "13. Measures", "items": ["Each activity: basis, retention, system", "Article 28(3) terms with each sub-processor", "Test request inside the statutory period", "AI exclusion verified in last 12 months", "No closure without its artifact"], "big": "No blanks", "bigsub": "A blank in the inventory is a finding, not a placeholder", "n": "Section 13 sets the measures. Every processing activity in the inventory has a legal basis, a retention period, and a named system, and a blank is a finding. Every sub-processor holding client personal data has an executed agreement carrying Article 28(3) terms. A test data subject request completes within the statutory period, measured rather than estimated. The AI training exclusion has been verified in the last twelve months for every service in use. And no workstream is reported complete without its artifact in the repository."}, {"k": "sec", "t": "14. Assumptions and Dependencies", "items": ["We stay processor for client personal data", "If not, the Plan is reissued, not extended", "Dates assume current Security Officer cadence", "Contested points depend on external counsel", "Refused 28(3) terms go to Accountable Party"], "art": "Recorded date changes and escalations", "cad": "As needed", "n": "Section 14 lists the assumptions. The Company continues to act as processor rather than controller for client personal data, and if that changes, the Plan is reissued rather than extended. Dates assume the Security Officer engagement continues at its current cadence, and any change that moves a date is recorded. Transfer assessments and genuinely contested controller or processor questions depend on external counsel being available. Sub-processor terms depend on what providers will agree to, and where a provider will not give Article 28(3) terms, the position is escalated to the Accountable Party rather than absorbed."}, {"k": "table", "t": "Records you create", "head": ["Evidence", "Workstream", "When"], "rows": [["Record of processing activities", "1", "Q4 2026; reviewed yearly"], ["Cookie and consent test record", "2", "Q4 2026, with dates and results"], ["Request procedure, register, test result", "3", "Q4 2026 to Q1 2027"], ["Sub-processor list, DPAs, transfer records", "4", "Q4 2026 to Q1 2027"], ["Extended matrix and exercise record", "5", "Q4 2026; exercise yearly"], ["AI training exclusion verification", "6", "Per service, dated"], ["Quarterly report; Committee acceptance", "All", "Each quarter while open"]], "n": "Section 12 names the evidence the Plan produces. The record of processing activities, with its review dates. The cookie and consent test record, with dates and results. The data subject request procedure and register, and the test request result. The sub-processor list, executed data processing agreements, and transfer mechanisms and assessments. The extended notification matrix and the exercise record for the personal data scenario. The AI training exclusion verification for each service, with its date. And the quarterly progress reports, with the Committee's acceptance of each closed workstream."}, {"k": "sign", "t": "Acknowledge this plan", "items": ["Name, version, date", "Quiz: 60% to pass", "Plan, not Policy or Notice"], "side": "At hire and when it changes", "n": "You acknowledge this plan when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Remember that this Plan schedules the work, while the Privacy Policy states our obligations and the Privacy Notice tells the public. Thank you for helping us prove our privacy commitments, not just state them. Let's move on to the questions."}]}, {"key": "cook", "title": "Cookie Policy", "id": "POL-COOK-001", "version": "1.0", "date": "September 2, 2026", "blurb": "Strictly necessary cookies only. No tracking.", "slides": [{"k": "title", "t": "Cookie Policy", "sub": "Strictly necessary cookies only", "body": "Our public policy on the cookies and similar technologies we set, and the ones we deliberately do not.", "meta": "POL-COOK-001, version 1.0, September 2, 2026", "n": "Welcome to PromptHalo's Cookie Policy training. This is a public policy, published for anyone who visits prompthalo.ai or signs in to the PromptHalo platform, so you should be able to explain it accurately to a client. We will cover what a cookie is, our approach, the cookies we set, the one third party in the sign-in flow, what we do not use, how people control cookies, and how this policy changes. At the end, you will answer short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Purpose and Scope", "items": [["globe", "Where", "prompthalo.ai and the signed-in platform"], ["lock", "What we set", "Strictly necessary cookies only"], ["ok", "No banner", "Nothing we set needs consent"]], "banner": ["Sits alongside the Privacy Notice.", "Terms the Notice defines mean the same here."], "n": "Section 1 sets the purpose and scope. The policy explains how PromptHalo uses cookies and similar technologies on prompthalo.ai and on the signed-in platform, and it names every cookie the Company sets, what each does, and how long it lasts. We set strictly necessary cookies only: no analytics, no advertising or tracking cookies, and no third-party trackers. Because nothing we set requires consent, there is no cookie banner and no preference center. That absence is a deliberate decision, not an oversight."}, {"k": "two", "t": "2. What a Cookie Is", "items": [["lock", "Strictly necessary", ["Service cannot work without it", "Keeps you signed in", "No consent required"]], ["alert", "Every other category", ["Analytics, ads, tracking", "Consent required first", "We set none of these"]]], "n": "Section 2 explains the terms. A cookie is a small text file a website stores in your browser and reads back on later requests. Related technologies, such as local storage, session storage and pixels, work differently but serve similar purposes, and the policy covers them too. A cookie is strictly necessary when the service cannot function without it: keeping you signed in, protecting a form submission, or routing your request to the server holding your session. Under the ePrivacy Directive and comparable US rules, strictly necessary cookies need no consent. Every other category does."}, {"k": "sec", "t": "3. Our Approach", "items": ["Strictly necessary cookies only", "No analytics, telemetry cookies, or pixels", "No session replay or third-party trackers", "Reliability measured from server-side records", "Consent controls before any other cookie"], "art": "Server-side request records", "cad": "Kept up to thirteen months", "n": "Section 3 describes our approach. The Company has decided not to run analytics, product telemetry cookies, marketing pixels, session replay, or any third-party tracker on its site or platform. Service reliability is measured from server-side request records described in the Privacy Notice, not from cookies in your browser. Those records are retained for up to thirteen months under the Data Retention, Disposal and Disaster Recovery Policy. If the Company ever introduces a cookie that is not strictly necessary, consent controls are implemented before it is set, and this policy is updated first."}, {"k": "sec", "t": "4. Cookies We Set", "items": ["First-party cookies, set by prompthalo.ai", "Every one classified strictly necessary", "Public marketing pages set no cookies", "Cookies start only when you sign in", "Each named with its purpose and lifetime"], "art": "Cookie table in this policy", "cad": "Updated before any cookie change ships", "n": "Section 4 covers the cookies we set. They are first-party cookies, set by prompthalo.ai, and all of them are classified strictly necessary. The public marketing pages set no cookies at all until you sign in. As Section 1 commits, the policy names every cookie the Company sets, what each one does, and how long it lasts, and that table is the reference for any question about a specific cookie."}, {"k": "sec", "t": "5. Third-Party Cookies", "items": ["No third-party trackers embedded", "Google Workspace is our identity provider", "Google sets its own cookies on its domains", "We neither set nor read Google's cookies", "We receive only the identity assertion"], "art": "None specified", "cad": "At each sign-in", "n": "Section 5 covers third parties. The Company embeds no third-party trackers, and one third party appears in the sign-in flow. Google Workspace is our identity provider. When you sign in, you are handed to Google to authenticate, and Google sets its own cookies on its own domains to manage that. Those cookies are governed by Google's privacy and cookie policies, not ours, and the Company neither sets nor reads them. We receive only the identity assertion confirming that you signed in successfully."}, {"k": "check", "t": "6. What We Do Not Use", "items": ["No analytics cookies of any kind", "No ad, retargeting, or conversion pixels", "No cross-site behavioral tracking", "No session replay or heatmaps", "No cookie-setting embeds or fingerprinting"], "big": "Nothing to sell", "bigsub": "No sale or sharing for cross-context advertising", "n": "Section 6 lists what we do not use: analytics cookies, including Google Analytics or any equivalent; advertising, retargeting or conversion pixels; cross-site or cross-context behavioral tracking of any kind; session replay or heatmap tools; social media embeds that set cookies; and fingerprinting or any technique that identifies a device without cookies. The Company does not sell personal information and does not share it for cross-context behavioral advertising, as California law defines those terms. It holds no cookie-based data to sell."}, {"k": "sec", "t": "7. Controlling Cookies", "items": ["Browsers can view, block, and delete cookies", "Private browsing discards them on close", "Blocking ours stops platform sign-in", "Public pages stay readable", "Global Privacy Control is honored"], "art": "None specified", "cad": "As needed", "n": "Section 7 explains control. Every major browser lets people view, block and delete cookies, and offers a private mode that discards them when the window closes. Because we set only strictly necessary cookies, blocking them has a direct effect: the person cannot sign in to the platform, and it will not work. The public pages remain readable. The Company honors Global Privacy Control and comparable browser-level opt-out signals. Since we run no tracking, such a signal confirms what we already do rather than changing our behavior."}, {"k": "sec", "t": "8. Changes to This Policy", "items": ["Policy and table updated before production", "Anything beyond necessary needs consent first", "Account administrators told beforehand", "Reviewed yearly with the Privacy Notice"], "art": "Updated policy and cookie table", "cad": "Before each change; reviewed yearly", "n": "Section 8 covers change. If a cookie is added, removed or changed, this policy and its cookie table are updated before the change reaches production. Adding anything beyond strictly necessary cookies also means introducing consent controls first, and account administrators are told before that happens. The policy is reviewed annually, together with the Privacy Notice, so the two cannot drift apart."}, {"k": "table", "t": "Artifacts and cadence", "head": ["Artifact", "Section", "When"], "rows": [["Cookie table: name, purpose, lifetime", "1, 4", "Before any cookie change ships"], ["Server-side request records", "3", "Retained up to thirteen months"], ["Consent controls", "3, 8", "Before any non-essential cookie"], ["Notice to account administrators", "8", "Before non-essential cookies"], ["Joint review with Privacy Notice", "8", "Annually"]], "n": "Here is what this policy keeps current. The cookie table, naming each cookie with its purpose and lifetime, is updated before any cookie change reaches production. Server-side request records are retained for up to thirteen months. Consent controls must exist before any cookie that is not strictly necessary is set, and account administrators are told before that happens. Finally, the policy is reviewed every year together with the Privacy Notice."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass", "Public policy: describe it accurately"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Because this policy is public, clients and visitors will rely on exactly what it says, so describe our cookie use accurately and flag any change before it ships. Thank you for helping us keep this promise simple and true. Let's move on to the questions."}]}, {"key": "gdpr", "title": "GDPR Territorial Scope", "id": "ASM-GDPR-001", "version": "1.0", "date": "September 2, 2026", "blurb": "Not in scope today. Ready for when we are.", "slides": [{"k": "title", "t": "GDPR Territorial Scope", "sub": "Not in scope today, ready for when we are", "body": "Why the EU and UK GDPR do not currently reach PromptHalo, and what changes when we expand.", "meta": "ASM-GDPR-001, version 1.0, September 2, 2026", "n": "Welcome to PromptHalo's GDPR Territorial Scope Assessment training. This is an assessment, not a policy. It records a dated decision about whether the EU and UK GDPR apply to us, the reasoning behind it, and what must happen before we serve European customers. We will walk through the decision, the three Article 3 tests, our position as a processor, how our public statements stay aligned, the expansion sequence, and the limits of the assessment. At the end, you will answer short questions and sign your acknowledgment."}, {"k": "grid", "t": "The assessment at a glance", "items": [["flag", "Decision", "GDPR does not currently apply"], ["user", "Owner", "Security Officer"], ["clock", "Review", "Yearly and on any trigger"], ["globe", "Direction", "EU and UK expansion intended"]], "n": "Here is the assessment at a glance. The Company has concluded that neither the EU GDPR nor the UK GDPR currently applies to its processing. The Security Officer owns the assessment. It is reassessed every year and whenever a trigger occurs. It is a dated position, not a settled one: the Company intends to serve customers in the European Union and the United Kingdom as soon as it is commercially able, and the assessment is written to be superseded."}, {"k": "sec", "t": "1. Decision", "items": ["Article 3 territorial tests are not met", "No Article 27 representative appointed", "Recorded here and in the risk register", "Reassessed yearly and on any trigger", "Expansion needs no additional headcount"], "art": "This assessment; risk register entry", "cad": "Yearly and on any trigger", "n": "Section 1 records the decision. Neither the EU GDPR nor the UK GDPR currently applies, because the territorial scope tests in Article 3 are not met. On that basis the Company has not appointed a representative under Article 27 and does not publish one. The decision is recorded here and in the risk register, next to the decision to scope the Privacy category out of the current examination. The sections that matter most cover when the tests are met and how we meet the obligations without adding staff, because the Company has no capacity for more headcount and the expansion plan requires none."}, {"k": "sec", "t": "2. Why This Assessment Exists", "items": ["Size gives no exemption from Article 27", "Article 27(2) exemption is narrow; not used", "We rely on an earlier gate: no reach at all", "That position must be written down", "Missing representative looks like a failure"], "art": "This assessment", "cad": "Yearly and on any trigger", "n": "Section 2 explains why this record exists. Company size creates no exemption from Article 27; there is no small-business carve-out. The only exemption, in Article 27(2), is narrow and requires all of these: processing is occasional, excludes large-scale special category or criminal offence data, and is unlikely to risk rights and freedoms. The EDPB reads occasional as outside the regular course of business, and the Company does not rely on it. We rely on an earlier gate: the Regulation does not reach us at all. That must be documented, because a privacy notice with no named representative otherwise looks like a compliance failure."}, {"k": "sec", "t": "3. Article 3(1) Establishment", "items": ["Applies where an EU establishment exists", "Incorporated and operating in the US", "Based in Frisco, Texas", "No EU or UK office, branch, agent, or staff", "Article 3(1) is not engaged"], "art": "This assessment", "cad": "Yearly and on any trigger", "n": "Section 3 applies the first test. Article 3(1) applies the Regulation to processing in the context of the activities of an establishment in the Union, wherever the processing happens. The Company is incorporated and operates in the United States, at 6475 Preston Road, Unit 140, Frisco, Texas. It has no office, branch, subsidiary, agent or personnel in any Member State or in the United Kingdom. Article 3(1) is not engaged."}, {"k": "sec", "t": "4. Article 3(2)(a) Offering Goods or Services", "items": ["Reaches offering services to people in the EU", "Applies whether or not payment is required", "A reachable website is not enough", "What counts is evidence of intent to target", "No indicator present; not engaged"], "art": "This assessment", "cad": "Yearly and on any trigger", "n": "Section 4 applies the second test. Article 3(2)(a) reaches a controller outside the Union where processing relates to offering goods or services to data subjects in the Union, whether or not payment is required. EDPB Guidelines 3/2018 are explicit that a website merely being accessible from the Union is not sufficient. What matters is evidence of an intention to target. No such indicator is present, so Article 3(2)(a) is not engaged."}, {"k": "sec", "t": "5. Article 3(2)(b) Monitoring Behavior", "items": ["Online tracking counts as monitoring", "We set strictly necessary cookies only", "No analytics, pixels, replay, or fingerprinting", "Server records: no profiling or combining", "Load-bearing: depends on no tracking"], "art": "Cookie Policy and Privacy Notice", "cad": "Holds while no tracking is true", "n": "Section 5 applies the third test. Article 3(2)(b) reaches monitoring the behavior of people in the Union, and the EDPB treats internet tracking, including analytics, profiling and behavioral advertising, as monitoring. The Company sets strictly necessary cookies only, with no analytics, advertising pixels, session replay, cross-site tracking or fingerprinting, as published in the Cookie Policy and Privacy Notice. Reliability comes from server-side request records kept up to thirteen months, and we never profile visitors or combine those records with other sources. This is the load-bearing conclusion, and it depends entirely on the no-tracking decision remaining true."}, {"k": "sec", "t": "6. Position as a Processor", "items": ["Client data may include EU or UK people", "That alone does not trigger Article 3(2)", "Client's Article 28 agreement binds us", "Privacy Policy already commits to those duties", "Gap: no Company DPA addendum yet"], "art": "Risk register gap entry", "cad": "Until a DPA addendum exists", "n": "Section 6 covers our role as processor. Data we process on a customer's instructions may include people in the Union or the United Kingdom, but that does not by itself bring us within Article 3(2). The targeting or monitoring must be our own. What binds us then is the customer's data processing agreement under Article 28: documented instructions, sub-processor notice, help with data subject requests, and breach notification to the controller. The Privacy Policy already commits to these. The Company does not yet have a data processing addendum of its own, and that is recorded as a gap in the risk register."}, {"k": "two", "t": "7. Two Questions Kept Apart", "items": [["globe", "Does it apply?", ["A legal question", "Answered by Article 3", "Today: not currently"]], ["heart", "Our standard", ["A policy choice", "Rights extended to everyone", "SCCs where a transfer needs one"]]], "n": "Section 7 separates two questions that must stay apart in every artifact. Whether the Regulation applies is a legal question, answered by Article 3, and only that answer decides whether an Article 27 representative is required. What standard we hold ourselves to is a policy choice: we extend the Privacy Notice rights of access, correction, deletion, restriction, portability and objection to everyone who asks, and use Standard Contractual Clauses where a transfer or contract needs them. Meeting a standard voluntarily does not make us subject to it, but a customer can enforce a published commitment, so we state only what we will do."}, {"k": "sec", "t": "7. Keeping the Public Position Aligned", "items": ["Privacy Notice: Which law applies", "Compliance ledger GDPR row in index.html", "Trust Center FAQ GDPR entry", "Edit one, edit all three in the same release", "Mismatch with internal records is the risk"], "art": "Notice, ledger row, and Trust Center FAQ", "cad": "Changed together, same release", "n": "Three public artifacts carry this position and must change together. The Privacy Notice section Which law applies states the applicability position, the absence of a representative, and the commitment to appoint one before serving UK or EEA customers. The GDPR row of the compliance ledger in index.html reads: territorial scope assessed annually, GDPR-grade rights extended to everyone. The Trust Center FAQ gives the same two-part answer. If any one is edited, the other two are edited in the same release. A public claim of applicability beside an internal record denying it reads, in a dispute, as knowing the public page overstated the position."}, {"k": "sec", "t": "8. Expansion: Marketing Crosses the Line", "items": ["Intent to target, not a signed contract", "Outbound or campaigns aimed at EU or UK", "Pricing in euro or sterling", "European prospects held in a CRM to sell", "A late representative cannot cure the gap"], "art": "Recorded go date", "cad": "Before the first European outbound", "n": "Section 8 covers expansion into the UK or the EEA. The question is not whether these obligations arrive but when, and it is earlier than most companies assume. The line is crossed by marketing, not by signature. Directing outbound at European prospects, running a campaign that targets those markets, pricing in euro or sterling, or holding European prospect contacts in a CRM to sell to them can all engage Article 3(2)(a). By the time a contract is signed, the Regulation has usually applied for months, and a representative appointed after processing has begun does not cure the period before it."}, {"k": "flow", "t": "8. The Expansion Sequence", "steps": [["flag", "Go date", "Set before first European outbound", "DCEFE2"], ["user", "Appoint", "EU and UK representatives, separately", "E3ECFA"], ["doc", "Disclose", "Name them in the Privacy Notice", "FBF0DC"], ["list", "Record", "Complete the Article 30 record", "F3E5F5"], ["send", "Publish", "DPA and sub-processor list", "E0F2F1"], ["link", "Transfers", "Confirm SCCs; reissue public text", "FDE7E7"]], "banner": "Appoint both representatives when European outbound begins, not at signature.", "n": "Here is the sequence. Decide the go date before the first deliberate act of targeting. Appoint the representatives: EU and UK appointments are separate, and both are subscriptions, not employees. Name them in the Privacy Notice under the Article 13(1)(a) disclosure, because an unnamed representative does not satisfy the obligation. Complete the Article 30 record of processing activities. Publish the data processing addendum and sub-processor list. Confirm the transfer mechanism, then reissue the Notice, ledger row and FAQ together. Early appointment costs a small subscription; late appointment is a documented failure during a European customer's diligence."}, {"k": "sec", "t": "9. Meeting Obligations Without New Staff", "items": ["Representative is a subscription, not a hire", "Low three-figure sum per jurisdiction yearly", "Verify pricing and terms before appointing", "A DPO is almost certainly not required", "Representative may never double as DPO"], "art": "Written representative appointment", "cad": "At expansion; Article 37 on change", "n": "Section 9 shows that none of this needs headcount. An Article 27 representative is a person or entity established in a Member State, appointed in writing, acting as contact point for authorities and data subjects. Specialist providers, including Prighter, DataRep, EDPO and Rickert, supply it as an annual subscription, typically a low three-figure sum per jurisdiction, usually with the UK bundled. Verify current pricing first. A Data Protection Officer is almost certainly not required under Article 37: we run no behavioral tracking, process no special category data, and our core activity is security testing. The EDPB treats representative and DPO as incompatible roles."}, {"k": "table", "t": "9. What Cannot Be Outsourced", "head": ["Obligation", "What it takes"], "rows": [["Record of processing activities", "A spreadsheet: a day, reviewed yearly"], ["Data subject requests", "One month, extendable by two if complex"], ["Breach notification", "72 hours from awareness, where notifiable"], ["Breach readiness", "Template, named deputy, clock decision rule"], ["Sub-processor change notice", "Mailing list and a stated notice period"], ["Recurring cost", "Small subscription; about a day a quarter"]], "n": "Some work stays with us. The record of processing activities is a spreadsheet, built once and reviewed yearly. Data subject requests are answered within one month, extendable by two for complex requests, and at our volume the Security Officer absorbs them. Breach notification to the supervisory authority within 72 hours is the one demanding commitment, because the clock starts at awareness, not confirmation. It is met by preparation: a drafted template, a named deputy, and a rule for when the clock starts, done before expansion. If we later monitor at scale or process special category data, the Article 37 analysis is rerun."}, {"k": "sec", "t": "11. What to Do if a Trigger Fires", "items": ["Reopen; record changed facts before acting", "Get legal advice on Article 3(2)", "If engaged, appoint EU and UK representatives", "Name them; share the processing record", "Review public statements and reissue"], "art": "Reopened assessment; written mandate", "cad": "Before the triggering activity starts", "n": "Sections 10 and 11 cover reassessment. A trigger requires this assessment to be reopened before the activity begins, not afterwards. When one fires, reopen the assessment and record the changed facts. Obtain legal advice on whether Article 3(2) is engaged, and do not appoint a representative preemptively, because naming one asserts the Regulation applies. If it is engaged, appoint a representative in the relevant Member State by written mandate, plus a separate UK appointment. Publish their details in the Privacy Notice, give them the record of processing activities, route requests and authority correspondence to the Security Officer, and review public statements for new obligations."}, {"k": "sec", "t": "12. Limits of This Assessment", "items": ["A business judgment, not a legal opinion", "Not yet reviewed by counsel", "Counsel review before a contract relies on it", "Notice, ledger, and assessment now consistent", "Article 30 record kept regardless"], "art": "Record of processing activities", "cad": "Maintained as good practice", "n": "Section 12 sets the limits. This record is a documented business judgment, not a legal opinion, and it has not been reviewed by counsel. It should be before the Company signs a contract that turns on it. The earlier inconsistency between this assessment, the Privacy Notice and the compliance ledger has been resolved, and all three are maintained together. Finally, the Article 30(5) exemption for records of processing is a different exemption. It applies below 250 employees but falls away where processing is regular, which personnel data is, so we keep a record of processing activities regardless."}, {"k": "table", "t": "Artifacts and cadence", "head": ["Artifact", "Section", "When"], "rows": [["This assessment and risk register entry", "1", "Yearly and on any trigger"], ["Risk register gap: no Company DPA", "6", "Until an addendum exists"], ["Notice, ledger row, Trust Center FAQ", "7", "Edited together, same release"], ["Go date and representative mandates", "8, 9, 11", "Before European outbound"], ["Record of processing activities", "9, 12", "Reviewed yearly"], ["Breach template, deputy, clock rule", "9", "Before expansion"]], "n": "Here are the artifacts this assessment relies on. The assessment itself and its risk register entry, reviewed yearly and on any trigger. The risk register gap for our missing data processing addendum. The Privacy Notice, compliance ledger row and Trust Center FAQ, always edited together in one release. The go date and written representative mandates, in place before European outbound begins. The record of processing activities, reviewed yearly. And the breach notification template, named deputy and clock decision rule, prepared before expansion."}, {"k": "sign", "t": "Acknowledge this assessment", "items": ["Name, version, date", "Quiz: 60% to pass", "No EU or UK outbound before a go date"], "side": "At hire and when it changes", "n": "You acknowledge this assessment when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Remember that the conclusion depends on two facts staying true: we do not track visitors, and we do not target European customers. If you plan anything that could change either, raise it before it starts. Thank you. Let's move on to the questions."}]}, {"key": "pi", "title": "Processing Integrity", "id": "POL-PI-001", "version": "1.0", "date": "August 24, 2026", "blurb": "Validate, process, deliver, and fix errors.", "slides": [{"k": "title", "t": "Processing Integrity", "sub": "Complete, accurate, timely, authorized", "body": "What PromptHalo requires of data at input, processing, output, and storage, and how processing errors are handled.", "meta": "POL-PI-001, version 1.0, August 24, 2026", "n": "Welcome to PromptHalo's Processing Integrity Policy training. It covers why processing integrity matters, the key terms, our objectives, the requirements at each stage of processing, how processing errors are handled, monitoring and review, and the records we keep. You can pause or skip ahead at any time. At the end, you will answer short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["db", "Our value", "Depends on data processed correctly"], ["list", "Four stages", "Input, processing, output, storage"], ["link", "One place each", "Names other policies, never restates them"]], "banner": ["Deliberately short:", "one description of each control, one place to change it."], "n": "Section 1 sets the purpose. PromptHalo delivers a service whose value depends on the data it processes being complete, accurate, timely, and authorized. This policy states what we require at each stage, input, processing, output, and storage, and where a processing error is dealt with. It is deliberately short. Where another policy already governs an activity, such as access, change, classification, retention, logging, incident handling, or backup, this policy names that policy rather than restating it."}, {"k": "grid", "t": "2 and 3. Scope and roles", "items": [["users", "All personnel", "Our data and data processed for customers"], ["pen", "Accountable Party", "CEO, or Security Officer, owns it"], ["tool", "Engineering", "Owns correctness of product processing"], ["check", "Steering Committee", "Approves; reviews at least annually"]], "n": "Section 2 says the policy applies to all personnel and to data we process for ourselves or for a customer, in every environment it passes through. Processing integrity is not in scope for the current examination period; the policy is kept so the category can be added later, and the Information Security Steering Committee records the categories in scope before each period. Where a requirement would cost more than the risk, the lighter form is used and the reason recorded. Section 3: the CEO, or the Security Officer, owns the policy, Engineering owns processing correctness, and the Security Officer confirms the controls annually."}, {"k": "grid", "t": "4. What integrity means", "items": [["check", "Complete", "All processed, nothing silently dropped"], ["target", "Accurate", "Output matches input and rules"], ["lock", "Authorized", "Entitled requester, entitled data"], ["clock", "Timely", "Within the period we committed to"]], "n": "Section 4 defines the terms. Complete means all of the data that should have been processed was processed, and none was silently dropped. Accurate means the output corresponds to the input and to the processing rules meant to apply. Authorized means the processing was requested by someone entitled to request it, on data they are entitled to reach. Timely means within the period we committed to, or what a customer would reasonably expect where there is no commitment. A processing error is any instance where data is incomplete, inaccurate, unauthorized, or late."}, {"k": "sec", "t": "5. Processing integrity objectives", "items": ["Encrypted in transit and at rest", "Access only under the Access Control Policy", "Covered at onboarding and annual refresher", "Reviewed with Data Classification yearly", "Customer commitments in commitment register"], "art": "Commitment register entries", "cad": "Annually, and as commitments change", "n": "Section 5 sets the objectives. Data is protected on entry, in processing, in storage, and on exit, and is encrypted in transit and at rest under the Encryption Standard. Only authorized personnel and customer users reach it, under the Access Control Policy. Personnel learn what these requirements mean during onboarding and at the annual refresher under the Security Awareness and Training Policy. This policy is reviewed together with the Data Classification Policy each year. What we commit to customers about processing is recorded in the commitment register, so an obligation never exists only in a contract."}, {"k": "sec", "t": "6. System inputs", "items": ["Validate structure, type, range at the boundary", "Reject what cannot be validated", "Record the origin of each input", "No anonymous input into a processing path", "Bulk input: partial failure fails the batch"], "art": "Input validation and rejection logs", "cad": "On every input", "n": "Section 6 covers inputs. Inputs are validated at the boundary before processing, covering structure, type, and range, and anything that cannot be validated is rejected rather than passed through. The origin of each input is recorded so a downstream error can be traced. Inputs must be attributable to an authenticated identity; anonymous input into a processing path is not permitted. Rejected inputs are logged with the reason, and a rejection rate that moves materially is investigated rather than tolerated. For bulk or file-based input the same validation applies, and a partial failure fails the whole batch."}, {"k": "sec", "t": "7. System processing", "items": ["Logic changes only via Change Management", "Test changes affecting correctness", "Failed runs are logged and alerted", "Retries are bounded and idempotent", "No direct edits of stored data by users"], "art": "Processing logs and change test evidence", "cad": "On every change and run", "n": "Section 7 covers processing. Processing logic changes only through the Change Management Policy, and changes affecting correctness are tested before release. Failures are detected rather than assumed absent: failed and incomplete runs are logged and alerted. Retries are bounded and idempotent, so a retry cannot duplicate a result. End users cannot edit stored data directly; changes go through defined application functions and are logged. Where a model or automated agent is part of a processing path, its outputs are processing outputs under this policy, and the AI Governance Policy governs how it is approved and monitored."}, {"k": "sec", "t": "8. System outputs", "items": ["Complete, accurate, to the right party", "Wrong recipient: error and security incident", "Exports tested before release", "Log what was produced and to whom", "Flag incomplete results to the recipient"], "art": "Output and export logs", "cad": "On every output", "n": "Section 8 covers outputs. Outputs must be complete, accurate, and delivered to the party entitled to receive them. Delivery to the wrong recipient is a processing error and is also handled as a security incident. Export and reporting functions are tested before release under the Change Management Policy, and end users cannot configure them in ways that alter their correctness. Outputs are logged well enough to establish what was produced and to whom. If an output is known to be incomplete, for example because a source was unavailable, the recipient is told rather than shown it as complete."}, {"k": "table", "t": "9. System storage: who governs what", "head": ["Topic", "Governed by"], "rows": [["Encryption at rest", "Encryption Standard"], ["Access to stored data", "Access Control Policy"], ["Backups and their retention", "Business Continuity Policy"], ["Retention and disposal", "Data Retention, Disposal and DR Policy"], ["Log retention", "Logging and Monitoring Policy"]], "n": "Section 9 covers storage, and it points to other policies rather than repeating them. Data at rest is protected under the Encryption Standard and reachable only under the Access Control Policy. Backups and their retention are governed by the Business Continuity Policy, and this policy sets no separate backup schedule. Retention and disposal follow the Data Retention, Disposal and Disaster Recovery Policy: data is not kept longer because it is convenient. Logs are retained as the Logging and Monitoring Policy defines."}, {"k": "flow", "t": "10. Handling a processing error", "steps": [["alert", "Identify", "Monitoring, staff, or a customer", "F7DEDE"], ["doc", "Ticket", "Data, period, customers affected", "E9E3F5"], ["eye", "Triage", "Customer impact: to Security Officer", "F7EDC9"], ["tool", "Correct", "Via Change Management; log reprocessing", "DDEBF7"], ["edit", "Record", "Missing control: plan of action", "DCEFE2"]], "banner": "Same cause again? Escalate it as a design concern, not another repeat fix.", "n": "Section 10 covers processing errors. However an error is found, by monitoring, personnel, or a customer, it is recorded in the ticketing system with the data, period, and customers affected. Each error is triaged for impact; if it affected customer data or a recorded commitment, it goes to the Security Officer and is handled under the Incident Response Plan, whose notification matrix governs customer notice. Correction goes through Change Management, and any reprocessing is recorded. A missing or failed control is recorded in the plan of action under the Information Security Policy. Recurring errors of the same cause are escalated as a design concern."}, {"k": "sec", "t": "11. Monitoring and review", "items": ["Access reviews cover customer data", "Processing logs reviewed on schedule", "Anomalies follow incident response", "Controls confirmed at annual review", "No change? Recording that is enough"], "art": "Annual confirmation record", "cad": "Annually", "n": "Section 11 covers monitoring and review. Access to data we process is reviewed at the cadence set by the Access Control Policy, and that review covers customer data specifically. Logs relevant to processing, meaning rejected inputs, failed runs, export activity, and administrative changes, are reviewed at the cadence in the Logging and Monitoring Policy, and anomalies follow the incident response process. The controls in this policy are confirmed as operating at the annual review, and the confirmation is recorded. Where nothing has changed, recording that finding satisfies the requirement."}, {"k": "two", "t": "13 and 14. Enforcement and exceptions", "items": [["alert", "Enforcement", ["Discipline up to termination", "Security Officer documents", "Raise concerns with a manager"]], ["pen", "Exceptions", ["Written request to Security Officer", "Steering Committee approves", "Compensating control, expiry"]]], "n": "Section 13 covers enforcement. Violations may lead to disciplinary action up to and including termination of employment or contract. The Security Officer documents the finding and recommends action, and the CEO determines and documents the outcome. If you are asked to do something you believe violates this policy, raise it with your ma
