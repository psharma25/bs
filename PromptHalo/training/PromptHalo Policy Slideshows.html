he incident, customer agreements, legal requirements, and legal advice where appropriate. The CEO, or a designee, decides on and coordinates material notifications. Where we act as a processor, we notify the controller without undue delay. Decisions and their basis are recorded whether or not we notify, and contractual commitments are kept in a notification register."}, {"k": "sec", "t": "9. Incident records", "items": ["Register lists every reported event", "Date, severity, and disposition", "Non-incidents are recorded too", "Critical and High: full timeline and impact", "Existing tickets or documents can serve"], "art": "Event and incident register", "cad": "Every reported event", "n": "Section 9 covers records. The Security Officer, or a designee, keeps an event and incident register listing each reported event with its date, severity, and disposition, including events closed as non-incidents. For Critical and High incidents, the record also includes a timeline, the systems and data affected, containment, findings, customer impact, the notification decision, recovery, and follow-up. Existing tickets, shared documents, emails, GitHub issues, or security tool records may serve as the record."}, {"k": "sec", "t": "10. Testing", "items": ["Annual tabletop exercise", "Confirms reporting and contacts work", "Covers containment, investigation, recovery", "Notification is considered", "Issues found are tracked to resolution"], "art": "Tabletop exercise record", "cad": "At least annually", "n": "Section 10. At least annually, the Company runs a tabletop exercise confirming that personnel know how to report, the right people can be contacted, containment and investigation are understood, recovery can be coordinated, and notification is considered. The tabletop may exercise business continuity and disaster recovery in the same scenario, such as a compromised AWS credential with customer data potentially affected while the primary engineer is unavailable. Significant issues found are tracked to resolution."}, {"k": "check", "t": "11. The first hour", "items": ["Report and call the Security Officer", "Open a record and start the timeline", "Contain the immediate threat", "Preserve logs and evidence", "Set severity; check notification register"], "big": "First hour", "bigsub": "Suspected Critical or High incident", "n": "Section 11 lists the incident contacts, including a phone number that works when email is down, plus legal counsel, the cyber insurer, and AWS Support. In the first hour of a suspected Critical or High incident: report to security at prompthalo dot ai and call the Security Officer. Open an incident record and start the timeline. Contain the immediate threat. Preserve logs and evidence where practical. Confirm the severity and whether the CEO, counsel, or outside help is needed, and check the notification register."}, {"k": "sec", "t": "12. Exceptions and review", "items": ["Departures may be needed during an incident", "Note significant departures in the record", "Standing exceptions: Exception Register", "Plan reviewed at least annually", "And after a significant incident or change"], "art": "Incident record; Exception Register", "cad": "Yearly and after major incidents", "n": "Section 12 covers exceptions and review. During an incident, circumstances may require departing from this Plan. Significant departures are noted in the incident record, and standing exceptions are recorded in the Exception Register. The Plan is reviewed at least annually, and after a significant incident or change that warrants an update."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "How often"], "rows": [["Event and incident register entry", "6, 9", "Every reported event"], ["Timeline and full incident record", "9", "Each Critical or High incident"], ["Corrective actions", "7", "Tracked in tickets or risk records"], ["Notification decision and basis", "8", "Each evaluation, notified or not"], ["Notification register", "8", "Holds contractual commitments"], ["Tabletop exercise and issues", "10", "At least annually"], ["Departures and exceptions", "12", "When they occur"]], "n": "Here are the records this Plan produces. Every reported event goes in the event and incident register, even if closed as a non-incident. Critical and High incidents get a full record with a timeline. Corrective actions are tracked in existing tickets or risk records. Each notification decision and its basis is recorded, whether or not we notify, and the notification register holds our contractual commitments. The tabletop is recorded annually, and departures and standing exceptions are recorded when they occur."}, {"k": "sign", "t": "Acknowledge this plan", "items": ["Name, version, date", "Quiz result recorded", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this Plan when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for reporting early and helping PromptHalo respond well when something goes wrong. Let's move on to the questions."}]}, {"key": "ic", "title": "Internal Control", "id": "POL-IC-001", "version": "1.0", "date": "August 24, 2026", "blurb": "Own, operate, evaluate, and fix controls.", "slides": [{"k": "title", "t": "Internal Control", "sub": "Policies followed, not merely published", "body": "How PromptHalo owns, operates, evaluates, and corrects its controls as one system.", "meta": "POL-IC-001, version 1.0, August 24, 2026", "n": "Welcome to PromptHalo's Internal Control Policy training. This walkthrough covers why the policy exists, the control environment, how controls are owned, how they are evaluated, how deficiencies are tracked to verified closure, how changes to controls are handled, what we tell external parties, and enforcement. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["lock", "Safeguard", "Assets protected against loss"], ["target", "Operate", "Operations run efficiently"], ["check", "Follow", "Policies actually followed"]], "banner": ["One system:", "not a second program beside the Information Security Policy."], "n": "Section 1 sets the purpose. PromptHalo maintains a system of internal control so that its assets are safeguarded against loss, its operations run efficiently, and its stated policies are actually followed rather than merely published. This policy does not create a second control program alongside the Information Security Policy. It explains how the controls authorized by that policy are owned, operated, and evaluated as one system, so anyone can tell what we rely on and how we know the reliance is justified."}, {"k": "grid", "t": "2. What it covers", "items": [["users", "All personnel", "Everyone who works for the Company"], ["server", "All assets", "Apps, infrastructure, systems, data"], ["shield", "Every control", "Technical, administrative, physical"], ["link", "Vendor-run too", "Controls a vendor operates for us"]], "n": "Section 2 says the policy applies to all personnel, all Company-owned or managed information assets, and the applications, infrastructure, systems, and data through which we deliver our service. It covers technical, administrative, and physical controls, whether operated by the Company or by a vendor on its behalf. It is written for a company of our current size. Where a requirement would cost more effort than the risk it addresses, the lighter form is used and the reason recorded. Where a review finds nothing has changed, recording that finding satisfies the requirement."}, {"k": "grid", "t": "3. Roles", "items": [["user", "Accountable Party", "Owns the control system"], ["users", "Steering Committee", "Approves; receives deficiency reports"], ["eye", "Security Officer", "Matrix, evaluations, deficiencies"], ["pen", "Control owner", "A named individual, not a role"]], "n": "Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party, accountable for the existence and effectiveness of the internal control system. The Information Security Steering Committee approves the policy, reviews it at least annually, and receives the deficiency reporting. The Security Officer maintains the control matrix, coordinates the evaluations, and tracks deficiencies to closure in the plan of action. Each control has a named individual as its owner, not a role alone."}, {"k": "table", "t": "4. Key terms", "head": ["Term", "Meaning"], "rows": [["Control", "Activity on a cadence that produces evidence"], ["Control matrix", "Each control's risk, owner, cadence, evidence"], ["Preventive control", "Stops an undesired event from occurring"], ["Detective control", "Identifies that an undesired event occurred"], ["Evidence", "Lets a reviewer reach the operator's conclusion"], ["Deficiency", "Absent, not operating, or no evidence"], ["Plan of action", "Single record of deficiencies and fixes"]], "n": "Section 4 defines the key terms. A control is an activity, automated or manual, performed on a defined cadence that produces evidence it occurred. The control matrix records each control's risk, owner, cadence, type, and evidence. A preventive control stops an undesired event; a detective control identifies that one has occurred. Evidence must be enough for a reviewer to reach the same conclusion as the operator. A deficiency is a control that is absent, not operating as described, or not producing evidence. The plan of action is the single record of deficiencies and corrective actions."}, {"k": "sec", "t": "5. The control environment", "items": ["Controls work only as well as their setting", "Code of Conduct: on hire and annually", "Security duties written and acknowledged", "Org chart shows reporting lines and contractors"], "art": "Code of Conduct acknowledgment; org chart", "cad": "On hire and annually", "n": "Section 5 describes the control environment: the structures, reporting lines, standards of behavior, and management attitude within which controls operate. Senior management recognizes that controls operate only as well as that environment permits. The standards of behavior expected of personnel are in the Code of Conduct, which personnel acknowledge on hire and annually thereafter. Security responsibilities are defined for all roles, communicated in writing, and acknowledged. The organization chart records reporting lines and includes contractors."}, {"k": "sec", "t": "5. Segregation and reporting", "items": ["Segregation of duties where practicable", "Compensating control recorded on FRM-CE-001", "Size limit on independence: in risk register", "Report control failures to Security Officer", "Concerns about the Security Officer: ethics route"], "art": "FRM-CE-001 and risk register entry", "cad": "Reviewed at each annual assessment", "n": "Segregation of duties is applied where practicable. Where our size prevents full segregation, the compensating control is recorded on the Annual Control Environment Assessment form and reviewed at each annual assessment. The Company acknowledges that its size limits independence, and carries that limitation as a discrete risk register entry with its compensating control, rather than treating it as no risk. Personnel report suspected control failures, policy violations, and incidents to the Security Officer. Concerns about the Security Officer's conduct can go through the ethics reporting route in the Code of Conduct."}, {"k": "sec", "t": "6. Controls treat recorded risks", "items": ["Matrix: risk, owner, cadence, type, evidence", "Adopted to treat a recorded risk", "Never just because a framework lists it", "Preventive or detective is recorded", "Detective-only treatment is deliberate"], "art": "Control matrix", "cad": "Kept current as controls change", "n": "Section 6 covers ownership. The control matrix records, for each control, the risk it treats, its named owner, its cadence, whether it is preventive or detective, and the evidence it produces. Controls are selected in response to risks identified under the Risk Management Policy. A control is not adopted because a framework lists it; it is adopted because it treats a risk the Company has recorded. Where a risk is treated only by detective controls, that position is deliberate and recorded."}, {"k": "sec", "t": "6. Owners and accountability", "items": ["Owner operates on cadence, keeps evidence", "Accountability lines reviewed yearly", "Vendor controls: Company-side confirmation", "Vendor controls under POL-VM-001", "Check no one owns too many controls"], "art": "Control evidence; FRM-CE-001 conclusion", "cad": "On each control's cadence; yearly", "n": "Each control owner operates the control on its cadence and keeps the evidence it produces. Lines of accountability are reviewed at least annually and corrected where performance measures are not met. Where a vendor operates a control on our behalf, the matrix records that fact and identifies the Company-side control that confirms it is operating, and vendor controls are governed by the Vendor Management Policy. The annual control environment assessment also considers whether anyone holds more control responsibilities than they can reasonably discharge, and records the conclusion."}, {"k": "sec", "t": "7. Evaluating controls", "items": ["Senior management reviews at least yearly", "Confirms controls work and fit objectives", "Scoped by what each control is for", "Reviews documents and period evidence", "Sampling allowed; higher risks first"], "art": "Signed internal control review", "cad": "At least annually", "n": "Section 7 says senior management reviews internal control processes at least annually, confirming that controls operate effectively and remain aligned to business objectives. Control objectives are identified by their relevance to the Company, department, business line, or product, so the evaluation is scoped to what a control is for. The evaluation reviews the pertinent policies, procedures, and documentation, and the evidence each control produced. Management may sample controls rather than test all of them every year, recording the basis of selection and preferring controls that treat higher-rated risks."}, {"k": "sec", "t": "7. Independence and sign-off", "items": ["Not assessed only by the control's operator", "No independent assessor: CEO signs", "Management signs off; findings shared", "Fix or remove outdated procedures", "Recorded on FRM-CE-001"], "art": "FRM-CE-001 with reviewing signature", "cad": "Annually", "n": "Self-assessments are not performed solely by the person who operates the control. If our size prevents an independent assessor, the CEO reviews and signs the completed assessment. A member of management, or a designee, documents the review and signs it off, and findings go to those who need to act. Outdated or non-operating procedures are updated or removed, and new controls are added where needed. The assessment is recorded on form FRM-CE-001, and may be one annual exercise if each element is separately recorded. An independent examination required by a client supplements, but does not replace, this evaluation."}, {"k": "sec", "t": "8. Recording deficiencies", "items": ["Failures communicated to management", "Logged in the plan of action", "Each has an owner and remediation date", "Security Officer tracks to closure", "No separate deficiency register"], "art": "Plan of action entry", "cad": "When a deficiency is found", "n": "Section 8 covers deficiencies. Identified control failures and deficiencies, and the corrective action plans proposed for them, are addressed and communicated to management. Deficiencies are recorded in the plan of action maintained under the Information Security Policy, each with an assigned owner and a remediation date, and the Security Officer tracks them to closure. This policy does not create a separate deficiency register. Each issue is assessed for its impact on internal control, and where warranted, a corrective action plan is developed, documented, and monitored until implemented."}, {"k": "flow", "t": "8. A deficiency from finding to closure", "steps": [["alert", "Identify", "Control absent, failing, or no evidence", "F7DEDE"], ["edit", "Record", "Plan of action, owner, due date", "F7EDC9"], ["tool", "Correct", "Corrective action plan, monitored", "DDEBF7"], ["eye", "Verify", "Effective; who verified and when", "E9E3F5"], ["check", "Close", "Only after verification is recorded", "DCEFE2"]], "banner": "Reopened after closure? Escalate it as a control design concern.", "n": "Here is the life of a deficiency. It is identified, recorded in the plan of action with an owner and remediation date, and corrected through a monitored corrective action plan. The corrective action is then verified as effective, recording who verified it and when. Only then is the deficiency closed. Recording a corrective action as performed does not close it. A deficiency that reopens after closure is escalated as a concern with the design of the control, rather than remediated again on the same terms."}, {"k": "check", "t": "8. Escalation rules", "items": ["Missed control activity is a deficiency", "Even if performed later", "Severity assigned to each deficiency", "Reported to the Committee quarterly", "Overdue deficiencies escalated"], "big": "Quarterly", "bigsub": "Written deficiency report to the Steering Committee", "n": "Failing to perform a scheduled control activity or evaluation by its due date is itself a deficiency. It is recorded and escalated whether or not the activity is performed later. Deficiencies are assigned a severity and reported in writing to the Information Security Steering Committee at least quarterly, in the report required by the Information Security Policy. Deficiencies open beyond their agreed remediation date are escalated in that report."}, {"k": "sec", "t": "9. Changes affecting internal control", "items": ["Assess the effect before making a change", "Management approves before implementation", "Security changes follow POL-CM-001", "Triggers: reassess under POL-RSK-001", "Tell affected personnel; record it"], "art": "Change approval and communication record", "cad": "With each change to a control", "n": "Section 9 says management assesses what a corrective action or other change does to internal control before it is made, considering the external environment, business model, leadership, and relationships with vendors, partners, and other third parties. All changes to control activities are approved by management first. Changes affecting network or IT security follow the Change Management Policy. If a reassessment trigger is met, the Risk Management Policy governs, and closing the change includes updating the control matrix, System Security Plan, and asset inventory. Changes are communicated to affected personnel, and a retired control's record states how its risk is now treated."}, {"k": "sec", "t": "10. Communicating with external parties", "items": ["Material changes affecting NDAs or contracts", "Decide if a third party must affirm it", "Management approves legal communications", "Update the commitment register", "Monitored security contact address"], "art": "External communications and affirmations", "cad": "When a change is material", "n": "Section 10 covers external parties. The Company communicates about internal control where a change is material to a nondisclosure agreement or to contractual confidentiality and privacy provisions. It assesses whether a customer, partner, vendor, or other third party must be told and affirm the change, proportionately. Communications with legal or regulatory implications are approved by management before they go out. If a change affects a recorded customer commitment, the commitment register is updated. A monitored security contact address lets anyone report concerns. Where we rely on a subservice organization, the carve-out method applies."}, {"k": "sec", "t": "12 and 13. Enforcement and exceptions", "items": ["Violations may lead to discipline", "Security Officer documents and recommends", "CEO decides and documents the outcome", "Exceptions: Committee approves in writing", "Lighter alternative: Governance Decisions Log"], "art": "Exception record or Governance Decisions Log", "cad": "Reviewed at expiry or annual review", "n": "Section 12 says violations may result in discipline up to termination, and unlawful activity may be reported to law enforcement. The Security Officer documents the finding and recommends action, and the CEO determines and documents the outcome. If you are asked to do something you believe violates this policy, raise it with your manager, any other manager, or the ethics route. Section 13: exceptions are requested in writing to the Security Officer and approved by the Steering Committee, with rationale, compensating control, approver, and expiry date. Lighter proportionate alternatives are recorded in the Governance Decisions Log and revisited annually."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "When"], "rows": [["Control matrix", "6, 11", "Kept current"], ["Control evidence", "6", "On each control's cadence"], ["Self-assessments and FRM-CE-001", "5, 7", "Annually, with signature"], ["Management review sign-off", "7", "At least annually"], ["Plan of action and closure proof", "8", "Per deficiency"], ["Quarterly deficiency report", "8", "At least quarterly"], ["Change approvals and notices", "9", "Per change to a control"], ["External communications", "10", "When a change is material"]], "n": "Section 11 lists the records. The control matrix, with owners, cadences, and evidence types. Completed self-assessments and the annual control environment assessment, with the reviewing signature. The plan of action, with deficiencies, owners, remediation dates, and closure verification. Management sign-off of each review and the findings shared. Approvals and communications of control changes, and external communications with any affirmations. These may live in systems we already use, as long as they are retrievable and attributable."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I report control failures", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping make sure our policies are actually followed, and that we can prove it. Let's move on to the questions."}]}, {"key": "log", "title": "Logging and Monitoring", "id": "POL-LOG-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Log what matters, alert, triage, review.", "slides": [{"k": "title", "t": "Logging and Monitoring", "sub": "What happened, when, where, and who", "body": "How PromptHalo records, protects, alerts on, and reviews activity in its systems.", "meta": "POL-LOG-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Logging and Monitoring Policy training. This walkthrough covers why we log, which systems are covered, what is logged, how logs are protected and retained, how alerts are triaged, the quarterly and annual reviews, and how AI and agent activity is logged. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["alert", "Detect", "Spot security events"], ["eye", "Investigate", "Understand what happened"], ["clock", "Reconstruct", "What, when, where, and who"]], "banner": ["Native logging:", "use the built-in capabilities of our platforms."], "n": "Section 1 sets the purpose. PromptHalo must record enough activity in its systems to detect, investigate, and reconstruct security events: what happened, when, from where, and who or what did it. Logging must use the native capabilities of the Company's platforms, rather than separate tools we would have to build and run ourselves."}, {"k": "grid", "t": "2. What it covers", "items": [["server", "AWS", "Accounts and workloads"], ["globe", "SaaS", "GitHub, Workspace, password manager"], ["cpu", "AI and agents", "AI services, agents, automations"], ["phone", "Not covered", "Personally owned devices"]], "n": "Section 2 sets the scope: Company-controlled systems. That means AWS accounts and workloads, the GitHub organization, Google Workspace, the password manager, Company AI services, and the agents and automations that act on those systems. The policy does not apply to personally owned devices. As the Acceptable Use Policy states, the Company operates no logging agent on them and collects nothing from them."}, {"k": "grid", "t": "3. Roles", "items": [["user", "Accountable Party", "CEO, or the Security Officer"], ["users", "Steering Committee", "Approves; reviews at least yearly"], ["eye", "Security Officer", "Oversees, triages, reviews"], ["tool", "Engineering", "Enables and maintains logging"]], "n": "Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party: they own the policy, oversee it, and may delegate duties. The Information Security Steering Committee approves the policy and reviews it at least annually. The Security Officer, or a designee, oversees logging, triages alerts, and performs the quarterly review. Engineering enables and maintains logging for the systems it manages."}, {"k": "table", "t": "5. What is logged", "head": ["System", "Activity logged"], "rows": [["AWS", "Management activity, all accounts and regions"], ["AWS storage", "Data access where customer data is held"], ["Google Workspace", "Admin, sign-in, third-party app access"], ["GitHub", "Org and repo audit, branch protection"], ["GitHub alerts", "Access changes and secret-scanning alerts"], ["Product", "App and agent activity from our code"]], "n": "Section 5 lists what is logged. In AWS, management activity in every account and region, and data access for storage holding customer information. In Google Workspace, administrator, sign-in, and third-party application access activity. In GitHub, organization and repository audit activity, including access changes, branch protection changes, and secret-scanning alerts. And in our product, application and agent activity written by the Company's own code."}, {"k": "sec", "t": "5. What every record shows", "items": ["What happened and when", "From where", "The identity involved", "No secrets, credentials, or full tokens", "No customer data; redact at the source"], "art": "Audit logs on each platform", "cad": "Continuous", "n": "An audit log is a system-generated record of an event, kept so activity can be reconstructed afterwards. Each record must show what happened, when, from where, and the identity involved. Secrets, credentials, full authentication tokens, and customer information are not written into logs. Where they might appear, they are redacted at the source, before the record is written."}, {"k": "sec", "t": "6. Protection and retention", "items": ["Keep logs at least thirteen months", "Covers a full twelve-month audit period", "Generating accounts cannot alter or delete", "Access limited; config changes are logged", "Export before a platform's records expire"], "art": "Log storage and retention settings", "cad": "Kept at least thirteen months", "n": "Section 6 says logs must be retained for at least thirteen months, so a twelve-month audit period is fully covered. Logs must be protected from alteration or deletion by the accounts that generate them, using separate storage or write-once settings where the platform supports it. Access to logs is restricted to those who need it, and changes to logging configuration must themselves be logged. Where a platform keeps records for less than thirteen months, they must be exported before they expire."}, {"k": "check", "t": "7. The alerts we configure", "items": ["Root or organization account use", "Logging configuration changes", "Backup changes or deletions", "New admin or unapproved app grants", "Secret-scanning findings"], "big": "Short list", "bigsub": "Only high-signal events raise alerts", "n": "Section 7 requires alerts for a short list of high-signal events. An alert is an automated notification raised when logged activity matches a detection rule. Ours cover root or organization-level account use, changes to logging configuration, changes to backup settings or deletion of backups, new administrative grants, unapproved third-party application grants, and secret-scanning findings."}, {"k": "flow", "t": "7. How an alert is handled", "steps": [["mail", "Alert", "Sent to security@prompthalo.ai", "DDEBF7"], ["eye", "Triage", "When it arrives", "F7EDC9"], ["edit", "Record", "Brief disposition, every time", "DCEFE2"], ["alert", "Escalate", "Suspected incident: use PLN-IRP-001", "F7DEDE"]], "banner": "Record a disposition even when the alert is not an incident.", "n": "Alerts go to security at prompthalo dot A I, and are triaged when they arrive. Each alert must receive a brief recorded disposition, including when it turns out not to be an incident. Anything suspected to be an incident must be escalated under the Incident Response Plan."}, {"k": "sec", "t": "8. Review", "items": ["Quarterly review of alerts and dispositions", "Includes privileged access in customer environments", "Record the date and conclusion", "No alerts? Record that too", "Yearly: review and adjust alert coverage"], "art": "Dated quarterly review record", "cad": "Quarterly; coverage yearly", "n": "Section 8 sets the reviews. At least quarterly, the Security Officer, or a designee, reviews the alerts and their dispositions for the period, including privileged access held in customer environments, and records the date and conclusion. A quarter with no alerts is recorded as such. At least annually, alerting coverage is reviewed and adjusted when systems change."}, {"k": "sec", "t": "9. AI and agent activity", "items": ["Each agent runs under its own identity", "Log input, tools, actions, and outcome", "AI config changes follow POL-CM-001", "No customer data in prompt logs", "Redact before keeping for debugging"], "art": "Agent activity logs", "cad": "Every agent action", "n": "Section 9 covers AI and agents. An agent is software that takes actions using tools or system interfaces. Each agent must run under its own identity, not a person's credentials, so its actions are attributable. Agent activity must be logged with enough context to reconstruct what happened: the triggering input, the tools used, the actions taken, and the outcome. Changes to models, guardrails, tool definitions, and retrieval configuration follow the Change Management Policy. Customer information must not be written into prompt or completion logs, and anything kept for debugging is redacted first."}, {"k": "sec", "t": "10. Exceptions", "items": ["Platform lacks a needed record", "Plan cannot meet the retention period", "Use a compensating control", "Record in the Exception Register", "Include a review date"], "art": "Exception Register entry", "cad": "When an exception arises", "n": "Section 10 covers exceptions. Sometimes a requirement cannot be met, for example when a platform does not emit a record we need, or a subscription plan does not support the thirteen-month retention period. In that case a compensating control is used, and the exception is recorded in the Exception Register with a review date."}, {"k": "table", "t": "Artifacts and cadence", "head": ["Artifact", "Section", "How often"], "rows": [["Platform audit logs", "5, 9", "Continuous"], ["Retention and protection settings", "6", "Kept 13 months or more"], ["Exported platform records", "6", "Before they expire"], ["Alert disposition", "7", "Every alert"], ["Quarterly alert review", "8", "At least quarterly"], ["Alert coverage review", "8", "At least annually"], ["Exception Register entry", "10", "With a review date"]], "n": "Here is what this policy produces. Platform audit logs and agent activity logs are written continuously. Retention and protection settings keep them at least thirteen months, and short-lived platform records are exported before they expire. Every alert gets a recorded disposition. The Security Officer records a quarterly review of alerts, even when there were none, and reviews alert coverage at least annually. Exceptions go in the Exception Register with a review date."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I keep secrets out of logs", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for helping us see what happens in our systems, and reconstruct it when it matters. Let's move on to the questions."}]}, {"key": "net", "title": "Network Security", "id": "POL-NET-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Control access and exposure, simply.", "slides": [{"k": "title", "t": "Network Security", "sub": "Control access and exposure, simply", "body": "How PromptHalo protects its cloud and SaaS systems from unauthorized access and exposure.", "meta": "POL-NET-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Network Security Policy training. We operate primarily in cloud and SaaS services, so this policy focuses on who can get in, what is exposed, and how information is protected. We will go section by section, then summarize the records the policy relies on. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["lock", "Unauthorized access", "Keep out people who should not be in"], ["globe", "Exposure", "Expose only what the business needs"], ["server", "Cloud first", "Controls fit our cloud and SaaS model"]], "banner": ["Purpose:", "protect systems from access, exposure and misuse."], "n": "Section 1 states the purpose: to protect PromptHalo systems and information from unauthorized access, exposure, and misuse through appropriate network and access security controls. The Company operates primarily using cloud and SaaS services, so network security controls are applied based on the systems, services, and risks that actually apply to us."}, {"k": "grid", "t": "2. Who and what it covers", "items": [["users", "All personnel", "Everyone who works for us"], ["server", "Cloud environments", "Company-managed accounts"], ["cpu", "Systems and apps", "Holding Company or customer data"], ["link", "Services", "That store, process, or transmit it"]], "n": "Section 2 sets the scope. The policy applies to Company personnel and to the Company-managed cloud environments, systems, applications, and services used to store, process, or transmit Company or customer information. If a system handles our information or our customers' information, these controls apply to it."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Committee approves and reviews yearly", "Security Officer oversees the policy", "Reviewed yearly and on significant change", "Personnel report suspected issues"], "art": "Annual policy review record", "cad": "At least annually", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy and may delegate duties. The Information Security Steering Committee approves it and reviews it at least annually. The Security Officer, or a designee, oversees the policy and reviews it at least annually and when significant changes to our environment or risk profile warrant it. Personnel follow the security requirements and report suspected security issues."}, {"k": "grid", "t": "4. Key terms", "items": [["globe", "External exposure", "Any system reachable from the internet"], ["user", "Privileged access", "Admin access that can change systems"], ["users", "Personnel", "Staff, contractors, interns, temps"], ["shield", "Steering Committee", "Today, the CEO, by dated record"]], "n": "Section 4 defines the terms. External exposure means any system or service reachable from the internet. Privileged access means administrative access that can change systems, configurations, or other users' access. Personnel means employees, officers, contractors, consultants, interns, and temporary workers. At our current size, the Steering Committee is the CEO, and a dated written record made or confirmed by the CEO satisfies any Committee decision or review."}, {"k": "flow", "t": "5. Network security at a glance", "steps": [["lock", "Access", "Authenticated, authorized only", "E9E3F5"], ["user", "Privilege", "Admin only where required", "DDEBF7"], ["globe", "Exposure", "Only what the business needs", "F7EDC9"], ["shield", "Encryption", "Protect data in transit", "FBE5D6"], ["eye", "Review", "Events, configs, vulnerabilities", "DCEFE2"]], "banner": "Protections fit our size, operating model, and risk.", "n": "Here is Section 5 on one slide. Access is authenticated and limited to authorized personnel. Privileged access is restricted to those who need it. External exposure is limited to legitimate business purposes. Information is encrypted in transit where supported and applicable. And security events, configurations, and vulnerabilities are reviewed and addressed based on risk. The Company maintains protections appropriate to its size, operating model, and risk."}, {"k": "check", "t": "5. Network and access security: minimum", "items": ["Access authenticated, authorized only", "Admin access only where required", "External exposure: business need only", "Configurations prevent unneeded access", "Encrypt in transit where supported"], "big": "Must", "bigsub": "These are the mandatory minimum controls", "n": "Section 5 sets the minimum. Access to Company systems and cloud environments must be authenticated and limited to authorized personnel. Administrative and privileged access must be restricted to personnel who require it. Externally exposed systems and services must be limited to legitimate business purposes. Cloud and network configurations must be maintained to prevent unnecessary or unauthorized access. Company and customer information must be protected in transit using appropriate encryption where supported and applicable."}, {"k": "sec", "t": "5. Changes, monitoring, vulnerabilities", "items": ["Security changes follow POL-CM-001", "Exposure changes follow it too", "Events and configs reviewed by risk", "Vulnerabilities evaluated by risk", "And addressed based on risk"], "art": "Change records and findings", "cad": "As changes and findings occur", "n": "Section 5 continues. Material changes affecting security or external exposure must follow the Change Management Policy. Security-relevant events and configurations are reviewed as appropriate, based on risk and the capabilities available to us. Identified network or cloud security vulnerabilities are evaluated and addressed based on risk."}, {"k": "sec", "t": "6. Remote and cloud access", "items": ["Remote access to cloud and SaaS allowed", "Use Company-authorized accounts", "Use the required authentication", "No traditional corporate network needed"], "art": "Company-authorized accounts", "cad": "Ongoing", "n": "Section 6 covers remote and cloud access. Personnel may access Company cloud and SaaS services remotely, using Company-authorized accounts and the required authentication controls. A traditional corporate network is not required. What matters is that every sign-in uses an authorized account and the authentication controls the system requires."}, {"k": "sec", "t": "7. Third-party services", "items": ["Providers may supply security controls", "Network and infrastructure controls", "Providers managed under POL-VM-001"], "art": "Vendor register entry", "cad": "Per Vendor Management Policy", "n": "Section 7 covers third-party services. The Company may rely on cloud and SaaS providers for network and infrastructure security controls. Those providers are managed under the Vendor Management Policy, POL-VM-001, which sets how vendors are classified, assessed, monitored, and offboarded. Relying on a provider's controls does not remove our own duties under Section 5."}, {"k": "sec", "t": "8. Exceptions", "items": ["Legitimate business need", "Resulting risk is acceptable", "Approved by the Accountable Party", "Material exceptions are documented"], "art": "Documented exception", "cad": "When a material exception is approved", "n": "Section 8 covers exceptions. The Accountable Party may approve an exception when there is a legitimate business need and the resulting risk is acceptable. Material exceptions are documented. The policy also works with related documents: the Information Security, Access Control, Change Management, and Vendor Management policies."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "When"], "rows": [["Policy review by Security Officer", "3", "At least annually, and on change"], ["Change record for security changes", "5", "Per Change Management Policy"], ["Vulnerability evaluation", "5", "As vulnerabilities are identified"], ["Provider records", "7", "Per Vendor Management Policy"], ["Documented exception", "8", "When a material exception is approved"]], "n": "Here are the records this policy relies on. The Security Officer reviews the policy at least annually and when significant changes warrant it. Material security or exposure changes leave a record under the Change Management Policy. Identified vulnerabilities are evaluated and addressed based on risk. Providers we rely on are managed under the Vendor Management Policy. And material exceptions are documented when they are approved."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-NET-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping access limited and exposure small. Let's move on to the questions."}]}, {"key": "pwd", "title": "Password and Authentication", "id": "POL-PWD-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Strong sign-in, safe secrets.", "slides": [{"k": "title", "t": "Password and Authentication", "sub": "MFA, password manager, no shared secrets", "body": "How PromptHalo protects accounts, passwords, and secrets.", "meta": "POL-PWD-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Password and Authentication Policy training. It covers your account, multi-factor authentication, passwords, secrets, account recovery, what to do if a credential is exposed, and how we review and handle exceptions. You can pause or skip ahead at any time. At the end, you will answer ten short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["lock", "Unauthorized access", "Prevent it with proper sign-in"], ["pen", "Credentials", "Managed securely"], ["target", "Risk-based", "Controls match system sensitivity"]], "banner": ["Purpose:", "appropriate authentication, secure credentials."], "n": "Section 1 states the purpose: to protect PromptHalo systems and information from unauthorized access by requiring appropriate authentication and secure management of credentials. Authentication controls are matched to the sensitivity and risk of the system being accessed, so a critical system gets stronger protection than a low-risk one."}, {"k": "grid", "t": "2. Who and what it covers", "items": [["users", "Personnel", "Employees and contractors"], ["user", "Admin accounts", "Administrative and privileged"], ["server", "Apps and SaaS", "Company applications and services"], ["cpu", "Non-human", "Service accounts, keys, tokens"]], "n": "Section 2 sets the scope. The policy applies to employees, contractors, and other personnel accessing Company systems; to administrative and privileged accounts; to Company applications and SaaS services; and to service accounts, API keys, tokens, and other non-human credentials. Machine credentials are covered just as much as people's passwords."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Committee approves and reviews yearly", "Security Officer oversees requirements", "Admins configure authentication", "Personnel protect credentials, use MFA"], "art": "Annual policy approval record", "cad": "At least annually", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy and may delegate duties. The Information Security Steering Committee approves it and reviews it at least annually. The Security Officer, or a designee, oversees authentication requirements. System administrators configure authentication controls for the systems they manage. Personnel protect their credentials, use required multi-factor authentication, and report suspected compromise promptly."}, {"k": "two", "t": "4. Key terms", "items": [["shield", "Phishing-resistant", ["Cannot be relayed by an attacker", "Example: a passkey", "Example: a hardware security key"]], ["cpu", "Secret", ["A non-human credential", "API key or access token", "Service or cloud access key"]]], "n": "Section 4 defines two terms that matter here. Phishing-resistant authentication is a sign-in method an attacker cannot relay, such as a passkey or a hardware security key. A secret is a non-human credential, such as an API key, an access token, a service credential, or a cloud access key. The Accountable Party is the CEO or, in their absence, the Security Officer."}, {"k": "sec", "t": "5. Authentication", "items": ["Individually assigned accounts", "Shared accounts only if technically needed", "MFA on critical systems where supported", "Phishing-resistant for admins, if practical", "SSO where practical and supported"], "art": "MFA and SSO configuration", "cad": "Ongoing; confirmed annually", "n": "Section 5. Personnel use individually assigned accounts, and shared user accounts are used only where technically necessary. Multi-factor authentication must be enabled for critical systems where supported, including Google Workspace, AWS, GitHub, the password manager, and other systems holding sensitive information. Phishing-resistant authentication should be used for privileged access where practical. Single sign-on is used where practical. A higher-cost tier is bought for single sign-on only when risk, customer requirements, or business need warrant it."}, {"k": "check", "t": "5. MFA on critical systems", "items": ["Google Workspace", "AWS", "GitHub", "The password manager", "Other systems with sensitive data"], "big": "Must", "bigsub": "MFA enabled on critical systems where supported", "n": "Here are the critical systems where multi-factor authentication must be enabled, where supported: Google Workspace, AWS, GitHub, the password manager, and any other system holding sensitive Company or customer information. For privileged or administrative access, a phishing-resistant method such as a passkey or hardware security key should be used where practical and supported."}, {"k": "sec", "t": "6. Passwords", "items": ["Long, hard to guess, unique", "Never shared by email or chat", "Change on compromise or requirement", "No routine age-based rotation", "No arbitrary composition rules"], "art": "Password manager entries", "cad": "When compromise is suspected", "n": "Section 6 covers passwords. Passwords must be long, hard to guess, unique to the Company account, and never shared through email, chat, or other insecure methods. A password is changed when compromise is suspected or confirmed, or when a system, customer, contract, or legal requirement calls for it. Routine age-based rotation and arbitrary composition rules are not required."}, {"k": "sec", "t": "6. Password manager and secrets", "items": ["Store in the approved password manager", "Password manager protected by MFA", "Not in email, chat, docs, or sheets", "Secrets never committed to source code", "Prefer managed identities and roles"], "art": "Secrets-management configuration", "cad": "Ongoing", "n": "Company passwords and shared credentials are stored in the approved password manager where possible, protected by multi-factor authentication, rather than in email, chat, documents, or spreadsheets. Secrets are protected from unauthorized access and are never committed to source code. Where practical, managed identities, roles, or secrets-management capabilities are used instead of embedded or long-lived credentials."}, {"k": "sec", "t": "7. Account recovery", "items": ["Reasonably verify the requester", "Sensitive accounts: not email alone", "Recovery never weakens MFA", "Emergency credentials stored securely", "Usable when primary sign-in fails"], "art": "Securely stored recovery credentials", "cad": "At each recovery", "n": "Section 7 starts with account recovery. Recovery reasonably verifies the identity of the person requesting it. Recovery of sensitive or administrative accounts does not rely solely on an unverified email or message, and it does not weaken multi-factor authentication. Recovery and emergency credentials are stored securely, in a way that permits authorized recovery when the primary authentication mechanism is unavailable."}, {"k": "flow", "t": "7. Suspected credential compromise", "steps": [["alert", "Spot", "Phishing, odd prompt, exposed key", "F7DEDE"], ["mail", "Report", "Promptly to security@prompthalo.ai", "F7EDC9"], ["lock", "Revoke", "Revoke, reset, or rotate", "DDEBF7"], ["check", "Verify", "Confirm the result", "DCEFE2"]], "banner": "Lost device or unexpected account activity? Report it too.", "n": "Personnel must report suspected credential compromise promptly to security at prompthalo dot ai. Examples include a password entered on a suspected phishing site, a sign-in prompt you did not start, an exposed API key or token, a lost device, or unexpected account activity. The affected credentials are then revoked, reset, or rotated, and the result is verified."}, {"k": "sec", "t": "8. Review", "items": ["Security Officer or designee reviews", "MFA still on for critical systems", "Password manager access appropriate", "System configuration is the evidence"], "art": "System configuration showing MFA", "cad": "At least annually", "n": "Section 8 covers review. At least annually, the Security Officer, or a designee, confirms that multi-factor authentication remains enabled for critical systems and that access to the password manager remains appropriate. The configuration from the systems that enforce these controls serves as the evidence, so no separate document needs to be produced."}, {"k": "sec", "t": "9. Exceptions", "items": ["Compensating control if a system can't comply", "Restricted access or network limits", "Strong unique password in the manager", "Reduced privileges or more monitoring", "Material exceptions: Exception Register"], "art": "Exception Register entry", "cad": "When a material exception arises", "n": "Section 9 covers exceptions. Where a system cannot reasonably meet a requirement of this policy, a compensating control is used. Examples include restricted access, network restrictions, a strong unique password held in the password manager, reduced privileges, or additional monitoring. Material exceptions are recorded in the Exception Register. Related documents include the Access Control Policy, STD-ENC-001 Encryption Standard, and PLN-IRP-001 Incident Response Plan."}, {"k": "table", "t": "Records you create", "head": ["Record", "Section", "When"], "rows": [["MFA and SSO configuration", "5, 8", "Confirmed at least annually"], ["Password manager access", "6, 8", "Confirmed at least annually"], ["Compromise report", "7", "Promptly, when suspected"], ["Revoke, reset, or rotate result", "7", "After each compromise"], ["Exception Register entry", "9", "For material exceptions"]], "n": "Here are the records this policy relies on. Multi-factor and single sign-on settings in the systems themselves, confirmed at least annually. Password manager access, also confirmed at least annually. A prompt report to the security mailbox when compromise is suspected, followed by the verified revoke, reset, or rotation. And an Exception Register entry for any material exception, with its compensating control."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-PWD-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping your accounts and secrets secure. Let's move on to the questions."}]}, {"key": "pr", "title": "Performance Review", "id": "POL-PR-001", "version": "1.0", "date": "August 24, 2026", "blurb": "Review yearly, cover controls, record it.", "slides": [{"k": "title", "t": "Performance Review", "sub": "One annual conversation, recorded and kept", "body": "How PromptHalo reviews each employee's work and confirms their security and control responsibilities.", "meta": "POL-PR-001, version 1.0, August 24, 2026", "n": "Welcome to PromptHalo's Performance Review Policy training. It covers why we hold reviews, who is reviewed and when, how a review is conducted, the security and control element every review must include, compensation, the records we keep, enforcement, and exceptions. You can pause or skip ahead at any time. At the end, you will answer short questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why we hold reviews", "items": [["users", "The work", "Requirements, wins, gaps, and next steps"], ["shield", "Security duties", "Discussed and confirmed in each review"], ["doc", "Recorded", "Consistent, written, and kept"]], "banner": ["Reviews carry weight:", "they may inform pay, responsibilities, and progression."], "n": "Section 1 sets the purpose. A performance review gives each person and the Company a scheduled occasion to discuss the work: what the role requires, what has gone well, what has not, and what should change before the next one. It is also where each person's security and control responsibilities are discussed and confirmed. Because reviews may inform compensation, responsibilities, and progression, they are conducted on a consistent basis, recorded, and kept."}, {"k": "grid", "t": "2 and 3. Who it covers and who owns it", "items": [["users", "All employees", "Every employee of the Company"], ["user", "Not covered", "Contractors: HR Security and Vendor policies"], ["pen", "The CEO", "Owns policy, reviews, approves pay changes"], ["shield", "Security Officer", "Adds the security and control element"]], "n": "Section 2 says the policy applies to all employees. Contractors and third-party personnel are assessed under the HR Security Policy and the Vendor Management Policy instead. Section 3 sets the roles. The CEO owns this policy, conducts reviews, and approves any compensation change arising from one. Because the Company has no management layer, the reviewer is the CEO or a delegate the CEO names in writing, and that delegation is recorded in the Governance Decisions Log. The Security Officer contributes the security and control element of each review and is reviewed by the CEO in the same cycle."}, {"k": "sec", "t": "2. The formal cycle replaces the CEO note", "items": ["This policy sets the formal performance cycle", "The dated CEO note fallback ends for employees", "The review now satisfies that requirement", "No amendment needed to the other policies", "One annual cycle, a short record, no grading"], "art": "Review record", "cad": "From the effective date", "n": "Section 2 also explains how this policy fits with others. The Information Security Policy and the HR Security Policy each say that, where no formal performance cycle exists, a dated note from the CEO confirming that control responsibilities were discussed is enough. From the effective date of this policy, that fallback no longer applies to employees: the review required here is what satisfies it. Those documents are corrected at their next scheduled review. The policy is written for our current size, with a single annual cycle and a short record, not a graded appraisal framework."}, {"k": "sec", "t": "4. Key terms", "items": ["Reviewer: the CEO or a named delegate", "Review record: date, people, topics, agreements", "Review cycle: the annual review period", "Control responsibilities: duties of the role"], "art": "Definitions in this policy", "cad": "Reviewed with the policy", "n": "Section 4 defines the terms. The reviewer is the CEO, or a delegate the CEO has named in writing for a particular review. The review record is the written record of a completed review, including the date, the participants, the matters discussed, and anything agreed. The review cycle is the annual period within which every eligible person is reviewed. Control responsibilities are the security and control duties assigned to a person's role, as recorded under the Information Security Policy."}, {"k": "sec", "t": "5. Eligibility and cadence", "items": ["Every employee reviewed at least annually", "Eligible after twelve months of employment", "CEO announces the dates of each cycle", "Missed review: deficiency in the plan of action", "Brought forward when control duties are added"], "art": "Cycle dates and list of people reviewed", "cad": "At least annually", "n": "Section 5 sets eligibility and cadence. Every employee is reviewed at least annually. An employee becomes eligible after twelve months of continuous employment; before that, the onboarding and probation arrangements in the HR Security Policy apply. The CEO announces the dates of each cycle, and reviews may be held more often with no approval needed. A review not held within the cycle is recorded as a deficiency in the plan of action under the Information Security Policy. A review may be brought forward on a material change of role, and is brought forward where a change adds control responsibilities."}, {"k": "flow", "t": "6. Conducting the review", "steps": [["clock", "Announce", "CEO sets format and timing", "E9E3F5"], ["users", "Review", "Objective and consistent", "DDEBF7"], ["shield", "Cover controls", "Every Section 7 matter", "F7EDC9"], ["edit", "Record", "Who, when, discussed, agreed", "FBE5D6"], ["check", "Approve", "Approvals before actions are shared", "DCEFE2"]], "banner": "A shortfall is recorded with what is expected and by when.", "n": "Section 6 covers conducting the review. The CEO sets the format and timing of each cycle; the format may change between cycles and differ between individuals, provided every review covers the matters in Section 7. Reviews are objective and consistent across the people reviewed in a cycle. Every review is recorded in writing: the person, the reviewer, the date, what was discussed, and what was agreed. A proposed action is not discussed with the person until its approvals are obtained. A shortfall is recorded with what is expected and by when; conduct matters go to the Code of Conduct and, where security is engaged, the HR Security Policy."}, {"k": "check", "t": "7. Security and control responsibilities", "items": ["What are the person's control duties?", "Are they being met?", "Are they still right for the role?", "Training and acknowledgments current?", "Too much for one person? Record it"], "big": "Every review", "bigsub": "Covers security and control responsibilities", "n": "Section 7 is the security heart of the policy. Every review covers the person's security and control responsibilities: what they are, whether they are being met, and whether they remain appropriate to the role. The review confirms that required security awareness training and policy acknowledgments are current. Where a person's control responsibilities have grown beyond what they can reasonably discharge, that is recorded and fed into the annual control environment assessment, which considers concentration and segregation of duties."}, {"k": "sec", "t": "7. Combining with the control assessment", "items": ["May share a sitting with the annual assessment", "Review record kept separate", "Assessment record kept separate", "Each record must be complete"], "art": "Review record and assessment record", "cad": "Annually", "n": "Section 7 also allows an efficiency. The performance review may be held in the same sitting as the annual control environment assessment. If it is, the review record and the assessment record are kept separate, and each must be complete on its own. This keeps the evidence for each requirement clear, even when one meeting covers both."}, {"k": "sec", "t": "8. Compensation", "items": ["A review does not itself produce a raise", "Based on overall performance and role", "CEO checks every proposed salary change", "Checked before it is communicated", "Compensation records are confidential"], "art": "Approval of compensation change", "cad": "When a change is proposed", "n": "Section 8 covers compensation. A review does not of itself produce a salary increase. Any change is assessed against the person's overall performance and their salary relative to the responsibilities of the role. The CEO reviews every proposed salary change for consistency with this policy and the Company's compensation guidelines before it is communicated. Compensation records are confidential and are handled under the Data Classification Policy and the Privacy Policy."}, {"k": "two", "t": "10 and 11. Enforcement and exceptions", "items": [["alert", "Enforcement", ["Discipline up to termination", "Security Officer documents findings", "Raise concerns with the CEO"]], ["pen", "Exceptions", ["Request in writing to the CEO", "Logged in Governance Decisions Log", "Rationale, approver, expiry"]]], "n": "Section 10 covers enforcement. Violations may lead to disciplinary action up to and including termination, and the Company may notify law enforcement of unlawful activity. Where a disciplinary matter arises from a security finding, the Security Officer documents the finding and recommends action, and the CEO determines and documents the outcome. If you are asked to do something you believe violates this policy, raise it with the CEO or through the ethics reporting route in the Code of Conduct as soon as possible. Section 11: exceptions are requested in writing to the CEO and recorded in the Governance Decisions Log with rationale, approver, and expiry date."}, {"k": "table", "t": "9. Records you create", "head": ["Record", "When", "Who can see it"], "rows": [["Completed review record", "Each review; kept per retention policy", "Reviewer, the person, need to know"], ["Cycle dates and people reviewed", "Each annual cycle", "Need to know"], ["Written delegation of a review", "When the CEO delegates", "Governance Decisions Log"], ["Approval of a compensation change", "When a change is proposed", "Confidential"], ["Missed review deficiency", "If a review is not held", "Plan of action"]], "n": "Section 9 lists the records. Completed review records are retained for the period in the Data Retention, Disposal and Disaster Recovery Policy. We also keep the dates announced for each cycle and the list of people reviewed, the CEO's written delegations of a review, and approvals of compensation changes. A missed review is recorded as a deficiency in the plan of action. Review records are confidential, reachable only by the reviewer, the person reviewed, and those with a defined need under the Access Control Policy."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["Name, version, date", "Quiz: 60% to pass", "Reviewed at least once a year"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for taking part in honest, recorded reviews that keep our security responsibilities clear. Let's move on to the questions."}]}, {"key": "phy", "title": "Physical Security", "id": "POL-PHY-001", "version": "1.0", "date": "August 18, 2026", "blurb": "Remote-first, practical, proportionate.", "slides": [{"k": "title", "t": "Physical Security", "sub": "Remote-first, practical, proportionate", "body": "How we protect information and devices at home, in the office, on the move, and at client sites.", "meta": "POL-PHY-001, version 1.0, August 18, 2026", "n": "Welcome to PromptHalo's Physical Security Policy training. We are a remote-first company with a small office, so this policy is short and practical. We will go section by section: the office and cloud infrastructure, remote working, devices away from home, client premises, the few records we keep, and exceptions. You can pause, rewind, speed up, or skip ahead at any time. At the end, you will answer a few questions and sign your acknowledgment."}, {"k": "three", "t": "1. Why this policy exists", "items": [["user", "Remote-first", "Mostly from home, sometimes at clients"], ["map", "Small office", "Optional, with no badges or keys"], ["server", "Cloud", "Data center controls covered by AWS"]], "banner": ["Purpose:", "simple, practical physical security expectations."], "n": "Section 1 sets the purpose. PromptHalo is a remote-first company with a small office. People work mainly from home and sometimes at client sites. We process no information on hardware we own in a data center, so physical and environmental controls for our cloud infrastructure are provided by AWS. This policy sets simple, practical expectations for remote working, the office, and client premises."}, {"k": "grid", "t": "2. Who and what it covers", "items": [["map", "Company office", "An optional place to work"], ["user", "Homes", "Where most work happens"], ["users", "Client premises", "Under the client's site rules"], ["server", "AWS", "Data center controls carved out"]], "n": "Section 2 sets the scope. The policy covers the physical side of handling Company and client information wherever it happens: the Company office, homes, client premises, and shared spaces. It also covers the carve-out of data center controls to AWS."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party owns the policy", "Committee approves and reviews yearly", "Steering Committee: the CEO today", "Building access: hiring manager or CEO", "Lost devices: tell the Security Officer"], "art": "Dated approval record", "cad": "At least annually", "n": "Section 3 sets the roles. The CEO, or the Security Officer in the CEO's absence, is the Accountable Party, who owns the policy and may delegate duties. The Information Security Steering Committee approves it and reviews it at least annually. At our current size, the Committee is the CEO, and a dated written record satisfies any Committee decision. Elsewhere in the policy, the hiring manager or the CEO handles building access cards or codes, and the Security Officer receives lost device reports."}, {"k": "three", "t": "5. The office", "items": [["map", "Optional", "People choose whether to come in"], ["lock", "No badges", "No keys or individual access credentials"], ["eye", "Mind the room", "No visitors or ex-staff near our data"]], "banner": ["Building:", "we rely on the landlord's door controls."], "n": "Section 5 covers the office. Personnel may choose to work from the office. It does not use badges, and employees are not issued physical keys or individual access credentials. Whoever is working there makes sure that visitors, former personnel, and other unauthorized people do not have access to Company information or equipment. Where the building or landlord controls the exterior doors, we rely on those controls. Physical security is proportionate to the office, the information handled there, and our size."}, {"k": "check", "t": "5. What we deliberately do not keep", "items": ["Badge list", "Key register", "Visitor log", "Access-log reviews", "Separate access procedures"], "big": "Not needed", "bigsub": "Simple access list only if credentials are issued", "n": "The policy is explicit about what we do not keep: no badge list, no key register, no visitor log, no access-log review, and no separate badge, visitor, or physical-access procedure, because none of these processes exist. If the Company begins issuing individual access credentials, it introduces a simple access list at that time."}, {"k": "sec", "t": "5. Building access and the annual check", "items": ["Building card or code: returned on exit", "Handled by hiring manager or CEO", "New leased facility: Accountable Party", "Annual dated confirmation", "By the CEO, Security Officer, or delegate"], "art": "Annual confirmation in compliance platform", "cad": "Once a year", "n": "If the building issues an access card or code to someone, the hiring manager or the CEO has it returned or disabled when that person leaves. A new office or other facility leased for Company operations is approved by the Accountable Party. Once a year, the CEO, the Security Officer, or a delegate records a dated confirmation in the compliance platform, for example: physical access model reviewed; no employee keys or credentials issued; no material change."}, {"k": "two", "t": "5. Cloud infrastructure", "items": [["server", "AWS provides", ["Data center physical controls", "Environmental controls", "Treated as a carve-out"]], ["doc", "We review", ["AWS assurance documentation", "Our complementary user controls", "Through vendor management"]]], "n": "We process no information on hardware we own in a data center. Physical and environmental controls for cloud infrastructure are provided by AWS and are addressed through our vendor management process. AWS is a subservice organization, and its data center controls are carved out, meaning we rely on its own assurance. We review the AWS assurance documentation, together with the complementary user entity controls that are our responsibility."}, {"k": "three", "t": "6. Remote working", "items": [["eye", "Screens and calls", "Others can't easily read or overhear"], ["lock", "Screen lock", "Auto-lock; lock it when you step away"], ["doc", "Printing", "Fine; shred Confidential printouts"]], "banner": ["Acknowledged:", "in the annual Code of Conduct sign-off, nothing extra."], "n": "Section 6 covers remote working. When working remotely, take reasonable care that others nearby cannot easily read Confidential information on your screen or overhear sensitive client conversations. Devices lock automatically after a short period of inactivity, and you lock your screen when you step away in a shared space. Printing is fine when needed; printouts containing Confidential information are shredded when no longer needed. These expectations are covered by the annual Code of Conduct acknowledgment, with no separate sign-off."}, {"k": "check", "t": "7. Devices away from home", "items": ["Keep devices with you or secured", "Not visible in a parked car", "Not in checked baggage", "Mind your screen and calls in public", "Return equipment when asked"], "big": "Laptops", "bigsub": "are the real physical risk, not intruders", "n": "Section 7 covers devices away from home. Most physical risk to the Company is a laptop in a public place, not an intruder in a building. Keep devices with you or secured when traveling. Do not leave them visible in a parked vehicle or pack them in checked baggage. In public places, be mindful of who can see your screen or hear client calls. Company-provided equipment is returned when the Company asks for it, and is wiped before it is reissued."}, {"k": "flow", "t": "7. If a device is lost or stolen", "steps": [["alert", "Notice", "A work device is missing", "F7EDC9"], ["phone", "Report", "Tell the Security Officer early", "F7DEDE"], ["lock", "Revoke", "Revoke access, not recover hardware", "DCEFE2"]], "banner": "Report fastest if it held Confidential or other Company or client data.", "n": "If a device used for Company work is lost or stolen, report it to the Security Officer as early as possible, especially if it held Confidential information or other Company or client data. Because our information lives in the Company's cloud services rather than on the device, the response is usually to revoke access rather than to recover the hardware."}, {"k": "two", "t": "8. At client premises", "items": [["users", "On site", ["Follow the client's site rules", "Use only the access you need", "Separate from our own office"]], ["lock", "Client badges and keys", ["Look after them with care", "Return them at engagement end", "The return is recorded"]]], "n": "Section 8 covers client premises. At client sites, follow the client's site rules and use only the access the engagement requires. Client badges, keys, and access cards are looked after with reasonable care and returned at the end of the engagement, and the return is recorded. These client arrangements are separate from our own office."}, {"k": "check", "t": "9. Records: kept to a minimum", "items": ["Annual confirmation, with office photo", "Building access removal, if issued", "Incident evidence, only if one occurs", "Client returns: engagement records", "AWS assurance: Vendor Management"], "big": "Minimal", "bigsub": "In the compliance platform; nothing else required", "n": "Section 9 keeps records to a minimum, in the compliance platform. First, the annual confirmation, with a photo of the secured office entrance or the building's security description. Second, offboarding evidence that a building access card or code was returned or disabled, only where one was issued. Third, evidence of a physical security incident, only if one occurs. Client badge or key returns are noted in the engagement records, and AWS assurance is kept under the Vendor Management Policy. No other physical security records are required."}, {"k": "sec", "t": "10. Exceptions", "items": ["A requirement can't reasonably be met", "Tell the Security Officer", "Agree a practical alternative", "Record what was agreed"], "art": "Agreed alternative", "cad": "When agreed", "n": "Section 10 covers exceptions. Where a requirement of this policy cannot reasonably be met, for example because of a particular home, travel, or client situation, the person tells the Security Officer. A practical alternative is then agreed and recorded. There is no separate exception form; what matters is that the alternative is agreed with the Security Officer and written down."}, {"k": "table", "t": "Artifacts and how often they are updated", "head": ["Artifact", "Section", "How often"], "rows": [["Annual confirmation and office photo", "5, 9", "Once a year"], ["Building card or code removal", "5, 9", "When a person leaves, if issued"], ["Lost or stolen device report", "7", "As early as possible"], ["Incident evidence", "9", "Only if an incident occurs"], ["Client badge or key return", "8", "End of each engagement"], ["Agreed exception alternative", "10", "When agreed"]], "n": "Here are the few records this policy produces. The annual confirmation and office photo, once a year. Removal of any building card or code, when a person leaves, only if one was issued. A lost or stolen device report, as early as possible. Incident evidence, only if an incident occurs. Client badge or key returns, at the end of each engagement. And an agreed alternative, whenever an exception is agreed."}, {"k": "sign", "t": "Acknowledge this policy", "items": ["I have read POL-PHY-001", "Name, version, date", "Quiz: 60% to pass"], "side": "At hire and when it changes", "n": "You acknowledge this policy when you join and whenever it changes materially. Your record captures your name, the version, the date, and your quiz result. Thank you for keeping our information and devices safe, wherever you work. Let's move on to the questions."}]}, {"key": "priv", "title": "Privacy Policy", "id": "POL-PRIV-001", "version": "1.0", "date": "September 4, 2026", "blurb": "Process lawfully, protect it, never sell it.", "slides": [{"k": "title", "t": "Privacy Policy", "sub": "Controller for our people, Processor for clients", "body": "The internal rules for how PromptHalo processes, protects, and shares personal data.", "meta": "POL-PRIV-001, version 1.0, September 4, 2026", "n": "Welcome to PromptHalo's Privacy Policy training. This is our internal Privacy Policy. It is different from the public Privacy Notice and from the Privacy Implementation Plan. It covers the two roles we play, what we process, the obligations we carry, how we protect and share personal data, and the records we keep. You can pause or skip ahead at any time. At the end, you will answer short questions and sign your acknowledgment."}, {"k": "three", "t": "1 and 2. Two roles, one policy", "items": [["users", "Controller", "Our own personnel and candidate records"], ["shield", "Processor", "Client personal data from engagements"], ["doc", "Scoping decision", "Privacy category out of current scope"]], "banner": ["Revisit the scope when", "a client requires it, or we control material volumes."], "n": "Section 1 explains that we process personal data in two capacities. We are a Controller for our own personnel records and a Processor for client personal data, and this policy governs both. Section 2 sets the scope: personal data about our personnel and candidates, and personal data we process for clients. The Privacy category of the Trust Services Criteria is out of scope for the current examination. That decision is recorded here and in the risk register, and must be revisited when a client agreement requires the category or when we begin acting as a Controller for material volumes of personal data."}, {"k": "sec", "t": "3. Roles", "items": ["Accountable Party: CEO, or Security Officer", "Owns, oversees, and enforces the policy", "May delegate duties to a designee", "Steering Committee approves; reviews yearly", "Accountable Party handles data subject requests"], "art": "Dated CEO record of Committee approval", "cad": "At least annually", "n": "Section 3 sets the roles. The CEO or, in their absence, the Security Officer is the Accountable Party. They own this policy, oversee its implementation and enforcement, and may delegate specific duties to a designee. The Information Security Steering Committee approves the policy and reviews it at least annually; at our size the Committee is the CEO, and a dated written record satisfies any Committee decision. The Accountable Party also handles data subject requests and decides whether we act as Controller or Processor for an activity, seeking external advice where needed."}, {"k": "sec", "t": "4. Key terms", "items": ["Controller decides purposes and means", "Processor acts for the Controller", "Service provider: contract limits use", "Sub-processor: processes for a client", "Privacy Notice: our published disclosure"], "art": "Definitions in this policy", "cad": "Reviewed with the policy", "n": "Section 4 defines the terms, many drawn from GDPR and California law. A Controller decides the purposes and means of processing personal data; a Processor processes it on the Controller's behalf. A service provider processes personal data for a business under a written contract that prohibits any other use. A sub-processor is a Processor we engage to process personal data on a client's behalf. Personal data includes personal information as US state privacy law defines it. The Privacy Notice is our published ex
