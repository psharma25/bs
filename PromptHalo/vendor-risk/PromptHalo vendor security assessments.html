<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PromptHalo vendor security assessments</title>
<style>
:root{
  --banner-a:#35205f; --banner-b:#5a3d9a;
  --p700:#3f2a73; --p600:#5a3d9a; --p500:#7556b8; --p300:#bcaee0; --p200:#ddd4f1; --p100:#eee9f8; --p50:#f7f5fc;
  --ink:#1f1b2e; --ink2:#4a4560; --ink3:#77728c;
  --line:#e3def0; --paper:#ffffff; --page:#f4f1fa;
  --good:#1f6b4c; --goodbg:#e3f3ea; --goodfill:#8fd0ad;
  --warn:#86590a; --warnbg:#fcf1db; --warnfill:#f1cf7e;
  --bad:#9a2a2e;  --badbg:#fbe8e8; --badfill:#ee9d9b;
  --mut:#5b5870; --mutbg:#eeecf3;
  --shadow:0 1px 2px rgba(53,32,95,.06),0 6px 18px rgba(53,32,95,.07);
  --shadow-lift:0 2px 4px rgba(53,32,95,.08),0 10px 26px rgba(53,32,95,.10);
  --fs:15px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --p700:#cbbdf0; --p600:#b19ae6; --p500:#9a82d8; --p300:#5d4a8c; --p200:#3a2e58; --p100:#2a2242; --p50:#221c36;
    --ink:#ece8f7; --ink2:#c3bdd8; --ink3:#948eab;
    --line:#352c4f; --paper:#1b1629; --page:#130f1f;
    --good:#8fd6b0; --goodbg:#17302a; --goodfill:#3f8f6a;
    --warn:#f1cf7e; --warnbg:#332916; --warnfill:#a88636;
    --bad:#f1a3a1;  --badbg:#3a1d23; --badfill:#a8514f;
    --mut:#c3bdd8; --mutbg:#2a2440;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --shadow-lift:0 2px 4px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
    --p700:#cbbdf0; --p600:#b19ae6; --p500:#9a82d8; --p300:#5d4a8c; --p200:#3a2e58; --p100:#2a2242; --p50:#221c36;
    --ink:#ece8f7; --ink2:#c3bdd8; --ink3:#948eab;
    --line:#352c4f; --paper:#1b1629; --page:#130f1f;
    --good:#8fd6b0; --goodbg:#17302a; --goodfill:#3f8f6a;
    --warn:#f1cf7e; --warnbg:#332916; --warnfill:#a88636;
    --bad:#f1a3a1;  --badbg:#3a1d23; --badfill:#a8514f;
    --mut:#c3bdd8; --mutbg:#2a2440;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --shadow-lift:0 2px 4px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3);
}
html{font-size:var(--fs);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:Inter,Calibri,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--p600)}
button{font:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--p500);outline-offset:2px}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--paper);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:18px 12px 30px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.brand{padding:4px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .t{font-weight:700;color:var(--p700);font-size:1rem}
.brand .s{font-size:.78rem;color:var(--ink3)}
.idx{list-style:none;margin:0;padding:0}
.idx button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;
  padding:8px 10px;cursor:pointer;color:var(--ink2);text-align:left;font-size:.9rem;border-left:3px solid transparent}
.idx button:hover{background:var(--p50)}
.idx button.on{background:var(--p100);color:var(--p700);font-weight:600;border-left-color:var(--p600)}
.idx .nm{flex:1}
.chip{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.c-good{background:var(--goodbg);color:var(--good)}
.c-warn{background:var(--warnbg);color:var(--warn)}
.c-bad{background:var(--badbg);color:var(--bad)}
.c-mut{background:var(--mutbg);color:var(--mut)}
.c-pur{background:var(--p100);color:var(--p700)}
.sizer{margin-top:18px;padding:12px 10px 0;border-top:1px solid var(--line)}
.sizer .lab{font-size:.75rem;color:var(--ink3);margin-bottom:6px}
.sizer .row{display:flex;gap:6px;flex-wrap:wrap}
.sizer button{border:1px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:.8rem}
.sizer button.on{background:var(--p600);border-color:var(--p600);color:#fff}

main{min-width:0;padding:0 0 70px}
.banner{background:linear-gradient(120deg,var(--banner-a),var(--banner-b));color:#fff;padding:26px 30px 24px}
.banner h1{margin:0;font-size:1.65rem;font-weight:700;letter-spacing:-.2px}
.banner h1 .as{font-weight:400;opacity:.8;font-size:1.05rem;margin-left:6px}
.banner .sub{opacity:.85;margin-top:4px;font-size:.92rem;max-width:90ch}
.banner .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.banner .meta span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;font-size:.78rem}
.wrap{padding:22px 30px 0;max-width:1320px}

.grid{display:grid;gap:16px}
.g3{grid-template-columns:minmax(250px,.8fr) minmax(300px,1fr) minmax(360px,1.25fr)}
.g3b{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px}
.panel h2{margin:0 0 10px;font-size:1.08rem;color:var(--p700);font-weight:700}
.panel h3{margin:14px 0 6px;font-size:.92rem;color:var(--ink)}
.sectitle{margin:30px 0 4px;font-size:1.18rem;color:var(--p700);font-weight:700}
.seclede{margin:0 0 12px;color:var(--ink2);font-size:.9rem;max-width:90ch}

.gauge{display:flex;flex-direction:column;align-items:center}
.gauge svg{width:190px;height:190px}
.riskpill{display:inline-block;font-weight:700;letter-spacing:.3px;padding:6px 18px;border-radius:999px;margin:6px 0 12px;font-size:.95rem}
.reason{font-size:.88rem;color:var(--ink2)}
.reason strong{color:var(--ink)}

.radar svg{width:100%;height:auto;max-width:520px;display:block;margin:0 auto}

table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.76rem;color:var(--ink3);font-weight:600;background:var(--p50)}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
td.sc{text-align:center;font-weight:700;font-size:.98rem}
.sg{background:var(--goodbg);color:var(--good)} .sw{background:var(--warnbg);color:var(--warn)} .sb{background:var(--badbg);color:var(--bad)}
tr.tot td{font-weight:700;border-bottom:none;background:var(--p50)}
.tw{overflow-x:auto}

.certrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.certrow:last-child{border-bottom:none}
.certrow .ic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--p100);display:flex;align-items:center;justify-content:center}
.certrow .ic svg{width:22px;height:22px}
.certrow .tt{font-weight:600;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.certrow .dd{font-size:.84rem;color:var(--ink2);margin-top:2px}
ul.sig{list-style:none;margin:0;padding:0}
ul.sig li{display:flex;gap:10px;padding:6px 0;font-size:.87rem;color:var(--ink2)}
ul.sig li .dot{flex:0 0 20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;margin-top:1px}
.dot.ok{background:var(--goodbg);color:var(--good)} .dot.gap{background:var(--badbg);color:var(--bad)}
.snap td:first-child{color:var(--ink2)} .snap td:last-child{text-align:right}
.snap td{border-bottom:none;padding:5px 4px}
ul.plain{margin:4px 0 10px;padding-left:18px;font-size:.86rem;color:var(--ink2)} ul.plain li{margin-bottom:3px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:st}
ol.steps li{counter-increment:st;display:flex;gap:10px;padding:5px 0;font-size:.86rem;color:var(--ink2)}
ol.steps li::before{content:counter(st);flex:0 0 22px;height:22px;border-radius:50%;background:var(--p600);color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center}

.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.summary .big{font-size:2.6rem;font-weight:800;color:var(--p700);line-height:1}
.summary .big small{font-size:1rem;color:var(--ink3);font-weight:500}
.summary p{margin:0 0 6px;max-width:92ch}

/* raised cards */
.cards{display:grid;gap:10px}
details.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);transition:box-shadow .15s}
details.card[open]{box-shadow:var(--shadow-lift)}
details.card>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 16px}
details.card>summary::-webkit-details-marker{display:none}
.card .code{font-weight:700;color:var(--p600);font-size:.8rem;min-width:44px}
.card .ttl{font-weight:600;font-size:.92rem}
.card .one{display:block;font-weight:400;font-size:.82rem;color:var(--ink3);margin-top:1px}
.card .chev{width:18px;height:18px;transition:transform .15s;color:var(--ink3)}
details.card[open] .chev{transform:rotate(90deg)}
.card .body{padding:2px 16px 16px 72px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:1px solid var(--line);padding-top:14px}
.card .body h4{margin:0 0 4px;font-size:.74rem;color:var(--ink3);font-weight:600;letter-spacing:.2px}
.card .body p{margin:0;font-size:.86rem;color:var(--ink2)}
.card .body ul{margin:0;padding-left:16px;font-size:.84rem;color:var(--ink2)}
.bar{height:6px;background:var(--mutbg);border-radius:3px;width:90px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px}
.scorebox{display:flex;align-items:center;gap:10px}
.expandall{display:flex;gap:8px;margin:0 0 10px}
.expandall button{border:1px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:6px;padding:4px 10px;font-size:.8rem;cursor:pointer}
.expandall button:hover{background:var(--p50)}

.ovbar{display:flex;align-items:center;gap:10px}
.ovbar .track{flex:1;height:10px;background:var(--mutbg);border-radius:5px;overflow:hidden;min-width:120px}
.ovbar .track i{display:block;height:10px;border-radius:5px}
.note{font-size:.84rem;color:var(--ink2);background:var(--p50);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px}
.src{font-size:.82rem;color:var(--ink2)} .src li{margin-bottom:3px}
footer{padding:26px 30px;color:var(--ink3);font-size:.78rem}

.menu-btn{display:none}
.banner .meta span.critbadge{border:0;padding:4px 14px;font-size:.84rem;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.banner .meta span.critbadge b{font-weight:800}
.cb-critical{background:#e5484d!important;color:#fff}
.cb-high{background:#f5a623!important;color:#2b1a00}
.cb-moderate{background:#3fb37f!important;color:#062a1a}
.cb-low{background:#9ad9b8!important;color:#062a1a}
.selft{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--ink3);margin:14px 10px 0;cursor:pointer}
.selft input{accent-color:var(--p600)}
li.selfsep{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.crit{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:start;border-left:4px solid var(--p600)}
.crit .lbl{font-size:.78rem;color:var(--ink3);font-weight:600}
.crit .tv{display:inline-block;font-size:1.5rem;font-weight:800;padding:4px 16px;border-radius:10px;margin:6px 0 4px}
.crit .pts{font-size:.8rem;color:var(--ink3);margin-bottom:8px}
.crit .pri{font-size:.84rem;color:var(--ink2)}
.cfs{display:grid;gap:7px}
.cf{display:grid;grid-template-columns:170px 60px 1fr;gap:10px;align-items:center;font-size:.86rem}
.cf .cn{font-weight:600;color:var(--ink)}
.cf .cr{color:var(--ink2)}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--mutbg);display:block}
.dots i.on.l1{background:var(--goodfill)} .dots i.on.l2{background:var(--warnfill)} .dots i.on.l3{background:var(--badfill)}
.cad{margin-top:10px;font-size:.84rem;color:var(--ink2)}
@media (max-width:860px){.crit{grid-template-columns:1fr}.cf{grid-template-columns:1fr 60px}.cf .cr{grid-column:1 / -1}}
@media (max-width:1180px){ .g3{grid-template-columns:1fr 1fr} .g3>.panel:last-child{grid-column:1 / -1} .g3b{grid-template-columns:1fr 1fr} }
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .idx{display:flex;flex-wrap:wrap;gap:4px} .idx li{flex:1 1 140px}
  .g3,.g3b{grid-template-columns:1fr}
  .card .body{grid-template-columns:1fr;padding-left:16px}
  .wrap,.banner{padding-left:16px;padding-right:16px}
  details.card>summary{grid-template-columns:auto 1fr auto}
  details.card>summary .bar{display:none}
}
@media print{ aside{display:none} .shell{grid-template-columns:1fr} details.card .body{display:grid} }
</style>
</head>

  rows+='<tr><td>'+c.n+'</td><td class="n">'+c.w+'</td><td class="sc s'+b+'">'+sv+'</td><td>'+v.notes[c.k]+'</td></tr>';}
 rows+='<tr class="tot"><td>TOTAL</td><td class="n">100</td><td class="sc s'+(t>=85?"g":(t>=65?"w":"b"))+'">'+t+'</td><td>'+rk[0]+' risk</td></tr>';
 h+='<div class="panel"><h2>Detailed Scoring Criteria</h2><div class="tw"><table><thead><tr><th>Category</th><th class="n">Weight</th><th class="n">Score</th><th>Notes</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
 h+='</div>';

 /* row 2 */
 var ic=[ICON.shield,ICON.globe,ICON.doc],ce="";
 for(var j=0;j<v.certs.length;j++){var cr=v.certs[j],st=CERTST[cr[1]];
  ce+='<div class="certrow"><div class="ic" style="color:var(--p600)">'+ic[j%3]+'</div><div><div class="tt">'+cr[0]+' '+pill(st[0],st[1])+'</div><div class="dd">'+cr[2]+'</div></div></div>';}
 h+='<div class="grid g3b" style="margin-top:16px">';
 h+='<div class="panel"><h2>Compliance and Certification Evidence</h2>'+ce+'</div>';
 h+='<div class="panel"><h2>What We Found (Positive Signals)</h2><ul class="sig">'+v.pos.map(function(x){return '<li><span class="dot ok">&#10003;</span>'+x+'</li>';}).join("")+'</ul></div>';
 h+='<div class="panel"><h2>Key Gaps and Areas of Concern</h2><ul class="sig">'+v.gaps.map(function(x){return '<li><span class="dot gap">!</span>'+x+'</li>';}).join("")+'</ul></div>';
 h+='</div>';

 /* row 3 */
 h+='<div class="grid g3b" style="margin-top:16px">';
 h+='<div class="panel"><h2>Technical Security Snapshot (External)</h2><table class="snap"><tbody>'+v.snap.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+snapPill(r[1],r[2])+'</td></tr>';}).join("")+'</tbody></table></div>';
 h+='<div class="panel"><h2>Risk Summary</h2><div>Overall risk level '+pill(rk[0].toUpperCase(),rk[1])+'</div>'
   +'<h3>Key risk drivers</h3><ul class="plain">'+v.drivers.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul>'
   +'<h3>Compensating factors</h3><ul class="plain">'+v.comp.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>';
 h+='<div class="panel"><h2>Recommended Next Steps for PromptHalo</h2><ol class="steps">'+v.steps.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ol></div>';
 h+='</div>';

 /* security requirement cards */
 h+='<div class="sectitle">Security risk requirements</div><p class="seclede">One card per scoring category. Open a card for the requirement, the explanation of the score, and the evidence.</p>'
  +'<div class="expandall"><button data-x="sec" data-o="1">Expand all</button><button data-x="sec" data-o="0">Collapse all</button></div><div class="cards" id="sec">';
 for(var k=0;k<CATS.length;k++){var cc=CATS[k],sv2=v.sc[cc.k];
  var d=cc.k==="tls"?[TLS_EXPL,TLS_EV]:v.det[cc.k];
  h+=card("S"+(k+1),cc.n,v.notes[cc.k],sv2,cc.w,[["Requirement",cc.d],["Explanation",d[0]],["Evidence",d[1]]]);}
 h+='</div>';

 /* SOC 2 cards */
 h+='<div class="sectitle">SOC 2 Trust Services Criteria</div><p class="seclede">Evidence score out of 5 for each criterion, with what the vendor covers and what PromptHalo must do as the customer (complementary user entity controls).</p>'
  +'<div class="expandall"><button data-x="soc" data-o="1">Expand all</button><button data-x="soc" data-o="0">Collapse all</button></div><div class="cards" id="soc">';
 for(var m=0;m<TSC.length;m++){var tc=TSC[m],o=v.soc[tc[0]],sd=socDefault(v,tc[0]);
  var scv=o?o[0]:sd[0],ven=o?o[1]:sd[1],cue=o?o[2]:sd[2];
  h+=card(tc[0],tc[1],tc[2],scv,5,[[v.self?"PromptHalo evidence":"Vendor coverage",ven],[v.self?"What customers will ask for":"PromptHalo responsibility",cue],["Evidence",[certLine(v),"Public sources listed below"]]]);}
 h+='</div>';

 /* sources */
 var src=(SOURCES[v.id]||[]).map(function(s){return '<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a></li>';}).join("");
 h+='<div class="panel" style="margin-top:22px"><h2>Sources</h2><ul class="src">'+src
  +'<li>DNS queries (NS, MX, TXT, DMARC, DKIM selectors, CAA, DNSKEY, DS) run 29 Sep 2026.</li><li>Vendor trust and compliance pages as described in each certification entry.</li></ul></div>';
 h+='</div>';
 return h;
}
function certLine(v){return "Attestation: "+v.certs[0][0]+" ("+CERTST[v.certs[0][1]][0].toLowerCase()+")";}

function renderOverview(){
 var rankP={P1:0,P2:1,P3:2};var sorted=V.slice().sort(function(a,b){var d=rankP[priorityOf(a)[0]]-rankP[priorityOf(b)[0]];return d!==0?d:total(a)-total(b);});
 var h='<div class="banner"><h1>Vendor Security Assessments <span class="as">(as of Sep 29, 2026)</span></h1>'
  +'<div class="sub">Nine PromptHalo vendors assessed from public information on one model. External and passive only; not a penetration test.</div></div><div class="wrap">';
 var rows="";
 for(var i=0;i<sorted.length;i++){var v=sorted[i],t=total(v),rk=riskOf(t);
  rows+='<tr><td><a href="#'+v.id+'" data-go="'+v.id+'"><strong>'+v.name+'</strong></a><div style="font-size:.78rem;color:var(--ink3)">'+v.use+'</div></td>'
   +'<td>'+pill(priorityOf(v)[0],priorityOf(v)[1])+'</td><td>'+pill(v.crit,v.crit==="Critical"?"c-bad":(v.crit==="High"?"c-warn":"c-good"))+'</td><td><div class="ovbar"><div class="track"><i style="width:'+t+'%;background:'+(t>=85?css("--goodfill"):(t>=65?css("--warnfill"):css("--badfill")))+'"></i></div><strong>'+t+'</strong></div></td>'
   +'<td>'+pill(rk[0],rk[1])+'</td><td>'+v.gaps[0]+'</td></tr>';}
 h+='<div class="panel"><h2>Portfolio summary</h2><div class="tw"><table><thead><tr><th>Vendor</th><th>Priority</th><th>Criticality</th><th style="min-width:180px">Score</th><th>Risk</th><th>Top concern</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
  +'<div class="note"><strong>Reading the table.</strong> Score measures the vendor\'s externally visible posture. Criticality measures what the vendor means to PromptHalo. Priority combines them: P1 is a Critical vendor scoring below 85, or any vendor below 70. Auth0, GitHub, and Secureframe are P1: each is Critical to PromptHalo and scores in the low 80s.</div>'+(SHOWSELF?'<div class="note"><strong>PromptHalo self-assessment:</strong> '+total(SELF)+' / 100, '+riskOf(total(SELF))[0]+' risk. <a href="#prompthalo" data-go="prompthalo">Open the self-assessment</a>.</div>':'')+'</div>';
 var cr="";for(var j=0;j<CATS.length;j++){var c=CATS[j];cr+='<tr><td>'+c.n+'</td><td class="n">'+c.w+'</td><td>'+c.d+'</td></tr>';}
 h+='<div class="panel" style="margin-top:16px"><h2>How scores are computed</h2><div class="tw"><table><thead><tr><th>Category</th><th class="n">Weight</th><th>Rubric</th></tr></thead><tbody>'+cr+'</tbody></table></div>'
  +'<p style="font-size:.86rem;color:var(--ink2);margin:10px 0 0">Risk bands: Low at 85 and above, Moderate from 65 to 84, High below 65. Category colors: green at 80% of weight or more, amber from 50% to 79%, red below 50%. Criticality: five factors (data sensitivity, access into PromptHalo, operational dependency, exit difficulty, blast radius) scored 1 to 3; 12 to 15 is Critical, 9 to 11 High, 6 to 8 Moderate, 5 Low. A 3 in data sensitivity or access sets a floor of High. SOC 2 cards score external evidence from 0 to 5 per criterion. TLS, security headers, and security.txt could not be tested from this environment; TLS receives 13 of 15 for every vendor on observed HTTPS alone.</p></div>';
 h+='</div>';return h;
}

/* ---------- nav ---------- */
var CUR="overview";
function buildIdx(){
 var h='<li><button data-go="overview"><span class="nm">Overview</span></button></li>';
 for(var i=0;i<V.length;i++){var t=total(V[i]),rk=riskOf(t);
  h+='<li><button data-go="'+V[i].id+'"><span class="nm">'+V[i].name+'</span><span class="chip '+rk[1]+'">'+t+'</span></button></li>';}
 if(SHOWSELF){var ts=total(SELF),rs=riskOf(ts);
  h+='<li class="selfsep"><button data-go="'+SELF.id+'"><span class="nm">'+SELF.name+'</span><span class="chip '+rs[1]+'">'+ts+'</span></button></li>';}
 el("idx").innerHTML=h;
 var bs=el("idx").querySelectorAll("button");
 for(var j=0;j<bs.length;j++) bs[j].addEventListener("click",function(){go(this.getAttribute("data-go"));});
 el("selfToggle").checked=SHOWSELF;
}
el("selfToggle").addEventListener("change",function(){
 SHOWSELF=this.checked; try{localStorage.setItem("ph-tprm-self",SHOWSELF?"1":"0");}catch(e){}
 buildIdx(); go(SHOWSELF?"prompthalo":(CUR==="prompthalo"?"overview":CUR));
});
function go(id){
 CUR=id; var v=null,L=allV();for(var i=0;i<L.length;i++) if(L[i].id===id) v=L[i];
 el("main").innerHTML=v?renderVendor(v):renderOverview();
 var bs=el("idx").querySelectorAll("button");
 for(var j=0;j<bs.length;j++){var on=bs[j].getAttribute("data-go")===id;bs[j].classList.toggle("on",on);if(on)bs[j].setAttribute("aria-current","page");else bs[j].removeAttribute("aria-current");}
 var ex=el("main").querySelectorAll(".expandall button");
 for(var k=0;k<ex.length;k++) ex[k].addEventListener("click",function(){
  var ds=el(this.getAttribute("data-x")).querySelectorAll("details"),o=this.getAttribute("data-o")==="1";
  for(var m=0;m<ds.length;m++) ds[m].open=o;});
 var links=el("main").querySelectorAll("a[data-go]");
 for(var n=0;n<links.length;n++) links[n].addEventListener("click",function(e){e.preventDefault();go(this.getAttribute("data-go"));});
 try{history.replaceState(null,"","#"+id);}catch(e){}
 window.scrollTo(0,0);
}

/* ---------- text size ---------- */
(function(){
 var saved=null;try{saved=localStorage.getItem("ph-tprm-fs");}catch(e){}
 function apply(v){document.documentElement.style.setProperty("--fs",v);
  var bs=document.querySelectorAll(".sizer button");for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-fs")===v);
  try{localStorage.setItem("ph-tprm-fs",v);}catch(e){}}
 apply(saved||"15px");
 var bs=document.querySelectorAll(".sizer button");for(var i=0;i<bs.length;i++)bs[i].addEventListener("click",function(){apply(this.getAttribute("data-fs"));});
})();

buildIdx();
var start=(location.hash||"").replace("#","");
go(start&&(start==="overview"||allV().some(function(v){return v.id===start;}))?start:"overview");
if(window.matchMedia){try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){go(CUR);});}catch(e){}}
</script>
</body>
</html>
