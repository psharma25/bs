<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PromptHalo vendor security assessments</title>
<style>
:root{
  --banner-a:#35205f; --banner-b:#5a3d9a;
  --p700:#3f2a73; --p600:#5a3d9a; --p500:#7556b8; --p300:#bcaee0; --p200:#ddd4f1; --p100:#eee9f8; --p50:#f7f5fc;
  --ink:#1f1b2e; --ink2:#4a4560; --ink3:#77728c;
  --line:#e3def0; --paper:#ffffff; --page:#f4f1fa;
  --good:#1f6b4c; --goodbg:#e3f3ea; --goodfill:#8fd0ad;
  --warn:#86590a; --warnbg:#fcf1db; --warnfill:#f1cf7e;
  --bad:#9a2a2e;  --badbg:#fbe8e8; --badfill:#ee9d9b;
  --mut:#5b5870; --mutbg:#eeecf3;
  --shadow:0 1px 2px rgba(53,32,95,.06),0 6px 18px rgba(53,32,95,.07);
  --shadow-lift:0 2px 4px rgba(53,32,95,.08),0 10px 26px rgba(53,32,95,.10);
  --fs:15px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --p700:#cbbdf0; --p600:#b19ae6; --p500:#9a82d8; --p300:#5d4a8c; --p200:#3a2e58; --p100:#2a2242; --p50:#221c36;
    --ink:#ece8f7; --ink2:#c3bdd8; --ink3:#948eab;
    --line:#352c4f; --paper:#1b1629; --page:#130f1f;
    --good:#8fd6b0; --goodbg:#17302a; --goodfill:#3f8f6a;
    --warn:#f1cf7e; --warnbg:#332916; --warnfill:#a88636;
    --bad:#f1a3a1;  --badbg:#3a1d23; --badfill:#a8514f;
    --mut:#c3bdd8; --mutbg:#2a2440;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --shadow-lift:0 2px 4px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
    --p700:#cbbdf0; --p600:#b19ae6; --p500:#9a82d8; --p300:#5d4a8c; --p200:#3a2e58; --p100:#2a2242; --p50:#221c36;
    --ink:#ece8f7; --ink2:#c3bdd8; --ink3:#948eab;
    --line:#352c4f; --paper:#1b1629; --page:#130f1f;
    --good:#8fd6b0; --goodbg:#17302a; --goodfill:#3f8f6a;
    --warn:#f1cf7e; --warnbg:#332916; --warnfill:#a88636;
    --bad:#f1a3a1;  --badbg:#3a1d23; --badfill:#a8514f;
    --mut:#c3bdd8; --mutbg:#2a2440;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --shadow-lift:0 2px 4px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3);
}
html{font-size:var(--fs);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:Inter,Calibri,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--p600)}
button{font:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--p500);outline-offset:2px}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--paper);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:18px 12px 30px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.brand{padding:4px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .t{font-weight:700;color:var(--p700);font-size:1rem}
.brand .s{font-size:.78rem;color:var(--ink3)}
.idx{list-style:none;margin:0;padding:0}
.idx button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;
  padding:8px 10px;cursor:pointer;color:var(--ink2);text-align:left;font-size:.9rem;border-left:3px solid transparent}
.idx button:hover{background:var(--p50)}
.idx button.on{background:var(--p100);color:var(--p700);font-weight:600;border-left-color:var(--p600)}
.idx .nm{flex:1}
.chip{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.c-good{background:var(--goodbg);color:var(--good)}
.c-warn{background:var(--warnbg);color:var(--warn)}
.c-bad{background:var(--badbg);color:var(--bad)}
.c-mut{background:var(--mutbg);color:var(--mut)}
.c-pur{background:var(--p100);color:var(--p700)}
.sizer{margin-top:18px;padding:12px 10px 0;border-top:1px solid var(--line)}
.sizer .lab{font-size:.75rem;color:var(--ink3);margin-bottom:6px}
.sizer .row{display:flex;gap:6px;flex-wrap:wrap}
.sizer button{border:1px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:.8rem}
.sizer button.on{background:var(--p600);border-color:var(--p600);color:#fff}

main{min-width:0;padding:0 0 70px}
.banner{background:linear-gradient(120deg,var(--banner-a),var(--banner-b));color:#fff;padding:26px 30px 24px}
.banner h1{margin:0;font-size:1.65rem;font-weight:700;letter-spacing:-.2px}
.banner h1 .as{font-weight:400;opacity:.8;font-size:1.05rem;margin-left:6px}
.banner .sub{opacity:.85;margin-top:4px;font-size:.92rem;max-width:90ch}
.banner .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.banner .meta span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;font-size:.78rem}
.wrap{padding:22px 30px 0;max-width:1320px}

.grid{display:grid;gap:16px}
.g3{grid-template-columns:minmax(250px,.8fr) minmax(300px,1fr) minmax(360px,1.25fr)}
.g3b{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px}
.panel h2{margin:0 0 10px;font-size:1.08rem;color:var(--p700);font-weight:700}
.panel h3{margin:14px 0 6px;font-size:.92rem;color:var(--ink)}
.sectitle{margin:30px 0 4px;font-size:1.18rem;color:var(--p700);font-weight:700}
.seclede{margin:0 0 12px;color:var(--ink2);font-size:.9rem;max-width:90ch}

.gauge{display:flex;flex-direction:column;align-items:center}
.gauge svg{width:190px;height:190px}
.riskpill{display:inline-block;font-weight:700;letter-spacing:.3px;padding:6px 18px;border-radius:999px;margin:6px 0 12px;font-size:.95rem}
.reason{font-size:.88rem;color:var(--ink2)}
.reason strong{color:var(--ink)}

.radar svg{width:100%;height:auto;max-width:520px;display:block;margin:0 auto}

table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.76rem;color:var(--ink3);font-weight:600;background:var(--p50)}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
td.sc{text-align:center;font-weight:700;font-size:.98rem}
.sg{background:var(--goodbg);color:var(--good)} .sw{background:var(--warnbg);color:var(--warn)} .sb{background:var(--badbg);color:var(--bad)}
tr.tot td{font-weight:700;border-bottom:none;background:var(--p50)}
.tw{overflow-x:auto}

.certrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.certrow:last-child{border-bottom:none}
.certrow .ic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--p100);display:flex;align-items:center;justify-content:center}
.certrow .ic svg{width:22px;height:22px}
.certrow .tt{font-weight:600;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.certrow .dd{font-size:.84rem;color:var(--ink2);margin-top:2px}
ul.sig{list-style:none;margin:0;padding:0}
ul.sig li{display:flex;gap:10px;padding:6px 0;font-size:.87rem;color:var(--ink2)}
ul.sig li .dot{flex:0 0 20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;margin-top:1px}
.dot.ok{background:var(--goodbg);color:var(--good)} .dot.gap{background:var(--badbg);color:var(--bad)}
.snap td:first-child{color:var(--ink2)} .snap td:last-child{text-align:right}
.snap td{border-bottom:none;padding:5px 4px}
ul.plain{margin:4px 0 10px;padding-left:18px;font-size:.86rem;color:var(--ink2)} ul.plain li{margin-bottom:3px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:st}
ol.steps li{counter-increment:st;display:flex;gap:10px;padding:5px 0;font-size:.86rem;color:var(--ink2)}
ol.steps li::before{content:counter(st);flex:0 0 22px;height:22px;border-radius:50%;background:var(--p600);color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center}

.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.summary .big{font-size:2.6rem;font-weight:800;color:var(--p700);line-height:1}
.summary .big small{font-size:1rem;color:var(--ink3);font-weight:500}
.summary p{margin:0 0 6px;max-width:92ch}

/* raised cards */
.cards{display:grid;gap:10px}
details.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);transition:box-shadow .15s}
details.card[open]{box-shadow:var(--shadow-lift)}
details.card>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 16px}
details.card>summary::-webkit-details-marker{display:none}
.card .code{font-weight:700;color:var(--p600);font-size:.8rem;min-width:44px}
.card .ttl{font-weight:600;font-size:.92rem}
.card .one{display:block;font-weight:400;font-size:.82rem;color:var(--ink3);margin-top:1px}
.card .chev{width:18px;height:18px;transition:transform .15s;color:var(--ink3)}
details.card[open] .chev{transform:rotate(90deg)}
.card .body{padding:2px 16px 16px 72px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:1px solid var(--line);padding-top:14px}
.card .body h4{margin:0 0 4px;font-size:.74rem;color:var(--ink3);font-weight:600;letter-spacing:.2px}
.card .body p{margin:0;font-size:.86rem;color:var(--ink2)}
.card .body ul{margin:0;padding-left:16px;font-size:.84rem;color:var(--ink2)}
.bar{height:6px;background:var(--mutbg);border-radius:3px;width:90px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px}
.scorebox{display:flex;align-items:center;gap:10px}
.expandall{display:flex;gap:8px;margin:0 0 10px}
.expandall button{border:1px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:6px;padding:4px 10px;font-size:.8rem;cursor:pointer}
.expandall button:hover{background:var(--p50)}

.ovbar{display:flex;align-items:center;gap:10px}
.ovbar .track{flex:1;height:10px;background:var(--mutbg);border-radius:5px;overflow:hidden;min-width:120px}
.ovbar .track i{display:block;height:10px;border-radius:5px}
.note{font-size:.84rem;color:var(--ink2);background:var(--p50);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px}
.src{font-size:.82rem;color:var(--ink2)} .src li{margin-bottom:3px}
footer{padding:26px 30px;color:var(--ink3);font-size:.78rem}

.menu-btn{display:none}
td.kn{min-width:260px;font-size:.8rem}
.expandall button.on{background:var(--p600);border-color:var(--p600);color:#fff}
.clink{font-size:.8rem;white-space:nowrap}
.clink::after{content:" \2197"}
.card .body.lbody{display:block;padding:14px 16px 16px}
.regt input,.regt select{font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--paper);color:var(--ink);width:100%;min-width:110px}
.regt td:nth-child(4){min-width:260px}
.regt td:first-child{white-space:nowrap}
.btnrow2{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btnrow2 button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:6px;padding:5px 12px;cursor:pointer}
.btnrow2 button:hover{background:var(--p50)}
.small{font-size:.8rem;color:var(--ink3)}
#csvOut{width:100%;height:140px;margin-top:8px;font-family:ui-monospace,Consolas,monospace;font-size:.75rem}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--ink2);margin:0 0 10px}
.asm .sec{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
.asm .sec>h2{margin:0;padding:10px 18px;font-size:1.05rem;color:#fff;background:var(--p600);font-weight:700}
.asm .sec .in{padding:16px 18px}
.asm .grid2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(320px,1fr);gap:18px;align-items:start}
.asm .grid2 .sec{margin-top:0}
.asm /* diagram */
.flow{display:grid;grid-template-columns:120px 32px 250px 32px 1fr;gap:0;align-items:center}
.asm .node{border-radius:10px;padding:12px 14px;border:1px solid var(--line);font-size:.84rem;color:var(--ink2);background:var(--p50)}
.asm .node h3{margin:0 0 4px;font-size:.93rem;color:var(--ink)}
.asm .node .mono{font-family:ui-monospace,Consolas,monospace;font-size:.76rem;overflow-wrap:break-word}
.asm .node.inet{text-align:center;background:transparent;border:0}
.asm .node.inet svg{width:52px;height:52px;color:var(--p600)}
.asm .node.dns{background:var(--p100);border-color:var(--p300)}
.asm .arrow{display:flex;align-items:center;justify-content:center;color:var(--p500)}
.asm .arrow svg{width:28px;height:14px}
.asm .targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.asm .t-web{background:var(--goodbg);border-color:var(--goodfill)}
.asm .t-mail{background:var(--warnbg);border-color:var(--warnfill)}
.asm .t-id{background:var(--elevbg);border-color:var(--elevfill)}
.asm .t-aws{background:var(--elevbg);border-color:var(--elevfill)}
.asm .t-api{background:var(--badbg);border-color:var(--badfill)}
.asm .t-none{background:transparent;border:1px dashed var(--line)}
.asm .tag{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-top:6px}
.asm .tg{background:var(--goodbg);color:var(--good)}
.asm .atw{background:var(--warnbg);color:var(--warn)}
.asm .te{background:var(--elevbg);color:var(--elev)}
.asm .tb{background:var(--badbg);color:var(--bad)}
.asm .tm{background:var(--mutbg);color:var(--mut)}
.asm .tp{background:var(--p100);color:var(--p700)}
.asm table{border-collapse:collapse;width:100%;font-size:.84rem}
.asm th,.asm td{text-align:left;vertical-align:top;padding:8px 9px;border-bottom:1px solid var(--line)}
.asm th{font-size:.76rem;color:var(--ink3);font-weight:600;background:var(--p50)}
.asm tr:last-child td{border-bottom:none}
.asm td ul{margin:0;padding-left:16px}
.asm td li{margin-bottom:2px}
.asm .mono{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;overflow-wrap:break-word}
.asm #assetBody td:nth-child(2){min-width:165px}
.asm #assetBody td:nth-child(3){min-width:190px}
.asm #findBody td:nth-child(2){min-width:165px}
.asm td.sc{text-align:center;font-weight:800;font-size:1.05rem;width:64px}
.asm td.lv{text-align:center;font-weight:600;width:100px}
.asm .s-low{background:var(--goodbg);color:var(--good)}
.asm .s-mod{background:var(--warnbg);color:var(--warn)}
.asm .s-elev{background:var(--elevbg);color:var(--elev)}
.asm .s-high{background:var(--badbg);color:var(--bad)}
.asm .s-na{background:var(--mutbg);color:var(--mut)}
.asm .twrap{overflow-x:auto}
.asm .cat{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--ink)}
.asm .cat svg{width:24px;height:24px;flex:0 0 24px;color:var(--p600)}
.asm .score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.asm .score svg{width:170px;height:170px;flex:0 0 170px}
.asm .pill{display:inline-block;font-weight:700;padding:5px 16px;border-radius:999px;font-size:.95rem}
.asm .note{font-size:.85rem;color:var(--ink2);background:var(--p50);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.asm .take{margin:14px 0 0;padding-left:18px;font-size:.87rem;color:var(--ink2)}
.asm .take li{margin-bottom:5px}
.asm h3.sm{margin:14px 0 6px;font-size:.95rem;color:var(--p700)}
.asm .corr td:first-child{font-weight:600;color:var(--ink)}
.asm ol.steps{margin:0;padding-left:20px;font-size:.87rem;color:var(--ink2)}
.asm ol.steps li{margin-bottom:5px}
@media (max-width:1700px){.asm .grid2{grid-template-columns:1fr}}
@media (max-width:1100px){.asm .targets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.asm .flow{grid-template-columns:1fr}.asm .arrow{transform:rotate(90deg);height:28px}.asm .targets{grid-template-columns:1fr}}
:root{--elev:#9a4b12;--elevbg:#fde6d6;--elevfill:#f0a877}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--elev:#f5b98c;--elevbg:#3a2517;--elevfill:#b0673a}}
:root[data-theme="dark"]{--elev:#f5b98c;--elevbg:#3a2517;--elevfill:#b0673a}
.idx .grp{font-size:.7rem;font-weight:700;color:var(--ink3);letter-spacing:.4px;padding:12px 10px 4px}
.vbar{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sbar{display:inline-block;width:96px;height:10px;border-radius:5px;background:var(--mutbg);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:5px}
.sbar.big{width:200px;height:14px;border-radius:7px}
.vbar b{font-size:.84rem}
.bars2{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;margin:4px 0 12px}
.bars2 .bl{font-size:.8rem;color:var(--ink3);font-weight:600}
.mon{border-left:4px solid var(--bad)}
.dlbtn{margin-left:auto}
details.glance>summary{list-style:none;cursor:pointer}
details.glance>summary::-webkit-details-marker{display:none}
.vflow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.vstage{flex:1 1 170px;min-width:150px;background:var(--p50);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.vstage .st{font-size:.7rem;font-weight:700;color:var(--ink3);letter-spacing:.3px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.vstage .st .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--p600);color:#fff;font-size:.68rem}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:7px 0 5px;background:var(--mutbg)}
.stack i{display:block;height:100%}
.leg{display:flex;gap:8px;flex-wrap:wrap;font-size:.7rem;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:4px}
.leg span:before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.varr{align-self:center;color:var(--p500);font-size:1.1rem;font-weight:800}
.vtog{align-self:center;font-size:.72rem;color:var(--p600);font-weight:700;white-space:nowrap;padding:0 4px}
details.glance[open] .vtog .o{display:none} details.glance:not([open]) .vtog .c{display:none}
.execs .kpi{padding:7px 10px}.execs .kpi .v{font-size:1.15rem}.execs .kpi .k,.execs .kpi .d{font-size:.7rem}
.execs .acts{font-size:.78rem}.execs .acts li{margin-bottom:2px}
.execs .lede{margin:0 0 6px;font-size:.78rem;color:var(--ink2)}
details.fpgrp{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.fpgrp>summary{cursor:pointer;font-weight:700;color:var(--p700);font-size:.9rem}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:8px 0 4px}
.fstep{flex:1 1 0;min-width:118px;border-radius:12px;padding:10px 12px;font-size:.8rem;color:#2c2540;border:1px solid rgba(0,0,0,.05)}
.fstep b{display:block;font-size:.85rem;margin-bottom:3px}
.fstep .k{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.75);font-size:.72rem;font-weight:800;margin-right:6px;color:#4a3a6a}

  if(!a.named) d("Model provider not publicly named",-1);

  if(a.iso) d("ISO/IEC 42001 certified",0.5);
 }
 s=Math.max(0,Math.min(5,s));
 return {score:Math.round(s*2)/2,parts:parts,a:a};

 if(r==="High")return "Enhanced monitoring until the next annual assessment"+(v.crit==="Critical"?"; remediate or accept within the quarter":"")+". "+s;
 return s;}
/* ---------- vendor numbers ---------- */
function vnum(id){var all=V.concat(NEWV).concat(DISC).map(function(x){return x;}).sort(function(a,b){return a.name.localeCompare(b.name,undefined,{sensitivity:"base"});});
 for(var i=0;i<all.length;i++)if(all[i].id===id)return "V-"+("0"+(i+1)).slice(-2);return "";}
/* ---------- vendor risk table downloads ---------- */
function riskTableRows(){
 var R=[];
 V.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(v){R.push([vnum(v.id),v.name,v.use,v.crit+(v.provisional?" (provisional)":""),riskRating(v),REVIEW[v.crit],v.gaps[0],mitigationOf(v),"Assessed",(v.assessed||ASSESSED)]);});
 NEWV.forEach(function(d){var t=critOf(d.id).tier;R.push([vnum(d.id),d.name,d.use,t+(d.provisional?" (provisional)":""),"Not yet assessed",REVIEW[t],d.provisional?"Purpose not confirmed":"Security review required","Complete the assessment","Classified, not yet assessed","Not yet assessed (classified "+CLASSIFIED+")"]);});
 DISC.forEach(function(d){var t=critOf(d.id).tier;R.push([vnum(d.id),d.name,d.use,t,"Not assessed",REVIEW[t],"Not in the vendor inventory","Add to the register, classify, and assess","Discovered","Not assessed (discovered "+ASSESSED+")"]);});
 R.sort(function(a,b){return a[0].localeCompare(b[0]);});
 return R;
}
var REVIEW={Critical:"Annually",Moderate:"At renewal or when a concern is identified, at most yearly",Low:"No periodic security review"};
var ASSESSED="2026-09-29",CLASSIFIED="2026-10-08";
function fmtD(s){var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],p=s.split("-");return (+p[2])+" "+m[+p[1]-1]+" "+p[0];}
var RT_HEAD=["No.","Vendor","Use at PromptHalo","Vendor tier","Security risk","Review frequency","Top concern","Mitigation","Status","Assessment date"];
function plain(s){var d=document.createElement("div");d.innerHTML=s;return d.textContent||"";}
function loadScript(src){return new Promise(function(ok,no){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
function saveBlob(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}
function dlTable(kind,head,rows,name,title,widths,colorCols){
 rows=rows.map(function(r){return r.map(plain);});
 if(kind==="xlsx"){
  (window.XLSX?Promise.resolve():loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")).then(function(){
   var ws=XLSX.utils.aoa_to_sheet([head].concat(rows));ws["!cols"]=head.map(function(x,i){return {wch:(widths&&widths[i])?Math.round(widths[i]/4):20};});
   var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,title.slice(0,31));XLSX.writeFile(wb,name+".xlsx");
  }).catch(function(){
   var csv=[head].concat(rows).map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
   saveBlob(new Blob(["﻿"+csv],{type:"text/csv"}),name+".csv");});
  return;}
 var p=window.jspdf?Promise.resolve():loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js").then(function(){return loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js");});
 p.then(function(){
  var doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:"letter"});
  doc.setFontSize(14);doc.text("PromptHalo "+title,40,40);
  doc.setFontSize(9);doc.text("Vendor tier per Vendor Management Policy Section 6; security risk per Appendix B. Generated "+new Date().toISOString().slice(0,10)+".",40,56);
  var col={"Critical":[251,232,232],"High":[251,232,232],"Moderate":[252,241,219],"Low":[227,243,234]};
  var cs={};if(widths)widths.forEach(function(w,i){cs[i]={cellWidth:w};});
  doc.autoTable({head:[head],body:rows,startY:68,styles:{fontSize:7.5,cellPadding:3,overflow:"linebreak"},headStyles:{fillColor:[90,61,154]},columnStyles:cs,
   didParseCell:function(d){if(d.section==="body"&&colorCols&&colorCols.indexOf(d.column.index)>=0){var k=String(d.cell.raw).split(" ")[0];if(col[k])d.cell.styles.fillColor=col[k];}}});
  doc.save(name+".pdf");
 }).catch(function(){window.print();});
}
function registerRows(){
 var R=buildRegister(),S=loadJ(REG_KEY,{});
 return R.map(function(r){var s=S[r.id]||{};return [r.id,r.src,r.vendor,r.risk,RLAB[r.rating][0],"2026-09-29",s.owner||"",s.status||"Open",s.notes||""];});
}
var REG_HEAD=["ID","Source","Vendor or party","Risk","Rating","Logged","Owner","Status","Notes"];
function dlExcel(){dlTable("xlsx",RT_HEAD,riskTableRows(),"PromptHalo-Vendor-Risk","vendor risk table",[30,50,110,50,50,70,110,120,50,52],[3,4]);}
function dlPdf(){dlTable("pdf",RT_HEAD,riskTableRows(),"PromptHalo-Vendor-Risk","vendor risk table",[30,50,110,50,50,70,110,120,50,52],[3,4]);}
function initSort(){
 var th=el("main").querySelectorAll("th[data-sk]"); if(!th.length) return;
 var tb=th[0].closest("table").querySelector("tbody");
 var RANK={Critical:0,High:0,P1:0,Moderate:1,P2:1,Low:2,P3:2};
 function key(tr,k){var c=tr.children[k];if(!c)return "";
  if(k===0||k===1){var a=c.querySelector(k===0?"b":"strong");return (a?a.textContent:c.textContent).trim().toLowerCase();}
  var t=c.textContent.trim().split(/\s+/)[0];
  if(k===4||k===5)return c.textContent.trim().toLowerCase();
  if(k===6)return c.getAttribute("data-d")||"9";
  return t in RANK?RANK[t]:9;}
 var cur=-1,dir=1;
 for(var i=0;i<th.length;i++) th[i].addEventListener("click",function(){
  var k={0:0,5:1,2:2,3:3,4:4,7:5,6:6}[+this.getAttribute("data-sk")]; if(k===cur)dir=-dir; else {cur=k;dir=1;}
  var rows=[].slice.call(tb.children);
  rows.sort(function(a,b){var x=key(a,cur),y=key(b,cur);var r=(typeof x==="number"&&typeof y==="number")?x-y:String(x).localeCompare(String(y));
   if(r===0&&cur!==0)r=String(key(a,0)).localeCompare(String(key(b,0)));return r*dir;});
  rows.forEach(function(r){tb.appendChild(r);});
  for(var j=0;j<th.length;j++){var on={0:0,5:1,2:2,3:3,4:4,7:5,6:6}[+th[j].getAttribute("data-sk")]===cur;th[j].querySelector(".sarr").innerHTML=on?(dir>0?"&#9650;":"&#9660;"):"";if(on)th[j].setAttribute("aria-sort",dir>0?"ascending":"descending");else th[j].removeAttribute("aria-sort");}
 }); th[0].click();
}
/* ---------- nav ---------- */
var CUR="overview";
function buildIdx(){
 var h='<li><button data-go="overview"><span class="nm">Summary</span></button></li>';
 h+='<li class="grp">VENDORS</li>';
 for(var i=0;i<V.length;i++){var rr=riskRating(V[i]);
  h+='<li><button data-go="'+V[i].id+'" title="'+rr+' security risk"><span class="nm"><span style="color:var(--ink3);font-size:.72rem;margin-right:6px">'+vnum(V[i].id).slice(2)+'</span>'+V[i].name+'</span><span class="chip '+riskCls(rr)+'">'+rr.charAt(0)+'</span></button></li>';}
 if(NEWV.length) h+='<li class="grp">CLASSIFIED, NOT YET ASSESSED</li>';
 for(var q=0;q<NEWV.length;q++){var nc=NEWV[q].provisional?"c-mut":tierCls(NEWV[q].crit);
  h+='<li><button data-go="'+NEWV[q].id+'"><span class="nm"><span style="color:var(--ink3);font-size:.72rem;margin-right:6px">'+vnum(NEWV[q].id).slice(2)+'</span>'+NEWV[q].name+'</span><span class="chip c-mut" title="Not yet assessed">&ndash;</span></button></li>';}
 h+='<li class="grp">GOVERNANCE</li><li><button data-go="register"><span class="nm">Risk register and log</span></button></li>';
 if(SHOWSELF){var sr=riskRating(SELF),as=asmScore(),al=lvl(as);
  var ac={"s-low":"c-good","s-mod":"c-warn","s-elev":"c-warn","s-high":"c-bad"}[al[1]];
  h+='<li class="grp">PROMPTHALO</li>';
  h+='<li><button data-go="asm"><span class="nm">External attack surface</span><span class="chip '+ac+'">'+al[0].charAt(0)+'</span></button></li>';
  h+='<li><button data-go="'+SELF.id+'"><span class="nm">Self-assessment</span><span class="chip '+riskCls(sr)+'">'+sr.charAt(0)+'</span></button></li>';}
 el("idx").innerHTML=h;
 var bs=el("idx").querySelectorAll("button");
 for(var j=0;j<bs.length;j++) bs[j].addEventListener("click",function(){go(this.getAttribute("data-go"));});
 el("selfToggle").checked=SHOWSELF;
}
el("selfToggle").addEventListener("change",function(){
 SHOWSELF=this.checked; try{localStorage.setItem("ph-tprm-self",SHOWSELF?"1":"0");}catch(e){}
 buildIdx(); go(SHOWSELF?"asm":((CUR==="prompthalo"||CUR==="asm")?"overview":CUR));
});
function go(id){
 CUR=id; var v=null,L=allV();for(var i=0;i<L.length;i++) if(L[i].id===id) v=L[i];
 if(id==="asm"&&SHOWSELF){el("main").innerHTML=ASM_HTML;initASM();} else if(id==="register"){el("main").innerHTML=renderRegister();bindRegister();} else {var nv=null;for(var z=0;z<NEWV.length;z++)if(NEWV[z].id===id)nv=NEWV[z];el("main").innerHTML=nv?renderPending(nv):(v?renderVendor(v):renderOverview());}
 var bs=el("idx").querySelectorAll("button");
 for(var j=0;j<bs.length;j++){var on=bs[j].getAttribute("data-go")===id;bs[j].classList.toggle("on",on);if(on)bs[j].setAttribute("aria-current","page");else bs[j].removeAttribute("aria-current");}
 var ex=el("main").querySelectorAll(".expandall button[data-x]");
 for(var k=0;k<ex.length;k++) ex[k].addEventListener("click",function(){
  var ds=el(this.getAttribute("data-x")).querySelectorAll("details"),o=this.getAttribute("data-o")==="1";
  for(var m=0;m<ds.length;m++) ds[m].open=o;});
 var dlb=el("main").querySelectorAll("button[data-dl]");
 for(var w=0;w<dlb.length;w++) dlb[w].addEventListener("click",function(){if(this.getAttribute("data-dl")==="xlsx")dlExcel();else dlPdf();});
 initSort();
 var psb=el("main").querySelectorAll("button[data-psort]");
 for(var q=0;q<psb.length;q++) psb[q].addEventListener("click",function(){PSORT=this.getAttribute("data-psort");go("overview");});
 var links=el("main").querySelectorAll("a[data-go]");
 for(var n=0;n<links.length;n++) links[n].addEventListener("click",function(e){e.preventDefault();go(this.getAttribute("data-go"));});
 try{history.replaceState(null,"","#"+id);}catch(e){}
 window.scrollTo(0,0);
}

/* ---------- text size ---------- */
(function(){
 var saved=null;try{saved=localStorage.getItem("ph-tprm-fs");}catch(e){}
 function apply(v){document.documentElement.style.setProperty("--fs",v);
  var bs=document.querySelectorAll(".sizer button");for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-fs")===v);
  try{localStorage.setItem("ph-tprm-fs",v);}catch(e){}}
 apply(saved||"15px");
 var bs=document.querySelectorAll(".sizer button");for(var i=0;i<bs.length;i++)bs[i].addEventListener("click",function(){apply(this.getAttribute("data-fs"));});
})();

V.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{sensitivity:"base"});});
buildIdx();
var start=(location.hash||"").replace("#","");
go(start&&(start==="overview"||(start==="asm"&&SHOWSELF)||start==="register"||allV().some(function(v){return v.id===start;})||NEWV.some(function(v){return v.id===start;}))?start:"overview");
if(window.matchMedia){try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){go(CUR);});}catch(e){}}
</script>
