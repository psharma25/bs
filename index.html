<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Come back again</title>
<style>
  :root {
    --petrol: #1b4965;
    --petrol-deep: #0f2f42;
    --paper: #f7f5f2;
    --muted: #6b7a85;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: var(--paper);
    color: var(--petrol-deep);
    font-family: "Inter", Calibri, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; }
  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 9vw, 4rem);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--petrol);
  }
  hr {
    border: 0;
    border-top: 1px solid rgba(27, 73, 101, 0.18);
    margin: 1.75rem 0 1.1rem;
  }
  p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <h1>Come back again.</h1>
    <hr>
    <p>Nothing here yet. This page will fill in when there's something worth showing.</p>
  </main>
</body>
</html>
