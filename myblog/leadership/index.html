<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What kind of leader are you, actually?</title>
<style>
:root{
  --petrol:#1b4965;--petrol-deep:#123145;--petrol-mid:#2d6a8f;
  --amber:#ffa500;--amber-soft:#fff4e0;
  --bg:#f4f7f8;--card:#fff;--ink:#16232b;--muted:#61757f;--line:#dde5e9;--line-soft:#eef3f5;
  --ok:#1a6e4c;--ok-soft:#e4f1ea;--ok-b:#9fcbb5;--warn:#b26a00;--bad:#a92e25;--bad-soft:#fbeceb;
  --sans:'Inter','Calibri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','Consolas','SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.in{max-width:1020px;margin:0 auto}
.mast{background:var(--petrol);color:#fff;padding:24px 26px 20px}
.mast h1{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-.015em}
.mast p{margin:0;color:#bcd4e2;font-size:13.5px;max-width:800px}
.tabs{background:var(--petrol-deep);padding:0 26px;border-bottom:3px solid var(--amber)}
.tabs .in{display:flex;gap:2px;flex-wrap:wrap}
.tab{background:none;border:0;color:#9fc0d2;font-size:13.5px;font-weight:600;padding:12px 17px;
     border-bottom:3px solid transparent;margin-bottom:-3px}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--amber)}
.tab[disabled]{color:#5d7f92;cursor:not-allowed}
.bar{position:sticky;top:0;z-index:30;background:rgba(244,247,248,.96);border-bottom:1px solid var(--line);padding:10px 26px}
.bar .in{display:flex;align-items:center;gap:13px}
.bar b{font-family:var(--mono);font-size:12.5px;color:var(--petrol);white-space:nowrap}
.track{flex:1;height:6px;background:#dde7eb;border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--amber);width:0;transition:width .25s}
.wrap{max-width:1020px;margin:0 auto;padding:20px 26px 70px}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:4px;
      padding:13px 16px;margin-bottom:20px;font-size:13.5px;color:#3d525d}
.note b{color:var(--petrol)}.note p{margin:0 0 7px}.note p:last-child{margin:0}
.grp{margin-bottom:26px}
.grp-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--petrol);font-weight:700;
       padding-bottom:6px;border-bottom:2px solid var(--petrol);margin-bottom:11px;display:flex;
       justify-content:space-between;align-items:baseline;gap:12px}
.grp-h em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--muted)}
button.grp-h{width:100%;background:none;border:0;border-bottom:2px solid var(--petrol);cursor:pointer;
  font-family:var(--sans);text-align:left;padding:0 0 6px}
button.grp-h:hover{border-bottom-color:var(--petrol-mid)}
button.grp-h:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.grp-h .tw{display:inline-block;font-size:10px;color:var(--petrol-mid);margin-right:7px;transition:transform .14s}
.grp.shut .grp-h .tw{transform:rotate(-90deg)}
.grp-h .bits{display:flex;align-items:center;gap:9px;margin-left:auto}
.grp-h .mini2{width:52px;height:5px;background:#dde7eb;border-radius:3px;overflow:hidden;display:block}
.grp-h .mini2 i{display:block;height:100%;background:var(--amber)}
.grp.shut .q,.grp.shut .pat{display:none}
.grp.shut .grp-h{margin-bottom:0}
.gctl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px;font-size:12.5px;color:var(--muted)}
.gctl .chip{font-size:12px;padding:4px 11px;border:1px solid var(--line);background:#fff;border-radius:3px;
  cursor:pointer;color:var(--muted);font-family:var(--sans)}
.gctl .chip:hover{border-color:var(--petrol-mid);color:var(--petrol)}
.gctl .chip[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff;font-weight:600}
.gctl label{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--muted)}
.q{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px 17px 13px;margin-bottom:9px;scroll-margin-top:70px}
.q.done{border-color:#c6dbe4}
.q .n{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.q h3{margin:3px 0 3px;font-size:16px;font-weight:650;letter-spacing:-.008em}
.q .s{margin:0 0 12px;font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:#fbfdfd;border:1px solid var(--line);border-radius:4px;padding:10px 13px;font-size:14.5px;color:var(--ink);line-height:1.45}
.opt:hover{border-color:var(--petrol-mid);background:#f4f9fb}
.opt.on{border-color:var(--petrol);background:#e9f2f7;font-weight:500}
.btn{font-size:13.5px;padding:10px 20px;border:1px solid var(--petrol);background:var(--petrol);color:#fff;border-radius:4px;font-weight:600}
.btn:hover{background:var(--petrol-deep)}
.btn[disabled]{background:#b9c9d2;border-color:#b9c9d2;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--petrol)}
.btn.ghost:hover{background:var(--line-soft)}
.btn.sm{padding:7px 14px;font-size:12.5px}
.btn.danger{background:#fff;color:var(--bad);border-color:#e0b4ae}
.btn.danger:hover{background:var(--bad-soft)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
.center{text-align:center;margin:24px 0}
.stats{display:flex;flex-wrap:wrap;gap:26px;background:var(--petrol-deep);color:#cfe0ea;border-radius:5px;padding:14px 20px;margin-bottom:16px}
.stat b{display:block;font-size:20px;color:#fff;font-weight:700;line-height:1.2}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#8fb2c6}
.portrait{background:var(--petrol);color:#fff;border-radius:5px;padding:26px;margin-bottom:16px}
.portrait .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#8fb6cc}
.portrait h2{font-size:29px;margin:7px 0 11px;letter-spacing:-.02em;line-height:1.12}
.portrait p{font-size:15.5px;color:#d3e4ee;margin:0}
.verdict{border-radius:5px;padding:20px 22px;margin-bottom:16px;border:1px solid}
.verdict h3{font-size:11px;text-transform:uppercase;letter-spacing:.11em;margin:0 0 7px;font-weight:700}
.verdict h2{font-size:22px;margin:0 0 9px;letter-spacing:-.015em}
.verdict p{margin:0;font-size:14.5px}
.v-good{background:var(--ok-soft);border-color:var(--ok-b)}
.v-good h3,.v-good h2{color:var(--ok)}.v-good p{color:#2a4d3c}
.v-mid{background:var(--amber-soft);border-color:#f0d5a8}
.v-mid h3,.v-mid h2{color:#8a5a08}.v-mid p{color:#5c3a00}
.v-bad{background:var(--bad-soft);border-color:#e0b4ae}
.v-bad h3,.v-bad h2{color:var(--bad)}.v-bad p{color:#5e211c}
.sec{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:20px 22px;margin-bottom:14px}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--petrol);font-weight:700;margin:0 0 6px}
.sec .lead{font-size:13.5px;color:var(--muted);margin:0 0 17px}
.mq{position:relative;height:430px;border:1px solid #B9C6CD;border-radius:5px;overflow:hidden;background:#fff}
.mqc{position:absolute;width:50%;height:50%}
.mq-tl{top:0;left:0;background:#FAF0E1}.mq-tr{top:0;right:0;background:#E2F0E7}
.mq-bl{bottom:0;left:0;background:#F1F1EE}.mq-br{bottom:0;right:0;background:#E8F0F7}
.mqrule{position:absolute;background:#8FA3AE;z-index:1}
.mqrule.v{left:calc(50% - 1px);top:0;bottom:0;width:2px}
.mqrule.h{top:calc(50% - 1px);left:0;right:0;height:2px}
.mqn{position:absolute;bottom:10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;z-index:2}
.mq-tl .mqn,.mq-bl .mqn{left:13px}.mq-tr .mqn,.mq-br .mqn{right:13px;text-align:right}
.mq-tl .mqn{color:#7A4212}.mq-tr .mqn{color:#175E3D}.mq-bl .mqn{color:#4E4E48}.mq-br .mqn{color:#17456A}
.mqn em{display:block;font-style:normal;text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:400;margin-top:3px;max-width:190px;color:#3A4750;line-height:1.35}
.mq-tr .mqn em,.mq-br .mqn em{margin-left:auto}
.mqzone{position:absolute;border:2px dashed #2E7D5B;background:rgba(46,125,91,.05);border-radius:4px;z-index:2}
.mqzone i{position:absolute;top:6px;left:8px;font-size:9.5px;font-style:normal;letter-spacing:.06em;text-transform:uppercase;
  color:#175E3D;font-weight:700;background:#fff;border:1px solid #A9CDBB;padding:1px 6px;border-radius:3px}
.me{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:4}
.me i{display:block;width:20px;height:20px;border-radius:50%;background:var(--amber);border:3px solid #123145;margin:0 auto}
.me b{display:block;font-size:11.5px;font-weight:700;color:#123145;white-space:nowrap;background:#fff;border:2px solid var(--amber);padding:1px 7px;margin-top:5px;border-radius:3px}
.mqax{display:flex;justify-content:space-between;font-size:11.5px;color:#43555F;margin-top:8px;font-weight:600}
.mqy{font-size:11.5px;color:#43555F;margin-bottom:6px;font-weight:600}
.axis{margin-bottom:22px}.axis:last-child{margin-bottom:0}
.axis .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px}
.axis .top b{font-size:15px;font-weight:650}
.axis .top em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.rail{position:relative;height:36px;background:#f1f5f7;border:1px solid #e2eaee;border-radius:5px}
.good{position:absolute;top:-1px;bottom:-1px;background:var(--ok-soft);border:1px solid var(--ok-b);border-radius:4px}
.good i{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;font-style:normal;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ok);background:#fff;border:1px solid var(--ok-b);padding:1px 6px;border-radius:8px;white-space:nowrap}
.pin{position:absolute;top:8px;width:20px;height:20px;border-radius:50%;transform:translateX(-50%);border:2px solid #fff;z-index:3;
  background:var(--amber);box-shadow:0 0 0 1px #b06d00}
.pin.sm2{width:13px;height:13px;top:11px;border-width:2px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.tl{position:relative;padding-left:25px}
.tl:before{content:"";position:absolute;left:5px;top:7px;bottom:7px;width:2px;background:linear-gradient(var(--ok-b),var(--amber),var(--bad))}
.step{position:relative;margin-bottom:16px}.step:last-child{margin-bottom:0}
.step:before{content:"";position:absolute;left:-24px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--muted)}
.step.s0:before{border-color:var(--ok)}.step.s1:before{border-color:var(--amber)}.step.s2:before{border-color:var(--bad)}
.step h4{margin:0 0 3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em}
.step.s0 h4{color:var(--ok)}.step.s1 h4{color:#a06400}.step.s2 h4{color:var(--bad)}
.step p{margin:0;font-size:14.5px;color:#3d525d;line-height:1.5}
.gets{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:9px}
.gets>div{padding:12px 14px}
.gets .g{background:var(--ok-soft);border-right:1px solid var(--line)}
.gets .p{background:var(--bad-soft)}
.gets h4{font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 4px;font-weight:700}
.gets .g h4{color:var(--ok)}.gets .p h4{color:var(--bad)}
.gets p{margin:0;font-size:13.5px;color:#3d525d;line-height:1.45}
.ah{font-weight:650;font-size:14.5px;margin:16px 0 0}.ah.f{margin-top:0}
.try{background:var(--amber-soft);border:1px solid #f0d5a8;border-radius:5px;padding:16px 18px;margin-bottom:14px}
.try h3{color:#8a5a08;font-size:11px;text-transform:uppercase;letter-spacing:.11em;margin:0 0 6px;font-weight:700}
.try p{margin:0;font-size:14.5px;color:#5c3a00}
button.sec-h{width:100%;background:none;border:0;cursor:pointer;font-family:var(--sans);text-align:left;
  font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--petrol);font-weight:700;padding:0 0 6px;
  display:flex;align-items:center;gap:8px}
button.sec-h:hover{color:var(--petrol-deep)}
button.sec-h:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
button.sec-h .tw{font-size:10px;color:var(--petrol-mid);transition:transform .14s}
.sec.shut button.sec-h .tw,.anon.shut button.sec-h .tw,.try.shut button.sec-h .tw{transform:rotate(-90deg)}
.sec.shut .sec-b,.anon.shut .sec-b,.try.shut .sec-b{display:none}
.sec.shut,.anon.shut,.try.shut{padding-bottom:14px}
.foldbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.foldbar .chip{font-size:12px;padding:4px 11px;border:1px solid var(--line);background:#fff;border-radius:3px;
  cursor:pointer;color:var(--muted);font-family:var(--sans)}
.foldbar .chip:hover{border-color:var(--petrol-mid);color:var(--petrol)}
button.pat-h{width:100%;background:none;border:0;cursor:pointer;font-family:var(--sans);text-align:left;
  padding:0;display:grid;grid-template-columns:18px 1fr 120px;gap:11px;align-items:center}
button.pat-h:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.pat-h .tw{font-size:10px;color:var(--petrol-mid);transition:transform .14s}
.pat.shut .pat-h .tw{transform:rotate(-90deg)}
.pat.shut .pbody{display:none}
.pat-h .mini{margin:0}
.pbody{margin-top:11px}
.pat{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:16px 18px;margin-bottom:10px}
.pat.mine{border-color:var(--amber);border-left:4px solid var(--amber);background:#fffdf9}
.pat h4{margin:0 0 3px;font-size:16px;font-weight:650}
.pat .tag{font-family:var(--mono);font-size:10.5px;color:var(--petrol-mid);letter-spacing:.04em}
.pat .yours{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:#8a5a08;background:var(--amber-soft);border:1px solid #f0d5a8;padding:2px 8px;border-radius:10px;margin-left:8px}
.pat p{margin:7px 0 0;font-size:14px;color:#3d525d}
.pat .mini{position:relative;height:16px;background:#f1f5f7;border:1px solid #e2eaee;border-radius:4px;margin:10px 0 5px}
.pat .mini .gd{position:absolute;top:-1px;bottom:-1px;background:var(--ok-soft);border:1px solid var(--ok-b);border-radius:3px}
.pat .mini .dot{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;background:var(--petrol);transform:translateX(-50%);z-index:2;border:2px solid #fff;box-shadow:0 0 0 1px var(--petrol-deep)}
.pat .mend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pat .cost{margin-top:9px;font-size:13.5px;color:#5e211c;background:var(--bad-soft);border:1px solid #e0b4ae;border-radius:4px;padding:9px 12px}
.pat .cost b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--bad);margin-bottom:3px}
.refs{list-style:none;padding:0;margin:0;counter-reset:r}
.refs li{counter-increment:r;padding:13px 0 13px 34px;border-top:1px solid var(--line-soft);position:relative;font-size:13.5px;color:#3d525d}
.refs li:first-child{border-top:0}
.refs li:before{content:counter(r);position:absolute;left:0;top:14px;width:23px;height:23px;border-radius:50%;
  background:var(--petrol);color:#fff;font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.reflink{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:11.5px;color:var(--petrol-mid);
  text-decoration:none;border-bottom:1px solid #b7d0dd;word-break:break-all}
.reflink:hover{color:var(--petrol-deep);border-bottom-color:var(--petrol)}
.refs b{display:block;color:var(--petrol-deep);font-size:14px;margin-bottom:3px}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:22px;line-height:1.6}

/* --- one at a time --- */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:26px 26px 22px;box-shadow:0 1px 6px rgba(20,45,60,.05)}
.card .n{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.card h2{margin:7px 0 6px;font-size:22px;font-weight:700;letter-spacing:-.015em;color:var(--petrol-deep)}
.card .s{margin:0 0 18px;font-size:16px;color:#3d525d;line-height:1.5}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.dots i{width:16px;height:4px;border-radius:2px;background:#d8e3e8;display:block}
.dots i.d{background:var(--petrol)}.dots i.c{background:var(--amber)}
.fb{margin-top:16px;background:var(--amber-soft);border:1px solid #f0d5a8;border-radius:6px;padding:14px 16px}
.fb b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#8a5a08;margin-bottom:4px}
.fb p{margin:0;font-size:15px;color:#5c3a00;line-height:1.5}
.picked{margin-top:14px;font-size:13.5px;color:var(--muted)}
.picked b{color:var(--petrol);font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);font-size:13.5px;padding:6px 2px;text-decoration:underline}
.link:hover{color:var(--petrol)}
.dots i{cursor:default}
.dots i.click{cursor:pointer}
.dots i.click:hover{background:var(--petrol-mid)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:13px 16px;margin-bottom:8px;
     display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.rev.blank{border-style:dashed;background:#fbfcfd}
.rev .t{font-size:14.5px;font-weight:650;color:var(--ink)}
.rev .t em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block;letter-spacing:.04em}
.rev .a{font-size:14px;color:#3d525d;margin-top:4px}
.rev .a.none{color:#a0b0b8;font-style:italic}
.chip2 button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:13px;padding:0 0 0 6px;line-height:1}
.warn{background:#fff;border:1px solid #e0b4ae;border-left:3px solid var(--bad);border-radius:4px;padding:12px 15px;
      margin-bottom:18px;font-size:13px;color:#5e211c}
.warn b{color:var(--bad)}
.anon{background:#eef4f7;border:1px solid #c7dae4;border-radius:5px;padding:18px 20px;margin-bottom:14px}
.anon h3{color:var(--petrol);font-size:11px;text-transform:uppercase;letter-spacing:.11em;margin:0 0 6px;font-weight:700}
.anon p{margin:0 0 11px;font-size:14px;color:#3d525d}
.anon input[type=text]{width:100%;max-width:320px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;
  font-family:var(--sans);font-size:14px;color:var(--ink);margin-bottom:9px}
.anon textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);
  font-size:12.5px;color:#3d525d;background:#fbfdfd;min-height:56px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip2{font-family:var(--mono);font-size:11px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:4px 9px;color:var(--petrol)}
.locked{background:#f6f8f9;border:1px dashed #b9c9d2;border-radius:5px;padding:16px 18px;font-size:13.5px;color:#43555F;margin-top:12px}
.locked b{color:var(--petrol)}
.pin.them2{background:var(--petrol);box-shadow:0 0 0 1px #0f2e42;z-index:2}
.key{display:flex;gap:17px;flex-wrap:wrap;font-size:12px;color:#3d525d;margin-bottom:18px}

<script>
const AX = {
 grip: {n:"Grip",          lo:"Hands off",      hi:"Hands on",           good:[30,58], g:"How you hold the work",        wp:0.6, we:0.9},
 cmd:  {n:"Command",       lo:"Laissez-faire",  hi:"Militaristic",       good:[30,58], g:"How you hold the work",        wp:0.5, we:0.9},
 say:  {n:"Candour",       lo:"Just nice",      hi:"Blunt",              good:[52,80], g:"How you say hard things",      wp:0.9, we:0.5},
 conf: {n:"Conflict",      lo:"Lets it run",    hi:"Steps in fast",      good:[40,68], g:"How you say hard things",      wp:0.5, we:0.7},
 grow: {n:"Growth",        lo:"All of them",    hi:"All of you",         good:[25,52], g:"Who you build",                wp:0.9, we:0.2},
 light:{n:"Spotlight",     lo:"Gives it away",  hi:"Takes it",           good:[18,46], g:"Who you build",                wp:0.8, we:0.2},
 wx:   {n:"Weather",       lo:"Flat calm",      hi:"Storm front",        good:[18,46], g:"How you show up",              wp:1.0, we:0.4},
 wake: {n:"Wake",          lo:"Leaves scars",   hi:"Creates dependence", good:[55,82], g:"How you show up",              wp:1.0, we:0.1},
 self: {n:"Self-interest", lo:"Never yourself", hi:"Yourself first",     good:[22,52], g:"What you are like underneath", wp:0.9, we:0.2},
 out:  {n:"Outlook",       lo:"Nothing is good enough", hi:"Everything is fine", good:[35,62], g:"How you show up",              wp:0.8, we:0.3},
 fair: {n:"Even-handed",   lo:"Over-corrects",  hi:"Has favourites",     good:[25,55], g:"What you are like underneath", wp:0.9, we:0.2}
};

const Q = [
{ax:"grip", t:"The draft",
 s:"Work comes back close to what you had in mind. Not quite. It goes out Monday.",
 o:[["You take it home and finish it yourself.",4,"The work gets better tonight. The person does not."],
    ["You send it back with everything you would change.",3,"Thorough. A long list is also hard to read priorities from."],
    ["You name the two things that matter and leave the rest.",2,"That is the version somebody can actually act on."],
    ["You send it on as it is.",1,"Quick. Worth knowing whether they were clear where the bar was."]]},
{ax:"grip", t:"Away for the week",
 s:"You are on leave. Something comes up that you would normally decide.",
 o:[["You answer the message.",4,"They got an answer. They also learned to ask."],
    ["You hear about it after and say what you would have done.",3,"The correction arrives after the fact, which is the expensive moment for it."],
    ["You had left a note on how to weigh decisions like that one.",2,"Direction without presence. That is the kind that travels."],
    ["You find out on your return. It was handled.",1,"They coped. Worth knowing whether they felt equipped or just brave."]]},

{ax:"cmd", t:"Reopening it",
 s:"Something was settled last week. Someone wants to go back to it.",
 o:[["You say it is decided and we are moving.",4,"Clear. Possibly also the last time they raise something like this."],
    ["You listen, then confirm it stands.",3,"They were heard. Whether they felt heard is a separate question."],
    ["You ask what has changed since.",2,"That question is the whole control. It separates new information from second thoughts."],
    ["You reopen it.",1,"Buy-in matters. So does the cost of nothing ever being settled."]]},
{ax:"cmd", t:"Monday morning",
 s:"Think about how work actually gets pointed at your team.",
 o:[["There is a plan, and you would notice a departure from it.",4,"Nobody is confused. Some of them have stopped thinking."],
    ["There is a plan and you walk through it together each week.",3,"Shared, if a little ritual."],
    ["There are priorities. They work out the order.",2,"Direction from you, method from them. Usually the sweet spot."],
    ["They know the goal. The rest is theirs.",1,"Freeing for the confident. Quiet for everybody else."]]},

{ax:"say", t:"The thing they cannot see",
 s:"Someone is doing something that will cost them in about a year. They have no idea.",
 o:[["You say it this week, and stay in the conversation afterwards.",4,"Early and specific. The one that feels expensive and costs least."],
    ["You say it, then spend a while taking the edge off.",3,"It was said. Some of it may not have survived the softening."],
    ["You gesture at it and hope.",2,"Hinting puts the decoding on the person least able to do it."],
    ["You keep it for the review.",1,"There is a proper place for it. There is also a year between now and then."]]},
{ax:"say", t:"The work is not good",
 s:"Someone hands you what you asked for. It does not do the job.",
 o:[["\u201cThis is not there yet. Here is what is missing.\u201d",4,"Direct and usable. The second half is what makes the first half land."],
    ["\u201cGood start.\u201d Then a long list.",3,"The list is the message. The opener may be working against it."],
    ["You thank them and quietly repair the worst of it.",2,"Kind in the moment. They will do it exactly the same way next time."],
    ["You thank them and ask someone else.",1,"The work gets fixed. They find out later, from somebody else, or never."]]},

{ax:"conf", t:"The two of them",
 s:"Two people on your team have gone cool with each other. It shows in meetings.",
 o:[["You get them both in a room this week.",4,"Decisive. It is also now your conflict rather than theirs."],
    ["You speak to each of them separately first.",3,"Sensible sequencing, as long as it does not stop there."],
    ["You give it a fortnight, then step in.",2,"Space with a deadline on it. That is a strategy rather than an absence of one."],
    ["You leave it. They are adults.",1,"Often true. The times it is not true are the expensive ones."]]},
{ax:"conf", t:"The third time",
 s:"Someone comes to you about a colleague. It is the third time this quarter.",
 o:[["You go to the colleague today.",4,"Fast. The person who came to you has also learned they never need to say it themselves."],
    ["You bring the two of them together.",3,"Resolved, with you as the mechanism."],
    ["You ask what they have already said to them directly.",2,"That question builds something. It is also the least comfortable answer to have to give."],
    ["You listen properly and keep watching.",1,"Three times is usually past the point where watching counts as the intervention."]]},

{ax:"grow", t:"The one free day",
 s:"You get a day a month with nothing in it.",
 o:[["Your own learning, or your own network.",4,"Necessary. Nobody else is going to put it in your calendar."],
    ["Split between reading and time with the team.",3,"Reasonable. Split days have a way of becoming neither."],
    ["Coaching the two who need it most.",2,"About the clearest return you will get on a day."],
    ["It goes to the team. It always goes to the team.",1,"Generous. Also how leaders quietly go out of date."]]},
{ax:"grow", t:"The visible project",
 s:"Something high-profile lands. You could do it, or hand it to someone who would learn from it.",
 o:[["You take it. It is visible and you need that at the moment.",4,"Honest. Worth noticing how often that turns out to be the answer."],
    ["You take it and bring someone along to watch.",3,"Watching is not doing. Useful, and not the same thing."],
    ["You give it to them and stay close.",2,"Stretch with a net under it. That is what development actually looks like."],
    ["You give it to them and step away.",1,"Trusting. Check they know where to find you."]]},

{ax:"light", t:"The room is impressed",
 s:"Your team's work lands well. Senior people are there. So are you.",
 o:[["You take the questions. You know the answers.",4,"Efficient. The only name that room now knows is yours."],
    ["You say the team did it, without names.",3,"Generous in tone, anonymous in effect."],
    ["You name the two people who did it.",2,"Names are what senior people retain. That was the whole moment."],
    ["You name them and hand the next question over.",1,"You gave away the room. That is the part they will remember."]]},
{ax:"light", t:"It failed publicly",
 s:"Something your team owns has gone wrong in the open. Someone senior asks how.",
 o:[["You answer honestly about who did what.",4,"Accurate. It will be repeated back to them for a long time."],
    ["You say the team got it wrong.",3,"Collective, which spreads it thinly rather than removing it."],
    ["You say it was your call.",2,"That is the version that buys you something later."],
    ["You say it was your call \u2014 having already told them so first.",1,"The order matters. Telling them first is what makes it true rather than tactical."]]},

{ax:"wx", t:"An expensive mistake",
 s:"Someone tells you about something they got wrong. It is going to cost real money.",
 o:[["You ask how it was allowed to happen.",4,"A fair question, asked in a way that sets how long you wait for the next one."],
    ["You say less than usual for a day or so.",3,"You did not say anything. They read it anyway."],
    ["You say it is fine, and move on.",2,"Kind. Nothing changed either, which they also noticed."],
    ["You ask what happened and what they need.",1,"That order is why you will hear about the next one early."]]},
{ax:"wx", t:"The risk you already dismissed",
 s:"Someone raises something you considered three weeks ago and set aside.",
 o:[["It is clear you have been here before.",4,"They will think twice before raising the next one."],
    ["\u201cWe have got it.\u201d And on.",3,"Closed without being explained, which reads as dismissal even when it is not."],
    ["You explain why you set it aside.",2,"Costs a minute. Buys the next risk somebody spots."],
    ["You go back through it with them.",1,"Generous with your time. Occasionally you will change your mind, which is the point."]]},

{ax:"wake", t:"They move on",
 s:"Someone leaves your team for another job. Think about the last few who did.",
 o:[["They still route decisions past you months later, and you still answer.",4,"Flattering. They have not entirely left, and neither have you."],
    ["You stayed in touch, and you would hire them tomorrow.",3,"About the healthiest version of an ending there is."],
    ["Professional. Best wishes, and that was that.",2,"Clean. Neutral endings are common, and they are not free."],
    ["They were quiet at the end, and you heard the reason later.",1,"The quiet is the information. It usually means the conversation felt unavailable."]]},
{ax:"wake", t:"What they say about you",
 s:"Someone is considering joining your team and asks a current member what you are like.",
 o:[["\u201cYou will not want to work for anyone else afterwards.\u201d",4,"High praise, with a shadow inside it."],
    ["\u201cYou will learn a lot.\u201d",3,"The thing most people want from a manager and rarely get."],
    ["\u201cThey are fine.\u201d",2,"Fine is not a criticism. It is also not a reason to join."],
    ["\u201cKeep your head down.\u201d",1,"That sentence has a history behind it."]]},

{ax:"out", t:"The quarter is over",
 s:"Most of it went well. One thing did not.",
 o:[["You lead with the thing that did not, and stay there.",1,"Accurate. Also the only part anybody will remember from the meeting."],
    ["You mention the wins in a sentence, then spend the hour on the problem.",2,"The proportions in a meeting are the message, whatever the words are."],
    ["You name what went well specifically, then work the problem properly.",3,"Both things are true and both got said. That is harder than it sounds."],
    ["You celebrate the quarter. The problem can wait for another day.",4,"Morale now, at the cost of a problem that will be older when you get to it."]]},
{ax:"out", t:"A plan you think might fail",
 s:"Someone brings you something they are keen on. You can see a real chance it does not work.",
 o:[["You go through everything that could go wrong. They should know.",1,"Thorough. They will bring you the next one already braced, or not at all."],

 [78,"They would follow you to your next job.","On the traits that decide whether people re-enlist, you are in good shape. The risk from here is complacency rather than a cliff \u2014 a reputation like this is built slowly and spent quickly, usually in one bad quarter when you were under pressure and stopped noticing."],
 [62,"They would work for you again.","Not with a banner, but genuinely \u2014 if you called them in two years, most would take the meeting. Look at whichever trait sits furthest outside its healthy zone, because that is the one quietly deciding whether this holds."],

 [28,"Probably not, and they would be polite about why.","People are managing around you rather than working with you. Nobody will say this to your face \u2014 the exit conversations will mention timing, or a stretch opportunity, or being ready for something new. Read the timeline and notice how much has already happened."],

function stepsFor(sc){
  const o=outOf(sc);
  const picks=(o.length?o.slice(0,3):Object.keys(AX).filter(k=>sc[k]!==null)
    .map(k=>({k:k,side:sc[k]>midOf(k)?"hi":"lo",d:0}))
    .sort((a,b)=>Math.abs(sc[b.k]-midOf(b.k))-Math.abs(sc[a.k]-midOf(a.k))).slice(0,2));
  return picks}

/* A downloaded copy is a document you chose to keep, not a session. It carries its
   answers in a data island so the file actually reopens as itself. Nothing is written
   to storage at any point, so closing the tab without downloading loses everything. */
function downloadSelf(){
  const old=document.getElementById("saved-state");if(old)old.remove();
  const tag=document.createElement("script");
  tag.type="application/json";tag.id="saved-state";
  tag.textContent=JSON.stringify({a:S.a,ws:S.ws,codes:S.codes,demo:!!S.demo});
  document.head.appendChild(tag);
  const doc="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
  tag.remove();
  const b=new Blob([doc],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="leadership-check"+(S.ws?"-"+S.ws.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase():"")+".html";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

const zoneOf=v=>ZONES.filter(z=>v>=z[0])[0];

/* Not a plain weighted mean. If you fail the thing that matters most to
   someone, being fine on the rest does not rescue the pairing — an anxious
   high performer under a volatile manager is not saved by good candour. */
function compatOf(sc){
  return PEOPLE.map(pp=>{
    let num=0,den=0,best=null,worst=null,heavy=[];
    pp.needs.forEach(([k,end,w])=>{
      const p=pct(k,sc[k]);
      const m=end==="lo"?(100-p)/100:end==="hi"?p/100:1-Math.abs(p-50)/50;
      num+=m*w;den+=w;
      if(w>=2)heavy.push(m);
      if(!best||m>best.m)best={k:k,m:m,end:end};
      if(!worst||m<worst.m)worst={k:k,m:m,end:end};
    });
    const mean=num/den, low=heavy.length?Math.min.apply(null,heavy):mean;
    return {p:pp,score:Math.round(100*(mean*0.6+low*0.4)),best:best,worst:worst}})
   .sort((a,b)=>b.score-a.score)}

/* ---------- the tool simulating itself ----------
   The same scoring code the result uses, run over synthetic answer sets. Nothing
   is fetched or precomputed \u2014 change a question and the distribution changes. */
const WEIGHTS={
 rand:{l:"Answering at random",w:[0.25,0.25,0.25,0.25],
   d:"No self-image at all. Useful as a control: it shows what the instrument does before any human tendency touches it."},
 real:{l:"Realistically",w:[0.10,0.32,0.38,0.20],
   d:"A slight pull toward the moderate options, which is how people actually fill these in."},
 kind:{l:"Kind to yourself",w:[0.04,0.28,0.48,0.20],
   d:"A deliberate flattering skew. Worth comparing against the middle column \u2014 it moves the people score far less than you would expect."}};
let SIMSTATE={mode:"real",n:20000,cache:{},open:null};

function runSim(mode,n){
  const w=WEIGHTS[mode].w,c=w.map((_,i)=>w.slice(0,i+1).reduce((a,b)=>a+b,0));
  const pick=()=>{const r=Math.random();for(let i=0;i<4;i++)if(r<c[i])return i+1;return 4};
  const pat={},quad={},verd={};let sp=0,se=0,sz=0;
  for(let i=0;i<n;i++){
    const a=[];for(let j=0;j<Q.length;j++)a[j]=pick();
    const sc=scoreOf(a),T=typeOf(sc),P=axisScore(sc,"p"),E=axisScore(sc,"e");
    pat[T.key]=(pat[T.key]||0)+1;
    const qd=E>=50?(P>=50?"Leaders":"Challengers"):(P>=50?"Visionaries":"Niche players");
    quad[qd]=(quad[qd]||0)+1;
    const v=verdOf(P)[1];verd[v]=(verd[v]||0)+1;
    sp+=P;se+=E;sz+=Object.keys(AX).filter(k=>pct(k,sc[k])>=AX[k].good[0]&&pct(k,sc[k])<=AX[k].good[1]).length;
  }
  return {pat:pat,quad:quad,verd:verd,n:n,P:sp/n,E:se/n,zone:sz/n}}

/* the canonical profile for a pattern: that trait at the extreme, the rest middling */
function canonical(key){
  const a=Array(Q.length).fill(0).map((_,i)=>i%2?2:3);
  if(key!=="balanced"){const k=key.slice(0,key.lastIndexOf("_")),side=key.slice(key.lastIndexOf("_")+1);

  const lshut=!!S.gshut["When nothing is extreme"];
  const sec=el("div","grp"+(lshut?" shut":""));
  const lh=document.createElement("button");lh.className="grp-h";lh.type="button";
  lh.setAttribute("aria-expanded",lshut?"false":"true");
  const li2=el("span");li2.style.cssText="display:flex;align-items:baseline;width:100%";
  li2.appendChild(el("span","tw","\u25be"));li2.appendChild(document.createTextNode("When nothing is extreme"));
  const lb2=el("span","bits");lb2.appendChild(el("em",null,"1 pattern"));li2.appendChild(lb2);
  lh.appendChild(li2);
  lh.addEventListener("click",()=>{S.gshut["When nothing is extreme"]=!lshut;render()});
  sec.appendChild(lh);
  const bMine=mine==="balanced", bShut=S.pshut.balanced!==undefined?S.pshut.balanced:!bMine;
  const c=el("div","pat"+(bMine?" mine":"")+(bShut?" shut":""));c.id="pat-balanced";
  const bh=document.createElement("button");bh.className="pat-h";bh.type="button";
  bh.setAttribute("aria-expanded",bShut?"false":"true");
  bh.appendChild(el("span","tw","\u25be"));
  const bl=el("span");bl.appendChild(el("div","tag","All eleven near the middle"));
  const h=el("h4",null,TYPE.balanced.n);
  if(bMine)h.appendChild(el("span","yours",S.demo?"the example\u2019s pattern":"your pattern"));
  bl.appendChild(h);bh.appendChild(bl);bh.appendChild(el("span"));
  bh.addEventListener("click",()=>{S.pshut.balanced=!bShut;render()});
  c.appendChild(bh);
  const cwrap=el("div","pbody");cwrap.appendChild(el("p",null,TYPE.balanced.d));
  const cost=el("div","cost");cost.innerHTML="<b>What the team carries</b>";
  cost.appendChild(document.createTextNode(TYPE.balanced.tl[2]));
  cwrap.appendChild(cost);c.appendChild(cwrap);sec.appendChild(c);w.appendChild(sec);

  const hs=el("div","sec");
  hs.appendChild(el("h3",null,"How leaders are actually distributed in companies"));
  hs.appendChild(el("p","lead","The patterns above are shapes, not frequencies \u2014 nothing in this tool can tell you how common each one is in the world. What the research does say is blunter and worth having in front of you: good managers are rare, most people in the job were never selected for it, and the effect shows up at the other end in engagement."));
  const hist=el("div","hist");
  HIST.forEach(block=>{
    hist.appendChild(el("div","hsub",block.h));
    block.rows.forEach(r=>{
      const row=el("div","hrow");
      const l=el("div","hl",r[0]);l.appendChild(el("em",null,r[1]));row.appendChild(l);
      const bar=el("div","hbar "+r[3]);const fi=el("i");fi.style.width=r[2]+"%";bar.appendChild(fi);
      row.appendChild(bar);row.appendChild(el("div","hval",r[2]+"%"));
      hist.appendChild(row)})});
  hs.appendChild(hist);
  const hn=el("div","hnote");
  hn.innerHTML="<b>The line worth sitting with.</b> Roughly three in ten people can do this job well, and roughly eight in ten appointments pick somebody else. That is not an argument for fatalism \u2014 two of those three in ten get there through investment rather than instinct, which is the entire case for taking something like this seriously. It is an argument against assuming you are in the good third because nobody has told you otherwise.";
  hs.appendChild(hn);
  const hr=document.createElement("div");hr.style.marginTop="18px";
  hr.appendChild(el("div","hsub","Sources for the figures above"));
  const ol=document.createElement("ol");ol.className="refs";
  HREFS.forEach(pair=>{const u=pair[0],t=pair[1];const li=document.createElement("li");
    const i=t.indexOf(".");li.appendChild(el("b",null,t.slice(0,i)));
    li.appendChild(document.createTextNode(t.slice(i+1)));
    const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener noreferrer";
    a.className="reflink";a.textContent=u.replace(/^https?:\/\//,"");
    li.appendChild(document.createElement("br"));li.appendChild(a);
    ol.appendChild(li)});
  hr.appendChild(ol);hs.appendChild(hr);
  const hf=el("p","lead");hf.style.margin="12px 0 0";
  hf.textContent="Figures were current at the time of writing. Gallup and DDI both publish annually, so check the latest edition before quoting any of them in a room that matters.";
  hs.appendChild(hf);
  w.appendChild(hs);
  return w}

function references(){
  const w=el("div");const n=el("div","note");
  n.innerHTML="<p><b>Where the healthy bands come from.</b> None of the positions here are invented. The bands lean where the evidence leans, which is why candour sits above the midpoint and spotlight sits below it.</p><p>Links go to the publisher\u2019s page or a DOI. Two entries have no link because no stable public one exists \u2014 they are books, and the method note is about this tool rather than an outside source.</p>";
  w.appendChild(n);
  const s=el("div","sec");s.appendChild(el("h3",null,"References"));
  const ol=el("ol","refs");
  REFS.forEach(r=>{const li=document.createElement("li");
    li.appendChild(el("b",null,r.t));li.appendChild(document.createTextNode(r.d));
    if(r.u){const a=document.createElement("a");a.href=r.u;a.target="_blank";a.rel="noopener noreferrer";
      a.className="reflink";a.textContent=r.u.replace(/^https?:\/\//,"").replace(/\/$/,"");
      li.appendChild(document.createElement("br"));li.appendChild(a)}
    ol.appendChild(li)});
  s.appendChild(ol);w.appendChild(s);return w}

/* Every panel with its own heading folds, on every tab. Applied once after the
   view is built rather than woven through each builder. */
function foldable(root){
  [...root.querySelectorAll(".sec, .anon, .try")].forEach(sec=>{
    const h=[...sec.children].filter(c=>c.tagName==="H3")[0];
    if(!h)return;
    const key=h.textContent.trim();
    const shut=!!S.secShut[key];
    const btn=document.createElement("button");btn.className="sec-h";btn.type="button";
    btn.setAttribute("aria-expanded",shut?"false":"true");
    btn.appendChild(el("span","tw","\u25be"));
    btn.appendChild(document.createTextNode(key));
    btn.addEventListener("click",()=>{S.secShut[key]=!shut;render()});
    const body=document.createElement("div");body.className="sec-b";
    while(h.nextSibling)body.appendChild(h.nextSibling);
    sec.replaceChild(btn,h);sec.appendChild(body);
    if(shut)sec.classList.add("shut")})}

function foldBar(root){
  const names=[...root.querySelectorAll(".sec, .anon, .try")]
    .map(x=>[...x.children].filter(c=>c.tagName==="H3")[0]).filter(Boolean).map(h=>h.textContent.trim());
  if(names.length<2)return null;
  const bar=el("div","foldbar");
  bar.appendChild(el("span",null,"Panels:"));
  const a=el("button","chip","Expand all");a.type="button";
  a.addEventListener("click",()=>{names.forEach(n=>delete S.secShut[n]);render()});
  const b=el("button","chip","Collapse all");b.type="button";
  b.addEventListener("click",()=>{names.forEach(n=>S.secShut[n]=true);render()});
  bar.appendChild(a);bar.appendChild(b);
  return bar}

function render(){
  const n=done();
  document.getElementById("cnt").textContent=n+" / "+Q.length;
  document.getElementById("fill").style.width=(n/Q.length*100)+"%";
  document.getElementById("pbar").style.display=(S.m==="q")?"":"none";
  document.querySelectorAll(".tab").forEach(t=>{
    t.setAttribute("aria-selected",t.dataset.m===S.m?"true":"false");
    if(t.dataset.m==="r")t.disabled=n<Q.length});
  if(ABOUT)document.getElementById("sub").textContent="Twenty-two moments. Pick what actually happens, not what should.";
  const app=document.getElementById("app");app.innerHTML="";
  const view=S.m==="sim"?simulation():S.m==="p"?patterns():S.m==="x"?references():(S.m==="r"&&n===Q.length)?results():ask();
  const bar=foldBar(view);
  foldable(view);
  if(bar)view.insertBefore(bar,view.firstChild);
  app.appendChild(view)}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  if(t.disabled)return;S.m=t.dataset.m;render();window.scrollTo({top:0})}));
window.addEventListener("beforeunload",e=>{if(done()>0){e.preventDefault();e.returnValue=""}});
render();

</script>
