services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medtech
      POSTGRES_USER: medtech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtech -d medtech"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MEDTECH_DATABASE_URL: postgresql+psycopg://medtech:${POSTGRES_PASSWORD}@db:5432/medtech
      MEDTECH_ADMIN_TOKEN: ${MEDTECH_ADMIN_TOKEN:?Set MEDTECH_ADMIN_TOKEN in .env}
      MEDTECH_CORS_ORIGINS: ${MEDTECH_CORS_ORIGINS:?Set the GitHub Pages origin in .env}
      MEDTECH_REFRESH_HOURS: ${MEDTECH_REFRESH_HOURS:-168}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
